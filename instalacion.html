<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C&aacute;lculo de TAP e Instalaci&oacute;n</title>
<style>
:root{
  --ki-teal:#12a5b8; --ki-green:#35a853;
  --ki-bg:#081724; --ki-card:#0f2739; --ki-card2:#143349;
  --ki-line:rgba(255,255,255,.09); --ki-line2:rgba(255,255,255,.06);
  --ki-t1:#eef4f9; --ki-t2:#a7bccd; --ki-t3:#7f9bb2;
  --ki-ok:#35a853; --ki-warn:#e0a230; --ki-crit:#d6584a; --ki-null:#5f7d94;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ki-bg);color:var(--ki-t1);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}

.ki-top{background:linear-gradient(100deg,var(--ki-teal),var(--ki-green));color:#fff;
  padding:14px 20px;display:flex;justify-content:space-between;align-items:center;
  gap:14px;flex-wrap:wrap}
.ki-top h1{margin:0;font-size:20px;font-weight:600}
.ki-top .sub{margin:3px 0 0;font-size:13px;opacity:.9}

.ki-wrap{padding:18px 20px;max-width:1400px;margin:0 auto}
.ki-cols{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:14px;
  align-items:start}
@media(max-width:940px){.ki-cols{grid-template-columns:1fr}}

.ki-card{background:var(--ki-card);border:1px solid var(--ki-line);border-radius:9px;
  padding:13px 15px;margin-bottom:14px}
.ki-card:last-child{margin-bottom:0}
.ki-card .ct{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  margin-bottom:12px;flex-wrap:wrap}
.ki-card .ct b{font-size:13px;font-weight:600;color:#fff}
.ki-card .ct span{font-size:10.5px;color:var(--ki-t3);letter-spacing:.4px;
  text-transform:uppercase}

.ki-f{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:5px 0;border-bottom:1px solid var(--ki-line2)}
.ki-f:last-child{border-bottom:none}
.ki-f label{font-size:12.5px;color:var(--ki-t2);flex:1 1 auto;min-width:0}
.ki-f label i{font-style:normal;color:var(--ki-t3);font-size:11px;display:block}
.ki-f input,.ki-f select{background:var(--ki-card2);border:1px solid var(--ki-line);
  color:#fff;border-radius:5px;padding:5px 7px;font-size:13px;font-family:inherit;
  width:96px;text-align:right}
.ki-f select{width:120px;text-align:left}
.ki-f input:focus,.ki-f select:focus{outline:none;border-color:var(--ki-teal)}
.ki-sel{width:100%!important;margin-bottom:12px;text-align:left!important}

.ki-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px}
.ki-p{background:var(--ki-card2);border:1px solid var(--ki-line);border-radius:7px;
  padding:9px 11px;position:relative;overflow:hidden}
.ki-p:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--ki-teal)}
.ki-p.g:before{background:var(--ki-green)}
.ki-p.w:before{background:var(--ki-warn)}
.ki-p.r:before{background:var(--ki-crit)}
.ki-p .n{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--ki-t3)}
.ki-p .fr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;
  color:#7fa8c4;margin:3px 0 4px;word-break:break-word}
.ki-p .r2{font-size:18px;font-weight:600;color:#fff;letter-spacing:-.4px}
.ki-p .r2 small{font-size:11px;font-weight:400;color:var(--ki-t2);margin-left:3px;
  letter-spacing:0}

table.ki-t{width:100%;border-collapse:collapse;font-size:12px;color:var(--ki-t2)}
table.ki-t th{text-align:right;font-weight:600;color:var(--ki-t3);font-size:10px;
  letter-spacing:.5px;text-transform:uppercase;padding:0 0 7px 9px;
  border-bottom:1px solid var(--ki-line);white-space:nowrap}
table.ki-t th:first-child,table.ki-t td:first-child{text-align:left;padding-left:0}
table.ki-t td{text-align:right;padding:6px 0 6px 9px;
  border-bottom:1px solid var(--ki-line2);white-space:nowrap}
table.ki-t tr:last-child td{border-bottom:none}
table.ki-t .ok{color:var(--ki-ok)}
table.ki-t .df{color:var(--ki-warn)}
.ki-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

.ki-tab{display:grid;grid-template-columns:repeat(auto-fit,minmax(38px,1fr));gap:4px;
  margin-top:4px}
.ki-tab div{background:var(--ki-card2);border:1px solid var(--ki-line);border-radius:4px;
  padding:5px 2px;text-align:center;font-size:10.5px;color:var(--ki-t3);line-height:1.35}
.ki-tab div b{display:block;color:var(--ki-t2);font-size:11px;font-weight:600}
.ki-tab div.on{border-color:var(--ki-teal);background:rgba(18,165,184,.16)}
.ki-tab div.on b{color:#7fd0dd}

.ki-btn{background:linear-gradient(100deg,var(--ki-teal),var(--ki-green));border:none;
  color:#fff;border-radius:7px;padding:9px 18px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit}
.ki-btn:hover{filter:brightness(1.12)}
.ki-btn:disabled{opacity:.6;cursor:default;filter:none}
.ki-msg{font-size:12.5px;color:var(--ki-t3)}
.ki-msg.ok{color:var(--ki-ok)}
.ki-msg.mal{color:var(--ki-crit)}
.ki-nota{font-size:11.5px;color:var(--ki-t3);line-height:1.55;margin:12px 0 0}
.ki-nota b{color:var(--ki-t2);font-weight:600}
.ki-nota .al{color:var(--ki-warn)}
.ki-av{background:rgba(224,162,48,.10);border:1px solid rgba(224,162,48,.35);
  border-radius:7px;padding:9px 11px;font-size:12px;color:#e8c07a;line-height:1.5;
  margin-top:11px}
</style>
</head>
<body>

<div class="ki-top">
  <div>
    <h1>C&aacute;lculo de TAP e Instalaci&oacute;n</h1>
    <p class="sub">Dise&ntilde;o el&eacute;ctrico de unidad ESP y p&eacute;rdida de tensi&oacute;n en cable</p>
  </div>
</div>

<div class="ki-wrap">
  <div class="ki-cols">
    <div>
      <div class="ki-card">
        <div class="ct"><b>Datos de instalaci&oacute;n</b><span>Editables</span></div>
        <select class="ki-sel" id="kiPozo"></select>
        <div id="kiForm"></div>
      </div>
      <div class="ki-card">
        <div class="ct"><b>Tablas de referencia</b><span>CVD y TCF</span></div>
        <div id="kiTablas"></div>
      </div>
    </div>
    <div id="kiSalida"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   CONEXION
   Se hereda de Kronos-M igual que en los demas modulos: el iframe
   corre en el mismo origen y toma el cliente del padre para que la
   sesion sea una sola.
   ============================================================ */
function kiCredencial(nombre){
  var f = [];
  try { if (window.parent && window.parent !== window) f.push(window.parent); } catch(e){}
  try { if (window.opener) f.push(window.opener); } catch(e){}
  for (var i = 0; i < f.length; i++){
    try {
      var v = f[i][nombre];
      if (v && String(v).indexOf('PEGAR_AQUI') !== 0) return v;
    } catch(e){}
  }
  return null;
}

let kiSb = null;
function kiCliente(){
  if (kiSb) return kiSb;
  var f = [];
  try { if (window.parent && window.parent !== window) f.push(window.parent); } catch(e){}
  try { if (window.opener) f.push(window.opener); } catch(e){}
  for (var i = 0; i < f.length; i++){
    try { if (f[i].sb && f[i].sb.rpc) { kiSb = f[i].sb; return kiSb; } } catch(e){}
  }
  const url = kiCredencial('SUPABASE_URL');
  const key = kiCredencial('SUPABASE_ANON_KEY');
  if (!url || !key)
    throw new Error('No se pudo tomar la conexion de Kronos-M. '
      + 'Recarga con Ctrl+Shift+R.');
  kiSb = window.supabase.createClient(url, key);
  return kiSb;
}

/* ============================================================
   CAPA DE DATOS
   ============================================================ */
async function kiCargarUnidades(){
  const { data, error } = await kiCliente().rpc('opt_unidades');
  if (error) throw new Error(error.message);
  return (data || []).map(r => ({
    pozo: r.pozo,
    campo: r.campo || '\u2014',
    pad: r.pad || '\u2014',
    vsd: r.vsd || r.marca_variador || '',
    conf: r.conexion || 'DELTA',
    hp: kiN(r.hp),
    v_placa: kiN(r.v_placa_v),
    i_placa: kiN(r.i_placa_a),
    f_max: kiN(r.f_max_diseno_hz),
    awg: kiN(r.awg),
    long_ft: kiN(r.longitud_ft),
    temp_f: kiN(r.temp_pozo_f),
    tap: kiN(r.tap_sut_v),
    v_nom: kiN(r.v_nom_variador_v),
    filtro: !!r.filtro_seno,
    k_filtro: kiN(r.k_filtro),
    cable_medido: kiN(r.caida_cable_v)
  }));
}

/* La flota entera, tenga o no diseno registrado. Es lo que permite
   dar de alta un pozo de Put Sur: sin esto el modulo solo conoce lo
   que alguien ya cargo, y no habria por donde empezar. Se lee con
   dp_bes_lista, la misma fuente de Monitoreo de Condicion. */
async function kiCargarFlota(){
  try {
    const { data, error } = await kiCliente().rpc('dp_bes_lista');
    if (error) throw new Error(error.message);
    return (data || []).filter(r => r && r.pozo).map(r => ({
      pozo: r.pozo,
      campo: r.campo || '\u2014',
      pad: r.pad || '\u2014',
      marca: r.marca_variador || ''
    }));
  } catch(e){
    console.warn('[Kronos-M] Flota no disponible:', e.message);
    return [];
  }
}

async function kiCargarParametros(){
  const { data, error } = await kiCliente().rpc('opt_parametros');
  if (error) throw new Error(error.message);
  return data || {};
}

async function kiGuardarDiseno(pozo, datos){
  const { data, error } = await kiCliente().rpc('opt_guardar_diseno',
    { p_pozo: pozo, p_datos: datos });
  if (error) throw new Error(error.message);
  if (data && data.ok === false) throw new Error(data.error || 'No se pudo guardar');
  return data;
}

function kiN(v){
  if (v == null || v === '') return null;
  const n = Number(v);
  return isFinite(n) ? n : null;
}

/* ============================================================
   CALCULO DE TAP E INSTALACION  ·  prototipo de validacion
   ------------------------------------------------------------
   Traslado de la hoja TAP_CALCULATION_ESP_UNITS_PUT-NORTH. Sirve
   para dos cosas distintas:

   1. Disenar una instalacion nueva: con la placa del motor, el
      cable y la temperatura del pozo sale la tension que debe
      entregar el SUT, el TAP a seleccionar, la relacion de
      transformacion y los limites de corriente del variador.

   2. Calcular la perdida de tension en el cable, que es la
      entrada que le faltaba al modulo de optimizacion. Ahi la
      caida estaba escrita a mano como una constante por pozo;
      aqui se calcula de la longitud, el calibre y la temperatura.

   Cadena:
     CVD = tabla(corriente del motor)      V por cada 1000 ft
     TCF = tabla(temperatura del pozo)     factor por temperatura
     CL  = longitud x CVD / 1000 x TCF
     V SUT @ F max = V placa x F max / 60 + CL
     V SUT con filtro = V SUT x 1.07
     RT  = TAP / V nominal del variador
   ============================================================ */

let KI_DATOS = [];

/* Tabla CVD de la hoja CALCULATIONS. Solo esta cargado el calibre
   #2, el unico que usa la hoja. Los demas calibres quedan
   pendientes de las tablas del fabricante del cable. */
let KI_CVD = {
  2: [[40,11],[50,14],[60,16],[70,19],[80,22],[90,25],[100,27],[110,30],[120,33],[130,36],[140,39]]
};
let KI_TCF = [[140,1.13],[149,1.15],[158,1.17],[167,1.19],[176,1.21],[185,1.23],
              [194,1.25],[203,1.27],[212,1.29],[221,1.31],[230,1.33]];

const kiCfg = { vNom: 480, kFiltro: 1.07, tempDefecto: 193 };

/* Las tablas y los factores son los mismos que usa Optimizacion.
   Vienen de opt_parametro para que no haya dos versiones. */
function kiAplicarParametros(p){
  const n = k => (p[k] == null ? null : Number(p[k]));
  if (n('k_filtro') != null) kiCfg.kFiltro = n('k_filtro');
  if (n('v_nom') != null)    kiCfg.vNom = n('v_nom');
  if (n('temp_pozo_f_default') != null) kiCfg.tempDefecto = n('temp_pozo_f_default');
  if (p.tabla_cvd && typeof p.tabla_cvd === 'object') KI_CVD = p.tabla_cvd;
  if (Array.isArray(p.tabla_tcf) && p.tabla_tcf.length) KI_TCF = p.tabla_tcf;
}
let kiE = null;     /* entradas de trabajo */
let kiRef = null;   /* unidad cargada, o null si es una instalacion suelta */
let KI_FLOTA = [];  /* pozos de la flota, con o sin diseno */

function kiInterp(t, x){
  if (x == null || !isFinite(x)) return null;
  if (x <= t[0][0]) return t[0][1];
  if (x >= t[t.length-1][0]) return t[t.length-1][1];
  for (let i = 0; i < t.length - 1; i++){
    const [a, va] = t[i], [b, vb] = t[i+1];
    if (x >= a && x <= b) return va + (vb - va) * (x - a) / (b - a);
  }
  return null;
}

function kiCalc(){
  const e = kiE, r = {};
  const tabla = KI_CVD[e.awg] || KI_CVD[String(e.awg)];
  r.tablaFalta = !tabla;
  r.cvd = tabla ? kiInterp(tabla, e.i_placa) : null;

  /* La temperatura casi nunca esta cargada por unidad. Se usa el
     valor por defecto de los parametros para no dejar el calculo
     parado, pero se marca de donde salio: quien firme el diseno
     tiene que saber que ese numero no se midio en ese pozo. */
  r.tempPropia = e.temp_f != null;
  r.temp = r.tempPropia ? e.temp_f : kiCfg.tempDefecto;
  r.tcf = kiInterp(KI_TCF, r.temp);

  if (r.cvd != null && r.tcf != null && e.long_ft != null)
    r.cl = e.long_ft * r.cvd / 1000 * r.tcf;

  if (e.v_placa != null && e.f_max && r.cl != null){
    r.vEsp = e.v_placa * e.f_max / 60 + r.cl;
    r.vPwm = r.vEsp * kiCfg.kFiltro;
  }
  r.vReq = e.filtro ? r.vPwm : r.vEsp;

  if (e.tap != null && kiCfg.vNom){
    r.rt      = e.tap / kiCfg.vNom;
    r.v60Sut  = e.f_max ? e.tap * 60 / e.f_max : null;
    r.v60Drv  = r.rt ? (r.v60Sut != null ? r.v60Sut / r.rt : null) : null;
    r.kva     = e.i_placa != null ? e.tap * e.i_placa * 1.73 / 1000 : null;
    r.ctrl    = e.i_placa != null ? e.i_placa * r.rt : null;
    r.vClamp  = r.v60Drv != null && e.f_max ? r.v60Drv * e.f_max / 60 : null;
    r.iRun    = e.i_placa != null ? e.i_placa * 0.95 * r.rt : null;
    r.iSync   = e.i_placa != null ? e.i_placa * 1.25 * r.rt : null;
    r.iOver   = r.ctrl;
    r.iNom    = r.ctrl;
    r.iMag    = e.i_placa != null ? 0.3 * e.i_placa * r.rt : null;
    if (r.vReq != null) r.dTap = e.tap - r.vReq;
  }
  r.torque = e.hp != null ? e.hp * 5252 / 3450 : null;
  return r;
}

/* ---------- formulario ---------- */

const KI_CAMPOS = [
  ['vsd',      'Variador',                   'texto'],
  ['hp',       'Potencia del motor',         'num', 'HP'],
  ['v_placa',  'Tensi\u00f3n de placa',      'num', 'V'],
  ['i_placa',  'Corriente de placa',         'num', 'A'],
  ['f_max',    'Frecuencia m\u00e1xima',     'num', 'Hz'],
  ['awg',      'Calibre del cable',          'num', 'AWG'],
  ['long_ft',  'Longitud del cable',         'num', 'ft'],
  ['temp_f',   'Temperatura del pozo',       'num', '\u00b0F'],
  ['conf',     'Conexi\u00f3n del motor',    'conf'],
  ['filtro',   'Filtro seno instalado',      'si'],
  ['tap',      'TAP escogido en el SUT',     'num', 'V (opcional)']
];

function kiForm(){
  const h = KI_CAMPOS.map(c => {
    const [k, et, tipo, un] = c;
    let ctrl;
    if (tipo === 'conf'){
      ctrl = '<select data-k="' + k + '">'
        + ['WYE','DELTA'].map(o => '<option' + (kiE.conf === o ? ' selected' : '')
            + '>' + o + '</option>').join('') + '</select>';
    } else if (tipo === 'si'){
      ctrl = '<select data-k="' + k + '">'
        + '<option value="0"' + (kiE.filtro ? '' : ' selected') + '>No</option>'
        + '<option value="1"' + (kiE.filtro ? ' selected' : '') + '>S\u00ed</option></select>';
    } else if (tipo === 'texto'){
      ctrl = '<input data-k="' + k + '" type="text" style="width:130px;text-align:left" '
        + 'value="' + (kiE[k] || '') + '">';
    } else {
      ctrl = '<input data-k="' + k + '" type="number" step="any" value="'
        + (kiE[k] != null ? kiE[k] : '') + '">';
    }
    return '<div class="ki-f"><label>' + et
      + (un ? '<i>' + un + '</i>' : '') + '</label>' + ctrl + '</div>';
  }).join('');

  return h
    + '<div class="ki-f"><label>Tensi\u00f3n nominal del variador<i>V</i></label>'
    + '<input data-k="vNom" type="number" step="any" value="' + kiCfg.vNom + '"></div>'
    + '<div class="ki-f"><label>Factor del filtro seno</label>'
    + '<input data-k="kFiltro" type="number" step="0.01" value="' + kiCfg.kFiltro + '"></div>';
}

function kiTablas(r){
  const cvd = KI_CVD[kiE.awg] || KI_CVD[String(kiE.awg)];
  let h = '<div style="font-size:11px;color:var(--ki-t3);letter-spacing:.5px;'
    + 'text-transform:uppercase;margin-bottom:2px">CVD calibre #'
    + (kiE.awg != null ? kiE.awg : '\u2014') + ' &middot; V por 1000 ft</div>';
  if (!cvd){
    h += '<p class="ki-nota" style="margin-top:4px">No hay tabla cargada para este '
      + 'calibre. La hoja original solo trae el calibre #2.</p>';
  } else {
    h += '<div class="ki-tab">' + cvd.map(([a, f]) => {
      const on = r.cvd != null && kiE.i_placa != null
        && Math.abs(kiE.i_placa - a) <= 5;
      return '<div class="' + (on ? 'on' : '') + '">' + a + ' A<b>' + f + '</b></div>';
    }).join('') + '</div>';
  }
  h += '<div style="font-size:11px;color:var(--ki-t3);letter-spacing:.5px;'
    + 'text-transform:uppercase;margin:12px 0 2px">TCF &middot; factor por temperatura</div>'
    + '<div class="ki-tab">' + KI_TCF.map(([t, f]) => {
        const on = kiE.temp_f != null && Math.abs(kiE.temp_f - t) <= 4.5;
        return '<div class="' + (on ? 'on' : '') + '">' + t + '\u00b0<b>' + f + '</b></div>';
      }).join('') + '</div>'
    + '<p class="ki-nota">Los dos factores se interpolan entre puntos de la tabla. '
    + 'La celda resaltada es el punto m&aacute;s cercano, no el valor usado.</p>';
  return h;
}

/* ---------- salida ---------- */

function kiSalida(r){
  const p = (cls, n, f, val, un) => '<div class="ki-p ' + cls + '">'
    + '<div class="n">' + n + '</div>'
    + (f ? '<div class="fr">' + f + '</div>' : '')
    + '<div class="r2">' + val + (un ? '<small>' + un + '</small>' : '') + '</div></div>';
  const nn = (v, d) => v == null ? '\u2014' : v.toFixed(d == null ? 1 : d);

  let h = '';

  h += '<div class="ki-card"><div class="ct"><b>1. P&eacute;rdida de tensi&oacute;n en el cable</b>'
    + '<span>Entrada del m&oacute;dulo de optimizaci&oacute;n</span></div><div class="ki-grid">'
    + p('', 'CVD', 'tabla(' + nn(kiE.i_placa, 0) + ' A)', nn(r.cvd, 1), 'V/1000ft')
    + p('', 'TCF', 'tabla(' + nn(r.temp, 0) + ' \u00b0F'
        + (r.tempPropia ? '' : ', por defecto') + ')', nn(r.tcf, 3), '')
    + p('g', 'Ca&iacute;da en el cable', 'long x CVD / 1000 x TCF', nn(r.cl, 1), 'V')
    + '</div>';
  if (r.tablaFalta){
    h += '<div class="ki-av">Sin tabla CVD para el calibre #'
      + (kiE.awg != null ? kiE.awg : '\u2014') + '. La ca&iacute;da no se puede calcular '
      + 'hasta cargar la tabla de ese calibre.</div>';
  } else if (r.cl == null){
    const f = [];
    if (kiE.i_placa == null) f.push('corriente de placa');
    if (kiE.long_ft == null) f.push('longitud del cable');
    if (f.length) h += '<div class="ki-av">Falta ' + f.join(' y ')
      + ' para calcular la ca&iacute;da.</div>';
  } else if (!r.tempPropia){
    h += '<div class="ki-av">La unidad no tiene temperatura de pozo registrada. '
      + 'Se us&oacute; ' + kiCfg.tempDefecto + ' \u00b0F por defecto; '
      + 'an&oacute;tela arriba si conoce la real.</div>';
  }
  h += '</div>';

  h += '<div class="ki-card"><div class="ct"><b>2. Tensi&oacute;n requerida en el SUT</b>'
    + '<span>A frecuencia m&aacute;xima</span></div><div class="ki-grid">'
    + p('', 'Sin filtro', 'V placa x F m&aacute;x / 60 + CL', nn(r.vEsp, 0), 'V')
    + p('', 'Con filtro seno', 'anterior x ' + kiCfg.kFiltro.toFixed(2), nn(r.vPwm, 0), 'V')
    + p('g', 'Requerida en esta unidad',
        kiE.filtro ? 'con filtro' : 'sin filtro', nn(r.vReq, 0), 'V')
    + '</div>'
    + '<p class="ki-nota">Esta es la tensi&oacute;n que debe entregar el SUT a frecuencia '
    + 'm&aacute;xima. La derivaci&oacute;n se escoge en sitio contra la tabla del SUT '
    + 'instalado.</p></div>';

  const cls = r.dTap == null ? '' : (Math.abs(r.dTap) <= 50 ? 'g'
              : (Math.abs(r.dTap) <= 150 ? 'w' : 'r'));
  h += '<div class="ki-card"><div class="ct"><b>3. Verificaci&oacute;n del TAP escogido</b>'
    + '<span>' + kiE.conf + '</span></div>';
  if (kiE.tap == null){
    h += '<p class="ki-nota" style="margin:0">La tensi&oacute;n requerida es el resultado '
      + 'del punto 2. La derivaci&oacute;n se escoge en sitio con la tabla del SUT '
      + 'instalado, que cambia de un modelo a otro. Al anotar aqu&iacute; el TAP escogido '
      + 'se calculan la relaci&oacute;n de transformaci&oacute;n, los ajustes del variador '
      + 'y los l&iacute;mites de corriente.</p></div>';
  } else {
    h += '<div class="ki-grid">'
      + p('', 'TAP escogido', 'anotado en sitio', nn(kiE.tap, 0), 'V')
      + p(cls, 'Diferencia contra la requerida', 'TAP - requerida',
          r.dTap == null ? '\u2014'
                         : (r.dTap > 0 ? '+' : '') + r.dTap.toFixed(0), 'V')
      + p('', 'Relaci&oacute;n de transformaci&oacute;n', 'TAP / ' + kiCfg.vNom, nn(r.rt, 3), '')
      + p('', 'Tensi&oacute;n @ 60 Hz salida SUT', 'TAP x 60 / F m&aacute;x', nn(r.v60Sut, 0), 'V')
      + '</div></div>';
  }

  if (r.rt == null){
    h += '<div class="ki-card"><div class="ct"><b>4. Ajustes del variador</b>'
      + '<span>Requieren el TAP</span></div>'
      + '<p class="ki-nota" style="margin:0">Los ajustes de puesta en servicio y los '
      + 'l&iacute;mites de corriente se refieren a superficie a trav&eacute;s de la '
      + 'relaci&oacute;n de transformaci&oacute;n, as&iacute; que salen una vez escogida '
      + 'la derivaci&oacute;n. El torque no depende del TAP: '
      + nn(r.torque, 0) + ' lb-ft.</p></div>';
    if (kiRef) h += kiGuardarPanel(r);
    return h;
  }

  h += '<div class="ki-card"><div class="ct"><b>4. Ajustes del variador</b>'
    + '<span>Puesta en servicio</span></div><div class="ki-grid">'
    + p('', 'Tensi&oacute;n del variador @ 60 Hz', 'V60 SUT / RT', nn(r.v60Drv, 1), 'V')
    + p('', 'V-clamp', 'anterior x F m&aacute;x / 60', nn(r.vClamp, 1), 'V')
    + p('', 'kVA requerido @ F m&aacute;x', 'TAP x A placa x 1.73 / 1000', nn(r.kva, 1), 'kVA')
    + p('', 'Dimensionamiento del controlador', 'A placa x RT', nn(r.ctrl, 1), 'A')
    + p('', 'Torque', 'HP x 5252 / 3450', nn(r.torque, 0), 'lb-ft')
    + '</div></div>';

  h += '<div class="ki-card"><div class="ct"><b>5. L&iacute;mites de corriente</b>'
    + '<span>Referidos a superficie</span></div><div class="ki-grid">'
    + p('', 'Run Ilimit', 'A placa x 0.95 x RT', nn(r.iRun, 1), 'A')
    + p('', 'Sync Ilimit', 'A placa x 1.25 x RT', nn(r.iSync, 1), 'A')
    + p('', 'Overload', 'A placa x RT', nn(r.iOver, 1), 'A')
    + p('', 'Corriente de placa referida', 'A placa x RT', nn(r.iNom, 1), 'A')
    + p('', 'Corriente de magnetizaci&oacute;n', '0.3 x A placa x RT', nn(r.iMag, 1), 'A')
    + '</div></div>';

  if (kiRef) h += kiGuardarPanel(r);
  return h;
}

/* Guardar es lo que convierte la calculadora en parte de la
   plataforma: el diseno queda registrado y el modulo de
   Optimizacion lo usa sin que nadie vuelva a teclearlo. */
function kiGuardarPanel(r){
  const nuevo = !!kiRef.nuevo;
  const ubic = (kiRef.campo && kiRef.campo !== '\u2014')
    ? kiRef.campo + (kiRef.pad && kiRef.pad !== '\u2014' ? ' \u00b7 ' + kiRef.pad : '')
    : '';
  return '<div class="ki-card"><div class="ct">'
    + '<b>' + (nuevo ? 'Dar de alta en Kronos-M' : 'Guardar en Kronos-M') + '</b>'
    + '<span>' + koEscI(kiRef.pozo) + (ubic ? ' \u00b7 ' + koEscI(ubic) : '') + '</span></div>'
    + (nuevo
        ? '<p class="ki-nota" style="margin:0 0 10px">Esta unidad todav&iacute;a no '
          + 'tiene dise&ntilde;o el&eacute;ctrico registrado. Al guardarla aparece en '
          + 'Optimizaci&oacute;n Energ&eacute;tica, que dir&aacute; qu&eacute; le falta '
          + 'hasta que se pueda calcular la propuesta.</p>'
        : '<p class="ki-nota" style="margin:0 0 10px">Queda como dise&ntilde;o '
          + 'el&eacute;ctrico de la unidad. El m&oacute;dulo de Optimizaci&oacute;n toma '
          + 'de aqu&iacute; el calibre, la longitud, la temperatura, el TAP y el filtro '
          + 'seno para calcular la ca&iacute;da de cable sin repetir el dato.</p>')
    + '<div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">'
    +   '<button class="ki-btn" id="kiGuardar">'
    +     (nuevo ? 'Dar de alta' : 'Guardar dise\u00f1o') + '</button>'
    +   '<span class="ki-msg" id="kiMsg"></span>'
    + '</div></div>';
}

function koEscI(t){
  return String(t == null ? '' : t).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

async function kiGuardar(boton){
  const msg = document.getElementById('kiMsg');
  boton.disabled = true;
  boton.textContent = 'Guardando\u2026';
  try {
    await kiGuardarDiseno(kiRef.pozo, {
      vsd: kiE.vsd || null,
      conexion: kiE.conf || null,
      hp: kiE.hp,
      v_placa_v: kiE.v_placa,
      i_placa_a: kiE.i_placa,
      f_max_hz: kiE.f_max,
      awg: kiE.awg,
      longitud_ft: kiE.long_ft,
      temp_pozo_f: kiE.temp_f,
      tap_sut_v: kiE.tap,
      v_nom_variador_v: kiCfg.vNom,
      filtro_seno: !!kiE.filtro
    });
    const pozo = kiRef.pozo;
    KI_DATOS = await kiCargarUnidades();
    kiPoblarSelector();
    document.getElementById('kiPozo').value = pozo;
    kiRef = KI_DATOS.find(x => x.pozo === pozo) || kiRef;
    kiPintar();
    const m = document.getElementById('kiMsg');
    if (m){ m.textContent = 'Guardado.'; m.className = 'ki-msg ok'; }
  } catch(e){
    boton.disabled = false;
    boton.textContent = 'Guardar diseno';
    if (msg){ msg.textContent = e.message; msg.className = 'ki-msg mal'; }
  }
}

/* ---------- ciclo ---------- *//* ---------- ciclo ---------- */

function kiPintar(){
  const r = kiCalc();
  document.getElementById('kiForm').innerHTML = kiForm();
  document.getElementById('kiTablas').innerHTML = kiTablas(r);
  document.getElementById('kiSalida').innerHTML = kiSalida(r);

  const gb = document.getElementById('kiGuardar');
  if (gb) gb.onclick = () => kiGuardar(gb);

  document.querySelectorAll('#kiForm [data-k]').forEach(el => {
    el.onchange = ev => {
      const k = ev.target.dataset.k;
      const v = ev.target.value;
      if (k === 'vNom' || k === 'kFiltro'){
        const n = Number(v);
        if (isFinite(n) && n > 0) kiCfg[k] = n;
      } else if (k === 'vsd'){
        kiE.vsd = v;
      } else if (k === 'conf'){
        kiE.conf = v;
      } else if (k === 'filtro'){
        kiE.filtro = v === '1';
      } else {
        const n = Number(v);
        kiE[k] = (v === '' || !isFinite(n)) ? null : n;
      }
      kiPintar();
    };
  });
}

function kiCargar(pozo){
  if (pozo === ''){
    kiRef = null;
    kiE = { vsd:'', hp:null, v_placa:null, i_placa:null, f_max:60, awg:2,
            long_ft:null, temp_f:null, conf:'DELTA', filtro:false, tap:null };
    kiPintar();
    return;
  }

  const u = KI_DATOS.find(x => x.pozo === pozo);
  if (u){
    kiRef = u;
    kiE = { vsd:u.vsd, hp:u.hp, v_placa:u.v_placa, i_placa:u.i_placa, f_max:u.f_max,
            awg:u.awg, long_ft:u.long_ft, temp_f:u.temp_f, conf:u.conf,
            filtro:u.filtro, tap:u.tap };
    kiPintar();
    return;
  }

  /* Pozo de la flota sin diseno cargado. Se abre en blanco pero
     asociado a esa unidad, para que al guardar quede en su registro
     y no como una instalacion suelta. La marca del variador que ya
     conoce la flota se usa como punto de partida. */
  const f = KI_FLOTA.find(x => x.pozo === pozo);
  kiRef = { pozo: pozo, campo: (f && f.campo) || '\u2014',
            pad: (f && f.pad) || '\u2014', nuevo: true };
  kiE = { vsd:(f && f.marca) || '', hp:null, v_placa:null, i_placa:null,
          f_max:60, awg:2, long_ft:null, temp_f:null, conf:'DELTA',
          filtro:false, tap:null };
  kiPintar();
}

const sel = document.getElementById('kiPozo');
sel.onchange = e => kiCargar(e.target.value);

/* Dos grupos: las unidades que ya tienen diseno y las que estan en
   la flota pero todavia no. Separarlas dice de un vistazo cuanto
   falta por cargar, que en Put Sur es todo. */
function kiPoblarSelector(){
  const con = KI_DATOS.map(u => u.pozo);
  const sin = KI_FLOTA.filter(f => con.indexOf(f.pozo) < 0);

  let h = '<option value="">Instalaci\u00f3n suelta (sin guardar)</option>';

  if (KI_DATOS.length){
    h += '<optgroup label="Con dise\u00f1o registrado (' + KI_DATOS.length + ')">'
      + KI_DATOS.map(u => '<option value="' + koEscI(u.pozo) + '">'
          + koEscI(u.pozo)
          + (u.campo && u.campo !== '\u2014' ? ' \u00b7 ' + koEscI(u.campo) : '')
          + '</option>').join('')
      + '</optgroup>';
  }
  if (sin.length){
    /* Agrupadas por campo: es como el usuario piensa la flota. */
    const campos = [...new Set(sin.map(f => f.campo))].sort();
    campos.forEach(c => {
      h += '<optgroup label="Sin dise\u00f1o \u00b7 ' + koEscI(c) + ' ('
        + sin.filter(f => f.campo === c).length + ')">'
        + sin.filter(f => f.campo === c).map(f =>
            '<option value="' + koEscI(f.pozo) + '">' + koEscI(f.pozo)
            + (f.pad && f.pad !== '\u2014' ? ' \u00b7 ' + koEscI(f.pad) : '')
            + '</option>').join('')
        + '</optgroup>';
    });
  }
  document.getElementById('kiPozo').innerHTML = h;
}

async function kiArrancar(){
  try { kiAplicarParametros(await kiCargarParametros()); }
  catch(e){ console.warn('[Kronos-M] Parametros no disponibles:', e.message); }

  KI_FLOTA = await kiCargarFlota();

  try { KI_DATOS = await kiCargarUnidades(); }
  catch(e){
    document.getElementById('kiSalida').innerHTML =
      '<div class="ki-card"><div class="ki-vacio">No se pudieron cargar las unidades.<br>'
      + koEscI(e.message) + '</div></div>';
    KI_DATOS = [];
  }

  kiPoblarSelector();
  kiCargar('');
}

kiArrancar();
</script>

<script>
/* Reporte de scroll al contenedor de Kronos-M.
   Este archivo tambien se abre en pestana aparte; ahi no hay padre a quien
   avisar y el bloque no hace nada. Solo sirve cuando corre dentro del
   iframe: el boton del asistente vive en la pagina padre y sin este aviso
   no se entera de que aqui adentro se esta bajando. */
(function () {
  if (window.parent === window) return;
  var ultimo = 0;
  window.addEventListener("scroll", function () {
    var y = window.scrollY || document.documentElement.scrollTop || 0;
    if (Math.abs(y - ultimo) < 4) return;
    ultimo = y;
    try { window.parent.postMessage({ tipo: "kx-scroll", y: y }, "*"); }
    catch (e) { /* origen distinto: se ignora */ }
  }, { passive: true });
})();
</script>
