<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C&aacute;lculo de TAP e Instalaci&oacute;n</title>
<style>
:root{
  --ki-teal:#12a5b8; --ki-green:#35a853;
  --ki-bg:#081724; --ki-card:#0f2739; --ki-card2:#143349;
  --ki-line:rgba(255,255,255,.09); --ki-line2:rgba(255,255,255,.06);
  --ki-t1:#eef4f9; --ki-t2:#a7bccd; --ki-t3:#7f9bb2;
  --ki-ok:#35a853; --ki-warn:#e0a230; --ki-crit:#d6584a; --ki-null:#5f7d94;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ki-bg);color:var(--ki-t1);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}

.ki-top{background:linear-gradient(100deg,var(--ki-teal),var(--ki-green));color:#fff;
  padding:14px 20px;display:flex;justify-content:space-between;align-items:center;
  gap:14px;flex-wrap:wrap}
.ki-top h1{margin:0;font-size:20px;font-weight:600}
.ki-top .sub{margin:3px 0 0;font-size:13px;opacity:.9}

.ki-wrap{padding:18px 20px;max-width:1400px;margin:0 auto}
.ki-cols{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:14px;
  align-items:start}
@media(max-width:940px){.ki-cols{grid-template-columns:1fr}}

.ki-card{background:var(--ki-card);border:1px solid var(--ki-line);border-radius:9px;
  padding:13px 15px;margin-bottom:14px}
.ki-card:last-child{margin-bottom:0}
.ki-card .ct{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  margin-bottom:12px;flex-wrap:wrap}
.ki-card .ct b{font-size:13px;font-weight:600;color:#fff}
.ki-card .ct span{font-size:10.5px;color:var(--ki-t3);letter-spacing:.4px;
  text-transform:uppercase}

.ki-f{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:5px 0;border-bottom:1px solid var(--ki-line2)}
.ki-f:last-child{border-bottom:none}
.ki-f label{font-size:12.5px;color:var(--ki-t2);flex:1 1 auto;min-width:0}
.ki-f label i{font-style:normal;color:var(--ki-t3);font-size:11px;display:block}
.ki-f input,.ki-f select{background:var(--ki-card2);border:1px solid var(--ki-line);
  color:#fff;border-radius:5px;padding:5px 7px;font-size:13px;font-family:inherit;
  width:96px;text-align:right}
.ki-f select{width:120px;text-align:left}
.ki-f input:focus,.ki-f select:focus{outline:none;border-color:var(--ki-teal)}
.ki-sel{width:100%!important;margin-bottom:12px;text-align:left!important}

.ki-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px}
.ki-p{background:var(--ki-card2);border:1px solid var(--ki-line);border-radius:7px;
  padding:9px 11px;position:relative;overflow:hidden}
.ki-p:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--ki-teal)}
.ki-p.g:before{background:var(--ki-green)}
.ki-p.w:before{background:var(--ki-warn)}
.ki-p.r:before{background:var(--ki-crit)}
.ki-p .n{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--ki-t3)}
.ki-p .fr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;
  color:#7fa8c4;margin:3px 0 4px;word-break:break-word}
.ki-p .r2{font-size:18px;font-weight:600;color:#fff;letter-spacing:-.4px}
.ki-p .r2 small{font-size:11px;font-weight:400;color:var(--ki-t2);margin-left:3px;
  letter-spacing:0}

table.ki-t{width:100%;border-collapse:collapse;font-size:12px;color:var(--ki-t2)}
table.ki-t th{text-align:right;font-weight:600;color:var(--ki-t3);font-size:10px;
  letter-spacing:.5px;text-transform:uppercase;padding:0 0 7px 9px;
  border-bottom:1px solid var(--ki-line);white-space:nowrap}
table.ki-t th:first-child,table.ki-t td:first-child{text-align:left;padding-left:0}
table.ki-t td{text-align:right;padding:6px 0 6px 9px;
  border-bottom:1px solid var(--ki-line2);white-space:nowrap}
table.ki-t tr:last-child td{border-bottom:none}
table.ki-t .ok{color:var(--ki-ok)}
table.ki-t .df{color:var(--ki-warn)}
.ki-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

.ki-tab{display:grid;grid-template-columns:repeat(auto-fit,minmax(38px,1fr));gap:4px;
  margin-top:4px}
.ki-tab div{background:var(--ki-card2);border:1px solid var(--ki-line);border-radius:4px;
  padding:5px 2px;text-align:center;font-size:10.5px;color:var(--ki-t3);line-height:1.35}
.ki-tab div b{display:block;color:var(--ki-t2);font-size:11px;font-weight:600}
.ki-tab div.on{border-color:var(--ki-teal);background:rgba(18,165,184,.16)}
.ki-tab div.on b{color:#7fd0dd}

.ki-nota{font-size:11.5px;color:var(--ki-t3);line-height:1.55;margin:12px 0 0}
.ki-nota b{color:var(--ki-t2);font-weight:600}
.ki-nota .al{color:var(--ki-warn)}
.ki-av{background:rgba(224,162,48,.10);border:1px solid rgba(224,162,48,.35);
  border-radius:7px;padding:9px 11px;font-size:12px;color:#e8c07a;line-height:1.5;
  margin-top:11px}
</style>
</head>

<div class="ki-top">

/* Tabla CVD de la hoja CALCULATIONS. Solo esta cargado el calibre
   #2, el unico que usa la hoja. Los demas calibres quedan
   pendientes de las tablas del fabricante del cable. */
const KI_CVD = {
  2: [[40,11],[50,14],[60,16],[70,19],[80,22],[90,25],[100,27],[110,30],[120,33],[130,36],[140,39]]
};
const KI_TCF = [[140,1.13],[149,1.15],[158,1.17],[167,1.19],[176,1.21],[185,1.23],
                [194,1.25],[203,1.27],[212,1.29],[221,1.31],[230,1.33]];

const kiCfg = { vNom: 480, kFiltro: 1.07 };
let kiE = null;    /* entradas de trabajo */
let kiRef = null;  /* unidad de referencia cargada, o null si es nueva */

function kiInterp(t, x){
  if (x == null || !isFinite(x)) return null;
  if (x <= t[0][0]) return t[0][1];
  if (x >= t[t.length-1][0]) return t[t.length-1][1];
  for (let i = 0; i < t.length - 1; i++){
    const [a, va] = t[i], [b, vb] = t[i+1];
    if (x >= a && x <= b) return va + (vb - va) * (x - a) / (b - a);
  }
  return null;
}

function kiCalc(){
  const e = kiE, r = {};
  const tabla = KI_CVD[e.awg];
  r.tablaFalta = !tabla;
  r.cvd = tabla ? kiInterp(tabla, e.i_placa) : null;
  r.tcf = kiInterp(KI_TCF, e.temp_f);

  if (r.cvd != null && r.tcf != null && e.long_ft != null)
    r.cl = e.long_ft * r.cvd / 1000 * r.tcf;

  if (e.v_placa != null && e.f_max && r.cl != null){
    r.vEsp = e.v_placa * e.f_max / 60 + r.cl;
    r.vPwm = r.vEsp * kiCfg.kFiltro;
  }
  r.vReq = e.filtro ? r.vPwm : r.vEsp;

  if (e.tap != null && kiCfg.vNom){
    r.rt      = e.tap / kiCfg.vNom;
    r.v60Sut  = e.f_max ? e.tap * 60 / e.f_max : null;
    r.v60Drv  = r.rt ? (r.v60Sut != null ? r.v60Sut / r.rt : null) : null;
    r.kva     = e.i_placa != null ? e.tap * e.i_placa * 1.73 / 1000 : null;
    r.ctrl    = e.i_placa != null ? e.i_placa * r.rt : null;
    r.vClamp  = r.v60Drv != null && e.f_max ? r.v60Drv * e.f_max / 60 : null;
    r.iRun    = e.i_placa != null ? e.i_placa * 0.95 * r.rt : null;
    r.iSync   = e.i_placa != null ? e.i_placa * 1.25 * r.rt : null;
    r.iOver   = r.ctrl;
    r.iNom    = r.ctrl;
    r.iMag    = e.i_placa != null ? 0.3 * e.i_placa * r.rt : null;
    if (r.vReq != null) r.dTap = e.tap - r.vReq;
  }
  r.torque = e.hp != null ? e.hp * 5252 / 3450 : null;
  return r;
}

/* ---------- formulario ---------- */

const KI_CAMPOS = [
  ['vsd',      'Variador',                   'texto'],
  ['hp',       'Potencia del motor',         'num', 'HP'],
  ['v_placa',  'Tensi\u00f3n de placa',      'num', 'V'],
  ['i_placa',  'Corriente de placa',         'num', 'A'],
  ['f_max',    'Frecuencia m\u00e1xima',     'num', 'Hz'],
  ['awg',      'Calibre del cable',          'num', 'AWG'],
  ['long_ft',  'Longitud del cable',         'num', 'ft'],
  ['temp_f',   'Temperatura del pozo',       'num', '\u00b0F'],
  ['conf',     'Conexi\u00f3n del motor',    'conf'],
  ['filtro',   'Filtro seno instalado',      'si'],
  ['tap',      'TAP escogido en el SUT',     'num', 'V (opcional)']
];

function kiForm(){
  const h = KI_CAMPOS.map(c => {
    const [k, et, tipo, un] = c;
    let ctrl;
    if (tipo === 'conf'){
      ctrl = '<select data-k="' + k + '">'
        + ['WYE','DELTA'].map(o => '<option' + (kiE.conf === o ? ' selected' : '')
            + '>' + o + '</option>').join('') + '</select>';
    } else if (tipo === 'si'){
      ctrl = '<select data-k="' + k + '">'
        + '<option value="0"' + (kiE.filtro ? '' : ' selected') + '>No</option>'
        + '<option value="1"' + (kiE.filtro ? ' selected' : '') + '>S\u00ed</option></select>';
    } else if (tipo === 'texto'){
      ctrl = '<input data-k="' + k + '" type="text" style="width:130px;text-align:left" '
        + 'value="' + (kiE[k] || '') + '">';
    } else {
      ctrl = '<input data-k="' + k + '" type="number" step="any" value="'
        + (kiE[k] != null ? kiE[k] : '') + '">';
    }
    return '<div class="ki-f"><label>' + et
      + (un ? '<i>' + un + '</i>' : '') + '</label>' + ctrl + '</div>';
  }).join('');

  return h
    + '<div class="ki-f"><label>Tensi\u00f3n nominal del variador<i>V</i></label>'
    + '<input data-k="vNom" type="number" step="any" value="' + kiCfg.vNom + '"></div>'
    + '<div class="ki-f"><label>Factor del filtro seno</label>'
    + '<input data-k="kFiltro" type="number" step="0.01" value="' + kiCfg.kFiltro + '"></div>';
}

function kiTablas(r){
  const cvd = KI_CVD[kiE.awg];
  let h = '<div style="font-size:11px;color:var(--ki-t3);letter-spacing:.5px;'
    + 'text-transform:uppercase;margin-bottom:2px">CVD calibre #'
    + (kiE.awg != null ? kiE.awg : '\u2014') + ' &middot; V por 1000 ft</div>';
  if (!cvd){
    h += '<p class="ki-nota" style="margin-top:4px">No hay tabla cargada para este '
      + 'calibre. La hoja original solo trae el calibre #2.</p>';
  } else {
    h += '<div class="ki-tab">' + cvd.map(([a, f]) => {
      const on = r.cvd != null && kiE.i_placa != null
        && Math.abs(kiE.i_placa - a) <= 5;
      return '<div class="' + (on ? 'on' : '') + '">' + a + ' A<b>' + f + '</b></div>';
    }).join('') + '</div>';
  }
  h += '<div style="font-size:11px;color:var(--ki-t3);letter-spacing:.5px;'
    + 'text-transform:uppercase;margin:12px 0 2px">TCF &middot; factor por temperatura</div>'
    + '<div class="ki-tab">' + KI_TCF.map(([t, f]) => {
        const on = kiE.temp_f != null && Math.abs(kiE.temp_f - t) <= 4.5;
        return '<div class="' + (on ? 'on' : '') + '">' + t + '\u00b0<b>' + f + '</b></div>';
      }).join('') + '</div>'
    + '<p class="ki-nota">Los dos factores se interpolan entre puntos de la tabla. '
    + 'La celda resaltada es el punto m&aacute;s cercano, no el valor usado.</p>';
  return h;
}

/* ---------- salida ---------- */

function kiSalida(r){
  const p = (cls, n, f, val, un) => '<div class="ki-p ' + cls + '">'
    + '<div class="n">' + n + '</div>'
    + (f ? '<div class="fr">' + f + '</div>' : '')
    + '<div class="r2">' + val + (un ? '<small>' + un + '</small>' : '') + '</div></div>';
  const nn = (v, d) => v == null ? '\u2014' : v.toFixed(d == null ? 1 : d);

  let h = '';

  h += '<div class="ki-card"><div class="ct"><b>1. P&eacute;rdida de tensi&oacute;n en el cable</b>'
    + '<span>Entrada del m&oacute;dulo de optimizaci&oacute;n</span></div><div class="ki-grid">'
    + p('', 'CVD', 'tabla(' + nn(kiE.i_placa, 0) + ' A)', nn(r.cvd, 1), 'V/1000ft')
    + p('', 'TCF', 'tabla(' + nn(kiE.temp_f, 0) + ' \u00b0F)', nn(r.tcf, 3), '')
    + p('g', 'Ca&iacute;da en el cable', 'long x CVD / 1000 x TCF', nn(r.cl, 1), 'V')
    + '</div>';
  if (r.tablaFalta){
    h += '<div class="ki-av">Sin tabla CVD para el calibre #'
      + (kiE.awg != null ? kiE.awg : '\u2014') + '. La ca&iacute;da no se puede calcular '
      + 'hasta cargar la tabla de ese calibre.</div>';
  }
  h += '</div>';

  h += '<div class="ki-card"><div class="ct"><b>2. Tensi&oacute;n requerida en el SUT</b>'
    + '<span>A frecuencia m&aacute;xima</span></div><div class="ki-grid">'
    + p('', 'Sin filtro', 'V placa x F m&aacute;x / 60 + CL', nn(r.vEsp, 0), 'V')
    + p('', 'Con filtro seno', 'anterior x ' + kiCfg.kFiltro.toFixed(2), nn(r.vPwm, 0), 'V')
    + p('g', 'Requerida en esta unidad',
        kiE.filtro ? 'con filtro' : 'sin filtro', nn(r.vReq, 0), 'V')
    + '</div>'
    + '<p class="ki-nota">Esta es la tensi&oacute;n que debe entregar el SUT a frecuencia '
    + 'm&aacute;xima. La derivaci&oacute;n se escoge en sitio contra la tabla del SUT '
    + 'instalado.</p></div>';

  const cls = r.dTap == null ? '' : (Math.abs(r.dTap) <= 50 ? 'g'
              : (Math.abs(r.dTap) <= 150 ? 'w' : 'r'));
  h += '<div class="ki-card"><div class="ct"><b>3. Verificaci&oacute;n del TAP escogido</b>'
    + '<span>' + kiE.conf + '</span></div>';
  if (kiE.tap == null){
    h += '<p class="ki-nota" style="margin:0">La tensi&oacute;n requerida es el resultado '
      + 'del punto 2. La derivaci&oacute;n se escoge en sitio con la tabla del SUT '
      + 'instalado, que cambia de un modelo a otro. Al anotar aqu&iacute; el TAP escogido '
      + 'se calculan la relaci&oacute;n de transformaci&oacute;n, los ajustes del variador '
      + 'y los l&iacute;mites de corriente.</p></div>';
  } else {
    h += '<div class="ki-grid">'
      + p('', 'TAP escogido', 'anotado en sitio', nn(kiE.tap, 0), 'V')
      + p(cls, 'Diferencia contra la requerida', 'TAP - requerida',
          (r.dTap > 0 ? '+' : '') + r.dTap.toFixed(0), 'V')
      + p('', 'Relaci&oacute;n de transformaci&oacute;n', 'TAP / ' + kiCfg.vNom, nn(r.rt, 3), '')
      + p('', 'Tensi&oacute;n @ 60 Hz salida SUT', 'TAP x 60 / F m&aacute;x', nn(r.v60Sut, 0), 'V')
      + '</div></div>';
  }

  if (r.rt == null){
    h += '<div class="ki-card"><div class="ct"><b>4. Ajustes del variador</b>'
      + '<span>Requieren el TAP</span></div>'
      + '<p class="ki-nota" style="margin:0">Los ajustes de puesta en servicio y los '
      + 'l&iacute;mites de corriente se refieren a superficie a trav&eacute;s de la '
      + 'relaci&oacute;n de transformaci&oacute;n, as&iacute; que salen una vez escogida '
      + 'la derivaci&oacute;n. El torque no depende del TAP: '
      + nn(r.torque, 0) + ' lb-ft.</p></div>';
    if (kiRef) h += kiComparar(r);
    return h;
  }

  h += '<div class="ki-card"><div class="ct"><b>4. Ajustes del variador</b>'
    + '<span>Puesta en servicio</span></div><div class="ki-grid">'
    + p('', 'Tensi&oacute;n del variador @ 60 Hz', 'V60 SUT / RT', nn(r.v60Drv, 1), 'V')
    + p('', 'V-clamp', 'anterior x F m&aacute;x / 60', nn(r.vClamp, 1), 'V')
    + p('', 'kVA requerido @ F m&aacute;x', 'TAP x A placa x 1.73 / 1000', nn(r.kva, 1), 'kVA')
    + p('', 'Dimensionamiento del controlador', 'A placa x RT', nn(r.ctrl, 1), 'A')
    + p('', 'Torque', 'HP x 5252 / 3450', nn(r.torque, 0), 'lb-ft')
    + '</div></div>';

  h += '<div class="ki-card"><div class="ct"><b>5. L&iacute;mites de corriente</b>'
    + '<span>Referidos a superficie</span></div><div class="ki-grid">'
    + p('', 'Run Ilimit', 'A placa x 0.95 x RT', nn(r.iRun, 1), 'A')
    + p('', 'Sync Ilimit', 'A placa x 1.25 x RT', nn(r.iSync, 1), 'A')
    + p('', 'Overload', 'A placa x RT', nn(r.iOver, 1), 'A')
    + p('', 'Corriente de placa referida', 'A placa x RT', nn(r.iNom, 1), 'A')
    + p('', 'Corriente de magnetizaci&oacute;n', '0.3 x A placa x RT', nn(r.iMag, 1), 'A')
    + '</div></div>';

  if (kiRef) h += kiComparar(r);
  return h;
}

/* La comparacion contra la hoja es lo que permite confiar en el
   traslado. Donde no coincide hay una decision pendiente. */
function kiComparar(r){
  const hj = kiRef.hoja || {};
  const fil = [
    ['CVD', hj.cvd, r.cvd, 1],
    ['TCF', hj.tcf, r.tcf, 3],
    ['Ca&iacute;da en el cable', hj.cl, r.cl, 1],
    ['Tensi&oacute;n SUT sin filtro', hj.v_esp, r.vEsp, 0],
    ['Tensi&oacute;n SUT con filtro', hj.v_pwm, r.vPwm, 0],
    ['Relaci&oacute;n de transformaci&oacute;n', hj.rt, r.rt, 3],
    ['Tensi&oacute;n @ 60 Hz salida SUT', hj.v60_sut, r.v60Sut, 0],
    ['Tensi&oacute;n variador @ 60 Hz', hj.v60_drive, r.v60Drv, 1],
    ['kVA requerido', hj.kva, r.kva, 1],
    ['Dimensionamiento del controlador', hj.ctrl, r.ctrl, 1],
    ['V-clamp', hj.vclamp, r.vClamp, 1],
    ['Torque', hj.torque, r.torque, 0],
    ['Run Ilimit', hj.i_run, r.iRun, 1],
    ['Sync Ilimit', hj.i_sync, r.iSync, 1],
    ['Overload', hj.i_over, r.iOver, 1],
    ['Magnetizaci&oacute;n', hj.i_mag, r.iMag, 1]
  ].filter(x => x[1] != null && x[2] != null).map(x => {
    const d = x[2] - x[1];
    const ig = Math.abs(d) < Math.max(0.05, Math.abs(x[1]) * 0.005);
    return '<tr><td>' + x[0] + '</td><td>' + x[1].toFixed(x[3]) + '</td>'
      + '<td style="color:#fff">' + x[2].toFixed(x[3]) + '</td>'
      + '<td class="' + (ig ? 'ok' : 'df') + '">'
      + (ig ? 'igual' : (d > 0 ? '+' : '') + d.toFixed(x[3])) + '</td></tr>';
  }).join('');

  return '<div class="ki-card"><div class="ct"><b>Contra la hoja de c&aacute;lculo</b>'
    + '<span>' + kiRef.pozo + '</span></div>'
    + '<div class="ki-scroll"><table class="ki-t"><thead><tr><th>Resultado</th>'
    + '<th>Hoja</th><th>Kronos-M</th><th>Diferencia</th></tr></thead><tbody>'
    + fil + '</tbody></table></div>'
    + '<p class="ki-nota">El CVD y el TCF de la hoja est&aacute;n escritos a mano; '
    + 'aqu&iacute; se interpolan de la tabla. Donde no coinciden, todo lo que sigue '
    + 'hereda la diferencia.</p></div>';
}

/* ---------- ciclo ---------- */

function kiPintar(){
  const r = kiCalc();
  document.getElementById('kiForm').innerHTML = kiForm();
  document.getElementById('kiTablas').innerHTML = kiTablas(r);
  document.getElementById('kiSalida').innerHTML = kiSalida(r);

  document.querySelectorAll('#kiForm [data-k]').forEach(el => {
    el.onchange = ev => {
      const k = ev.target.dataset.k;
      const v = ev.target.value;
      if (k === 'vNom' || k === 'kFiltro'){
        const n = Number(v);
        if (isFinite(n) && n > 0) kiCfg[k] = n;
      } else if (k === 'vsd'){
        kiE.vsd = v;
      } else if (k === 'conf'){
        kiE.conf = v;
      } else if (k === 'filtro'){
        kiE.filtro = v === '1';
      } else {
        const n = Number(v);
        kiE[k] = (v === '' || !isFinite(n)) ? null : n;
      }
      kiPintar();
    };
  });
}

function kiCargar(pozo){
  if (pozo === ''){
    kiRef = null;
    kiE = { vsd:'', hp:null, v_placa:null, i_placa:null, f_max:60, awg:2,
            long_ft:null, temp_f:null, conf:'DELTA', filtro:false, tap:null };
  } else {
    const u = KI_DATOS.find(x => x.pozo === pozo);
    kiRef = u;
    kiE = { vsd:u.vsd, hp:u.hp, v_placa:u.v_placa, i_placa:u.i_placa, f_max:u.f_max,
            awg:u.awg, long_ft:u.long_ft, temp_f:u.temp_f, conf:u.conf,
            filtro:false, tap:u.tap };
  }
  kiPintar();
}

const sel = document.getElementById('kiPozo');
sel.innerHTML = '<option value="">Instalaci\u00f3n nueva (en blanco)</option>'
  + KI_DATOS.map(u => '<option value="' + u.pozo + '">' + u.pozo + ' \u00b7 '
      + u.vsd + '</option>').join('');
sel.onchange = e => kiCargar(e.target.value);
kiCargar('CYC-40');
sel.value = 'CYC-40';
</script>
