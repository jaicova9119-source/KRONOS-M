<style>

.evita{margin:0 14px 10px;border-left:5px solid #E3A300;padding:4px 10px;background:var(--surface-2);font-size:14px}.evita ul{margin:4px 0 2px;padding-left:18px}
.fotoreq{margin:0 14px 14px;font-size:14px}

.grph b{font-size:15px}.grph span{font-size:13px;color:var(--ink-soft);text-align:right}

.regla{font-weight:700;padding:10px 12px;border-radius:10px;background:var(--card);border-left:6px solid var(--ok)}.regla.eN{border-left-color:var(--danger)}.regla.eA{border-left-color:#E3A300}
.bulk{margin-bottom:12px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px}.item p{margin:0 0 10px;font-weight:700}
.fila-hz{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px}

.mini-chip{font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--surface-2)}
.mini-chip.eC{background:var(--ok-bg);color:var(--ok)}.mini-chip.eA{background:var(--warn-bg);color:var(--warn)}.mini-chip.eN{background:var(--danger-bg);color:var(--danger)}

.calcbox{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:4px 12px;margin-bottom:12px}
.calcbox div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--surface-2)}.calcbox div:first-child{border-top:0}
.calcbox span{font-size:14px;color:var(--ink-soft)}.calcbox span small{display:block;font-size:12px}.calcbox b{text-align:right}.calcbox b.falta{color:var(--info);font-size:14px}
.pre{margin-top:6px}
.prechip{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;min-height:52px;font-size:15px;line-height:1.35}
.prechip i{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--ink-soft);margin-top:1px;position:relative}
.prechip[aria-pressed="true"]{border-color:var(--navy);background:var(--surface-2)}
.prechip[aria-pressed="true"] i{background:var(--navy);border-color:var(--navy)}
.prechip[aria-pressed="true"] i::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.preview{background:var(--surface-2);border-left:5px solid var(--acento);border-radius:8px;padding:10px 12px;margin:10px 0 4px;font-size:14px}.preview p{margin:6px 0 0}
.obs{margin:12px 0}.obs label{display:block;font-weight:700;margin-bottom:6px}.obs.req label{color:var(--danger)}
.fotos{margin-bottom:12px}.fotos input{position:absolute;opacity:0;width:1px;height:1px}
.miniaturas{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.miniaturas img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:2px solid var(--line)}
.na{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink-soft);min-height:44px}.na input{width:24px;height:24px}
.ro .captura,.ro .pre,.ro .obs,.ro .fotos label,.ro .na,.ro .bulk{pointer-events:none}.ro .fotos label,.ro .na{display:none}
.flujo{display:flex;gap:4px;margin-bottom:14px}.flujo span{flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:8px 2px;border-radius:6px;background:var(--card);border:1.5px solid var(--line);color:var(--ink-soft)}.flujo span.hecho{background:var(--navy);border-color:var(--navy);color:#fff}
.resrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-weight:700;font-size:15px}
.hall{background:var(--card);border-left:6px solid #E3A300;border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:14px}.hall.sAlta{border-left-color:var(--danger)}.hall b{display:block;font-size:15px}.hall small{color:var(--ink-soft)}
.toast{position:fixed;left:50%;transform:translate(-50%,8px);bottom:96px;width:min(520px,calc(100% - 28px));background:var(--texto);color:var(--bg);padding:13px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:30;padding:14px}
.modal.on{display:flex}
.modal-caja{background:var(--card);border-radius:16px;padding:18px;width:min(520px,100%);margin-bottom:env(safe-area-inset-bottom,0px)}
.modal-caja h3{margin:0 0 8px;color:var(--texto);font-size:18px}.modal-caja p{margin:0 0 14px;color:var(--ink-soft)}
.modal-caja textarea{margin-bottom:12px}.modal-acc{display:flex;gap:10px}.modal-acc .btn{flex:1}

.zona{flex:1;display:flex;min-height:0}
.col{flex:1;display:flex;flex-direction:column;min-width:0}
.lado{display:none}
.lista{display:block}
.form2 .campo.ancho,.form2 .ancho{grid-column:1/-1}

/* ---------- tableta: más ancho útil, formularios en dos columnas ---------- */
@media (min-width:760px){
  :root{--maxw:980px}
  .cuerpo{padding:18px 22px 26px}

  .accion{justify-content:flex-end;padding:12px 22px}
  .accion .btn.pri{flex:0 1 420px}

  .c-split{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  .c-split h2:first-child{margin-top:4px}

/* ---------- computador: recorrido fijo a la izquierda, guía junto a la captura ---------- */

  :root{--maxw:1560px}

  .lado-eq{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:12px 8px 4px;font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em}

  .lado-p{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px;min-height:40px;font-size:14px;color:var(--texto)}
  .lado-p:hover{background:var(--surface-2)}

  html[data-tema="oscuro"] .lado-p.act{background:var(--acento);color:#0b1a22}

  .lado-p .dot{width:12px;height:12px}

  .p-split{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:22px;align-items:start}
  .p-guia{position:sticky;top:0;max-height:calc(100vh - 190px);overflow-y:auto;border-radius:var(--radius)}
  .p-guia details.guia{margin-bottom:0}
  .lista{grid-template-columns:repeat(3,minmax(0,1fr))}
  .form2{grid-template-columns:repeat(3,1fr)}
  .form2 .campo.ancho{grid-column:1/-1}
  .form2 .campo.dos{grid-column:span 2}
  .form2{max-width:1180px}
  .cuerpo{padding:20px 28px 30px}
  .accion{padding:12px 28px}
  .inp input{width:120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="enc">

    <div class="t"><b id="encT">Comisionamiento</b><span id="encS">Equipos de superficie BES</span></div>
    <div class="red" id="red"></div>
  </header>
  <div class="zona">
    <aside class="lado" id="lado" aria-label="Recorrido"></aside>

<script>
/* ============================================================
   COMISIONAMIENTO DE EQUIPOS DE SUPERFICIE BES
   Módulo de Captura. Lee la plantilla de cm_plantillas, guía el
   recorrido paso a paso, guarda en el dispositivo y sincroniza por la
   misma cola de Captura (dp_pendientes).
   ============================================================ */
(function(){
"use strict";

/* ---------------- configuración (la misma de Captura) ---------------- */

var DB = null;

  if (DB) return Promise.resolve(DB);
  return new Promise(function(ok, ko){
    var r = indexedDB.open('kc_comisionamiento', 1);
    r.onupgradeneeded = function(){
      var d = r.result;
      if (!d.objectStoreNames.contains('cms')) d.createObjectStore('cms', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('fotos')) d.createObjectStore('fotos', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('plantillas')) d.createObjectStore('plantillas', { keyPath: 'clave' });
      if (!d.objectStoreNames.contains('cache')) d.createObjectStore('cache', { keyPath: 'clave' });
    };
    r.onsuccess = function(){ DB = r.result; ok(DB); };
    r.onerror = function(){ ko(r.error); };
  });
}
function idb(store, modo, fn){
  return db().then(function(d){ return new Promise(function(ok, ko){
    var tx = d.transaction(store, modo), st = tx.objectStore(store), res;
    var q = fn(st); if (q) q.onsuccess = function(){ res = q.result; };
    tx.oncomplete = function(){ ok(res); }; tx.onerror = function(){ ko(tx.error); };
  }); });
}
function idbPut(store, v){ return idb(store, 'readwrite', function(s){ return s.put(v); }); }

function leerCola(){ try { return JSON.parse(dpAlmacen.getItem(CLAVE_COLA) || '[]'); } catch(e){ return []; } }

/* Un paso se guarda muchas veces: en la cola solo queda la versión más reciente. */
function encolar(rpc, payload, etiqueta, clave){
  var c = leerCola();
  if (clave) c = c.filter(function(x){ return x.clave !== clave || x.error; });
  c.push({ rpc: rpc, payload: payload, etiqueta: etiqueta, ts: new Date().toISOString(), clave: clave || null });
  guardarCola(c);
}
/* Envía directo si se puede y no hay nada anterior en cola para ese
   comisionamiento (el orden importa: el paso no existe sin el crear). */
function enviar(rpc, payload, etiqueta, clave, comId){
  if (!sb || !navigator.onLine || colaDe(comId).some(function(x){ return !x.error; })) {
    encolar(rpc, payload, etiqueta, clave);
    return Promise.resolve({ cola: true });
  }
  return sb.rpc(rpc, { p: payload }).then(function(r){
    if (r.error) { encolar(rpc, payload, etiqueta, clave); return { cola: true }; }
    var b = r.data || {};
    if (!b.ok) return { rechazo: b.error || 'Rechazado por la base' };
    return { ok: true, data: b };
  }).catch(function(){ encolar(rpc, payload, etiqueta, clave); return { cola: true }; });
}
var sincronizando = false;
function sincronizar(){
  if (sincronizando || !sb || !navigator.onLine) return Promise.resolve();
  sincronizando = true;
  var cola = leerCola();
  function paso(i, fallidos){
    if (i >= cola.length){ guardarCola(fallidos); return Promise.resolve(); }
    var it = cola[i];
    if (it.error) { fallidos.push(it); return paso(i+1, fallidos); }
    return sb.rpc(it.rpc, { p: it.payload }).then(function(r){
      if (r.error) { guardarCola(fallidos.concat(cola.slice(i))); return; }
      var b = r.data || {};
      if (!b.ok) { it.error = b.error; fallidos.push(it); }
      return paso(i+1, fallidos);
    }).catch(function(){ guardarCola(fallidos.concat(cola.slice(i))); });
  }
  return paso(0, []).then(subirFotos).then(function(){ sincronizando = false; pintarRed(); }, function(){ sincronizando = false; });
}
function subirFotos(){
  return idbAll('fotos').then(function(fs){
    var pend = fs.filter(function(f){ return f.estado === 'local' && !colaDe(f.com).some(function(x){ return x.rpc === 'dp_cm_q_crear' && !x.error; }); });
    return pend.reduce(function(pr, f){ return pr.then(function(){ return subirFoto(f); }); }, Promise.resolve());
  });
}

  var ruta = f.com + '/' + f.paso + '/' + f.id + '.jpg';
  return fetch(f.url).then(function(r){ return r.blob(); }).then(function(b){
    return sb.storage.from(BUCKET).upload(ruta, b, { contentType: 'image/jpeg', upsert: false });
  }).then(function(r){
    if (r.error && !/exist|duplicate/i.test(r.error.message || '')) throw r.error;
    return sb.rpc('dp_cm_q_foto', { p: { id: f.id, comisionamiento_id: f.com, paso_id: f.paso, storage_path: ruta, orden: f.orden || 0, tomada_en: f.tomada_en } });
  }).then(function(r){
    if (r && !r.error && r.data && r.data.ok) { f.estado = 'subida'; f.ruta = ruta; return idbPut('fotos', f); }
  }).catch(function(){ /* se reintenta en la próxima pasada */ });

function evalPt(p, pt, rec, unitStep){

function calcExpr(expr, vars){

    var val = vars[k]; if (val == null) { falta.push(k); return null; } return val; }
