<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#134B70">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem("dp_tema"); } catch (e) {}
  if (t !== "claro" && t !== "oscuro") t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "oscuro" : "claro";
  document.documentElement.setAttribute("data-tema", t);
})();
</script>
<link rel="manifest" href="./manifest.json">
<title>Comisionamiento BES · Captura</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- La fuente no bloquea la carga: con señal débil la app abre con la fuente del sistema y cambia cuando llega. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
:root{color-scheme:light;--navy:#134B70;--navy-2:#1a5c85;--acento:#1B8E9E;--bg:#f7f9fa;--card:#ffffff;--line:#D1D8DE;--ink:#134B70;--ink-soft:#4d7089;--texto:#16222c;
--surface-2:#EFF1F4;--campo:#ffffff;--ok:#1C6B3A;--ok-bg:#DDEFE3;--warn:#7A5A00;--warn-bg:#FBEFC9;--danger:#BC2F2C;--danger-bg:#FDEDEA;--info:#1F4E79;--info-bg:#DCE6F1;--gris:#6B7680;
--radius:14px;--maxw:560px;--f:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;box-sizing:border-box;
}
html[data-tema="oscuro"]{color-scheme:dark;--navy:#0d2d43;--navy-2:#123f5b;--acento:#35b8c9;--bg:#14181c;--card:#1c2126;--line:#39434B;--ink:#8ecbe4;--ink-soft:#93a3ad;--texto:#dfe6ea;
--surface-2:#232a30;--campo:#232a31;--ok:#5fbf75;--ok-bg:#16281c;--warn:#d9ae6c;--warn-bg:#2a2318;--danger:#e26a6a;--danger-bg:#32201f;--info:#8fb8e6;--info-bg:#18263a;--gris:#8b979f}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--texto);font-family:var(--f);font-size:17px;line-height:1.4}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
/* La app ocupa exactamente la parte visible de la pantalla. Con 100vh (o
   con el relleno de zona segura sumado encima) en Android la barra de
   acción quedaba por debajo del borde. position:fixed con inset 0 se ajusta
   al área visible real, también con la barra del navegador o el teclado. */
.app{position:fixed;top:0;right:0;bottom:0;left:0;margin:0 auto;max-width:var(--maxw);display:flex;flex-direction:column;background:var(--bg)}
html,body{overflow:hidden}
.enc{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.enc .volver{width:48px;height:48px;border-radius:12px;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:26px;flex:0 0 auto}
.enc .t{flex:1;min-width:0}.enc .t b{display:block;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.enc .t span{font-size:13.5px;opacity:.88;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.red{font-size:12.5px;font-weight:600;border:1.5px solid rgba(255,255,255,.5);border-radius:999px;padding:4px 9px;white-space:nowrap;flex:0 0 auto}
.red i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#a6ecc6;vertical-align:1px}.red.off i{background:#FFB37A}.red.lenta i{background:#F2D16B}
.cuerpo{flex:1;overflow-y:auto;padding:14px 14px 22px}
.accion{flex:0 0 auto;background:var(--card);border-top:1.5px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.accion:empty{display:none}
.btn{min-height:56px;border-radius:12px;border:2px solid var(--ink-soft);background:var(--card);font-weight:700;font-size:16.5px;padding:0 14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;color:var(--texto)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff;flex:1 1 auto;min-width:0}
html[data-tema="oscuro"] .btn.pri{background:var(--acento);border-color:var(--acento);color:#0b1a22}
.btn.sec{flex:0 0 56px;width:56px;padding:0;font-size:28px}
.btn.sec2{flex:1 1 auto;min-width:0;font-size:15px;border-color:var(--line)}
.btn.ancho{width:100%}.btn.grande{min-height:64px;font-size:18px;margin-bottom:6px}
.btn[disabled]{opacity:.42;cursor:not-allowed}
h2{font-size:21px;margin:4px 0 12px;line-height:1.2;color:var(--ink)}
h3{font-size:15.5px;margin:16px 0 8px;color:var(--ink-soft)}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.panel.suave{background:var(--surface-2);border-style:dashed}
.campo{display:block;margin-bottom:12px}.campo>span{display:block;font-size:13.5px;color:var(--ink-soft);font-weight:700;margin-bottom:4px}
.campo input,.campo select,textarea{width:100%;min-height:54px;border:1.5px solid var(--ink-soft);border-radius:10px;background:var(--campo);padding:10px 12px;font-size:17px}
textarea{min-height:90px;resize:vertical}
.nota{font-size:14px;color:var(--ink-soft)}
.sincro{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--ink-soft)}
.sincro .btn{flex:0 0 auto;min-height:46px;font-size:14px}
.version{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:18px}
.dot.ePe{background:var(--info-bg);border-color:var(--info);border-style:dashed}
.pend-b{margin-left:10px;min-height:38px;padding:0 12px;border-radius:8px;border:1.5px solid var(--ink-soft);background:var(--card);font-weight:700;font-size:13px;flex:0 0 auto}
.grp-pend .pend-b{border-color:var(--info);color:var(--info)}
.grph{align-items:center}.grph span{flex:1}
.pend-nota{background:var(--info-bg);color:var(--info);padding:10px 12px;font-size:14px;border-radius:0 0 10px 10px}
.obs+.pend-nota,.na+.pend-nota{border-radius:10px;margin:2px 0 8px}
.modal-ops{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;max-height:34vh;overflow-y:auto}
.modal-ops .prechip{margin:0;min-height:44px}
.resumen-ip{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px;margin:10px 0}
.resumen-ip table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.resumen-ip th,.resumen-ip td{text-align:left;padding:7px 8px;border-top:1px solid var(--surface-2)}
.resumen-ip th{color:var(--ink-soft);font-size:12.5px}
.resumen-ip td.eC{color:var(--ok);font-weight:700}.resumen-ip td.eN{color:var(--danger);font-weight:700}.resumen-ip td.eA{color:var(--warn);font-weight:700}
.giro .giro-par{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:8px;align-items:end;margin-top:8px}
.giro .giro-par label{font-size:12px;color:var(--ink-soft);font-weight:700}
.giro .giro-par input{width:100%;min-height:48px;border:1.5px solid var(--ink-soft);border-radius:8px;padding:6px 8px;font-size:18px;background:var(--campo)}
.giro .gp-l{font-weight:700;font-size:14px;align-self:center}
.giro .gp-t{margin:12px 0 4px;font-size:13px;font-weight:700;color:var(--ink-soft)}
@media (max-width:520px){.giro .giro-par{grid-template-columns:1fr 1fr}.giro .gp-l{grid-column:1/-1}.giro .giro-par .mini-chip{grid-column:1/-1;justify-self:start}}
.errores{border-color:var(--danger);background:var(--danger-bg)}.errores b{color:var(--danger)}.errores ul{margin:6px 0 12px;padding-left:18px;font-size:14px}.errores li{margin-bottom:4px}.errores li b{color:var(--texto)}
.aviso{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14.5px;margin:0 0 12px}
.prueba{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;vertical-align:2px}
.ejec{display:flex;gap:8px;margin-bottom:8px}.ejec input{flex:1;min-width:0}
.quitar{flex:0 0 54px;min-height:54px;border-radius:10px;border:1.5px solid var(--ink-soft);background:var(--card);font-size:24px;font-weight:700}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:64px;min-height:52px;border-radius:10px;border:1.5px solid var(--ink-soft);background:var(--card);font-weight:700;font-size:15.5px;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
html[data-tema="oscuro"] .seg button[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:#0b1a22}
.seg.mini button{min-height:46px;font-size:14px;min-width:0;padding:0 10px}
/* Los grupos de opciones dentro de una fila no se parten en columna ni se
   recortan: en pantalla angosta pasan completos a la línea de abajo. */
.fila .seg.mini{flex-wrap:nowrap;flex:0 0 auto}
.fila .seg.mini button{flex:0 0 auto;white-space:nowrap}
.fila .encontrado{flex:1 1 100%}
.fila .encontrado .seg.mini{flex:0 0 auto}
.seg.chk button[data-v="SI"][aria-pressed="true"],.seg.chk button[data-v="B"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg.chk button[data-v="NO"][aria-pressed="true"],.seg.chk button[data-v="M"][aria-pressed="true"]{background:var(--danger);border-color:var(--danger);color:#fff}
.seg.chk button[data-v="R"][aria-pressed="true"]{background:#E3A300;border-color:#E3A300;color:#141C24}
.eqblk{margin-bottom:14px}
.eqh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 2px 8px;padding-bottom:6px;border-bottom:1.5px solid var(--line)}.eqh b{font-size:15.5px;color:var(--ink)}
.est{font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px;white-space:nowrap}
.est.vacio{color:var(--ink-soft);border:1.5px solid var(--line)}
.est.eC{background:var(--ok-bg);color:var(--ok)}.est.eA{background:var(--warn-bg);color:var(--warn)}.est.eN{background:var(--danger-bg);color:var(--danger)}.est.eP{background:var(--info-bg);color:var(--info)}.est.eX,.est.eR,.est.ePe,.est.eI{background:var(--surface-2);color:var(--gris)}
.pasoItem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:11px 12px;margin-bottom:8px;min-height:66px}
.pasoItem .n{font-weight:700;color:var(--ink-soft);width:24px;font-size:14.5px}
.pasoItem .x{flex:1;min-width:0}.pasoItem .x b{display:block;font-size:16px;line-height:1.25}.pasoItem .x small{display:block;color:var(--ink-soft);font-size:13px}
.barra{display:block;height:6px;background:var(--surface-2);border-radius:9px;overflow:hidden;margin-top:6px}.barra i{display:block;height:100%;background:var(--acento)}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}
.dot.eC{background:var(--ok);border-color:var(--ok)}.dot.eA{background:#E3A300;border-color:#E3A300}.dot.eN{background:var(--danger);border-color:var(--danger)}.dot.eP{background:var(--info);border-color:var(--info)}.dot.eX,.dot.eI{background:var(--gris);border-color:var(--gris)}
.prog{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);font-weight:700;margin-bottom:4px}
.estg{font-weight:600;font-size:12.5px}.estg::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:transparent}
.estg.local::before{background:#E3A300}.estg.nube::before{background:var(--ok)}.estg.cola::before{background:var(--info)}.estg.guardando::before{background:var(--line)}
details.guia{background:var(--card);border:2px solid var(--navy);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
html[data-tema="oscuro"] details.guia{border-color:var(--acento)}
details.guia summary{list-style:none;cursor:pointer;background:var(--navy);color:#fff;font-weight:700;padding:12px 14px;font-size:16px;min-height:48px}
details.guia summary::-webkit-details-marker{display:none}
details.guia summary::after{content:"Ocultar";float:right;font-weight:400;font-size:14px;opacity:.85}
details.guia:not([open]) summary::after{content:"Ver guía"}
details.guia .obj{margin:12px 14px 6px;font-weight:700}
details.guia ol{margin:0 14px 10px 34px;padding:0}details.guia li{margin-bottom:6px}
details.guia .con{display:flex;flex-wrap:wrap;gap:8px;margin:0 14px 10px}
.punta{border:3px solid;border-radius:8px;padding:6px 10px;font-size:14px}.punta.r{border-color:var(--danger)}.punta.n{border-color:var(--texto)}
details.guia .cond{margin:0 14px 10px;font-size:14px;color:var(--ink-soft)}
.evita{margin:0 14px 10px;border-left:5px solid #E3A300;padding:4px 10px;background:var(--surface-2);font-size:14px}.evita ul{margin:4px 0 2px;padding-left:18px}
.fotoreq{margin:0 14px 14px;font-size:14px}
.grp{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.grph{display:flex;justify-content:space-between;gap:8px;align-items:baseline;background:var(--surface-2);padding:9px 12px;border-bottom:1.5px solid var(--line)}
.grph b{font-size:15px}.grph span{font-size:13px;color:var(--ink-soft);text-align:right}
.fila{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--surface-2);flex-wrap:wrap}
.fl{flex:1 1 120px;min-width:0}.fl b{display:block;font-size:15px}.fl small{display:block;color:var(--ink-soft);font-size:12px}
.pr,.pn{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px}.pr{background:var(--danger)}.pn{background:var(--texto);margin-left:6px}
.inp{display:flex;align-items:center;gap:6px}
.inp input{width:104px;min-height:48px;border:1.5px solid var(--ink-soft);border-radius:8px;padding:6px 8px;font-size:18px;background:var(--campo);text-align:right}
.inp .u{font-size:13px;color:var(--ink-soft);min-width:24px}
.olb{min-height:48px;min-width:48px;border-radius:8px;border:1.5px solid var(--ink-soft);background:var(--card);font-weight:700}
.olb[aria-pressed="true"]{background:var(--navy);color:#fff}
.encontrado{display:flex;align-items:center;gap:6px;width:100%;font-size:13px;color:var(--ink-soft)}
.regla{font-weight:700;padding:10px 12px;border-radius:10px;background:var(--card);border-left:6px solid var(--ok)}.regla.eN{border-left-color:var(--danger)}.regla.eA{border-left-color:#E3A300}
.bulk{margin-bottom:12px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px}.item p{margin:0 0 10px;font-weight:700}
.fila-hz{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.fila-hz .hz{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.fila-hz .hz>span:first-child{font-size:18px;font-weight:700;margin-right:auto}
.mini-chip{font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--surface-2)}
.mini-chip.eC{background:var(--ok-bg);color:var(--ok)}.mini-chip.eA{background:var(--warn-bg);color:var(--warn)}.mini-chip.eN{background:var(--danger-bg);color:var(--danger)}
.celdas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.celdas label{font-size:12px;color:var(--ink-soft);font-weight:700}
.celdas input{width:100%;min-height:48px;border:1.5px solid var(--ink-soft);border-radius:8px;padding:6px 8px;font-size:18px;background:var(--campo)}
.calcbox{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:4px 12px;margin-bottom:12px}
.calcbox div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--surface-2)}.calcbox div:first-child{border-top:0}
.calcbox span{font-size:14px;color:var(--ink-soft)}.calcbox span small{display:block;font-size:12px}.calcbox b{text-align:right}.calcbox b.falta{color:var(--info);font-size:14px}
.pre{margin-top:6px}
.prechip{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;min-height:52px;font-size:15px;line-height:1.35}
.prechip i{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--ink-soft);margin-top:1px;position:relative}
.prechip[aria-pressed="true"]{border-color:var(--navy);background:var(--surface-2)}
.prechip[aria-pressed="true"] i{background:var(--navy);border-color:var(--navy)}
.prechip[aria-pressed="true"] i::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.preview{background:var(--surface-2);border-left:5px solid var(--acento);border-radius:8px;padding:10px 12px;margin:10px 0 4px;font-size:14px}.preview p{margin:6px 0 0}
.obs{margin:12px 0}.obs label{display:block;font-weight:700;margin-bottom:6px}.obs.req label{color:var(--danger)}
.fotos{margin-bottom:12px;border:2px dashed transparent;border-radius:var(--radius);transition:border-color .15s,background .15s}
.fotos.encima{border-color:var(--acento);background:var(--surface-2)}
.fotos{position:relative}
/* El input queda dentro de su recuadro: si queda suelto, al recibir el foco
   después del explorador de archivos el navegador desplaza la ventana
   completa para mostrarlo y la pantalla queda en blanco. */
.fotos input{position:absolute;top:0;left:0;opacity:0;width:1px;height:1px;pointer-events:none}
.fotos-btns{display:flex;gap:8px}.fotos-btns .btn{flex:1 1 0;min-width:0}
.fotos-btns .pri-f{border-color:var(--navy);color:var(--navy)}
html[data-tema="oscuro"] .fotos-btns .pri-f{border-color:var(--acento);color:var(--acento)}
.fotos .solta{margin:6px 2px 0}
.miniaturas{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.miniatura{width:76px;height:76px;padding:0;border-radius:8px;border:2px solid var(--line);background:var(--surface-2);overflow:hidden}
.miniatura img{width:100%;height:100%;object-fit:cover;display:block}
.na{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink-soft);min-height:44px}.na input{width:24px;height:24px}
.ro .captura,.ro .pre,.ro .obs,.ro .na,.ro .bulk{pointer-events:none}.ro .fotos-btns,.ro .fotos .solta,.ro .na{display:none}
.flujo{display:flex;gap:4px;margin-bottom:14px}.flujo span{flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:8px 2px;border-radius:6px;background:var(--card);border:1.5px solid var(--line);color:var(--ink-soft)}.flujo span.hecho{background:var(--navy);border-color:var(--navy);color:#fff}
.resrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-weight:700;font-size:15px}
.hall{background:var(--card);border-left:6px solid #E3A300;border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:14px}.hall.sAlta{border-left-color:var(--danger)}.hall b{display:block;font-size:15px}.hall small{color:var(--ink-soft)}
.toast{position:fixed;left:50%;transform:translate(-50%,8px);bottom:96px;width:min(520px,calc(100% - 28px));background:var(--texto);color:var(--bg);padding:13px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:30;padding:14px}
.modal.on{display:flex}
.modal-caja{background:var(--card);border-radius:16px;padding:18px;width:min(520px,100%);margin-bottom:env(safe-area-inset-bottom,0px)}

.modal-caja h3{margin:0 0 8px;color:var(--texto);font-size:18px}.modal-caja p{margin:0 0 14px;color:var(--ink-soft)}

<script>
/* ============================================================
   COMISIONAMIENTO DE EQUIPOS DE SUPERFICIE BES
   Módulo de Captura. Lee la plantilla de cm_plantillas, guía el
   recorrido paso a paso, guarda en el dispositivo y sincroniza por la
   misma cola de Captura (dp_pendientes).
   ============================================================ */
(function(){
"use strict";

/* ---------------- configuración (la misma de Captura) ---------------- */
var DP = {
  SUPABASE_URL: 'https://cxprmbnjnnldqyzaqsvf.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4cHJtYm5qbm5sZHF5emFxc3ZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNTA3OTQsImV4cCI6MjA5OTYyNjc5NH0.UVvo1JxPI0YBeDKyS2lv2egUNdEPu_sa3RX7Cnw5mrg'
};
var BUCKET = 'comisionamiento';
var CLAVE_COLA = 'dp_pendientes';

var dpMemoria = {};
var dpAlmacen = {
  getItem: function(k){ try { return localStorage.getItem(k); } catch(e){ return (k in dpMemoria) ? dpMemoria[k] : null; } },
  setItem: function(k, v){ try { localStorage.setItem(k, v); } catch(e){ dpMemoria[k] = v; } },
  removeItem: function(k){ try { localStorage.removeItem(k); } catch(e){ delete dpMemoria[k]; } }
};
var sb = null, errInicio = null;
try {
  if (!window.supabase) throw new Error('No cargó la librería de Supabase. Revisa la conexión.');
  sb = window.supabase.createClient(DP.SUPABASE_URL, DP.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, lock: function(n, e, fn){ return fn(); }, storage: dpAlmacen }
  });
} catch(e){ errInicio = e.message; }

/* ---------------- utilidades ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function num(t){ if (t == null || t === '') return null; var v = parseFloat(String(t).replace(',', '.')); return isNaN(v) ? null : v; }
function fmt(n, d){ if (n == null || isNaN(n)) return ''; var s = d != null ? (+n).toFixed(d) : String(+(+n).toPrecision(5)); return s.replace('.', ','); }
function dos(n){ return (n < 10 ? '0' : '') + n; }
function hoy(){ var d = new Date(); return dos(d.getDate()) + '/' + dos(d.getMonth()+1) + '/' + d.getFullYear(); }
function aISO(f){ if (!f) return null; var p = f.split('/'); return p.length === 3 ? p[2] + '-' + p[1] + '-' + p[0] : f; }
function deISO(f){ if (!f) return null; var p = String(f).slice(0,10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : f; }
function nuevoId(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){ var r = Math.random()*16|0, v = c === 'x' ? r : ((r&0x3)|0x8); return v.toString(16); });
}
var toastT = null;
function toast(m){ var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 2600); }
/* Diálogos propios: alert/confirm nativos no aparecen en la PWA instalada. */
function dialogo(titulo, texto, botones){
  return new Promise(function(ok){
    var m = $('modal');
    m.innerHTML = '<div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="modal-t"><h3 id="modal-t">' + esc(titulo) + '</h3>' +
      (botones.img ? '<img class="modal-img" alt="" src="' + botones.img + '">' : '') +
      (texto ? '<p>' + esc(texto) + '</p>' : '') + (botones.opciones ? '<div class="modal-ops">' + botones.opciones.map(function(o, i){ return '<button class="prechip" data-op="' + i + '"><span>' + esc(o) + '</span></button>'; }).join('') + '</div>' : '') +
      (botones.campo ? '<textarea id="modal-campo" placeholder="' + esc(botones.campo) + '">' + esc(botones.valor || '') + '</textarea>' : '') +
      '<div class="modal-acc">' + botones.lista.map(function(b, i){ return '<button class="btn ' + (b.pri ? 'pri' : '') + '" data-i="' + i + '">' + esc(b.t) + '</button>'; }).join('') + '</div></div>';
    m.classList.add('on');
    [].forEach.call(m.querySelectorAll('[data-op]'), function(b){ b.onclick = function(){ var t = $('modal-campo'); if (t) { t.value = botones.opciones[+b.getAttribute('data-op')]; t.focus(); } }; });
    [].forEach.call(m.querySelectorAll('[data-i]'), function(b){
      b.onclick = function(){ var v = $('modal-campo') ? $('modal-campo').value : null; m.classList.remove('on'); m.innerHTML = ''; ok({ i: +b.getAttribute('data-i'), texto: v }); };
    });
  });
}
function avisar(t, x){ return dialogo(t, x, { lista: [{ t: 'Entendido', pri: true }] }); }

/* ---------------- IndexedDB: comisionamientos, fotos y plantillas ---------------- */
var DB = null;
function db(){
  if (DB) return Promise.resolve(DB);
  return new Promise(function(ok, ko){
    var r = indexedDB.open('kc_comisionamiento', 1);
    r.onupgradeneeded = function(){
      var d = r.result;
      if (!d.objectStoreNames.contains('cms')) d.createObjectStore('cms', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('fotos')) d.createObjectStore('fotos', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('plantillas')) d.createObjectStore('plantillas', { keyPath: 'clave' });
      if (!d.objectStoreNames.contains('cache')) d.createObjectStore('cache', { keyPath: 'clave' });
    };
    r.onsuccess = function(){ DB = r.result; ok(DB); };
    r.onerror = function(){ ko(r.error); };
  });
}
function idb(store, modo, fn){
  return db().then(function(d){ return new Promise(function(ok, ko){
    var tx = d.transaction(store, modo), st = tx.objectStore(store), res;
    var q = fn(st); if (q) q.onsuccess = function(){ res = q.result; };
    tx.oncomplete = function(){ ok(res); }; tx.onerror = function(){ ko(tx.error); };
  }); });
}
function idbPut(store, v){ return idb(store, 'readwrite', function(s){ return s.put(v); }); }
function idbGet(store, k){ return idb(store, 'readonly', function(s){ return s.get(k); }); }
function idbAll(store){ return idb(store, 'readonly', function(s){ return s.getAll(); }); }
function idbDel(store, k){ return idb(store, 'readwrite', function(s){ return s.delete(k); }); }

/* ---------------- cola compartida con Captura ---------------- */
function leerCola(){ try { return JSON.parse(dpAlmacen.getItem(CLAVE_COLA) || '[]'); } catch(e){ return []; } }
function guardarCola(c){ dpAlmacen.setItem(CLAVE_COLA, JSON.stringify(c)); pintarRed(); }
function colaDe(comId){ return leerCola().filter(function(x){ return x.rpc && x.rpc.indexOf('dp_cm_') === 0 && x.payload && (x.payload.comisionamiento_id === comId || x.payload.id === comId); }); }
/* Un paso se guarda muchas veces: en la cola solo queda la versión más reciente. */
function encolar(rpc, payload, etiqueta, clave){
  var c = leerCola();
  if (clave) c = c.filter(function(x){ return x.clave !== clave; });
  c.push({ rpc: rpc, payload: payload, etiqueta: etiqueta, ts: new Date().toISOString(), clave: clave || null });
  guardarCola(c);
}
/* ---------------- red débil ----------------
   Con poca cobertura el navegador sigue diciendo "en línea", pero cada
   petición puede tardar minutos. Ninguna pantalla espera a la red: todo se
   guarda primero en el dispositivo y se envía por detrás. Las lecturas del
   servidor tienen un tiempo máximo; si no llega, se trabaja con lo guardado. */
var RED = { lenta: false, ultimoOk: 0 };
var T_LECTURA = 6000, T_ENVIO = 25000, T_FOTO = 60000;
function conTiempo(pr, ms){
  var t; return Promise.race([pr, new Promise(function(ok){ t = setTimeout(function(){ ok({ __tiempo: true }); }, ms); })])
    .then(function(r){ clearTimeout(t); if (r && r.__tiempo) { RED.lenta = true; pintarRed(); } else { RED.lenta = false; RED.ultimoOk = Date.now(); } return r; },
          function(e){ clearTimeout(t); throw e; });
}
function agotado(r){ return r && r.__tiempo; }
/* Todo envío entra a la cola y se sincroniza en segundo plano: guardar un
   paso nunca queda esperando a la red. */
function enviar(rpc, payload, etiqueta, clave, comId){
  encolar(rpc, payload, etiqueta, clave);
  setTimeout(sincronizar, 0);
  return Promise.resolve({ cola: true });
}
/* La creación sí se intenta directa unos segundos, para mostrar el código de
   inmediato cuando hay buena señal. Si no responde, queda en la cola. */
function enviarDirecto(rpc, payload, etiqueta, clave, comId, ms){
  if (!sb || !navigator.onLine) { encolar(rpc, payload, etiqueta, clave); return Promise.resolve({ cola: true }); }
  encolar(rpc, payload, etiqueta, clave);
  return conTiempo(sb.rpc(rpc, { p: payload }), ms || 8000).then(function(r){
    if (agotado(r) || r.error) return { cola: true };
    var b = r.data || {};
    var q = leerCola().filter(function(x){ return x.clave !== clave; });
    if (!b.ok) { guardarCola(q); return { rechazo: b.error || 'Rechazado por la base' }; }
    guardarCola(q); return { ok: true, data: b };
  }).catch(function(){ return { cola: true }; });
}
function erroresCm(comId){ return leerCola().filter(function(x){ return x.error && x.rpc && x.rpc.indexOf('dp_cm_') === 0 && (!comId || (x.payload && (x.payload.comisionamiento_id === comId || x.payload.id === comId))); }); }
/* Los rechazos quedan guardados con su motivo; al reintentar se vuelven a
   enviar en el mismo orden (primero la creación, luego los pasos). */
function reintentarErrores(){
  var c = leerCola(); c.forEach(function(x){ if (x.error && x.rpc && x.rpc.indexOf('dp_cm_') === 0) { x.error_anterior = x.error; delete x.error; } });
  guardarCola(c); return sincronizar();
}
function erroresH(lista){
  if (!lista.length) return '';
  return '<div class="panel errores"><b>' + lista.length + (lista.length === 1 ? ' envío rechazado' : ' envíos rechazados') + ' por la base</b>' +
    '<p class="nota">Los datos siguen guardados en este dispositivo. Este es el motivo que devolvió la base:</p><ul>' +
    lista.slice(0, 6).map(function(x){ return '<li><b>' + esc(x.etiqueta || x.rpc) + ':</b> ' + esc(x.error) + '</li>'; }).join('') + (lista.length > 6 ? '<li>…y ' + (lista.length - 6) + ' más</li>' : '') +
    '</ul><button class="btn ancho" id="reint">Reintentar envío</button></div>';
}
function enlazarReintento(){ if ($('reint')) $('reint').onclick = function(){ if (!navigator.onLine) { avisar('Sin señal', 'Conéctate para reintentar.'); return; } toast('Reintentando…'); reintentarErrores().then(function(){ var q = erroresCm(S.com && S.com.id); toast(q.length ? 'Siguen ' + q.length + ' con error' : 'Envíos completados'); render(); }); }; }
var sincronizando = false, sincroPend = false;
function sincronizar(){
  if (sincronizando) { sincroPend = true; return Promise.resolve(); }
  if (!sb || !navigator.onLine) return Promise.resolve();
  sincronizando = true;
  var errAntes = erroresCm().length;
  /* Se trabaja ítem por ítem sobre la cola guardada, para no pisar lo que se
     encole mientras tanto. Un tiempo agotado detiene la pasada sin perder nada. */
  function siguiente(){
    var cola = leerCola(), it = cola.filter(function(x){ return !x.error; })[0];
    if (!it) return Promise.resolve();
    return conTiempo(sb.rpc(it.rpc, { p: it.payload }), T_ENVIO).then(function(r){
      if (agotado(r) || r.error) return 'parar';
      var b = r.data || {}, c = leerCola(), k = c.findIndex(function(x){ return x.ts === it.ts && x.rpc === it.rpc && (x.clave || '') === (it.clave || ''); });
      if (k < 0) return siguiente();                                // ya lo reemplazó una versión más nueva
      if (!b.ok) c[k].error = b.error || 'Rechazado por la base'; else c.splice(k, 1);
      guardarCola(c); return siguiente();
    }).catch(function(){ return 'parar'; });
  }
  return siguiente().then(function(r){ return r === 'parar' ? null : subirFotos(); })
    .then(function(){ sincronizando = false; pintarRed(); actualizarEstadoGuardado();
      var errNuevos = erroresCm().length - errAntes;
      if (errNuevos > 0) { if (S.pantalla === 'ruta' || S.pantalla === 'inicio') render(); else toast('La base rechazó ' + (errNuevos === 1 ? 'un envío' : errNuevos + ' envíos') + '. Revisa el aviso en el recorrido.'); }
      if (sincroPend) { sincroPend = false; setTimeout(sincronizar, 500); } },
          function(){ sincronizando = false; pintarRed(); });
}
function quitarFotoServidor(f){
  return conTiempo(sb.rpc('dp_cm_q_quitar_foto', { p: { id: f.id, comisionamiento_id: f.com } }), T_ENVIO).then(function(r){
    var b = r && r.data;
    if (agotado(r) || r.error || !b) return;                         // sin respuesta: se reintenta luego
    if (!b.ok) { f.error = b.error; return idbPut('fotos', f); }
    var ruta = b.storage_path || f.ruta;
    return (ruta ? sb.storage.from(BUCKET).remove([ruta]).catch(function(){}) : Promise.resolve()).then(function(){ return idbDel('fotos', f.id); });
  }).catch(function(){});
}
function subirFotos(){
  return idbAll('fotos').then(function(fs){
    var borrar = fs.filter(function(f){ return f.estado === 'borrar' && !f.error; });
    return borrar.reduce(function(pr, f){ return pr.then(function(){ return quitarFotoServidor(f); }); }, Promise.resolve()).then(function(){ return fs; });
  }).then(function(fs){
    var pend = fs.filter(function(f){ return f.estado === 'local' && !colaDe(f.com).some(function(x){ return x.rpc === 'dp_cm_q_crear' && !x.error; }); });
    return pend.reduce(function(pr, f){ return pr.then(function(){ return subirFoto(f); }); }, Promise.resolve());
  });
}
function subirFoto(f){
  var ruta = f.com + '/' + f.paso + '/' + f.id + '.jpg';
  return fetch(f.url).then(function(r){ return r.blob(); }).then(function(b){
    return conTiempo(sb.storage.from(BUCKET).upload(ruta, b, { contentType: 'image/jpeg', upsert: false }), T_FOTO);
  }).then(function(r){
    if (agotado(r)) throw new Error('tiempo');
    if (r.error && !/exist|duplicate/i.test(r.error.message || '')) throw r.error;
    return conTiempo(sb.rpc('dp_cm_q_foto', { p: { id: f.id, comisionamiento_id: f.com, paso_id: f.paso, storage_path: ruta, orden: f.orden || 0, tomada_en: f.tomada_en } }), T_ENVIO);
  }).then(function(r){
    if (r && !agotado(r) && !r.error && r.data && r.data.ok) { f.estado = 'subida'; f.ruta = ruta; return idbPut('fotos', f); }
  }).catch(function(){ /* se reintenta en la próxima pasada */ });
}
window.addEventListener('online', function(){ pintarRed(); sincronizar(); });
window.addEventListener('offline', pintarRed);
setInterval(sincronizar, 30000);
function pintarRed(){
  var n = leerCola().filter(function(x){ return x.rpc && x.rpc.indexOf('dp_cm_') === 0; }), err = n.filter(function(x){ return x.error; }).length;
  var el = $('red'); if (!el) return;
  var lenta = navigator.onLine && RED.lenta;
  el.className = 'red ' + (!navigator.onLine ? 'off' : lenta ? 'lenta' : 'on');
  el.innerHTML = '<i></i>' + (!navigator.onLine ? 'Sin señal' : lenta ? 'Señal débil' : 'En línea') + (n.length ? ' · ' + n.length + ' en cola' + (err ? ' (' + err + ' con error)' : '') : '');
}

/* ---------------- estado ---------------- */
var S = { pantalla: 'inicio', pila: [], com: null, tpl: null, paso: null, guia: true, perfil: null, aprueba: false, pozos: [] };
var PASOS = [], EQUIPOS = [], PARAM = {};
function usarPlantilla(def){ S.tpl = def; PASOS = def.pasos; EQUIPOS = def.equipos; PARAM = def.parametros || {}; }
function paso(id){ return PASOS.filter(function(p){ return p.id === id; })[0]; }
function D(id){ var c = S.com; return c.d[id] || (c.d[id] = { vals: {}, enc: {}, campos: {}, checks: {}, tabla: {}, obs: '', fotos: [], unit: null, tens: null, na: false, fecha: null, pre: {} }); }
function editable(){ return S.com && (S.com.estado === 'borrador' || S.com.estado === 'en_campo'); }
function guardarLocal(){ return idbPut('cms', S.com); }

var FACT = { 'µΩ':1e-6, 'mΩ':1e-3, 'Ω':1, 'kΩ':1e3, 'MΩ':1e6, 'GΩ':1e9, 'µF':1, 'VDC':1, 'V':1, 'A':1 };
var ENUMTXT = { OL:'OL', EC:'Efecto capacitivo', CORTO:'Corto', ABIERTO:'Abierto', SI:'Sí', NO:'No', NA:'NA', B:'Bueno', R:'Regular', M:'Malo' };
var EST = { C:'Cumple', A:'Cumple con observación', N:'No cumple', P:'Por confirmar', R:'No realizado', X:'No aplica', I:'No concluyente', Pe:'Pendiente' };

/* ---------------- evaluación ---------------- */
function evalPt(p, pt, rec, unitStep){
  if (!rec) return null; var c = pt.c;
  if (rec.e) { if (c.t === 'enum') return rec.e === c.e ? 'C' : 'N'; return 'N'; }
  var v = num(rec.v); if (v == null) return null;
  if (c.t === 'enum') return 'N';
  if (c.t === 'none') return 'C';

function comprimir(file, cb, fallo){
  var img = new Image(), url = URL.createObjectURL(file);
  img.onload = function(){ try {
      var m = 1280, k = Math.min(1, m / Math.max(img.width, img.height)); var c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg', 0.72));
    } catch(e){ URL.revokeObjectURL(url); if (fallo) fallo(e); } };
  img.onerror = function(){ URL.revokeObjectURL(url); if (fallo) fallo(new Error('formato')); };
  img.src = url;
}

/* La sesión se lee del dispositivo. getSession() puede intentar renovar el
   token por la red y, con señal débil, dejar la app en blanco: se le da un

function sesionGuardada(){
  try {
    var k = Object.keys(localStorage).filter(function(x){ return /^sb-.*-auth-token$/.test(x); })[0];
    var s = k && JSON.parse(localStorage.getItem(k));
    s = s && (s.currentSession || s);
    return s && s.user ? s : null;

}
