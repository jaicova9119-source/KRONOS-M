<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optimizaci&oacute;n Energ&eacute;tica</title>

<!-- Tipografia. Carga diferida a proposito: media="print" hace que el
     navegador la baje sin bloquear el primer pintado, y onload la habilita.
     Sin senal en el PAD la interfaz cae al stack del sistema y sigue bien. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style id="kx-tokens">
/* ═══════════════════════════════════════════════════════════════════════
   KRONOS·M — SISTEMA DE TEMA  ·  paleta Termografia  ·  v3
   ───────────────────────────────────────────────────────────────────────
   Este bloque va INCRUSTADO en cada archivo, no en un CSS aparte.
   Razon: el service worker sirve los archivos externos desde cache y
   dejaba la hoja de tema sin cargar, con lo que el boton quedaba crudo
   y la paleta no aplicaba. Incrustado no hay peticion que se pueda
   perder, y el modulo abierto en pestana aparte tambien queda tematizado.

   Si cambias un color, cambialo en los cuatro archivos: el bloque es
   identico en todos y va delimitado por estos mismos comentarios.

   Regla de la paleta: el azul de marca identifica, el gris grafito
   sostiene, y la rampa calida (ambar - naranja - rojo) se reserva
   para severidad. Ningun color se usa como adorno.
   ═══════════════════════════════════════════════════════════════════════ */

/* ---------- CLARO ---------- */
html[data-tema="claro"]{
  color-scheme:light;

  --bg:#F1F3F4;          /* fondo de pagina */
  --surface:#FFFFFF;     /* tarjeta, panel, fila */
  --surface-2:#E9ECEE;   /* campo, cabecera de tabla, chip */
  --surface-3:#DDE1E4;   /* realce, barra de progreso */
  --line:#C8CDD1;
  --line-soft:#E3E6E9;

  --t1:#1B1F23;          /* texto principal y cifras */
  --t2:#545C63;          /* texto secundario */
  --t3:#7D858C;          /* rotulo, unidad, apoyo */

  --brand:#134B70;       /* barra superior */
  --brand-t:#FFFFFF;
  --accent:#2F6EA8;      /* interaccion: enlace, foco, seleccion */
  --accent-soft:#E4EDF6;
  --accent-line:#B9D0E5;
  --on-accent:#FFFFFF;

  --ok:#356951;    --ok-bg:#E4EFE9;
  --warn:#96590F;  --warn-bg:#F7EBD8;
  --crit:#AC3329;  --crit-bg:#F7E3E1;
  --alto:#C79312;  --alto-bg:#F8F0D9;   /* extremo de la rampa */
  --null:#787F85;  --null-bg:#ECEEF0;


  --serie-1:#1E4E7A; --serie-2:#2F6EA8; --serie-3:#4C89BE; --serie-4:#6FA3CE;
  --serie-5:#93BCDD; --serie-6:#B6D0E8; --serie-7:#8B9298;
  --sombra:0 1px 2px rgba(20,26,32,.07), 0 6px 18px rgba(20,26,32,.06);
  --sombra-alta:0 10px 32px rgba(20,26,32,.16);
  --velo:rgba(20,26,32,.42);
}

/* ---------- OSCURO ---------- */
html[data-tema="oscuro"]{
  color-scheme:dark;

  --bg:#181B1F;
  --surface:#212529;
  --surface-2:#2A2F35;
  --surface-3:#343A42;
  --line:#3B424A;
  --line-soft:#2B3037;

  --t1:#E7EAED;
  --t2:#A4ABB3;
  --t3:#767E86;

  --brand:#0E2436;
  --brand-t:#E7EAED;
  --accent:#74A9DC;
  --accent-soft:#1E2E3D;
  --accent-line:#2F4A63;
  --on-accent:#0E1418;

  --ok:#6FA88A;    --ok-bg:#1D2A24;
  --warn:#E0913F;  --warn-bg:#332614;
  --crit:#E0685A;  --crit-bg:#331E1B;
  --alto:#EFC04E;  --alto-bg:#332B14;
  --null:#767E86;  --null-bg:#262A2F;


  --serie-1:#A7C9E8; --serie-2:#74A9DC; --serie-3:#5A87B4; --serie-4:#47708F;
  --serie-5:#3A5B73; --serie-6:#2E4757; --serie-7:#767E86;
  --sombra:0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.34);
  --sombra-alta:0 10px 32px rgba(0,0,0,.55);
  --velo:rgba(0,0,0,.62);
}
/* ---------- Tipografia ----------
   IBM Plex Sans para interfaz, IBM Plex Mono para toda cifra medida:
   sus numeros son de ancho fijo, asi que las columnas de TAP, carga y
   factor se alinean sin ayuda. Si la fuente no llega (PAD sin senal)
   cae al stack del sistema y la interfaz sigue correcta. */
html[data-tema]{
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'IBM Plex Mono','SF Mono',Consolas,'Roboto Mono',monospace;
}

/* ---------- Alias de los nombres antiguos ----------
   Las reglas existentes de cada archivo no se tocaron: siguen pidiendo
   --bg-0, --kp-card, --ki-t1, --ko-line. Aqui esos nombres se redefinen
   apuntando a los tokens de arriba, y quedan tematizados solos.
   html[data-tema] gana en especificidad sobre el :root de cada archivo. */
html[data-tema]{
  /* index.html */
  --bg-0:var(--surface);
  --bg-1:var(--bg);
  --bg-2:var(--surface-2);
  --bg-3:var(--surface-3);
  --text-0:var(--t1);
  --text-1:var(--t2);
  --text-2:var(--t3);
  --accent-dim:var(--accent-line);
  --accent-bg:var(--accent-soft);
  --jac-blue:var(--brand);
  --danger:var(--crit);
  --danger-bg:var(--crit-bg);

  /* condicion.html */
  --kp-teal:var(--accent);
  --kp-green:var(--ok);
  --kp-ink:var(--t1);
  --kp-ink2:var(--t2);
  --kp-ink3:var(--t3);
  --kp-line:var(--line);
  --kp-page:var(--bg);
  --kp-card:var(--surface);
  --kp-ok:var(--ok);      --kp-ok-bg:var(--ok-bg);
  --kp-warn:var(--warn);  --kp-warn-bg:var(--warn-bg);
  --kp-crit:var(--crit);  --kp-crit-bg:var(--crit-bg);
  --kp-null:var(--null);  --kp-null-bg:var(--null-bg);

  /* instalacion.html */
  --ki-teal:var(--accent);
  --ki-green:var(--ok);
  --ki-bg:var(--bg);
  --ki-card:var(--surface);
  --ki-card2:var(--surface-2);
  --ki-line:var(--line);
  --ki-line2:var(--line-soft);
  --ki-t1:var(--t1);
  --ki-t2:var(--t2);
  --ki-t3:var(--t3);
  --ki-ok:var(--ok);
  --ki-warn:var(--warn);
  --ki-crit:var(--crit);
  --ki-null:var(--null);

  /* optimizacion.html */
  --ko-teal:var(--accent);
  --ko-green:var(--ok);
  --ko-bg:var(--bg);
  --ko-card:var(--surface);
  --ko-card2:var(--surface-2);
  --ko-line:var(--line);
  --ko-line2:var(--line-soft);
  --ko-t1:var(--t1);
  --ko-t2:var(--t2);
  --ko-t3:var(--t3);
  --ko-ok:var(--ok);
  --ko-warn:var(--warn);
  --ko-crit:var(--crit);
  --ko-null:var(--null);
}

html[data-tema]{background:var(--bg);}
html[data-tema] body{background:var(--bg);color:var(--t1);font-family:var(--sans);}

/* Los controles nativos (select, input, checkbox) siguen a color-scheme,
   pero el borde y el fondo hay que decirselos. */
html[data-tema] select,
html[data-tema] input,
html[data-tema] textarea{font-family:inherit;}

/* ═══════════════════════════════════════════════════════════════════════
   DOCUMENTOS QUE SE IMPRIMEN Y SE FIRMAN
   El informe de ensayos y el formato GTEC-MT-FO-016 no son interfaz:
   son hojas. Se les fuerza papel blanco con tinta negra aunque la
   aplicacion este en oscuro, para que la vista previa coincida con lo
   que sale de la impresora.
   ═══════════════════════════════════════════════════════════════════════ */
#ee-informe, #ot-doc, #print-root{
  --bg:#FFFFFF;       --bg-0:#FFFFFF;     --bg-1:#FFFFFF;
  --surface:#FFFFFF;  --surface-2:#F2F2F2;
  --bg-2:#F2F2F2;     --bg-3:#E8E8E8;     --surface-3:#E8E8E8;
  --line:#999999;     --line-soft:#CCCCCC;
  --t1:#000000;       --text-0:#000000;
  --t2:#555555;       --text-1:#555555;
  --t3:#666666;       --text-2:#666666;
  --ok:#2E7D32;       --warn:#E08600;
  --crit:#C62828;     --danger:#C62828;
  --kp-ink:#000000;   --kp-card:#FFFFFF;  --kp-page:#FFFFFF;
  background:#FFFFFF; color:#000000; color-scheme:light;
}

/* ═══════════════════════════════════════════════════════════════════════
   INTERRUPTOR DE TEMA
   El icono anuncia a donde vas, no donde estas: en claro se ve la luna
   (tocar = oscuro), en oscuro se ve el sol (tocar = claro).
   Estos estilos son propios y no dependen de ninguna hoja externa, para
   que el boton no vuelva a quedar crudo si algo falla al cargar.
   ═══════════════════════════════════════════════════════════════════════ */
.tema-btn{
  -webkit-appearance:none;appearance:none;
  background:none;border:0;margin:0;padding:0;cursor:pointer;line-height:0;
  width:32px;height:32px;border-radius:8px;flex:0 0 32px;
  display:inline-flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.82);
  transition:background .15s,color .15s;
}
.tema-btn svg{width:18px;height:18px;display:block;}
.tema-btn:hover{background:rgba(255,255,255,.14);color:#fff;}
.tema-btn:active{background:rgba(255,255,255,.22);}
.tema-btn:focus-visible{outline:2px solid rgba(255,255,255,.65);outline-offset:-2px;}

/* Un solo icono visible. El estado por defecto (sin atributo aun) muestra
   la luna, que es lo correcto porque el arranque sin preferencia es claro. */
.tema-btn .ico-claro{display:none;}
.tema-btn .ico-oscuro{display:block;}
html[data-tema="oscuro"] .tema-btn .ico-claro{display:block;}
html[data-tema="oscuro"] .tema-btn .ico-oscuro{display:none;}

/* El cambio de tema no deberia notarse como animacion. */
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important;}
}
</style>

<script>
/* Se ejecuta antes de pintar. Si el tema se aplicara desde el final del
   documento, la pagina destellaria en claro antes de pasar a oscuro. */
(function () {
  var t;
  try { t = localStorage.getItem("kx_tema"); } catch (e) { t = null; }
  if (t !== "claro" && t !== "oscuro") {
    t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "oscuro" : "claro";
  }
  document.documentElement.setAttribute("data-tema", t);

  /* El contenedor avisa cuando se cambia de tema con este panel abierto. */
  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (d && d.tipo === "kx-tema" && (d.tema === "claro" || d.tema === "oscuro")) {
      document.documentElement.setAttribute("data-tema", d.tema);
    }
  });
})();
</script>
<style>
:root{
  --ko-teal:#12a5b8; --ko-green:#35a853;
  --ko-bg:#081724; --ko-card:#0f2739; --ko-card2:#143349;
  --ko-line:rgba(255,255,255,.09); --ko-line2:rgba(255,255,255,.06);
  --ko-t1:#eef4f9; --ko-t2:#a7bccd; --ko-t3:#7f9bb2;
  --ko-ok:#35a853; --ko-warn:#e0a230; --ko-crit:#d6584a; --ko-null:#5f7d94;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ko-bg);color:var(--ko-t1);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

  font-family:inherit;display:none}

.ko-wrap{padding:18px 20px;max-width:1400px;margin:0 auto}

.ko-cfg{background:var(--ko-card);border:1px solid var(--ko-line);border-radius:9px;

.ko-cfg input{width:78px;text-align:right}

.ko-h.g:before{background:var(--ko-green)}
.ko-h.w:before{background:var(--ko-warn)}
.ko-h.r:before{background:var(--ko-crit)}
.ko-h.n:before{background:var(--ko-null)}
.ko-h .k{font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--ko-t3)}
.ko-h .v{font-size:25px;font-weight:600;letter-spacing:-.6px;margin:3px 0 0;
  color:var(--t1);line-height:1.05}
.ko-h .v small{font-size:11.5px;font-weight:400;color:var(--ko-t2);margin-left:3px;
  letter-spacing:0}
.ko-h .r2{font-size:11px;color:var(--ko-t3);margin-top:3px}

.ko-card{background:var(--ko-card);border:1px solid var(--ko-line);border-radius:9px;
  padding:13px 15px;margin-bottom:14px}
.ko-card .ct{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  margin-bottom:12px;flex-wrap:wrap}
.ko-card .ct b{font-size:13px;font-weight:600;color:var(--t1)}
.ko-card .ct span{font-size:10.5px;color:var(--ko-t3);letter-spacing:.4px;
  text-transform:uppercase}

.ko-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.ko-t{width:100%;border-collapse:collapse;font-size:12px;color:var(--ko-t2)}
table.ko-t th{text-align:right;font-weight:600;color:var(--ko-t3);font-size:10px;
  letter-spacing:.5px;text-transform:uppercase;padding:0 0 7px 9px;
  border-bottom:1px solid var(--ko-line);white-space:nowrap}
table.ko-t th:first-child,table.ko-t td:first-child{text-align:left;padding-left:0}
table.ko-t td{text-align:right;padding:6px 0 6px 9px;
  border-bottom:1px solid var(--ko-line2);white-space:nowrap}
table.ko-t tr:last-child td{border-bottom:none}
table.ko-t tr.cl{cursor:pointer}
table.ko-t tr.cl:hover td{background:var(--surface-2)}
table.ko-t .pz{font-weight:600;color:var(--t1)}
table.ko-t .sd{color:var(--ko-null)}
/* Flecha y color como canales separados: la flecha dice hacia donde se
   mueve la magnitud, el color si eso conviene. */
.ko-d{display:inline-flex;align-items:center;gap:3px;font-weight:600;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.ko-d.bien{color:var(--ko-ok)}
.ko-d.mal{color:var(--ko-crit)}
.ko-d.ig{color:var(--ko-t3);font-weight:500}
.ko-der{font-size:10px;font-weight:500;color:var(--ko-t3);
  text-transform:uppercase;letter-spacing:.4px;margin-left:5px}
/* Fila cuyos datos operacionales son anteriores al equipo instalado. Se

table.ko-t tr.viejo td{opacity:.42}
table.ko-t tr.viejo td.pz{opacity:1}
.ko-adv{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.4px;

table.ko-t .up{color:var(--accent)}
table.ko-t .dn{color:var(--ko-warn)}
.ko-fl{font-size:9px;letter-spacing:.5px;border:1px solid var(--line);

.ko-sem{display:inline-block;width:9px;height:9px;border-radius:2px;margin-left:7px;

.ko-bar{background:var(--ko-card);border:1px solid var(--ko-line);border-radius:9px;

</head>
<body>

<div class="ko-top">
  <div>
    <h1 id="koTitulo">Optimizaci&oacute;n Energ&eacute;tica</h1>
    <p class="sub" id="koSub">Propuesta de cambio de TAP por condici&oacute;n de operaci&oacute;n</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   CONEXION
   Las credenciales se heredan de Kronos-M: este archivo corre en
   un iframe del mismo origen. Al abrirse en pestana aparte el
   padre es window.opener. Es el mismo patron de condicion.html,
   para que la sesion sea una sola y no aparezca el aviso de
   multiples instancias de GoTrue.
   ============================================================ */
function koCredencial(nombre){
  const f = koVentanas();
  for (var i = 0; i < f.length; i++){
    try {
      var v = f[i][nombre];
      if (v && String(v).indexOf('PEGAR_AQUI') !== 0) return v;
    } catch(e){}
  }
  return null;
}

/* Ventanas donde puede estar el cliente ya autenticado. Importa el
   orden y que suba varios niveles: este modulo se abre tanto como
   iframe directo de Kronos-M como dentro de la capa de Monitoreo de
   Condicion, que a su vez es otro iframe. */
function koVentanas(){
  const v = [];
  let w = window;
  for (let i = 0; i < 4; i++){
    try {
      if (w.parent && w.parent !== w){ w = w.parent; v.push(w); }
      else break;
    } catch(e){ break; }
  }
  try { if (window.opener) v.push(window.opener); } catch(e){}
  try { if (window.top && v.indexOf(window.top) < 0) v.push(window.top); } catch(e){}
  return v;
}

let koSb = null;
function koCliente(){
  if (koSb) return koSb;
  const f = koVentanas();
  for (var i = 0; i < f.length; i++){
    for (const n of ['sb', 'kpSb', 'supabaseClient']){
      try { if (f[i][n] && f[i][n].rpc) { koSb = f[i][n]; return koSb; } } catch(e){}
    }
  }
  const url = koCredencial('SUPABASE_URL');
  const key = koCredencial('SUPABASE_ANON_KEY');
  if (!url || !key)
    throw new Error('No se pudo tomar la conexion de Kronos-M. '
      + 'Recarga con Ctrl+Shift+R; si window.sb sigue en undefined, '
      + 'el index.html desplegado es anterior a este modulo.');
  koSb = window.supabase.createClient(url, key);
  return koSb;
}

/* ============================================================
   CAPA DE DATOS
   Unico punto que toca la base.
   ============================================================ */
/* El campo y el PAD vienen de la flota, no de opt_unidades. Se
   cruzan por codigo de pozo aqui y no en SQL: dp_bes_lista() no
   expone columnas nombradas a un join, pero desde el navegador
   entrega objetos con campo y pad, que es como ya la consume
   Monitoreo de Condicion. Si falla, el modulo sigue funcionando
   sin los dos filtros en lugar de quedarse en blanco. */
async function koCargarFlota(){
  try {
    const { data, error } = await koCliente().rpc('dp_bes_lista');
    if (error) throw new Error(error.message);
    const m = {};
    (data || []).forEach(r => {
      if (r && r.pozo) m[r.pozo] = {
        campo: r.campo || '\u2014',
        pad:   r.pad   || '\u2014',
        marca: r.marca_variador || null
      };
    });
    return m;
  } catch(e){
    console.warn('[Kronos-M] Flota no disponible:', e.message);
    return {};
  }
}

async function koCargarUnidades(){
  const [flota, res] = await Promise.all([
    koCargarFlota(),
    koCliente().rpc('opt_unidades')
  ]);
  const { data, error } = res;
  if (error) throw new Error(error.message);
  return (data || []).map(r => {
    const f = flota[r.pozo] || {};
    return {
    pozo:   r.pozo,
    campo:  f.campo || '\u2014',
    pad:    f.pad   || '\u2014',
    vsd:    r.vsd || f.marca || '\u2014',
    /* Del diseno */
    v_placa: koNum(r.v_placa_v),
    i_placa: koNum(r.i_placa_a),
    tap:     koNum(r.tap_sut_v),
    v_nom:   koNum(r.v_nom_variador_v),
    awg:     koNum(r.awg),
    long_ft: koNum(r.longitud_ft),
    temp_f:  koNum(r.temp_pozo_f),
    filtro:  !!r.filtro_seno,
    k_filtro: koNum(r.k_filtro),
    /* La caida medida en campo manda sobre la calculada. */
    cable_medido: koNum(r.caida_cable_v),
    /* De la lectura mas reciente */
    fecha:   r.lectura_fecha || null,
    fuente:  r.lectura_fuente || null,
    f_op:    koNum(r.f_op_hz),
    f_max:   koNum(r.f_max_hz) != null ? koNum(r.f_max_hz) : koNum(r.f_max_diseno_hz),
    carga:   koNum(r.carga_motor),
    i_vsd:   koNum(r.i_vsd_a),
    i_mot:   koNum(r.i_motor_a),
    v_sut:   koNum(r.v_sut_v),
    /* Propuesta vigente, si hay */
    prop_f_max: koNum(r.propuesta_f_max),
    prop_estado: r.propuesta_estado || null
    };
  });
}

/* Fecha de instalacion del motor vigente, por unidad. Si la lectura es
   anterior, los calculos corresponden a un motor que ya no esta: fue el
   caso de CYC-16, que reportaba carga al 120% y una reduccion negativa
   de 163 kW sobre un equipo que ya se habia cambiado.

   Si la funcion no existe o falla, no se marca nada. El chequeo mejora
   la lectura de los datos; no puede ser motivo de que el modulo no
   abra. */
let KO_VIGENCIA = {};

async function koCargarVigencia(){
  try {
    const { data, error } = await koCliente().rpc('opt_vigencia_equipo');
    if (error) throw new Error(error.message);
    const m = {};
    (data || []).forEach(r => {
      if (r && r.pozo) m[r.pozo] = {
        instalado: r.motor_instalado_el || null,
        serial: r.motor_serial || null,
        previos: r.motores_previos || 0
      };
    });
    KO_VIGENCIA = m;
  } catch(e){
    console.warn('[Kronos-M] Vigencia de equipo no disponible:', e.message);
    KO_VIGENCIA = {};
  }
}

/* Devuelve la fecha de instalacion si la lectura es anterior a ella; si
   no, null. Sin fecha de instalacion registrada no se puede comparar y
   no se marca: en las unidades de inyeccion ese dato esta vacio. */
function koDatoViejo(u){
  const v = KO_VIGENCIA[u.pozo];
  if (!v || !v.instalado || !u.fecha) return null;
  return u.fecha < v.instalado ? v.instalado : null;
}

async function koCargarParametros(){
  const { data, error } = await koCliente().rpc('opt_parametros');
  if (error) throw new Error(error.message);
  return data || {};
}

/* Trae a opt_lectura la ultima ronda util de cada unidad. Es lo
   que reemplaza la importacion desde Excel: se corre cuando entren
   rondas nuevas y las propuestas quedan sobre lo medido. */
async function koSincronizar(){
  const { data, error } = await koCliente().rpc('opt_sincronizar_lecturas');
  if (error) throw new Error(error.message);
  if (data && data.ok === false) throw new Error(data.error || 'No se pudo sincronizar');
  return data || {};
}

/* La propuesta viaja con su linea base congelada. Sin la fecha de
   la lectura, el TAP y la frecuencia que tenia la unidad, y el kW
   que se calculo sobre ella, no hay contra que medir el ahorro
   real: la lectura que sustento el calculo deja de ser la mas
   reciente en cuanto entra la siguiente ronda.

   Los criterios van tambien porque tres de ellos siguen sin
   decidirse y son editables en pantalla. Una propuesta de hoy y
   otra de dentro de tres meses solo son comparables si se sabe con
   que criterio salio cada una. */
async function koEnviarPropuesta(p){
  const { data, error } = await koCliente().rpc('opt_guardar_propuesta', {
    p_pozo:         p.pozo,
    p_f_max:        p.f_max,
    p_tap:          p.tap,
    p_reduccion:    p.red,
    p_nota:         p.nota || null,
    p_base_fecha:   p.base_fecha || null,
    p_f_max_previa: p.f_max_previa,
    p_tap_previo:   p.tap_previo,
    p_kw_previo:    p.kw_previo,
    p_criterios:    p.criterios || null
  });
  if (error) throw new Error(error.message);
  if (data && data.ok === false) throw new Error(data.error || 'No se pudo guardar');
  return data;
}

/* ══════════════════════════════════════════════════════════════════
   FLECHAS Y COLOR
   ------------------------------------------------------------------
   La confusion del + y - venia de mezclar dos cosas en un solo signo:
   hacia donde se mueve la magnitud, y si eso conviene o no. Un ahorro
   de 55 kW se mostraba como "-55.7" y una unidad subtensionada como
   "-163.4", el mismo signo para lo bueno y para lo malo.

   Aqui son dos canales separados:
     la FLECHA dice que hace la magnitud fisica: sube o baja
     el COLOR  dice si eso conviene: verde bien, ambar ojo, rojo mal

   Asi "consumo ↓ 55.7 kW" en verde y "consumo ↑ 163.4 kW" en rojo se
   leen sin tener que recordar ninguna convencion. */

const KO_FLECHA = { sube: '\u2191', baja: '\u2193', igual: '\u2192' };

/* Entero con separador de miles. Tensiones y corrientes de campo no
   tienen decimales significativos: 585.6666666666666 A es un promedio
   de ronda, no una medicion con seis decimales de resolucion. */
function koEnt(v){
  if (v == null || !isFinite(v)) return '\u2014';
  return Math.round(v).toLocaleString('es-CO');
}

function koDelta(valor, opts){
  /* opts.mejor: 'baja' si lo deseable es que la magnitud baje.
     opts.dec:   decimales. opts.umbral: por debajo se considera igual. */
  if (valor == null) return '<span class="sd">\u2014</span>';
  const dec = opts.dec != null ? opts.dec : 1;
  const um  = opts.umbral != null ? opts.umbral : 0;
  const abs = Math.abs(valor);

  if (abs <= um)
    return '<span class="ko-d ig">' + KO_FLECHA.igual + ' ' + abs.toFixed(dec) + '</span>';

  const baja = valor > 0;                       /* el valor es la reduccion */
  const conviene = (opts.mejor === 'baja') === baja;
  return '<span class="ko-d ' + (conviene ? 'bien' : 'mal') + '">'
       + (baja ? KO_FLECHA.baja : KO_FLECHA.sube) + ' ' + abs.toFixed(dec) + '</span>';
}

/* El TAP no se muestra como diferencia con signo sino como la accion a
   ejecutar. "Subir 245 V" no necesita interpretacion; "-245" si. */
function koAccionTap(dTap){
  if (dTap == null) return '<span class="sd">\u2014</span>';
  const abs = Math.abs(dTap);
  if (abs < 1) return '<span class="ko-d ig">' + KO_FLECHA.igual + ' en punto</span>';
  const sem = koSemTap(dTap);
  return '<span class="ko-d" style="color:' + KO_HEX[sem] + '">'
       + (dTap > 0 ? KO_FLECHA.baja + ' bajar ' : KO_FLECHA.sube + ' subir ')
       + abs.toFixed(0) + ' V</span>';
}

/* Las tres tensiones del lado del variador no dicen nada por separado;
   lo que importa es en que se diferencian, porque cada diferencia
   apunta a una causa distinta.

   Entregada contra curva V/Hz: si el variador entrega menos de lo que
   su patron indica, hay caida en la acometida, el patron esta
   parametrizado distinto de lo que se supone, o el variador esta
   limitando por corriente. Nada de eso se arregla cambiando el TAP.

   Curva V/Hz contra lo que necesita el motor: esa si es una cuestion
   de TAP, y es la que este modulo resuelve.

   El umbral de 15 V es del orden del error de una medida de campo con
   pinza y sonda; por debajo no vale la pena llamarlo desviacion. */
function koLecturaVsd(r){
  const t = [];
  if (r.dVsdPatron != null && Math.abs(r.dVsdPatron) > 15){
    t.push(r.dVsdPatron < 0
      ? 'El variador entrega ' + koEnt(-r.dVsdPatron) + ' V menos de lo que '
        + 'indica su curva V/Hz. Eso no se corrige con el TAP: revise ca&iacute;da '
        + 'en la acometida, el patr&oacute;n V/Hz configurado y si est&aacute; '
        + 'limitando por corriente.'
      : 'El variador entrega ' + koEnt(r.dVsdPatron) + ' V m&aacute;s de lo que '
        + 'indica su curva V/Hz. Revise el patr&oacute;n configurado y el refuerzo '
        + 'de par a baja frecuencia.');
  }
  if (r.dVsdNec != null && Math.abs(r.dVsdNec) > 15){
    t.push(r.dVsdNec < 0
      ? 'Al motor le llegan ' + koEnt(-r.dVsdNec) + ' V menos de los que '
        + 'necesita a esta frecuencia. Con el TAP en su valor &oacute;ptimo esa '
        + 'diferencia se cierra.'
      : 'Al motor le llegan ' + koEnt(r.dVsdNec) + ' V m&aacute;s de los que '
        + 'necesita. Ahi est&aacute; el margen de ahorro que propone este '
        + 'm&oacute;dulo.');
  }
  if (!t.length)
    t.push('Las tres tensiones coinciden dentro de 15 V. El punto de '
         + 'operaci&oacute;n el&eacute;ctrico est&aacute; donde deber&iacute;a.');
  return '<p class="ko-nota">' + t.join(' ') + '</p>';
}

/* Retrato del motor al momento de emitir. */
function koCriterios(){
  return {
    modo_factor_carga: koCfg.modo,
    k_filtro:          koCfg.kFiltro,
    fp:                koCfg.fp,
    constante:         koCfg.raiz,
    caida_escala_frecuencia: koCfg.escalaCable
  };
}

/* Un cero medido es un dato; una cadena vacia no. */
function koNum(v){
  if (v == null || v === '') return null;
  const n = Number(v);
  return isFinite(n) ? n : null;
}

/* ============================================================
   MOTOR DE CALCULO
   ============================================================ */
/* Las tablas y los umbrales vienen de opt_parametro. Estos valores
   solo cubren el instante entre que abre la pantalla y llega la
   respuesta; en cuanto llega, se reemplazan. */
let KO_TABLA = [[0.50,0.87],[0.60,0.90],[0.70,0.94],[0.80,0.95],[0.90,0.98],[1.00,1.00]];
let KO_CVD   = {2:[[40,11],[50,14],[60,16],[70,19],[80,22],[90,25],[100,27],[110,30],
                   [120,33],[130,36],[140,39]]};
let KO_TCF   = [[140,1.13],[149,1.15],[158,1.17],[167,1.19],[176,1.21],[185,1.23],
                [194,1.25],[203,1.27],[212,1.29],[221,1.31],[230,1.33]];

const koCfg = {
  modo:    'interp',   /* interp | banda */
  kFiltro: 1.07,       /* perdida de tension del filtro seno */
  fp:      0.80,       /* factor de potencia para pasar A a kW */
  vNom:    480,        /* nominal por defecto del variador */
  raiz:    'sqrt3',    /* sqrt3 | hoja  (la hoja usaba 3^(1/3)) */
  uTap:    100,
  uVolA:   80,
  uVolC:   150,
  escalaCable: true   /* true: como la hoja de optimizacion */
};

let KO_DATOS = [];

/* Aplica lo que trae opt_parametros sobre la configuracion local,
   sin perder los valores por defecto si falta alguna clave. */
function koAplicarParametros(p){
  const n = k => (p[k] == null ? null : Number(p[k]));
  if (n('k_filtro') != null) koCfg.kFiltro = n('k_filtro');
  if (n('fp') != null)       koCfg.fp = n('fp');
  if (n('u_tap') != null)    koCfg.uTap = n('u_tap');
  if (n('u_vol_atencion') != null) koCfg.uVolA = n('u_vol_atencion');
  if (n('u_vol_alerta') != null)   koCfg.uVolC = n('u_vol_alerta');
  if (p.modo_factor_carga) koCfg.modo = String(p.modo_factor_carga);
  if (p.caida_escala_frecuencia != null)
    koCfg.escalaCable = !!p.caida_escala_frecuencia;
  if (Array.isArray(p.tabla_carga) && p.tabla_carga.length) KO_TABLA = p.tabla_carga;
  if (Array.isArray(p.tabla_tcf) && p.tabla_tcf.length)     KO_TCF = p.tabla_tcf;
  if (p.tabla_cvd && typeof p.tabla_cvd === 'object')       KO_CVD = p.tabla_cvd;
}

/* Interpolacion lineal con recorte a los extremos de la tabla. */
function koInterp(t, x){
  if (x == null || !isFinite(x)) return null;
  if (x <= t[0][0]) return t[0][1];
  if (x >= t[t.length-1][0]) return t[t.length-1][1];
  for (let i = 0; i < t.length - 1; i++){
    const [a, va] = t[i], [b, vb] = t[i+1];
    if (x >= a && x <= b) return va + (vb - va) * (x - a) / (b - a);
  }
  return null;
}

/* La caida de tension en el cable no se escala con la frecuencia:
   depende de la corriente. Se calcula del calibre, la longitud y la
   temperatura, salvo que la unidad tenga una caida medida en campo,
   que siempre manda sobre la calculada. */
function koCaidaCable(u){
  if (u.cable_medido != null) return {v:u.cable_medido, origen:'medida en campo'};
  const tabla = KO_CVD[u.awg] || KO_CVD[String(u.awg)];
  if (!tabla || u.long_ft == null || u.i_placa == null)
    return {v:null, origen:'sin calibre, longitud o corriente de placa'};
  const cvd = koInterp(tabla, u.i_placa);
  const tcf = koInterp(KO_TCF, u.temp_f);
  if (cvd == null || tcf == null)
    return {v:null, origen:'sin temperatura del pozo'};
  return {v: u.long_ft * cvd / 1000 * tcf, origen:'calculada', cvd:cvd, tcf:tcf};
}

let koSel   = null;         /* pozo abierto en detalle */
let koProp  = {};           /* pozo -> frecuencia maxima propuesta editada */
let koBusca = '';           /* texto del buscador */
let koFiltro = 'all';       /* all | tap | vol | ahorro | filtro | sin */
let koMarca = new Set();    /* pozos escogidos para la propuesta */

/* ---------- motor de calculo ---------- */

function koFactorCarga(carga){
  if (carga == null) return null;
  const T = KO_TABLA;
  if (carga <= T[0][0]) return T[0][1];
  if (carga >= T[T.length-1][0]) return T[T.length-1][1];

  if (koCfg.modo === 'banda'){
    /* Banda: se toma el escalon inmediatamente inferior, que es lo
       que hace una tabla leida a mano. */
    let f = T[0][1];
    for (const [c, v] of T) if (carga >= c) f = v;
    return f;
  }
  for (let i = 0; i < T.length - 1; i++){
    const [c1, v1] = T[i], [c2, v2] = T[i+1];
    if (carga >= c1 && carga <= c2)
      return v1 + (v2 - v1) * (carga - c1) / (c2 - c1);
  }
  return null;
}

/* Frecuencia de partida de una unidad: la propuesta ya registrada
   si existe, y si no el tope actual. */
function koFBase(u){
  return u.prop_f_max != null ? u.prop_f_max : u.f_max;
}

function koCalcular(u){
  const r = { pozo: u.pozo, u: u, ok: false };
  if (u.carga == null && u.i_mot != null && u.i_placa)
    u.carga = u.i_mot / u.i_placa;
  /* Prioridad de la frecuencia propuesta: lo que el usuario edita
     ahora, luego la propuesta ya guardada, y si no hay ninguna, el
     tope actual de la unidad. */
  r.fProp = koProp[u.pozo] != null ? koProp[u.pozo]
          : (u.prop_f_max != null ? u.prop_f_max : u.f_max);

  const cab = koCaidaCable(u);
  r.cable = cab.v;
  r.cableOrigen = cab.origen;
  r.cvd = cab.cvd; r.tcf = cab.tcf;

  if (u.carga == null || u.v_placa == null || u.f_op == null || !r.fProp
      || r.cable == null) return r;

  r.fCarga  = koFactorCarga(u.carga);
  r.vOpt60  = u.v_placa * r.fCarga;
  /* Dos criterios sobre la caida de cable, y la diferencia no es
     menor. La hoja de optimizacion la sumaba antes de escalar por
     frecuencia; la de instalacion la suma despues. Fisicamente la
     caida depende de la corriente y no de la velocidad, asi que
     "sin escalar" es lo correcto, pero se deja como parametro
     mientras se confirma contra campo. */
  if (koCfg.escalaCable){
    r.vSup60 = r.vOpt60 + r.cable;
    r.tapOpt = r.vSup60 * r.fProp / 60;
    r.vOptOp = r.vSup60 * u.f_op / 60;
  } else {
    r.vSup60 = r.vOpt60 + r.cable;
    r.tapOpt = r.vOpt60 * r.fProp / 60 + r.cable;
    r.vOptOp = r.vOpt60 * u.f_op / 60 + r.cable;
  }

  /* ── Lado del variador ────────────────────────────────────────────
     El SUT es un transformador: V salida = V entrada x (TAP / V nom).
     Con eso se pasa cualquier tension del lado de superficie al lado
     del variador, sin necesidad de un dato nuevo.

     Se calculan TRES tensiones y compararlas es el diagnostico:

       vVsdMed   lo que el variador esta entregando, deducido de la
                 tension medida en el SUT. Es una deduccion, no una
                 medida: no ve el error de regulacion del variador.
       vVsdPatron lo que deberia entregar segun su propia curva V/Hz,
                 que a la frecuencia maxima ajustada da la nominal.
       vVsdNec   lo que el motor necesita, referido al lado del
                 variador.

     Si patron y necesaria no coinciden, el TAP esta mal escogido. Si
     medida y patron no coinciden, la curva V/Hz esta mal parametrizada
     o hay caida en la acometida. Son dos fallas distintas y hoy el
     modulo no las separaba. */
  const vNomD = u.v_nom != null ? u.v_nom : koCfg.vNom;
  r.rtSut = (u.tap != null && vNomD) ? u.tap / vNomD : null;
  if (r.rtSut){
    r.vVsdMed = u.v_sut != null ? u.v_sut / r.rtSut : null;
    r.vVsdNec = r.vOptOp / r.rtSut;
  }
  r.vVsdPatron = (vNomD && u.f_max) ? vNomD * u.f_op / u.f_max : null;
  r.dVsdPatron = (r.vVsdMed != null && r.vVsdPatron != null)
                 ? r.vVsdMed - r.vVsdPatron : null;
  r.dVsdNec    = (r.vVsdMed != null && r.vVsdNec != null)
                 ? r.vVsdMed - r.vVsdNec : null;

  r.kFiltro = u.filtro ? (u.k_filtro != null ? u.k_filtro : koCfg.kFiltro) : 1;
  r.tapNew  = r.tapOpt * r.kFiltro;

  r.dTap = u.tap != null ? u.tap - r.tapOpt : null;
  r.dVol = u.v_sut != null ? Math.abs(u.v_sut - r.vOptOp) : null;

  const vNom = u.v_nom != null ? u.v_nom : koCfg.vNom;
  if (vNom && u.i_mot != null && u.i_vsd != null){
    r.vNom  = vNom;
    r.rtAct = u.tap != null ? u.tap / vNom : null;
    r.rtNew = r.tapNew / vNom;
    r.dAmp  = u.i_vsd - r.rtNew * u.i_mot;
    const k = koCfg.raiz === 'sqrt3' ? Math.sqrt(3) : Math.pow(3, 1/3);
    r.red   = k * r.dAmp * vNom * koCfg.fp / 1000;
    /* La reduccion es una diferencia; para comparar contra campo
       hace falta el absoluto. kwAct es lo que la unidad toma hoy y
       kwProp lo que tomaria con el TAP propuesto. Por construccion
       kwAct - kwProp es exactamente r.red, asi que el estimado y lo
       que despues se mida salen del mismo criterio. */
    r.kwAct  = k * u.i_vsd * vNom * koCfg.fp / 1000;
    r.kwProp = k * r.rtNew * u.i_mot * vNom * koCfg.fp / 1000;
  }
  r.ok = true;
  return r;
}

/* Semaforos de la hoja: el TAP se juzga por su diferencia contra el
   optimo, y la tension medida por su diferencia contra la optima a
   la frecuencia de operacion. */
function koSemTap(d){
  if (d == null) return 'null';
  return Math.abs(d) >= koCfg.uTap ? 'crit' : 'ok';
}
function koSemVol(d){
  if (d == null) return 'null';
  if (d >= koCfg.uVolC) return 'crit';
  if (d >= koCfg.uVolA) return 'warn';
  return 'ok';
}
const KO_HEX = {ok:'#35a853', warn:'#e0a230', crit:'#d6584a', 'null':'#5f7d94'};

/* El alcance es el buscador mas el filtro de estado. La seleccion es
   otra cosa: sobre el alcance visible se marcan las unidades que van
   a entrar en una propuesta concreta, y los indicadores pasan a
   contar solo esas. Sin marcas, cuentan todo el alcance. */
function koAmbito(rs){
  const q = koBusca.trim().toUpperCase();
  return rs.filter(r => {
    if (koCampo !== 'all' && r.u.campo !== koCampo) return false;
    if (koPad   !== 'all' && r.u.pad   !== koPad)   return false;
    if (q && r.pozo.toUpperCase().indexOf(q) < 0
          && String(r.u.vsd || '').toUpperCase().indexOf(q) < 0) return false;
    if (koFiltro === 'tap')    return r.ok && koSemTap(r.dTap) === 'crit';
    if (koFiltro === 'vol')    return r.ok && koSemVol(r.dVol) === 'crit';
    if (koFiltro === 'ahorro') return r.ok && r.red != null && r.red > 0;
    if (koFiltro === 'filtro') return !!r.u.filtro;
    if (koFiltro === 'sin')    return !r.ok;
    return true;
  });
}

const KO_FILTROS = [
  ['all',    'Todas'],
  ['tap',    'TAP fuera de rango'],
  ['vol',    'Tensi\u00f3n en alerta'],
  ['ahorro', 'Con ahorro'],
  ['filtro', 'Con filtro seno'],
  ['sin',    'Sin datos']
];

let koCampo = 'all';
let koPad   = 'all';

/* Los campos y los PAD salen de los datos, no de una lista fija. */
function koSelectores(rs){
  const campos = [...new Set(rs.map(r => r.u.campo)
    .filter(c => c && c !== '\u2014'))].sort();
  const pads = [...new Set(rs
    .filter(r => koCampo === 'all' || r.u.campo === koCampo)
    .map(r => r.u.pad).filter(p => p && p !== '\u2014'))].sort();
  if (pads.indexOf(koPad) < 0) koPad = 'all';

  const op = (v, t, sel) => '<option value="' + koEsc(v) + '"'
    + (sel === v ? ' selected' : '') + '>' + koEsc(t) + '</option>';

  return '<select class="ko-sel2" id="koCampoSel">'
    + op('all', 'Todos los campos', koCampo)
    + campos.map(c => op(c, c, koCampo)).join('') + '</select>'
    + '<select class="ko-sel2" id="koPadSel">'
    + op('all', 'Todos los PAD', koPad)
    + pads.map(p => op(p, p, koPad)).join('') + '</select>';
}

function koBarra(amb, rs){
  const chips = KO_FILTROS.map(([k, t]) => {
    const n = k === 'all' ? rs.length : koAmbitoCuenta(rs, k);
    return '<button class="ko-chip' + (koFiltro === k ? ' on' : '') + '" data-f="' + k
      + '">' + t + ' <s>' + n + '</s></button>';
  }).join('');

  const marcadas = koMarca.size;
  return '<div class="ko-bar">'
    + '<div class="ko-chips">' + chips + '</div>'
    + '<div class="ko-bar2">'
    +   koSelectores(rs)
    +   '<input class="ko-bus" id="koBus" placeholder="Buscar unidad o variador" value="'
    +     koEsc(koBusca) + '">'
    +   '<button class="ko-chip" id="koSync" title="Trae la ultima ronda de cada unidad">'
    +     'Actualizar desde rondas</button>'
    +   '<button class="ko-chip" id="koSeg" title="Que se propuso, que se aprobo y '
    +     'que se recupero">Seguimiento</button>'
    +   '<button class="ko-chip" id="koMarcarTodas">Marcar las ' + amb.length
    +     ' visibles</button>'
    +   (marcadas ? '<button class="ko-chip on" id="koLimpiar">'
        + marcadas + ' marcada' + (marcadas === 1 ? '' : 's') + ' \u00b7 limpiar</button>'
        : '<span class="ko-hint">Marque unidades para armar una propuesta</span>')
    + '</div></div>';
}

/* Decir "sin datos" no ayuda a nadie: hay que decir cual falta,
   porque cada faltante se resuelve en un lugar distinto. */
function koFalta(r){
  const u = r.u, f = [];
  if (u.f_op == null)    f.push('frecuencia de operacion');
  if (u.carga == null)   f.push('carga del motor');
  if (u.v_placa == null) f.push('tension de placa del motor');
  if (u.i_vsd == null)   f.push('corriente del variador');
  if (u.i_mot == null)   f.push('corriente del motor');
  if (r.cable == null)   f.push('caida de cable (' + r.cableOrigen + ')');
  if (!f.length) return 'Sin datos suficientes';
  return 'Falta ' + f.join(', ') + '.';
}

function koAmbitoCuenta(rs, k){
  const g = koFiltro; koFiltro = k;
  const n = koAmbito(rs).length; koFiltro = g;
  return n;
}

function koEsc(t){
  return String(t == null ? '' : t).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ---------- vistas ---------- */

function koPintar(){
  if (koSel) return koPintarDetalle();
  const v = document.getElementById('koVista');
  document.getElementById('koBack').style.display = 'none';
  document.getElementById('koTitulo').textContent = 'Optimizaci\u00f3n Energ\u00e9tica';
  document.getElementById('koSub').innerHTML =
    'Propuesta de cambio de TAP por condici&oacute;n de operaci&oacute;n';

  const rs  = KO_DATOS.map(koCalcular);
  const amb = koAmbito(rs);
  /* Los indicadores siguen a la seleccion cuando hay marcas; si no,
     al alcance visible. Un total que no corresponde a lo que se esta
     mirando es peor que no tenerlo. */
  const base = koMarca.size ? rs.filter(r => koMarca.has(r.pozo)) : amb;
  const con = base.filter(r => r.ok);
  const sin = base.length - con.length;

  /* La suma de ahorro excluye las unidades cuya lectura es anterior al
     motor instalado. Sumar esos kW seria prometer un ahorro calculado
     sobre un equipo que ya no esta. */
  const viejas = con.filter(r => koDatoViejo(r.u));
  const kw    = con.filter(r => r.red != null && r.red > 0 && !koDatoViejo(r.u))
                   .reduce((a, r) => a + r.red, 0);
  /* Unidades subtensionadas: el TAP esta por debajo del optimo. No son
     oportunidad de ahorro sino correccion, y mezclarlas en la misma
     cifra es lo que hacia aparecer reducciones negativas. */
  const subT  = con.filter(r => r.dTap != null && r.dTap < -20 && !koDatoViejo(r.u));
  const tapAl = con.filter(r => koSemTap(r.dTap) === 'crit').length;
  const volAl = con.filter(r => koSemVol(r.dVol) === 'crit').length;
  const flt   = con.filter(r => r.u.filtro).length;

  const tile = (c, k, val, u, r2) => '<div class="ko-h ' + c + '">'
    + '<div class="k">' + k + '</div><div class="v">' + val
    + (u ? '<small>' + u + '</small>' : '') + '</div>'
    + (r2 ? '<div class="r2">' + r2 + '</div>' : '') + '</div>';

  let h = koConfig() + koBarra(amb, rs);

  const alc = koMarca.size ? 'de las marcadas'
            : (koFiltro === 'all' && !koBusca.trim() ? 'de la flota' : 'del alcance');

  h += '<div class="ko-hero">'
    + tile('',  'Unidades evaluadas', String(con.length), '',
           sin ? sin + ' sin datos suficientes' : 'todas con datos')
    /* La flecha en la cifra de ahorro dice lo que pasa con el consumo,
       que es lo que interesa: baja. Antes el numero solo iba en verde y
       habia que saber que verde significaba reduccion. */
    + tile('g', 'Consumo si se ejecuta', '\u2193 ' + kw.toFixed(0), 'kW',
           'suma de ' + alc + ' unidad' + (alc === 1 ? '' : 'es') + ' con ahorro')
    /* Separada del ahorro a proposito. Una unidad con el TAP por debajo
       del optimo no es una oportunidad de ahorro: es una correccion por
       subtension, y ejecutarla puede costar energia y valer la pena
       igual. Mezclarlas era lo que producia reducciones negativas. */
    + tile(subT.length ? 'w' : 'g', 'Subtensionadas', String(subT.length), '',
           subT.length ? 'el TAP est&aacute; por debajo del &oacute;ptimo'
                       : 'ninguna por debajo del &oacute;ptimo')
    + tile(tapAl ? 'r' : 'g', 'TAP fuera de rango', String(tapAl), '',
           'diferencia de 100 V o m&aacute;s')
    + tile(volAl ? 'w' : 'g', 'Tensi&oacute;n en alerta', String(volAl), '',
           'desviaci&oacute;n de 150 V o m&aacute;s')
    + (viejas.length
        ? tile('w', 'Datos previos al equipo', String(viejas.length), '',
               'lectura anterior al motor instalado')
        : tile('',  'Con filtro seno', String(flt), '',
               'factor ' + koCfg.kFiltro.toFixed(2) + ' sobre el TAP'))
    + '</div>';

  const filas = amb.map(r => {
    const u = r.u;
    const mk = '<td class="ko-mk" onclick="event.stopPropagation()">'
      + '<input type="checkbox" data-m="' + u.pozo + '"'
      + (koMarca.has(u.pozo) ? ' checked' : '') + '></td>';

    if (!r.ok){
      return '<tr>' + mk + '<td class="pz">' + u.pozo + '</td>'
        + '<td colspan="12" style="text-align:left" class="sd">'
        + koEsc(koFalta(r)) + '</td></tr>';
    }
    const edit = koProp[u.pozo] != null && koProp[u.pozo] !== koFBase(u);
    const viejo = koDatoViejo(u);
    return '<tr class="cl' + (koMarca.has(u.pozo) ? ' mk' : '')
      +   (viejo ? ' viejo' : '') + '" data-p="' + u.pozo + '">'
      + mk
      + '<td class="pz">' + u.pozo
      +   (u.filtro ? '<span class="ko-fl">FILTRO</span>' : '')
      +   (viejo ? '<span class="ko-adv" title="La lectura es del '
                 + u.fecha + ', anterior al motor instalado el '
                 + viejo + '">dato previo al cambio</span>' : '') + '</td>'
      + '<td>' + u.f_op.toFixed(1) + '</td>'
      + '<td>' + u.f_max.toFixed(1) + '</td>'
      + '<td onclick="event.stopPropagation()">'
      +   '<input class="ko-f' + (edit ? ' ed' : '') + '" type="number" step="0.1" '
      +   'value="' + r.fProp + '" data-p="' + u.pozo + '"></td>'
      + '<td>' + (u.carga * 100).toFixed(0) + '%</td>'
      + '<td>' + r.fCarga.toFixed(3) + '</td>'
      + '<td>' + u.tap.toFixed(0) + '</td>'
      + '<td>' + r.tapOpt.toFixed(0) + '</td>'
      + '<td>' + (r.tapNew !== r.tapOpt
                    ? '<span class="up">' + r.tapNew.toFixed(0) + '</span>'
                    : r.tapNew.toFixed(0)) + '</td>'
      + '<td>' + koAccionTap(r.dTap) + '</td>'
      + '<td>' + (r.dVol != null ? r.dVol.toFixed(0) : '\u2014')
      +   '<span class="ko-sem" style="background:' + KO_HEX[koSemVol(r.dVol)] + '"></span></td>'
      /* Corriente del variador y consumo: lo deseable es que bajen. */
      + '<td>' + koDelta(r.dAmp, { mejor:'baja', dec:1, umbral:0.5 }) + '</td>'
      + '<td>' + koDelta(r.red,  { mejor:'baja', dec:1, umbral:0.5 }) + '</td>'
      + '</tr>';
  }).join('');

  if (!amb.length){
    h += '<div class="ko-card"><div class="ko-vacio">'
      + 'Ninguna unidad coincide con el filtro.</div></div>';
    document.getElementById('koVista').innerHTML = h;
    return koEnlazar();
  }

  h += '<div class="ko-card"><div class="ct"><b>Unidades</b>'
    + '<span>' + amb.length + ' de ' + rs.length
    + ' &middot; toque una fila para ver la cadena</span></div>'
    + '<div class="ko-scroll"><table class="ko-t"><thead><tr>'
    + '<th class="ko-mk"></th><th>Unidad</th><th>F&nbsp;ope</th><th>F&nbsp;m&aacute;x</th>'
    + '<th>F&nbsp;m&aacute;x prop.</th><th>Carga</th><th>Factor</th>'
    + '<th>TAP actual</th><th>TAP &oacute;ptimo</th><th>TAP nuevo</th>'
    + '<th>Acci&oacute;n TAP</th><th>&Delta;&nbsp;Vol</th>'
    + '<th>Corriente VSD</th><th>Consumo</th></tr></thead><tbody>' + filas + '</tbody></table></div>'
    + '<div class="ko-leg">'
    +   '<span><span class="ko-d bien">\u2193</span>&nbsp;baja y conviene</span>'
    +   '<span><span class="ko-d mal">\u2191</span>&nbsp;sube y no conviene</span>'
    +   '<span><i style="background:#35a853"></i>Dentro de rango</span>'
    +   '<span><i style="background:#e0a230"></i>Desviaci&oacute;n de 80 a 150 V</span>'
    +   '<span><i style="background:#d6584a"></i>Alerta</span>'
    +   '<span><i style="background:#5f7d94"></i>Sin dato</span></div>'
    + '<p class="ko-nota">El TAP se marca en alerta con 100 V o m&aacute;s de diferencia '
    + 'contra el &oacute;ptimo. La tensi&oacute;n medida en el SUT se compara contra la '
    + '&oacute;ptima a la frecuencia de operaci&oacute;n: bajo 80 V es normal, entre 80 y '
    + '150 V es regular, 150 V o m&aacute;s es alerta.</p></div>';

  if (koMarca.size) h += koPropuesta(rs);

  v.innerHTML = h;
  koEnlazar();
}

/* Lo que se marca sirve para pedir algo concreto: un cambio de TAP
   por unidad. El resumen se deja en texto plano para copiarlo a un
   correo o a un aviso sin volver a teclear cifras. */
function koPropuesta(rs){
  const sel = rs.filter(r => koMarca.has(r.pozo) && r.ok);
  if (!sel.length){
    return '<div class="ko-card"><div class="ct"><b>Propuesta</b></div>'
      + '<div class="ko-vacio">Las unidades marcadas no tienen datos suficientes.</div></div>';
  }
  const kw = sel.filter(r => r.red > 0).reduce((a, r) => a + r.red, 0);
  const li = sel.slice().sort((a, b) => (b.red || 0) - (a.red || 0)).map(r =>
    r.pozo.padEnd(8) + ' TAP ' + r.u.tap.toFixed(0).padStart(5)
    + ' \u2192 ' + r.tapNew.toFixed(0).padStart(5) + ' V'
    + (r.u.filtro ? ' (con filtro)' : '')
    + '   F m\u00e1x ' + r.fProp.toFixed(1) + ' Hz'
    + '   ' + (r.red != null ? (r.red > 0 ? '+' : '') + r.red.toFixed(1) + ' kW' : '')
  ).join('\n');

  const yaGuardadas = sel.filter(r => r.u.prop_estado).length;
  return '<div class="ko-card"><div class="ct"><b>Propuesta</b><span>'
    + sel.length + ' unidad' + (sel.length === 1 ? '' : 'es') + ' &middot; '
    + kw.toFixed(0) + ' kW</span></div>'
    + '<pre class="ko-pre">' + koEsc(li) + '</pre>'
    + '<div class="ko-bar2" style="margin-top:11px">'
    +   '<button class="ko-chip on" id="koGuardar">Registrar en Kronos-M</button>'
    +   '<span class="ko-hint" id="koGuardarMsg">'
    +     (yaGuardadas ? yaGuardadas + ' de estas unidades ya tienen una propuesta '
                       + 'vigente; registrarlas de nuevo reemplaza la anterior.'
                      : 'Queda registrada por unidad, con su frecuencia y su TAP.')
    +   '</span>'
    + '</div>'
    + '<p class="ko-nota">Tensiones a frecuencia m&aacute;xima propuesta. La derivaci&oacute;n '
    + 'la escoge el t&eacute;cnico contra la tabla del SUT instalado.</p></div>';
}

function koConfig(){
  return '<div class="ko-cfg">'
    + '<div class="g"><label>Tabla de carga</label>'
    +   '<select id="koModo">'
    +   '<option value="interp"' + (koCfg.modo === 'interp' ? ' selected' : '')
    +     '>Interpolaci&oacute;n lineal</option>'
    +   '<option value="banda"' + (koCfg.modo === 'banda' ? ' selected' : '')
    +     '>Banda inferior</option></select></div>'
    + '<div class="g"><label>Factor filtro seno</label>'
    +   '<input id="koK" type="number" step="0.01" value="' + koCfg.kFiltro + '"></div>'
    + '<div class="g"><label>FP para kW</label>'
    +   '<input id="koFp" type="number" step="0.01" value="' + koCfg.fp + '"></div>'
    + '<div class="g"><label>Ca&iacute;da de cable</label>'
    +   '<select id="koEsc">'
    +   '<option value="1"' + (koCfg.escalaCable ? ' selected' : '')
    +     '>Escala con la frecuencia</option>'
    +   '<option value="0"' + (koCfg.escalaCable ? '' : ' selected')
    +     '>Constante</option></select></div>'
    + '<div class="g"><label>Constante trif&aacute;sica</label>'
    +   '<select id="koRaiz">'
    +   '<option value="sqrt3"' + (koCfg.raiz === 'sqrt3' ? ' selected' : '')
    +     '>&radic;3 = 1.7321</option>'
    +   '<option value="hoja"' + (koCfg.raiz === 'hoja' ? ' selected' : '')
    +     '>3^(1/3) = 1.4422 (hoja)</option></select></div>'
    + '<p class="nota">Los controles afectan el c&aacute;lculo de todas las '
    + 'unidades. La constante trif&aacute;sica est&aacute; aqu&iacute; solo para '
    + 'comparar contra la hoja; el valor correcto es &radic;3.</p>'
    + '</div>';
}

function koPintarDetalle(){
  const u = KO_DATOS.find(x => x.pozo === koSel);
  if (!u){ koSel = null; return koPintar(); }
  const r = koCalcular(u);
  const v = document.getElementById('koVista');

  document.getElementById('koBack').style.display = 'block';
  document.getElementById('koTitulo').textContent = u.pozo;
  document.getElementById('koSub').textContent =
    u.vsd + ' \u00b7 ' + u.campo
    + (u.pad && u.pad !== '\u2014' ? ' \u00b7 ' + u.pad : '')
    + (u.filtro ? ' \u00b7 con filtro seno' : '');

  const p = (n, f, res, un) => '<div class="ko-p"><div class="n">' + n + '</div>'
    + '<div class="f">' + f + '</div><div class="r">' + res
    + (un ? '<small>' + un + '</small>' : '') + '</div></div>';

  let h = koConfig();

  if (!r.ok){
    h += '<div class="ko-card"><div class="ko-vacio">' + koEsc(koFalta(r))
      + '<br><br>El diseno electrico se completa en el modulo de Instalacion; '
      + 'las lecturas entran por la captura de campo.</div></div>';
    v.innerHTML = h;
    return koEnlazar();
  }

  const ent = [
    ['Frecuencia de operaci&oacute;n', u.f_op.toFixed(1) + ' Hz'],
    ['Frecuencia m&aacute;xima ajustada', u.f_max.toFixed(1) + ' Hz'],
    ['Carga del motor', (u.carga * 100).toFixed(0) + ' %'],
    ['Tensi&oacute;n de placa del motor', koEnt(u.v_placa) + ' V'],
    ['Corriente de placa', koEnt(u.i_placa) + ' A'],
    ['TAP del SUT instalado', u.tap != null ? u.tap.toFixed(0) + ' V' : '\u2014'],
    ['Tensi&oacute;n nominal del variador', (r.vNom || koCfg.vNom) + ' V'],
    ['Ca&iacute;da de tensi&oacute;n en cable',
      r.cable.toFixed(0) + ' V (' + r.cableOrigen + ')'],
    ['Cable', (u.awg != null ? 'calibre #' + u.awg : 'calibre sin registrar')
      + (u.long_ft != null ? ' \u00b7 ' + u.long_ft.toFixed(0) + ' ft' : '')
      + (u.temp_f != null ? ' \u00b7 ' + u.temp_f.toFixed(0) + ' \u00b0F' : '')],
    ['Lectura', (u.fecha || 'sin fecha')
      + (u.fuente ? ' \u00b7 ' + u.fuente : '')],
    /* Enteros. Los valores llegan como promedio de la ronda y arrastran
       trece decimales que no significan nada: un megohmetro de campo no
       resuelve milesimas de amperio y la falsa precision resta
       credibilidad al numero que si importa. */
    ['Corriente en el variador', koEnt(u.i_vsd) + ' A'],
    ['Corriente del motor', koEnt(u.i_mot) + ' A'],
    ['Tensi&oacute;n medida en el SUT', koEnt(u.v_sut) + ' V'],
    ['Tensi&oacute;n de salida del variador',
      r.vVsdMed != null
        ? koEnt(r.vVsdMed) + ' V <span class="ko-der">deducida del SUT</span>'
        : '\u2014']
  ].map(x => '<tr><td style="text-align:left;color:var(--ko-t3)">' + x[0]
    + '</td><td style="color:var(--t1);font-weight:600">' + x[1] + '</td></tr>').join('');

  h += '<div class="ko-card"><div class="ct"><b>Entradas</b>'
    + '<span>&Uacute;ltima corrida cargada</span></div>'
    + '<table class="ko-t" style="max-width:460px"><tbody>' + ent
    + '</tbody></table></div>';

  h += '<div class="ko-card"><div class="ct"><b>Cadena de c&aacute;lculo</b>'
    + '<span>Frecuencia m&aacute;xima propuesta ' + r.fProp.toFixed(1) + ' Hz</span></div>'
    + '<div class="ko-cad">'
    + p('Factor de carga', 'tabla(' + (u.carga * 100).toFixed(0) + '%)',
        r.fCarga.toFixed(3), '')
    + p('Tensi&oacute;n &oacute;ptima motor @60 Hz', 'V placa x factor',
        r.vOpt60.toFixed(0), 'V')
    + p('Tensi&oacute;n &oacute;ptima superficie @60 Hz', '+ ca&iacute;da de cable',
        r.vSup60.toFixed(0), 'V')
    + p('TAP &oacute;ptimo', 'V sup x F prop / 60', r.tapOpt.toFixed(0), 'V')
    + p('Tensi&oacute;n &oacute;ptima @ F operaci&oacute;n', 'V sup x F ope / 60',
        r.vOptOp.toFixed(0), 'V')
    + p('TAP a solicitar', u.filtro
          ? 'TAP &oacute;ptimo x ' + koCfg.kFiltro.toFixed(2) + ' (filtro)'
          : 'igual al &oacute;ptimo (sin filtro)',
        r.tapNew.toFixed(0), 'V')
    + '</div>';

  /* Lado del variador. Tres tensiones que se leen comparandolas entre
     si, no una por una. */
  if (r.vVsdMed != null || r.vVsdPatron != null){
    h += '<div class="ko-card"><div class="ct">'
      + '<b>Tensi&oacute;n en el lado del variador</b>'
      + '<span>referida por el SUT, relaci&oacute;n '
      + (r.rtSut != null ? r.rtSut.toFixed(2) : '\u2014') + '</span></div>'
      + '<div class="ko-cad">'
      + p('Entregada hoy', 'V medida SUT / relaci&oacute;n',
          koEnt(r.vVsdMed), 'V')
      + p('Seg&uacute;n curva V/Hz', 'V nom x F ope / F m&aacute;x',
          koEnt(r.vVsdPatron), 'V')
      + p('Que necesita el motor', 'V &oacute;ptima @F ope / relaci&oacute;n',
          koEnt(r.vVsdNec), 'V')
      + '</div>'
      + koLecturaVsd(r)
      + '</div>';
  }

  h += '<div class="ko-cad" style="margin-top:9px">'
    + p('Acci&oacute;n sobre el TAP', 'contra el &oacute;ptimo',
        koAccionTap(r.dTap), '')
    + p('Desviaci&oacute;n de tensi&oacute;n', '| V medida - V &oacute;ptima |',
        koEnt(r.dVol), 'V')
    + (r.rtNew != null
        ? p('Relaci&oacute;n de transformaci&oacute;n', 'actual '
            + r.rtAct.toFixed(2) + ' \u2192 nueva', r.rtNew.toFixed(2), '')
        : '')
    + (r.dAmp != null
        ? p('Corriente del variador', 'A variador - RT nueva x A motor',
            koDelta(r.dAmp, { mejor:'baja', dec:0, umbral:0.5 }), 'A')
        : '')
    + (r.red != null
        ? p('Consumo', (koCfg.raiz === 'sqrt3' ? '&radic;3' : '3^(1/3)')
            + ' x &Delta;A x V nom x FP / 1000',
            koDelta(r.red, { mejor:'baja', dec:1, umbral:0.5 }), 'kW')
        : '')
    + '</div>';

  /* De donde salio la caida de cable. Es la entrada menos visible
     del calculo y la que mas mueve el resultado, asi que se muestra
     desarmada en vez de como un numero suelto. */
  h += '<div class="ko-card"><div class="ct"><b>Ca&iacute;da de tensi&oacute;n en el cable</b>'
    + '<span>' + koEsc(r.cableOrigen) + '</span></div><div class="ko-cad">'
    + (r.cvd != null
        ? p('CVD', 'tabla(' + u.i_placa.toFixed(0) + ' A, calibre #' + u.awg + ')',
            r.cvd.toFixed(1), 'V/1000ft') : '')
    + (r.tcf != null
        ? p('TCF', 'tabla(' + u.temp_f.toFixed(0) + ' \u00b0F)', r.tcf.toFixed(3), '') : '')
    + p('Ca&iacute;da', r.cvd != null ? 'longitud x CVD / 1000 x TCF' : 'valor registrado',
        r.cable.toFixed(0), 'V')
    + '</div>'
    + '<p class="ko-nota">No se escala con la frecuencia: depende de la corriente, '
    + 'no de la velocidad.</p></div>';

  const pr = r.u.prop_estado
    ? '<div class="ko-card"><div class="ct"><b>Propuesta vigente</b><span>'
      + koEsc(r.u.prop_estado) + '</span></div>'
      + '<p class="ko-nota" style="margin:0">Registrada para '
      + (r.u.prop_f_max != null ? r.u.prop_f_max.toFixed(1) + ' Hz' : 'sin frecuencia')
      + '. Marque la unidad en el listado para volver a registrarla con otros valores.</p></div>'
    : '';
  h += pr;

  v.innerHTML = h;
  koEnlazar();
}

/* Sincronizar y recargar. Se informa cuantas lecturas entraron y
   cuantas unidades quedaron sin carga por no tener corriente de
   placa registrada, que es el faltante que mas se repite. */
async function koActualizar(boton){
  const previo = boton.textContent;
  boton.disabled = true;
  boton.textContent = 'Actualizando\u2026';
  try {
    const r = await koSincronizar();
    KO_DATOS = await koCargarUnidades();
    koPintar();
    const m = document.getElementById('koGuardarMsg');
    const txt = (r.lecturas || 0) + ' lecturas actualizadas'
      + (r.sin_diseno ? ' \u00b7 ' + r.sin_diseno + ' con ronda pero sin dise\u00f1o' : '')
      + (r.sin_carga ? ' \u00b7 ' + r.sin_carga + ' sin carga por falta de placa' : '');
    if (m) m.textContent = txt;
    else console.info('[Kronos-M] ' + txt);
  } catch(e){
    boton.disabled = false;
    boton.textContent = previo;
    const v = document.getElementById('koVista');
    if (v) v.insertAdjacentHTML('afterbegin',
      '<div class="ko-card"><div class="ko-vacio">No se pudo actualizar.<br>'
      + koEsc(e.message) + '</div></div>');
  }
}

/* Registrar es un acto, no un dibujo: se bloquea el boton, se
   informa cuantas quedaron y se recargan las unidades para que la
   pantalla muestre la propuesta vigente real y no la que se supone
   que quedo. */
async function koRegistrar(boton){
  const msg = document.getElementById('koGuardarMsg');
  const sel = KO_DATOS.map(koCalcular).filter(r => koMarca.has(r.pozo) && r.ok);
  if (!sel.length){
    if (msg) msg.textContent = 'No hay unidades con datos suficientes para registrar.';
    return;
  }
  boton.disabled = true;
  boton.textContent = 'Registrando\u2026';
  let ok = 0;
  const fallas = [];
  for (const r of sel){
    try {
      await koEnviarPropuesta({
        pozo:         r.pozo,
        f_max:        Number(r.fProp.toFixed(1)),
        tap:          Number(r.tapNew.toFixed(0)),
        red:          (r.red   != null ? Number(r.red.toFixed(1))   : null),
        base_fecha:   r.u.fecha || null,
        f_max_previa: (r.u.f_max != null ? Number(r.u.f_max) : null),
        tap_previo:   (r.u.tap   != null ? Number(r.u.tap)   : null),
        kw_previo:    (r.kwAct != null ? Number(r.kwAct.toFixed(2)) : null),
        criterios:    koCriterios()
      });
      ok += 1;
    } catch(e){ fallas.push(r.pozo + ': ' + e.message); }
  }
  try { KO_DATOS = await koCargarUnidades(); } catch(e){}
  koPintar();
  const m2 = document.getElementById('koGuardarMsg');
  if (m2) m2.textContent = ok + ' de ' + sel.length + ' registradas'
    + (fallas.length ? '. Fallaron: ' + fallas.join(' \u00b7 ') : '.');
}

/* ---------- eventos ---------- */

function koEnlazar(){
  const m = document.getElementById('koModo');
  if (m) m.onchange = e => { koCfg.modo = e.target.value; koPintar(); };
  const k = document.getElementById('koK');
  if (k) k.onchange = e => {
    const n = Number(e.target.value);
    if (isFinite(n) && n >= 1) koCfg.kFiltro = n;
    koPintar();
  };
  const f = document.getElementById('koFp');
  if (f) f.onchange = e => {
    const n = Number(e.target.value);
    if (isFinite(n) && n > 0 && n <= 1) koCfg.fp = n;
    koPintar();
  };
  const ec = document.getElementById('koEsc');
  if (ec) ec.onchange = e => { koCfg.escalaCable = e.target.value === '1'; koPintar(); };
  const rz = document.getElementById('koRaiz');
  if (rz) rz.onchange = e => { koCfg.raiz = e.target.value; koPintar(); };

  const cs = document.getElementById('koCampoSel');
  if (cs) cs.onchange = e => { koCampo = e.target.value; koPad = 'all'; koPintar(); };
  const ps = document.getElementById('koPadSel');
  if (ps) ps.onchange = e => { koPad = e.target.value; koPintar(); };

  document.querySelectorAll('.ko-chip[data-f]').forEach(b => {
    b.onclick = () => { koFiltro = b.dataset.f; koPintar(); };
  });
  const bs = document.getElementById('koBus');
  if (bs){
    bs.oninput = e => {
      koBusca = e.target.value;
      const pos = e.target.selectionStart;
      koPintar();
      const n = document.getElementById('koBus');
      if (n){ n.focus(); n.setSelectionRange(pos, pos); }
    };
  }
  const sy = document.getElementById('koSync');
  if (sy) sy.onclick = () => koActualizar(sy);

  /* Navegacion dentro del mismo marco. Sirve igual como iframe de
     Kronos-M, dentro de la capa de Monitoreo y en pestana aparte,
     porque no depende de que exista un padre al que pedirle nada. */
  const sg = document.getElementById('koSeg');
  if (sg) sg.onclick = () => { window.location.href = 'seguimiento.html'; };

  const mt = document.getElementById('koMarcarTodas');
  if (mt) mt.onclick = () => {
    koAmbito(KO_DATOS.map(koCalcular)).forEach(r => koMarca.add(r.pozo));
    koPintar();
  };
  const lp = document.getElementById('koLimpiar');
  if (lp) lp.onclick = () => { koMarca.clear(); koPintar(); };

  const gb = document.getElementById('koGuardar');
  if (gb) gb.onclick = () => koRegistrar(gb);

  document.querySelectorAll('input[data-m]').forEach(cb => {
    cb.onchange = e => {
      const p = e.target.dataset.m;
      if (e.target.checked) koMarca.add(p); else koMarca.delete(p);
      koPintar();
    };
  });

  document.querySelectorAll('tr.cl').forEach(tr => {
    tr.onclick = () => { koSel = tr.dataset.p; window.scrollTo(0, 0); koPintar(); };
  });
  document.querySelectorAll('input.ko-f').forEach(inp => {
    inp.onchange = e => {
      const n = Number(e.target.value);
      const pz = e.target.dataset.p;
      const u = KO_DATOS.find(x => x.pozo === pz);
      /* Un tope fuera de 30-70 Hz no es una propuesta, es un dedazo. */
      if (isFinite(n) && n >= 30 && n <= 70) koProp[pz] = n;
      else delete koProp[pz];
      koPintar();
    };
  });
}

document.getElementById('koBack').onclick = () => { koSel = null; koPintar(); };

/* Cuando se abre desde Monitoreo de Condicion llegan campo y PAD en
   la direccion. Se aplican antes del primer pintado para que la
   pantalla no parpadee mostrando toda la flota. */
function koAplicarUrl(){
  try {
    const p = new URLSearchParams(window.location.search);
    const c = p.get('campo');
    const d = p.get('pad');
    if (c) koCampo = c;
    if (d) koPad = d;
  } catch(e){}
}

async function koArrancar(){
  koAplicarUrl();
  const v = document.getElementById('koVista');
  try {
    const par = await koCargarParametros();
    koAplicarParametros(par);
  } catch(e){
    /* Sin parametros el modulo sigue sirviendo con los valores por
       defecto; lo que no puede es quedarse en blanco. */
    console.warn('[Kronos-M] Parametros de optimizacion no disponibles:', e.message);
  }
  /* En paralelo con las unidades: no depende de ellas y su fallo no
     debe retrasar la pantalla. */
  koCargarVigencia();
  try {
    KO_DATOS = await koCargarUnidades();
  } catch(e){
    v.innerHTML = '<div class="ko-card"><div class="ko-vacio">'
      + 'No se pudieron cargar las unidades.<br>' + koEsc(e.message) + '</div></div>';
    return;
  }
  if (!KO_DATOS.length){
    v.innerHTML = '<div class="ko-card"><div class="ko-vacio">'
      + 'No hay unidades con dise&ntilde;o registrado.<br>Cargue primero el '
      + 'dise&ntilde;o el&eacute;ctrico desde el m&oacute;dulo de Instalaci&oacute;n '
      + 'y C&aacute;lculo de TAP.</div></div>';
    return;
  }
  koPintar();
}

koArrancar();
</script>
<script>
/* Reporte de scroll al contenedor de Kronos-M.
   Este archivo tambien se abre en pestana aparte y desde la capa de
   optimizacion; cuando no hay padre a quien avisar el bloque no hace
   nada. Solo sirve dentro del iframe: el boton del asistente vive en la
   pagina padre y sin este aviso no se entera de que aqui se esta bajando. */
(function () {
  if (window.parent === window) return;
  var ultimo = 0;
  window.addEventListener("scroll", function () {
    var y = window.scrollY || document.documentElement.scrollTop || 0;
    if (Math.abs(y - ultimo) < 4) return;
    ultimo = y;
    try { window.parent.postMessage({ tipo: "kx-scroll", y: y }, "*"); }
    catch (e) { /* origen distinto: se ignora */ }
  }, { passive: true });
})();
</script>
