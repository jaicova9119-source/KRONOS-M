function koPintarDetalle(){
  const u = KO_DATOS.find(x => x.pozo === koSel);
  if (!u){ koSel = null; return koPintar(); }
  const r = koCalcular(u);
  const v = document.getElementById('koVista');

  document.getElementById('koBack').style.display = 'block';
  document.getElementById('koTitulo').textContent = u.pozo;
  document.getElementById('koSub').textContent =
    u.vsd + ' \u00b7 ' + u.campo
    + (u.pad && u.pad !== '\u2014' ? ' \u00b7 ' + u.pad : '')
    + (u.filtro ? ' \u00b7 con filtro seno' : '');

  const p = (n, f, res, un) => '<div class="ko-p"><div class="n">' + n + '</div>'
    + '<div class="f">' + f + '</div><div class="r">' + res
    + (un ? '<small>' + un + '</small>' : '') + '</div></div>';

  let h = koConfig();

  if (!r.ok){
    h += '<div class="ko-card"><div class="ko-vacio">' + koEsc(koFalta(r))
      + '<br><br>El diseno electrico se completa en el modulo de Instalacion; '
      + 'las lecturas entran por la captura de campo.</div></div>';
    v.innerHTML = h;
    return koEnlazar();
  }

  const ent = [
    ['Frecuencia de operaci&oacute;n', u.f_op.toFixed(1) + ' Hz'],
    ['Frecuencia m&aacute;xima ajustada', u.f_max.toFixed(1) + ' Hz'],
    ['Carga del motor', (u.carga * 100).toFixed(0) + ' %'],
    ['Tensi&oacute;n de placa del motor', koEnt(u.v_placa) + ' V'],
    ['Corriente de placa', koEnt(u.i_placa) + ' A'],
    ['TAP del SUT instalado', u.tap != null ? u.tap.toFixed(0) + ' V' : '\u2014'],
    ['Tensi&oacute;n primaria nominal del SUT', (r.vNom || koCfg.vNom) + ' V'],
    ['Impedancia del SUT', r.zPct != null
      ? r.zPct.toFixed(2) + ' %'
        + (r.sut.z_temp != null ? ' @ ' + r.sut.z_temp.toFixed(0) + ' \u00b0C' : '')
        + (r.sut.kva != null ? ' \u00b7 ' + koEnt(r.sut.kva) + ' kVA' : '')
      : '<span class="ko-der">sin registrar</span>'],
    ['Ca&iacute;da de tensi&oacute;n en cable',
      r.cable.toFixed(0) + ' V (' + r.cableOrigen + ')'],
    ['Cable', (u.awg != null ? 'calibre #' + u.awg : 'calibre sin registrar')
      + (u.long_ft != null ? ' \u00b7 ' + u.long_ft.toFixed(0) + ' ft' : '')
      + (u.temp_f != null ? ' \u00b7 ' + u.temp_f.toFixed(0) + ' \u00b0F' : '')],
    ['Lectura', (u.fecha || 'sin fecha')
      + (u.fuente ? ' \u00b7 ' + u.fuente : '')],
    /* Enteros. Los valores llegan como promedio de la ronda y arrastran
       trece decimales que no significan nada: un megohmetro de campo no
       resuelve milesimas de amperio y la falsa precision resta
       credibilidad al numero que si importa. */
    ['Corriente en el variador', koEnt(u.i_vsd) + ' A'],
    ['Corriente del motor', koEnt(u.i_mot) + ' A'],
    ['Tensi&oacute;n medida en el SUT', koEnt(u.v_sut) + ' V'],
    ['Tensi&oacute;n de salida del variador',
      r.vVsdMed == null ? '\u2014'
        : koEnt(r.vVsdMed) + ' V'
          + (r.vVsdOrigen === 'implicada'
              ? ' <span class="ko-der">no medida &middot; implicada por el SUT</span>'
              : '')]
  ].map(x => '<tr><td style="text-align:left;color:var(--ko-t3)">' + x[0]
    + '</td><td style="color:var(--t1);font-weight:600">' + x[1] + '</td></tr>').join('');

  h += '<div class="ko-card"><div class="ct"><b>Entradas</b>'
    + '<span>&Uacute;ltima corrida cargada</span></div>'
    + '<table class="ko-t" style="max-width:460px"><tbody>' + ent
    + '</tbody></table></div>';

  h += '<div class="ko-card"><div class="ct"><b>Cadena de c&aacute;lculo</b>'
    + '<span>Frecuencia m&aacute;xima propuesta ' + r.fProp.toFixed(1) + ' Hz</span></div>'
    + '<div class="ko-cad">'
    + p('Factor de carga', 'tabla(' + (u.carga * 100).toFixed(0) + '%)',
        r.fCarga.toFixed(3), '')
    + p('Tensi&oacute;n &oacute;ptima motor @60 Hz', 'V placa x factor',
        r.vOpt60.toFixed(0), 'V')
    + p('Tensi&oacute;n &oacute;ptima superficie @60 Hz', '+ ca&iacute;da de cable',
        r.vSup60.toFixed(0), 'V')
    + p('TAP sin p&eacute;rdidas del SUT', 'V sup x F prop / 60',
        r.tapBase.toFixed(0), 'V')
    + (r.pSut != null
        ? p('P&eacute;rdidas en el SUT',
            r.sutMetodo === 'escalado_por_carga'
              ? 'Z ' + r.zEfect.toFixed(2) + '% x TAP'
              : 'Z de placa ' + r.zPct.toFixed(2) + '% x TAP',
            r.pSut.toFixed(0), 'V')
        : p('P&eacute;rdidas en el SUT', 'sin impedancia registrada',
            '\u2014', ''))
    + p('TAP &oacute;ptimo', 'TAP base + p&eacute;rdidas del SUT',
        r.tapOpt.toFixed(0), 'V')
    + p('Tensi&oacute;n &oacute;ptima @ F operaci&oacute;n', 'V sup x F ope / 60',
        r.vOptOp.toFixed(0), 'V')
    + p('TAP a solicitar', u.filtro
          ? 'TAP &oacute;ptimo x ' + koCfg.kFiltro.toFixed(2) + ' (filtro)'
          : 'igual al &oacute;ptimo (sin filtro)',
        r.tapNew.toFixed(0), 'V')
    + '</div>'
    + (r.pSut == null
        ? '<p class="ko-nota">Esta unidad no tiene la impedancia del SUT '
          + 'registrada, as&iacute; que el TAP sale calculado solo con la '
          + 'ca&iacute;da del cable. El transformador tambi&eacute;n cae, y esa '
          + 'omisi&oacute;n siempre empuja el TAP hacia abajo. Reg&iacute;strela '
          + 'abajo antes de emitir la propuesta.</p>'
        : '')
    + (r.tapFuera
        ? '<p class="ko-nota">El TAP a solicitar queda por '
          + (r.tapFuera === 'alto' ? 'encima del m&aacute;ximo'
                                   : 'debajo del m&iacute;nimo')
          + ' que tiene este transformador ('
          + koEnt(r.sut.tap_min) + ' a ' + koEnt(r.sut.tap_max) + ' V). '
          + 'No es ejecutable: hay que revisar el dise&ntilde;o, no el tap.</p>'
        : '');

  /* Lado del variador. Tres tensiones que se leen comparandolas entre
     si, no una por una. */
  if (r.vVsdMed != null || r.vVsdPatron != null){
    h += '<div class="ko-card"><div class="ct">'
      + '<b>Tensi&oacute;n en el lado del variador</b>'
      + '<span>referida por el SUT, relaci&oacute;n '
      + (r.rtSut != null ? r.rtSut.toFixed(2) : '\u2014') + '</span></div>'
      + '<div class="ko-cad">'
      + p('Entregada hoy', r.vVsdOrigen === 'medida'
            ? 'medida en la ronda'
            : 'no medida &middot; V sut / relaci&oacute;n',
          koEnt(r.vVsdMed), 'V')
      + (r.dVsdImp != null
          ? p('Contraste con el SUT', 'medida - (V sut / relaci&oacute;n)',
              koDelta(-r.dVsdImp, { mejor:'baja', dec:0, umbral:15 }), 'V')
          : '')
      + p('Seg&uacute;n curva V/Hz',
          koEnt(r.vMaxSal) + ' x ' + u.f_op.toFixed(1) + ' / ' + u.f_max.toFixed(1),
          koEnt(r.vVsdPatron), 'V')
      + p('Desviaci&oacute;n contra el patr&oacute;n',
          'medida - esperada',
          (r.dVsdPatron != null
            ? '<span class="ko-d" style="color:' + KO_HEX[koSemSalida(r.dVsdPatron)]
              + '">' + (r.dVsdPatron > 0 ? '+' : '') + koEnt(r.dVsdPatron) + '</span>'
            : '\u2014'), 'V')
      + p('Que necesita el motor', 'V &oacute;ptima @F ope / relaci&oacute;n',
          koEnt(r.vVsdNec), 'V')
      + '</div>'
      + koLecturaVsd(r)
      + '</div>';
  }

  h += '<div class="ko-cad" style="margin-top:9px">'
    + p('Acci&oacute;n sobre el TAP', 'contra el &oacute;ptimo',
        koAccionTap(r.dTap), '')
    + p('Desviaci&oacute;n de tensi&oacute;n', '| V medida - V &oacute;ptima |',
        koEnt(r.dVol), 'V')
    + (r.rtNew != null
        ? p('Relaci&oacute;n de transformaci&oacute;n', 'actual '
            + r.rtAct.toFixed(2) + ' \u2192 nueva', r.rtNew.toFixed(2), '')
        : '')
    + (r.dAmp != null
        ? p('Corriente del variador', 'A variador - RT nueva x A motor',
            koDelta(r.dAmp, { mejor:'baja', dec:0, umbral:0.5 }), 'A')
        : '')
    + (r.red != null
        ? p('Consumo', (koCfg.raiz === 'sqrt3' ? '&radic;3' : '3^(1/3)')
            + ' x &Delta;A x V nom x FP / 1000',
            koDelta(r.red, { mejor:'baja', dec:1, umbral:0.5 }), 'kW')
        : '')
    + '</div>';

  /* De donde salio la caida de cable. Es la entrada menos visible
     del calculo y la que mas mueve el resultado, asi que se muestra
     desarmada en vez de como un numero suelto. */
  h += '<div class="ko-card"><div class="ct"><b>Ca&iacute;da de tensi&oacute;n en el cable</b>'
    + '<span>' + koEsc(r.cableOrigen) + '</span></div><div class="ko-cad">'
    + (r.cvd != null
        ? p('CVD', 'tabla(' + u.i_placa.toFixed(0) + ' A, calibre #' + u.awg + ')',
            r.cvd.toFixed(1), 'V/1000ft') : '')
    + (r.tcf != null
        ? p('TCF', 'tabla(' + u.temp_f.toFixed(0) + ' \u00b0F)', r.tcf.toFixed(3), '') : '')
    + p('Ca&iacute;da', r.cvd != null ? 'longitud x CVD / 1000 x TCF' : 'valor registrado',
        r.cable.toFixed(0), 'V')
    + '</div>'
    + '<p class="ko-nota">No se escala con la frecuencia: depende de la corriente, '
    + 'no de la velocidad.</p></div>';

  /* Perdidas totales, desarmadas. La del cable ya estaba; la del SUT es
     nueva y del mismo orden de magnitud, asi que se muestran juntas para
     que se vea el peso relativo. */
  if (r.pSut != null){
    h += '<div class="ko-card"><div class="ct">'
      + '<b>P&eacute;rdidas en el transformador</b><span>m&eacute;todo '
      + (r.sutMetodo === 'escalado_por_carga' ? 'escalado por carga' : 'conservador')
      + '</span></div><div class="ko-cad">'
      + (r.sOper != null
          ? p('Potencia de operaci&oacute;n', 'V sec x I motor x &radic;3 / 1000',
              r.sOper.toFixed(0), 'kVA') : '')
      + (r.sOper != null
          ? p('Impedancia efectiva', 'Z placa x (kVA oper / kVA nom)',
              r.zEfect.toFixed(2), '%') : '')
      + p('Ca&iacute;da en el SUT', 'Z efectiva x TAP', r.pSut.toFixed(0), 'V')
      + p('P&eacute;rdidas totales', 'cable + SUT', r.pTotal.toFixed(0), 'V')
      + '</div><p class="ko-nota">'
      + (r.sutMetodo === 'escalado_por_carga'
          ? 'El m&eacute;todo escalado corrige la Z de placa por la carga real '
            + 'del transformador. Refleja mejor la operaci&oacute;n y evita subir '
            + 'un tap sin necesidad, pero protege menos que el conservador.'
          : 'Se us&oacute; la Z de placa completa, que corresponde a la '
            + 'ca&iacute;da a plena carga nominal. Un SUT casi siempre trabaja '
            + 'por debajo de sus kVA, as&iacute; que el resultado es '
            + 'conservador. Registrando los kVA del transformador se habilita '
            + 'el m&eacute;todo escalado por carga.')
      + ' El m&eacute;todo usado queda guardado con la propuesta.</p></div>';
  }

  /* Verificacion de frecuencia maxima. Es lo que hace defendible la
     propuesta frente a quien la aprueba. */
  if (r.fMaxProp != null){
    const semM = r.margen == null ? 'null'
               : r.margen >= 2 ? 'ok' : r.margen >= 0 ? 'warn' : 'crit';
    h += '<div class="ko-card"><div class="ct">'
      + '<b>Frecuencia m&aacute;xima alcanzable</b>'
      + '<span>(TAP &minus; p&eacute;rdidas) x 60 / V placa</span></div>'
      + '<div class="ko-cad">'
      + (r.fMaxAct != null
          ? p('Con el TAP instalado', koEnt(u.tap) + ' V &minus; '
              + r.pTotalAct.toFixed(0) + ' V p&eacute;rdidas',
              r.fMaxAct.toFixed(1), 'Hz') : '')
      + p('Con el TAP propuesto', koEnt(r.tapNew) + ' V &minus; '
          + r.pTotalProp.toFixed(0) + ' V p&eacute;rdidas',
          r.fMaxProp.toFixed(1), 'Hz')
      + p('Margen sobre la propuesta', 'F m&aacute;x &minus; F propuesta '
          + r.fProp.toFixed(1) + ' Hz',
          '<span class="ko-d" style="color:' + KO_HEX[semM] + '">'
          + (r.margen > 0 ? '+' : '') + r.margen.toFixed(1) + '</span>', 'Hz')
      + '</div><p class="ko-nota">'
      + (r.cortoHoy != null && r.cortoHoy > 0
          ? 'Con el TAP que tiene hoy, esta unidad no puede sostener la '
            + 'relaci&oacute;n V/Hz por encima de ' + r.fMaxAct.toFixed(1)
            + ' Hz, y est&aacute; corriendo a ' + u.f_op.toFixed(1)
            + '. El motor est&aacute; subtensionado ahora mismo. '
          : '')
      + (r.margen == null ? ''
         : r.margen >= 2
           ? 'El margen cumple el criterio de campo de 2 a 3 Hz.'
           : r.margen >= 0
             ? 'El margen es menor a 2 Hz: al primer ajuste de frecuencia '
               + 'hacia arriba el tap vuelve a quedar corto. Conviene subir '
               + 'un tap, que aporta del orden de 3 Hz.'
             : 'El TAP propuesto no alcanza la frecuencia propuesta. Suba un '
               + 'tap y vuelva a verificar.')
      + '</p></div>';
  }

  /* Setpoints. Separados por lado del transformador a proposito: es
     donde se comete el error que descuadra un ADV recien configurado. */
  if (r.spOverload != null){
    const esAdv = /advantage|adv/i.test(u.vsd || '');
    h += '<div class="ko-card"><div class="ct">'
      + '<b>Setpoints a reprogramar</b><span>relaci&oacute;n nueva '
      + r.rtNew.toFixed(2) + '</span></div>'
      + '<div class="ko-cad">'
      + p('Volts at 60 Hz', 'V sec @60 / relaci&oacute;n',
          r.spVolts60.toFixed(0), 'V')
      + p('VClamp', 'Volts60 x F prop / 60'
          + (r.spVClampTope ? ' &middot; topado' : ''),
          r.spVClamp.toFixed(0), 'V')
      + p('Hi Speed Clamp', 'la menor entre F m&aacute;x y F aplicaci&oacute;n',
          r.spHiSpeed.toFixed(1), 'Hz')
      + p('Overload', 'A placa x relaci&oacute;n', r.spOverload.toFixed(0), 'A')
      + p('Run ILimit', 'A placa x relaci&oacute;n x 1,05',
          r.spRunI.toFixed(0), 'A')
      + p('Sync ILimit', 'A placa x relaci&oacute;n x 1,25',
          r.spSyncI.toFixed(0), 'A')
      + p('kVA requeridos', 'V sec x A placa x &radic;3 / 1000',
          r.kvaReq.toFixed(0), 'kVA')
      + '</div><p class="ko-nota">'
      + 'Al cambiar el tap cambia la relaci&oacute;n, y con ella todas las '
      + 'protecciones que se digitan del lado del variador. Un cambio de tap '
      + 'sin reescalarlas deja el motor sin protecci&oacute;n de sobrecarga, o '
      + 'disparando sin causa. '
      + (esAdv
          ? 'En esta unidad, que es Advantage: Overload y los dos ILimit van '
            + 'multiplicados como aparecen arriba, pero Load Setup (Mtr Nmplt '
            + 'Cur, Motor Mag Cur) va del lado del MOTOR, sin multiplicar. Y '
            + 'Act Xfmr Tap debe digitarse con el tap que quede f&iacute;sicamente '
            + 'seleccionado: sin eso el variador no conoce la relaci&oacute;n real '
            + 'y lo que muestra en pantalla queda mintiendo.'
          : 'Si la unidad es GCS, todo va multiplicado por la relaci&oacute;n, '
            + 'incluido Load Setup. Si es Advantage, Load Setup va del lado del '
            + 'motor sin multiplicar y hay que digitar Act Xfmr Tap.')
      + '</p></div>';
  }

  /* Captura de la placa del SUT. Va en la pantalla de la unidad y no en
     un modulo aparte porque el momento en que hace falta el dato es
     justo este: cuando alguien esta mirando la propuesta. */
  const sv = r.sut || {};
  const ci = (id, et, val, paso) =>
    '<div class="g"><label>' + et + '</label>'
    + '<input id="' + id + '" type="number" step="' + paso + '" value="'
    + (val != null ? val : '') + '"></div>';

  h += '<div class="ko-card"><div class="ct"><b>Placa del SUT</b><span>'
    + (sv.fecha
        ? 'capturado ' + koEsc(String(sv.fecha).slice(0, 10))
          + (sv.por ? ' \u00b7 ' + koEsc(sv.por) : '')
        : 'sin capturar') + '</span></div>'
    + '<div class="ko-cfg">'
    + ci('koSutZ', 'Impedancia Zcc (%)', sv.z_pct, '0.01')
    + ci('koSutT', 'Referida a (\u00b0C)', sv.z_temp, '1')
    + ci('koSutKva', 'Potencia (kVA)', sv.kva, '1')
    + ci('koSutTmin', 'Tap m&iacute;nimo (V)', sv.tap_min, '1')
    + ci('koSutTmax', 'Tap m&aacute;ximo (V)', sv.tap_max, '1')
    + '<div class="g"><label>Fuente</label>'
    +   '<input id="koSutF" type="text" value="' + koEsc(sv.fuente || '') + '"></div>'
    + '</div>'
    + '<p class="ko-nota">Estos datos est&aacute;n en la placa del '
    + 'transformador y en su descripci&oacute;n t&eacute;cnica en el '
    + 'm&oacute;dulo de activos. La impedancia habilita el t&eacute;rmino de '
    + 'p&eacute;rdidas del transformador; los kVA habilitan adem&aacute;s el '
    + 'm&eacute;todo escalado por carga; el rango de taps permite verificar '
    + 'que el TAP propuesto exista de verdad en este equipo. '
    + 'Nada de esto se estima: en blanco, el c&aacute;lculo lo dice.</p>'
    + '<div style="display:flex;gap:10px;align-items:center;margin-top:4px">'
    + '<button class="ko-chip on" id="koSutGuardar" data-p="' + koEsc(u.pozo)
    + '">Guardar placa del SUT</button>'
    + '<span class="ko-nota" id="koSutMsg" style="margin:0"></span></div></div>';

  const pr = r.u.prop_estado
    ? '<div class="ko-card"><div class="ct"><b>Propuesta vigente</b><span>'
      + koEsc(r.u.prop_estado) + '</span></div>'
      + '<p class="ko-nota" style="margin:0">Registrada para '
      + (r.u.prop_f_max != null ? r.u.prop_f_max.toFixed(1) + ' Hz' : 'sin frecuencia')
      + '. Marque la unidad en el listado para volver a registrarla con otros valores.</p></div>'
    : '';
  h += pr;

  v.innerHTML = h;
  koEnlazar();
}

/* Sincronizar y recargar. Se informa cuantas lecturas entraron y
   cuantas unidades quedaron sin carga por no tener corriente de
   placa registrada, que es el faltante que mas se repite. */
async function koActualizar(boton){
  const previo = boton.textContent;
  boton.disabled = true;
  boton.textContent = 'Actualizando\u2026';
  try {
    const r = await koSincronizar();
    KO_DATOS = await koCargarUnidades();
    koPintar();
    const m = document.getElementById('koGuardarMsg');
    const txt = (r.lecturas || 0) + ' lecturas actualizadas'
      + (r.sin_diseno ? ' \u00b7 ' + r.sin_diseno + ' con ronda pero sin dise\u00f1o' : '')
      + (r.sin_carga ? ' \u00b7 ' + r.sin_carga + ' sin carga por falta de placa' : '');
    if (m) m.textContent = txt;
    else console.info('[Kronos-M] ' + txt);
  } catch(e){
    boton.disabled = false;
    boton.textContent = previo;
    const v = document.getElementById('koVista');
    if (v) v.insertAdjacentHTML('afterbegin',
      '<div class="ko-card"><div class="ko-vacio">No se pudo actualizar.<br>'
      + koEsc(e.message) + '</div></div>');
  }
}

/* Registrar es un acto, no un dibujo: se bloquea el boton, se
   informa cuantas quedaron y se recargan las unidades para que la
   pantalla muestre la propuesta vigente real y no la que se supone
   que quedo. */
async function koRegistrar(boton){
  const msg = document.getElementById('koGuardarMsg');
  const sel = KO_DATOS.map(koCalcular).filter(r => koMarca.has(r.pozo) && r.ok);
  if (!sel.length){
    if (msg) msg.textContent = 'No hay unidades con datos suficientes para registrar.';
    return;
  }
  boton.disabled = true;
  boton.textContent = 'Registrando\u2026';
  let ok = 0;
  const fallas = [];
  for (const r of sel){
    try {
      await koEnviarPropuesta({
        pozo:         r.pozo,
        f_max:        Number(r.fProp.toFixed(1)),
        tap:          Number(r.tapNew.toFixed(0)),
        red:          (r.red   != null ? Number(r.red.toFixed(1))   : null),
        base_fecha:   r.u.fecha || null,
        f_max_previa: (r.u.f_max != null ? Number(r.u.f_max) : null),
        tap_previo:   (r.u.tap   != null ? Number(r.u.tap)   : null),
        kw_previo:    (r.kwAct != null ? Number(r.kwAct.toFixed(2)) : null),
        /* Los criterios globales mas lo que es propio de esta unidad. El
           procedimiento exige declarar cual metodo de perdidas del SUT se
           uso: sin eso, dos propuestas con el mismo TAP pueden venir de
           cuentas distintas y nadie puede auditarlas despues. */
        criterios:    Object.assign(koCriterios(), {
          sut_metodo:     r.sutMetodo,
          sut_z_pct:      r.zPct,
          sut_z_efectiva: (r.zEfect != null ? Number(r.zEfect.toFixed(2)) : null),
          sut_kva:        r.sutKva != null ? r.sutKva : null,
          perdida_cable_v: Number(r.cable.toFixed(0)),
          perdida_sut_v:  (r.pSut != null ? Number(r.pSut.toFixed(0)) : null),
          f_max_alcanzable: (r.fMaxProp != null ? Number(r.fMaxProp.toFixed(1)) : null),
          margen_hz:      (r.margen != null ? Number(r.margen.toFixed(1)) : null),
          setpoints: (r.spOverload != null ? {
            volts_60:      Number(r.spVolts60.toFixed(0)),
            vclamp:        Number(r.spVClamp.toFixed(0)),
            hi_speed:      Number(r.spHiSpeed.toFixed(1)),
            overload:      Number(r.spOverload.toFixed(0)),
            run_ilimit:    Number(r.spRunI.toFixed(0)),
            sync_ilimit:   Number(r.spSyncI.toFixed(0)),
            kva_requeridos: Number(r.kvaReq.toFixed(0))
          } : null)
        })
      });
      ok += 1;
    } catch(e){ fallas.push(r.pozo + ': ' + e.message); }
  }
  try { KO_DATOS = await koCargarUnidades(); } catch(e){}
  koPintar();
  const m2 = document.getElementById('koGuardarMsg');
  if (m2) m2.textContent = ok + ' de ' + sel.length + ' registradas'
    + (fallas.length ? '. Fallaron: ' + fallas.join(' \u00b7 ') : '.');
}

/* ---------- eventos ---------- */

function koEnlazar(){
  const m = document.getElementById('koModo');
  if (m) m.onchange = e => { koCfg.modo = e.target.value; koPintar(); };
  const k = document.getElementById('koK');
  if (k) k.onchange = e => {
    const n = Number(e.target.value);
    if (isFinite(n) && n >= 1) koCfg.kFiltro = n;
    koPintar();
  };
  const f = document.getElementById('koFp');
  if (f) f.onchange = e => {
    const n = Number(e.target.value);
    if (isFinite(n) && n > 0 && n <= 1) koCfg.fp = n;
    koPintar();
  };
  const ec = document.getElementById('koEsc');
  if (ec) ec.onchange = e => { koCfg.escalaCable = e.target.value === '1'; koPintar(); };
  const rz = document.getElementById('koRaiz');
  if (rz) rz.onchange = e => { koCfg.raiz = e.target.value; koPintar(); };

  const sg2 = document.getElementById('koSutGuardar');
  if (sg2) sg2.onclick = async () => {
    const msg = document.getElementById('koSutMsg');
    const val = id => {
      const el = document.getElementById(id);
      if (!el) return null;
      const t = String(el.value || '').trim();
      if (t === '') return null;
      const n = Number(t.replace(',', '.'));
      return isFinite(n) ? n : null;
    };
    const ft = document.getElementById('koSutF');
    sg2.disabled = true;
    const previo = sg2.textContent;
    sg2.textContent = 'Guardando\u2026';
    try {
      const res = await koGuardarSut(sg2.dataset.p, {
        z_pct:   val('koSutZ'),
        z_temp:  val('koSutT'),
        kva:     val('koSutKva'),
        tap_min: val('koSutTmin'),
        tap_max: val('koSutTmax'),
        fuente:  ft ? String(ft.value || '').trim() : null
      });
      koPintar();
      const m2 = document.getElementById('koSutMsg');
      if (m2) m2.textContent = res && res.metodo === 'escalado_por_carga'
        ? 'Guardado. Queda habilitado el m\u00e9todo escalado por carga.'
        : res && res.metodo === 'conservador'
          ? 'Guardado. Con los kVA del SUT se habilita el m\u00e9todo escalado por carga.'
          : 'Guardado. Sin impedancia el c\u00e1lculo sigue sin el t\u00e9rmino del SUT.';
    } catch(e){
      sg2.disabled = false;
      sg2.textContent = previo;
      if (msg) msg.textContent = e.message;
    }
  };

  const cs = document.getElementById('koCampoSel');
  if (cs) cs.onchange = e => { koCampo = e.target.value; koPad = 'all'; koPintar(); };
  const ps = document.getElementById('koPadSel');
  if (ps) ps.onchange = e => { koPad = e.target.value; koPintar(); };

  document.querySelectorAll('.ko-chip[data-f]').forEach(b => {
    b.onclick = () => { koFiltro = b.dataset.f; koPintar(); };
  });
  const bs = document.getElementById('koBus');
  if (bs){
    bs.oninput = e => {
      koBusca = e.target.value;
      const pos = e.target.selectionStart;
      koPintar();
      const n = document.getElementById('koBus');
      if (n){ n.focus(); n.setSelectionRange(pos, pos); }
    };
  }
  const sy = document.getElementById('koSync');
  if (sy) sy.onclick = () => koActualizar(sy);

  /* Navegacion dentro del mismo marco. Sirve igual como iframe de
     Kronos-M, dentro de la capa de Monitoreo y en pestana aparte,
     porque no depende de que exista un padre al que pedirle nada. */
  const xl = document.getElementById('koExcel');
  if (xl) xl.onclick = () => koExportar(xl);

  const sg = document.getElementById('koSeg');
  if (sg) sg.onclick = () => { window.location.href = 'seguimiento.html'; };

  const mt = document.getElementById('koMarcarTodas');
  if (mt) mt.onclick = () => {
    koAmbito(KO_DATOS.map(koCalcular)).forEach(r => koMarca.add(r.pozo));
    koPintar();
  };
  const lp = document.getElementById('koLimpiar');
  if (lp) lp.onclick = () => { koMarca.clear(); koPintar(); };

  const gb = document.getElementById('koGuardar');
  if (gb) gb.onclick = () => koRegistrar(gb);

  document.querySelectorAll('input[data-m]').forEach(cb => {
    cb.onchange = e => {
      const p = e.target.dataset.m;
      if (e.target.checked) koMarca.add(p); else koMarca.delete(p);
      koPintar();
    };
  });

  document.querySelectorAll('tr.cl').forEach(tr => {
    tr.onclick = () => { koSel = tr.dataset.p; window.scrollTo(0, 0); koPintar(); };
  });
  document.querySelectorAll('input.ko-f').forEach(inp => {
    inp.onchange = e => {
      const n = Number(e.target.value);
      const pz = e.target.dataset.p;
      const u = KO_DATOS.find(x => x.pozo === pz);
      /* Un tope fuera de 30-70 Hz no es una propuesta, es un dedazo. */
      if (isFinite(n) && n >= 30 && n <= 70) koProp[pz] = n;
      else delete koProp[pz];
      koPintar();
    };
  });
}

document.getElementById('koBack').onclick = () => { koSel = null; koPintar(); };

/* Cuando se abre desde Monitoreo de Condicion llegan campo y PAD en
   la direccion. Se aplican antes del primer pintado para que la
   pantalla no parpadee mostrando toda la flota. */
function koAplicarUrl(){
  try {
    const p = new URLSearchParams(window.location.search);
    const c = p.get('campo');
    const d = p.get('pad');
    if (c) koCampo = c;
    if (d) koPad = d;
  } catch(e){}
}

async function koArrancar(){
  koAplicarUrl();
  const v = document.getElementById('koVista');
  try {
    const par = await koCargarParametros();
    koAplicarParametros(par);
  } catch(e){
    /* Sin parametros el modulo sigue sirviendo con los valores por
       defecto; lo que no puede es quedarse en blanco. */
    console.warn('[Kronos-M] Parametros de optimizacion no disponibles:', e.message);
  }
  /* En paralelo con las unidades: no depende de ellas y su fallo no
     debe retrasar la pantalla. */
  koCargarVigencia();
  koCargarSalidaVsd();
  await koCargarSut();
  try {
    KO_DATOS = await koCargarUnidades();
  } catch(e){
    v.innerHTML = '<div class="ko-card"><div class="ko-vacio">'
      + 'No se pudieron cargar las unidades.<br>' + koEsc(e.message) + '</div></div>';
    return;
  }
  if (!KO_DATOS.length){
    v.innerHTML = '<div class="ko-card"><div class="ko-vacio">'
      + 'No hay unidades con dise&ntilde;o registrado.<br>Cargue primero el '
      + 'dise&ntilde;o el&eacute;ctrico desde el m&oacute;dulo de Instalaci&oacute;n '
      + 'y C&aacute;lculo de TAP.</div></div>';
    return;
  }
  koPintar();
}

koArrancar();
</script>
<script>
/* Reporte de scroll al contenedor de Kronos-M.
   Este archivo tambien se abre en pestana aparte y desde la capa de
   optimizacion; cuando no hay padre a quien avisar el bloque no hace
   nada. Solo sirve dentro del iframe: el boton del asistente vive en la
   pagina padre y sin este aviso no se entera de que aqui se esta bajando. */
(function () {
  if (window.parent === window) return;
  var ultimo = 0;
  window.addEventListener("scroll", function () {
    var y = window.scrollY || document.documentElement.scrollTop || 0;
    if (Math.abs(y - ultimo) < 4) return;
    ultimo = y;
    try { window.parent.postMessage({ tipo: "kx-scroll", y: y }, "*"); }
    catch (e) { /* origen distinto: se ignora */ }
  }, { passive: true });
})();
</script>
