</head>
<body>

<div class="ko-top">
  <div>
    <h1 id="koTitulo">Optimizaci&oacute;n Energ&eacute;tica</h1>
    <p class="sub" id="koSub">Propuesta de cambio de TAP por condici&oacute;n de operaci&oacute;n</p>
  </div>
  <button class="ko-back" id="koBack">&larr; Volver al listado</button>
</div>

<div class="ko-wrap" id="koVista">
  <div class="ko-card"><div class="ko-vacio">Cargando&hellip;</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   CONEXION
   Las credenciales se heredan de Kronos-M: este archivo corre en
   un iframe del mismo origen. Al abrirse en pestana aparte el
   padre es window.opener. Es el mismo patron de condicion.html,
   para que la sesion sea una sola y no aparezca el aviso de
   multiples instancias de GoTrue.
   ============================================================ */
function koCredencial(nombre){
  const f = koVentanas();
  for (var i = 0; i < f.length; i++){
    try {
      var v = f[i][nombre];
      if (v && String(v).indexOf('PEGAR_AQUI') !== 0) return v;
    } catch(e){}
  }
  return null;
}

/* Ventanas donde puede estar el cliente ya autenticado. Importa el
   orden y que suba varios niveles: este modulo se abre tanto como
   iframe directo de Kronos-M como dentro de la capa de Monitoreo de
   Condicion, que a su vez es otro iframe. */
function koVentanas(){
  const v = [];
  let w = window;
  for (let i = 0; i < 4; i++){
    try {
      if (w.parent && w.parent !== w){ w = w.parent; v.push(w); }
      else break;
    } catch(e){ break; }
  }
  try { if (window.opener) v.push(window.opener); } catch(e){}
  try { if (window.top && v.indexOf(window.top) < 0) v.push(window.top); } catch(e){}
  return v;
}

let koSb = null;
function koCliente(){
  if (koSb) return koSb;
  const f = koVentanas();
  for (var i = 0; i < f.length; i++){
    for (const n of ['sb', 'kpSb', 'supabaseClient']){
      try { if (f[i][n] && f[i][n].rpc) { koSb = f[i][n]; return koSb; } } catch(e){}
    }
  }
  const url = koCredencial('SUPABASE_URL');
  const key = koCredencial('SUPABASE_ANON_KEY');
  if (!url || !key)
    throw new Error('No se pudo tomar la conexion de Kronos-M. '
      + 'Recarga con Ctrl+Shift+R; si window.sb sigue en undefined, '
      + 'el index.html desplegado es anterior a este modulo.');
  koSb = window.supabase.createClient(url, key);
  return koSb;
}

/* ============================================================
   CAPA DE DATOS
   Unico punto que toca la base.
   ============================================================ */
/* El campo y el PAD vienen de la flota, no de opt_unidades. Se
   cruzan por codigo de pozo aqui y no en SQL: dp_bes_lista() no
   expone columnas nombradas a un join, pero desde el navegador
   entrega objetos con campo y pad, que es como ya la consume
   Monitoreo de Condicion. Si falla, el modulo sigue funcionando
   sin los dos filtros en lugar de quedarse en blanco. */
async function koCargarFlota(){
  try {
    const { data, error } = await koCliente().rpc('dp_bes_lista');
    if (error) throw new Error(error.message);
    const m = {};
    (data || []).forEach(r => {
      if (r && r.pozo) m[r.pozo] = {
        campo: r.campo || '\u2014',
        pad:   r.pad   || '\u2014',
        marca: r.marca_variador || null
      };
    });
    return m;
  } catch(e){
    console.warn('[Kronos-M] Flota no disponible:', e.message);
    return {};
  }
}

async function koCargarUnidades(){
  const [flota, res] = await Promise.all([
    koCargarFlota(),
    koCliente().rpc('opt_unidades')
  ]);
  const { data, error } = res;
  if (error) throw new Error(error.message);
  return (data || []).map(r => {
    const f = flota[r.pozo] || {};
    return {
    pozo:   r.pozo,
    campo:  f.campo || '\u2014',
    pad:    f.pad   || '\u2014',
    vsd:    r.vsd || f.marca || '\u2014',
    /* Del diseno */
    v_placa: koNum(r.v_placa_v),
    i_placa: koNum(r.i_placa_a),
    tap:     koNum(r.tap_sut_v),
    v_nom:   koNum(r.v_nom_variador_v),
    awg:     koNum(r.awg),
    long_ft: koNum(r.longitud_ft),
    temp_f:  koNum(r.temp_pozo_f),
    filtro:  !!r.filtro_seno,
    k_filtro: koNum(r.k_filtro),
    /* La caida medida en campo manda sobre la calculada. */
    cable_medido: koNum(r.caida_cable_v),
    /* De la lectura mas reciente */
    fecha:   r.lectura_fecha || null,
    fuente:  r.lectura_fuente || null,
    f_op:    koNum(r.f_op_hz),
    f_max:   koNum(r.f_max_hz) != null ? koNum(r.f_max_hz) : koNum(r.f_max_diseno_hz),
    carga:   koNum(r.carga_motor),
    i_vsd:   koNum(r.i_vsd_a),
    i_mot:   koNum(r.i_motor_a),
    v_sut:   koNum(r.v_sut_v),
    /* Propuesta vigente, si hay */
    prop_f_max: koNum(r.propuesta_f_max),
    prop_estado: r.propuesta_estado || null
    };
  });
}

/* Fecha de instalacion del motor vigente, por unidad. Si la lectura es
   anterior, los calculos corresponden a un motor que ya no esta: fue el
   caso de CYC-16, que reportaba carga al 120% y una reduccion negativa
   de 163 kW sobre un equipo que ya se habia cambiado.

   Si la funcion no existe o falla, no se marca nada. El chequeo mejora
   la lectura de los datos; no puede ser motivo de que el modulo no
   abra. */
let KO_VIGENCIA = {};

/* Tension de salida del variador MEDIDA en la ronda. opt_unidades no la
   expone, asi que se pide aparte. Antes se deducia del SUT, y deducir
   un dato que se mide es perder justo lo que la medida aporta: el error
   de regulacion real del variador. */
let KO_SALIDA = {};

async function koCargarSalidaVsd(){
  try {
    const { data, error } = await koCliente().rpc('opt_salida_vsd');
    if (error) throw new Error(error.message);
    const m = {};
    (data || []).forEach(r => {
      if (r && r.pozo) m[r.pozo] = {
        v_vsd: koNum(r.v_salida_vsd),
        v_sut: koNum(r.v_sut_v),
        /* Maxima que el variador entrega a su frecuencia maxima. Es
           distinta de la primaria nominal del SUT: en los PWM son 450
           contra 480, y no es igual en todas las unidades. Vacia
           significa que se cae a la nominal del SUT, que es lo que se
           venia haciendo. */
        v_max: koNum(r.v_max_salida_vsd_v),
        v_nom: koNum(r.v_nom_variador_v),
        fecha: r.fecha || null
      };
    });
    KO_SALIDA = m;
  } catch(e){
    console.warn('[Kronos-M] Salida del variador no disponible:', e.message);
    KO_SALIDA = {};
  }
}

/* Datos de placa del SUT. El transformador tambien produce una caida
   de tension, declarada en su placa como impedancia de cortocircuito, y
   hasta ahora el calculo la ignoraba: solo sumaba la del cable. No es un
   termino menor. En el ejemplo resuelto del procedimiento de RETAP son
   181 V de 356 V totales, o sea la mitad.

   Omitirla sesga el TAP propuesto siempre hacia abajo, que es justo el
   escenario que hace aparecer XLIM en un Advantage: el tap queda corto y
   el variador recorta tension intentando compensar.

   El dato se digita a mano desde esta misma pantalla. No se estima y no
   tiene valor por defecto: sin impedancia el modulo calcula con cable
   solamente y lo dice. */
let KO_SUT = {};

async function koCargarSut(){
  try {
    const { data, error } = await koCliente().rpc('opt_sut');
    if (error) throw new Error(error.message);
    const m = {};
    (data || []).forEach(r => {
      if (r && r.pozo) m[r.pozo] = {
        z_pct:   koNum(r.z_pct),
        z_temp:  koNum(r.z_temp_ref_c),
        kva:     koNum(r.kva),
        tap_min: koNum(r.tap_min_v),
        tap_max: koNum(r.tap_max_v),
        fuente:  r.fuente || null,
        fecha:   r.fecha || null,
        por:     r.capturado_por || null,
        metodo:  r.metodo || 'sin_impedancia'
      };
    });
    KO_SUT = m;
  } catch(e){
    console.warn('[Kronos-M] Datos del SUT no disponibles:', e.message);
    KO_SUT = {};
  }
}

/* Guarda la placa del SUT de una unidad. Se recarga el mapa completo en
   vez de parchear la entrada local: si el servidor rechazo algo, la
   pantalla debe mostrar lo que quedo guardado y no lo que se digito. */
async function koGuardarSut(pozo, vals){
  const { data, error } = await koCliente().rpc('opt_guardar_sut', {
    p_pozo:       pozo,
    p_z_pct:      vals.z_pct,
    p_z_temp_ref: vals.z_temp,
    p_kva:        vals.kva,
    p_tap_min:    vals.tap_min,
    p_tap_max:    vals.tap_max,
    p_fuente:     vals.fuente || null
  });
  if (error) throw new Error(error.message);
  if (data && data.ok === false) throw new Error(data.error || 'No se pudo guardar');
  await koCargarSut();
  return data;
}

async function koCargarVigencia(){
  try {
    const { data, error } = await koCliente().rpc('opt_vigencia_equipo');
    if (error) throw new Error(error.message);
    const m = {};
    (data || []).forEach(r => {
      if (r && r.pozo) m[r.pozo] = {
        instalado: r.motor_instalado_el || null,
        serial: r.motor_serial || null,
        previos: r.motores_previos || 0
      };
    });
    KO_VIGENCIA = m;
  } catch(e){
    console.warn('[Kronos-M] Vigencia de equipo no disponible:', e.message);
    KO_VIGENCIA = {};
  }
}

/* Devuelve la fecha de instalacion si la lectura es anterior a ella; si
   no, null. Sin fecha de instalacion registrada no se puede comparar y
   no se marca: en las unidades de inyeccion ese dato esta vacio. */
function koDatoViejo(u){
  const v = KO_VIGENCIA[u.pozo];
  if (!v || !v.instalado || !u.fecha) return null;
  return u.fecha < v.instalado ? v.instalado : null;
}

async function koCargarParametros(){
  const { data, error } = await koCliente().rpc('opt_parametros');
  if (error) throw new Error(error.message);
  return data || {};
}

/* Trae a opt_lectura la ultima ronda util de cada unidad. Es lo
   que reemplaza la importacion desde Excel: se corre cuando entren
   rondas nuevas y las propuestas quedan sobre lo medido. */
async function koSincronizar(){
  const { data, error } = await koCliente().rpc('opt_sincronizar_lecturas');
  if (error) throw new Error(error.message);
  if (data && data.ok === false) throw new Error(data.error || 'No se pudo sincronizar');
  return data || {};
}

/* La propuesta viaja con su linea base congelada. Sin la fecha de
   la lectura, el TAP y la frecuencia que tenia la unidad, y el kW
   que se calculo sobre ella, no hay contra que medir el ahorro
   real: la lectura que sustento el calculo deja de ser la mas
   reciente en cuanto entra la siguiente ronda.

   Los criterios van tambien porque tres de ellos siguen sin
   decidirse y son editables en pantalla. Una propuesta de hoy y
   otra de dentro de tres meses solo son comparables si se sabe con
   que criterio salio cada una. */
async function koEnviarPropuesta(p){
  const { data, error } = await koCliente().rpc('opt_guardar_propuesta', {
    p_pozo:         p.pozo,
    p_f_max:        p.f_max,
    p_tap:          p.tap,
    p_reduccion:    p.red,
    p_nota:         p.nota || null,
    p_base_fecha:   p.base_fecha || null,
    p_f_max_previa: p.f_max_previa,
    p_tap_previo:   p.tap_previo,
    p_kw_previo:    p.kw_previo,
    p_criterios:    p.criterios || null
  });
  if (error) throw new Error(error.message);
  if (data && data.ok === false) throw new Error(data.error || 'No se pudo guardar');
  return data;
}

/* ══════════════════════════════════════════════════════════════════
   FLECHAS Y COLOR
   ------------------------------------------------------------------
   La confusion del + y - venia de mezclar dos cosas en un solo signo:
   hacia donde se mueve la magnitud, y si eso conviene o no. Un ahorro
   de 55 kW se mostraba como "-55.7" y una unidad subtensionada como
   "-163.4", el mismo signo para lo bueno y para lo malo.

   Aqui son dos canales separados:
     la FLECHA dice que hace la magnitud fisica: sube o baja
     el COLOR  dice si eso conviene: verde bien, ambar ojo, rojo mal

   Asi "consumo ↓ 55.7 kW" en verde y "consumo ↑ 163.4 kW" en rojo se
   leen sin tener que recordar ninguna convencion. */

const KO_FLECHA = { sube: '\u2191', baja: '\u2193', igual: '\u2192' };

/* Entero con separador de miles. Tensiones y corrientes de campo no
   tienen decimales significativos: 585.6666666666666 A es un promedio
   de ronda, no una medicion con seis decimales de resolucion. */
function koEnt(v){
  if (v == null || !isFinite(v)) return '\u2014';
  return Math.round(v).toLocaleString('es-CO');
}

function koDelta(valor, opts){
  /* opts.mejor: 'baja' si lo deseable es que la magnitud baje.
     opts.dec:   decimales. opts.umbral: por debajo se considera igual. */
  if (valor == null) return '<span class="sd">\u2014</span>';
  const dec = opts.dec != null ? opts.dec : 1;
  const um  = opts.umbral != null ? opts.umbral : 0;
  const abs = Math.abs(valor);

  if (abs <= um)
    return '<span class="ko-d ig">' + KO_FLECHA.igual + ' ' + abs.toFixed(dec) + '</span>';

  const baja = valor > 0;                       /* el valor es la reduccion */
  const conviene = (opts.mejor === 'baja') === baja;
  return '<span class="ko-d ' + (conviene ? 'bien' : 'mal') + '">'
       + (baja ? KO_FLECHA.baja : KO_FLECHA.sube) + ' ' + abs.toFixed(dec) + '</span>';
}

/* El TAP no se muestra como diferencia con signo sino como la accion a
   ejecutar. "Subir 245 V" no necesita interpretacion; "-245" si. */
/* Desviacion de la salida del variador contra su patron V/Hz. Los
   umbrales salen del comportamiento observado en la hoja de calculo:
   hasta unos 10 V es dispersion normal de medida y ajuste, y a partir
   de 25 V el variador esta claramente fuera de su curva. */
function koSemSalida(d){
  if (d == null) return 'none';
  const a = Math.abs(d);
  return a >= 25 ? 'crit' : a >= 10 ? 'warn' : 'ok';
}

function koAccionTap(dTap){
  if (dTap == null) return '<span class="sd">\u2014</span>';
  const abs = Math.abs(dTap);
  if (abs < 1) return '<span class="ko-d ig">' + KO_FLECHA.igual + ' en punto</span>';
  const sem = koSemTap(dTap);
  return '<span class="ko-d" style="color:' + KO_HEX[sem] + '">'
       + (dTap > 0 ? KO_FLECHA.baja + ' bajar ' : KO_FLECHA.sube + ' subir ')
       + abs.toFixed(0) + ' V</span>';
}

/* Las tres tensiones del lado del variador no dicen nada por separado;
   lo que importa es en que se diferencian, porque cada diferencia
   apunta a una causa distinta.

   Entregada contra curva V/Hz: si el variador entrega menos de lo que
   su patron indica, hay caida en la acometida, el patron esta
   parametrizado distinto de lo que se supone, o el variador esta
   limitando por corriente. Nada de eso se arregla cambiando el TAP.

   Curva V/Hz contra lo que necesita el motor: esa si es una cuestion
   de TAP, y es la que este modulo resuelve.

   El umbral de 15 V es del orden del error de una medida de campo con
   pinza y sonda; por debajo no vale la pena llamarlo desviacion. */
function koLecturaVsd(r){
  const t = [];

  /* Va primero a proposito. Si las dos medidas no cuadran entre si, lo
     que sigue se calcula sobre datos que no se sostienen y no vale la
     pena leerlo hasta aclarar cual de los dos numeros es el bueno. */
  if (r.dVsdImp != null && Math.abs(r.dVsdImp) > 15){
    t.push('La salida medida del variador y la que implica el SUT '
      + 'difieren en ' + koEnt(Math.abs(r.dVsdImp)) + ' V. Siendo el SUT un '
      + 'transformador, deber&iacute;an coincidir: revise las dos medidas y '
      + 'confirme que el TAP registrado ('
      + (r.u && r.u.tap != null ? koEnt(r.u.tap) + ' V' : 'sin dato')
      + ') es el que est&aacute; conectado. Lo de abajo se calcula con esos '
      + 'mismos n&uacute;meros.');
  }
  /* La maxima de salida del variador es la referencia de todo este
     bloque. Si no esta registrada se usa la primaria nominal del SUT,
     que en un PWM son 480 en lugar de 450: un 6,7 % de error que
     siempre apunta en el mismo sentido. Decirlo evita perseguir una
     desviacion que es del dato y no del equipo. */
  if (r.vMaxOrigen !== 'unidad'){
    t.push('Esta unidad no tiene registrada la tensi&oacute;n m&aacute;xima de '
      + 'salida del variador, as&iacute; que se usa la primaria nominal del SUT '
      + '(' + koEnt(r.vMaxSal) + ' V). En un variador PWM son 450 y no 480, y esa '
      + 'diferencia se traslada entera a la desviaci&oacute;n de arriba.');
  }
  if (r.vVsdOrigen === 'implicada'){
    t.push('La salida del variador no viene medida en esta lectura: se '
      + 'muestra la que implica el SUT. Al tomarla en la ronda, el '
      + 'diagn&oacute;stico deja de depender de que el TAP registrado sea '
      + 'exacto.');
  }
  if (r.dVsdPatron != null && Math.abs(r.dVsdPatron) > 15){
    t.push(r.dVsdPatron < 0
      ? 'El variador entrega ' + koEnt(-r.dVsdPatron) + ' V menos de lo que '
        + 'indica su curva V/Hz. Eso no se corrige con el TAP: revise ca&iacute;da '
        + 'en la acometida, el patr&oacute;n V/Hz configurado y si est&aacute; '
        + 'limitando por corriente.'
      : 'El variador entrega ' + koEnt(r.dVsdPatron) + ' V m&aacute;s de lo que '
        + 'indica su curva V/Hz. Revise el patr&oacute;n configurado y el refuerzo '
        + 'de par a baja frecuencia.');
  }
  if (r.dVsdNec != null && Math.abs(r.dVsdNec) > 15){
    t.push(r.dVsdNec < 0
      ? 'Al motor le llegan ' + koEnt(-r.dVsdNec) + ' V menos de los que '
        + 'necesita a esta frecuencia. Con el TAP en su valor &oacute;ptimo esa '
        + 'diferencia se cierra.'
      : 'Al motor le llegan ' + koEnt(r.dVsdNec) + ' V m&aacute;s de los que '
        + 'necesita. Ahi est&aacute; el margen de ahorro que propone este '
        + 'm&oacute;dulo.');
  }
  if (!t.length)
    t.push('Las tres tensiones coinciden dentro de 15 V. El punto de '
         + 'operaci&oacute;n el&eacute;ctrico est&aacute; donde deber&iacute;a.');
  return '<p class="ko-nota">' + t.join(' ') + '</p>';
}

/* Retrato del motor al momento de emitir. */
function koCriterios(){
  return {
    modo_factor_carga: koCfg.modo,
    k_filtro:          koCfg.kFiltro,
    fp:                koCfg.fp,
    constante:         koCfg.raiz,
    caida_escala_frecuencia: koCfg.escalaCable
  };
}

/* Un cero medido es un dato; una cadena vacia no. */
function koNum(v){
  if (v == null || v === '') return null;
  const n = Number(v);
  return isFinite(n) ? n : null;
}

/* ============================================================
   MOTOR DE CALCULO
   ============================================================ */
/* Las tablas y los umbrales vienen de opt_parametro. Estos valores
   solo cubren el instante entre que abre la pantalla y llega la
   respuesta; en cuanto llega, se reemplazan. */
let KO_TABLA = [[0.50,0.87],[0.60,0.90],[0.70,0.94],[0.80,0.95],[0.90,0.98],[1.00,1.00]];
let KO_CVD   = {2:[[40,11],[50,14],[60,16],[70,19],[80,22],[90,25],[100,27],[110,30],
                   [120,33],[130,36],[140,39]]};
let KO_TCF   = [[140,1.13],[149,1.15],[158,1.17],[167,1.19],[176,1.21],[185,1.23],
                [194,1.25],[203,1.27],[212,1.29],[221,1.31],[230,1.33]];

const koCfg = {
  modo:    'interp',   /* interp | banda */
  kFiltro: 1.07,       /* perdida de tension del filtro seno */
  fp:      0.80,       /* factor de potencia para pasar A a kW */
  vNom:    480,        /* nominal por defecto del variador */
  raiz:    'sqrt3',    /* sqrt3 | hoja  (la hoja usaba 3^(1/3)) */
  uTap:    100,
  uVolA:   80,
  uVolC:   150,
  escalaCable: true   /* true: como la hoja de optimizacion */
};

let KO_DATOS = [];

/* Aplica lo que trae opt_parametros sobre la configuracion local,
   sin perder los valores por defecto si falta alguna clave. */
function koAplicarParametros(p){
  const n = k => (p[k] == null ? null : Number(p[k]));
  if (n('k_filtro') != null) koCfg.kFiltro = n('k_filtro');
  if (n('fp') != null)       koCfg.fp = n('fp');
  if (n('u_tap') != null)    koCfg.uTap = n('u_tap');
  if (n('u_vol_atencion') != null) koCfg.uVolA = n('u_vol_atencion');
  if (n('u_vol_alerta') != null)   koCfg.uVolC = n('u_vol_alerta');
  if (p.modo_factor_carga) koCfg.modo = String(p.modo_factor_carga);
  if (p.caida_escala_frecuencia != null)
    koCfg.escalaCable = !!p.caida_escala_frecuencia;
  if (Array.isArray(p.tabla_carga) && p.tabla_carga.length) KO_TABLA = p.tabla_carga;
  if (Array.isArray(p.tabla_tcf) && p.tabla_tcf.length)     KO_TCF = p.tabla_tcf;
  if (p.tabla_cvd && typeof p.tabla_cvd === 'object')       KO_CVD = p.tabla_cvd;
}

/* Interpolacion lineal con recorte a los extremos de la tabla. */
function koInterp(t, x){
  if (x == null || !isFinite(x)) return null;
  if (x <= t[0][0]) return t[0][1];
  if (x >= t[t.length-1][0]) return t[t.length-1][1];
  for (let i = 0; i < t.length - 1; i++){
    const [a, va] = t[i], [b, vb] = t[i+1];
    if (x >= a && x <= b) return va + (vb - va) * (x - a) / (b - a);
  }
  return null;
}

/* La caida de tension en el cable no se escala con la frecuencia:
   depende de la corriente. Se calcula del calibre, la longitud y la
   temperatura, salvo que la unidad tenga una caida medida en campo,
   que siempre manda sobre la calculada. */
function koCaidaCable(u){
  if (u.cable_medido != null) return {v:u.cable_medido, origen:'medida en campo'};
  const tabla = KO_CVD[u.awg] || KO_CVD[String(u.awg)];
  if (!tabla || u.long_ft == null || u.i_placa == null)
    return {v:null, origen:'sin calibre, longitud o corriente de placa'};
  const cvd = koInterp(tabla, u.i_placa);
  const tcf = koInterp(KO_TCF, u.temp_f);
  if (cvd == null || tcf == null)
    return {v:null, origen:'sin temperatura del pozo'};
  return {v: u.long_ft * cvd / 1000 * tcf, origen:'calculada', cvd:cvd, tcf:tcf};
}

let koSel   = null;         /* pozo abierto en detalle */
let koProp  = {};           /* pozo -> frecuencia maxima propuesta editada */
let koBusca = '';           /* texto del buscador */
let koFiltro = 'all';       /* all | tap | vol | ahorro | filtro | sin */
let koMarca = new Set();    /* pozos escogidos para la propuesta */

/* ---------- motor de calculo ---------- */

function koFactorCarga(carga){
  if (carga == null) return null;
  const T = KO_TABLA;
  if (carga <= T[0][0]) return T[0][1];
  if (carga >= T[T.length-1][0]) return T[T.length-1][1];

  if (koCfg.modo === 'banda'){
    /* Banda: se toma el escalon inmediatamente inferior, que es lo
       que hace una tabla leida a mano. */
    let f = T[0][1];
    for (const [c, v] of T) if (carga >= c) f = v;
    return f;
  }
  for (let i = 0; i < T.length - 1; i++){
    const [c1, v1] = T[i], [c2, v2] = T[i+1];
    if (carga >= c1 && carga <= c2)
      return v1 + (v2 - v1) * (carga - c1) / (c2 - c1);
  }
  return null;
}

/* Frecuencia de partida de una unidad: la propuesta ya registrada
   si existe, y si no el tope actual. */
function koFBase(u){
  return u.prop_f_max != null ? u.prop_f_max : u.f_max;
}

function koCalcular(u){
  const r = { pozo: u.pozo, u: u, ok: false };
  if (u.carga == null && u.i_mot != null && u.i_placa)
    u.carga = u.i_mot / u.i_placa;
  /* Prioridad de la frecuencia propuesta: lo que el usuario edita
     ahora, luego la propuesta ya guardada, y si no hay ninguna, el
     tope actual de la unidad. */
  r.fProp = koProp[u.pozo] != null ? koProp[u.pozo]
          : (u.prop_f_max != null ? u.prop_f_max : u.f_max);

  const cab = koCaidaCable(u);
  r.cable = cab.v;
  r.cableOrigen = cab.origen;
  r.cvd = cab.cvd; r.tcf = cab.tcf;

  if (u.carga == null || u.v_placa == null || u.f_op == null || !r.fProp
      || r.cable == null) return r;

  r.fCarga  = koFactorCarga(u.carga);
  r.vOpt60  = u.v_placa * r.fCarga;
  /* Dos criterios sobre la caida de cable, y la diferencia no es
     menor. La hoja de optimizacion la sumaba antes de escalar por
     frecuencia; la de instalacion la suma despues. Fisicamente la
     caida depende de la corriente y no de la velocidad, asi que
     "sin escalar" es lo correcto, pero se deja como parametro
     mientras se confirma contra campo. */
  if (koCfg.escalaCable){
    r.vSup60 = r.vOpt60 + r.cable;
    r.tapBase = r.vSup60 * r.fProp / 60;
    r.vOptOp = r.vSup60 * u.f_op / 60;
  } else {
    r.vSup60 = r.vOpt60 + r.cable;
    r.tapBase = r.vOpt60 * r.fProp / 60 + r.cable;
    r.vOptOp = r.vOpt60 * u.f_op / 60 + r.cable;
  }

  /* ── Perdidas en el SUT ───────────────────────────────────────────
     El transformador tambien cae. Su placa lo declara como impedancia
     de cortocircuito y hasta ahora el calculo lo ignoraba.

     Dos metodos, y hay que decir cual se uso:

       conservador          Z de placa completa, o sea la caida a plena
                            carga nominal del transformador. Es el del
                            procedimiento clasico. Un SUT casi siempre
                            trabaja por debajo de sus kVA nominales, asi
                            que sobreestima.
       escalado por carga   Z corregida por la relacion entre los kVA de
                            operacion y los nominales. Refleja mejor la
                            realidad y evita subir un tap sin necesidad.
                            Necesita los kVA del SUT.

     La caida depende del tap, y el tap es lo que se esta buscando: la
     cuenta es circular. Se resuelve como en el procedimiento, con una
     pasada: se calcula la caida sobre el tap sin corregir y se suma. La
     segunda iteracion mueve el resultado menos que la resolucion de un
     escalon de tap, asi que no se hace.

     No se escala con la frecuencia, por lo mismo que la del cable:
     depende de la corriente. */
  const sut = KO_SUT[u.pozo] || {};
  r.sut = sut;
  r.zPct = sut.z_pct != null ? sut.z_pct : null;

  if (r.zPct != null && r.tapBase){
    const iSec = u.i_mot != null ? u.i_mot : u.i_placa;
    r.sutKva = sut.kva != null ? sut.kva : null;
    if (r.sutKva && iSec != null){
      r.sOper  = r.tapBase * iSec * Math.sqrt(3) / 1000;
      r.zEfect = r.zPct * (r.sOper / r.sutKva);
      r.sutMetodo = 'escalado_por_carga';
    } else {
      r.zEfect = r.zPct;
      r.sutMetodo = 'conservador';
    }
    r.pSut = (r.zEfect / 100) * r.tapBase;
  } else {
    r.pSut = null;
    r.sutMetodo = 'sin_impedancia';
  }

  r.pTotal = r.cable + (r.pSut || 0);
  r.tapOpt = r.tapBase + (r.pSut || 0);

  /* ── Lado del variador ────────────────────────────────────────────
     El SUT es un transformador: V salida = V entrada x (TAP / V nom).
     Con eso se pasa cualquier tension del lado de superficie al lado
     del variador, sin necesidad de un dato nuevo.

     Se calculan TRES tensiones y compararlas es el diagnostico:

       vVsdMed   lo que el variador esta entregando, deducido de la
                 tension medida en el SUT. Es una deduccion, no una
                 medida: no ve el error de regulacion del variador.
       vVsdPatron lo que deberia entregar segun su propia curva V/Hz,
                 que a la frecuencia maxima ajustada da la nominal.
       vVsdNec   lo que el motor necesita, referido al lado del
                 variador.

     Si patron y necesaria no coinciden, el TAP esta mal escogido. Si
     medida y patron no coinciden, la curva V/Hz esta mal parametrizada
     o hay caida en la acometida. Son dos fallas distintas y hoy el
     modulo no las separaba. */
  const vNomD = u.v_nom != null ? u.v_nom : koCfg.vNom;
  r.rtSut = (u.tap != null && vNomD) ? u.tap / vNomD : null;

  /* La salida del variador se MIDE en la ronda. La deduccion del SUT se
     conserva pero solo como contraste: el SUT es un transformador, asi
     que V sut / relacion deberia dar la misma cifra. Cuando no la da,
     una de las dos medidas esta mal o el TAP registrado no es el
     instalado, y eso hay que verlo antes de proponer nada. */
  const sal = KO_SALIDA[u.pozo] || {};
  r.vVsdImp = (r.rtSut && u.v_sut != null) ? u.v_sut / r.rtSut : null;
  r.vVsdMed = sal.v_vsd != null ? sal.v_vsd : null;
  r.vVsdOrigen = r.vVsdMed != null ? 'medida' : (r.vVsdImp != null ? 'implicada' : null);
  if (r.vVsdMed == null) r.vVsdMed = r.vVsdImp;
  r.dVsdImp = (sal.v_vsd != null && r.vVsdImp != null)
              ? sal.v_vsd - r.vVsdImp : null;
  if (r.rtSut) r.vVsdNec = r.vOptOp / r.rtSut;
  /* La esperada segun el patron V/Hz del variador. La referencia es su
     tension MAXIMA DE SALIDA, no la primaria nominal del SUT: usar la
     segunda mete un error del 6,7 % en cada unidad de PWM, siempre en
     el sentido de decir que entrega menos de lo que debe. */
  r.vMaxSal = sal.v_max != null ? sal.v_max : vNomD;
  r.vMaxOrigen = sal.v_max != null ? 'unidad' : 'nominal del SUT';
  r.vVsdPatron = (r.vMaxSal && u.f_max) ? r.vMaxSal * u.f_op / u.f_max : null;
  r.dVsdPatron = (sal.v_vsd != null && r.vVsdPatron != null)
                 ? sal.v_vsd - r.vVsdPatron : null;
  r.dVsdNec    = (r.vVsdMed != null && r.vVsdNec != null)
                 ? r.vVsdMed - r.vVsdNec : null;

  r.kFiltro = u.filtro ? (u.k_filtro != null ? u.k_filtro : koCfg.kFiltro) : 1;
  r.tapNew  = r.tapOpt * r.kFiltro;

  r.dTap = u.tap != null ? u.tap - r.tapOpt : null;
  r.dVol = u.v_sut != null ? Math.abs(u.v_sut - r.vOptOp) : null;

  const vNom = u.v_nom != null ? u.v_nom : koCfg.vNom;
  if (vNom && u.i_mot != null && u.i_vsd != null){
    r.vNom  = vNom;
    r.rtAct = u.tap != null ? u.tap / vNom : null;
    r.rtNew = r.tapNew / vNom;
    r.dAmp  = u.i_vsd - r.rtNew * u.i_mot;
    const k = koCfg.raiz === 'sqrt3' ? Math.sqrt(3) : Math.pow(3, 1/3);
    r.red   = k * r.dAmp * vNom * koCfg.fp / 1000;
    /* La reduccion es una diferencia; para comparar contra campo
       hace falta el absoluto. kwAct es lo que la unidad toma hoy y
       kwProp lo que tomaria con el TAP propuesto. Por construccion
       kwAct - kwProp es exactamente r.red, asi que el estimado y lo
       que despues se mida salen del mismo criterio. */
    r.kwAct  = k * u.i_vsd * vNom * koCfg.fp / 1000;
    r.kwProp = k * r.rtNew * u.i_mot * vNom * koCfg.fp / 1000;
  }

  /* ── Frecuencia maxima alcanzable ─────────────────────────────────
     El paso que ninguna hoja del fabricante trae y el que convierte el
     calculo en una propuesta defendible:

       F max = (V tap - perdidas totales) x 60 / V placa del motor

     Se calcula dos veces y las dos sirven para cosas distintas.

     Con el TAP INSTALADO es un diagnostico del estado actual, y no es
     circular: dice hasta que frecuencia puede llegar hoy la unidad
     conservando su relacion V/Hz. Si sale por debajo de la frecuencia a
     la que esta corriendo, el motor esta subtensionado ahora mismo.

     Con el TAP PROPUESTO es la verificacion de que la propuesta sirve.
     Por construccion queda cerca de la frecuencia propuesta, asi que lo
     que importa no es el numero sino el margen: el criterio de campo
     son 2 a 3 Hz. Sin margen, al primer ajuste de frecuencia hacia
     arriba el tap vuelve a quedar corto. */
  if (u.v_placa){
    /* La caida del SUT es proporcional al tap, asi que la verificacion
       se hace sobre el tap que de verdad se va a instalar y no sobre el
       intermedio con que se selecciono. Es lo que hace el procedimiento
       en su ejemplo resuelto: escoge el tap y recien entonces calcula la
       caida con ese valor.

       Para el diagnostico del estado actual, la caida se calcula sobre
       el tap instalado, por la misma razon. */
    const zF = (r.zEfect != null) ? r.zEfect / 100 : 0;
    r.pTotalProp = r.cable + zF * r.tapNew;
    r.pTotalAct  = (u.tap != null) ? r.cable + zF * u.tap : null;

    r.fMaxAct = (u.tap != null)
      ? (u.tap - r.pTotalAct) * 60 / u.v_placa : null;
    r.fMaxProp = (r.tapNew - r.pTotalProp) * 60 / u.v_placa;
    r.margen = r.fMaxProp - r.fProp;
    /* Diagnostico del estado actual: la unidad corre por encima de lo
       que su tap le permite sostener. */
    r.cortoHoy = (r.fMaxAct != null && u.f_op != null)
      ? u.f_op - r.fMaxAct : null;
  }

  /* ── Setpoints a reprogramar ──────────────────────────────────────
     Al cambiar el tap cambia la relacion, y con ella todas las
     protecciones que se digitan del lado del variador. Un RETAP sin
     reescalarlas deja el motor sin proteccion de sobrecarga, o
     disparando sin causa. Es el olvido mas frecuente y el mas grave.

     Ojo con de que lado va cada corriente. En un Advantage, Load Setup
     va del lado del MOTOR sin multiplicar, mientras Overload y los dos
     ILimit van del lado del VARIADOR multiplicados. En un GCS todo va
     multiplicado, incluido Load Setup. Por eso la tarjeta los separa en
     vez de dar una lista plana. */
  if (r.rtNew && u.i_placa != null){
    r.vSecProp   = r.tapNew - (r.pSut || 0);
    r.vSec60     = r.vSup60 + (r.pSut || 0);
    r.spVolts60  = r.vSec60 / r.rtNew;
    r.spVClamp   = Math.min(r.spVolts60 * r.fProp / 60, r.vMaxSal || r.spVolts60);
    r.spVClampTope = (r.spVolts60 * r.fProp / 60) > (r.vMaxSal || Infinity);
    r.spHiSpeed  = Math.min(r.fMaxProp != null ? r.fMaxProp : r.fProp, r.fProp);
    r.spOverload = u.i_placa * r.rtNew;
    r.spRunI     = u.i_placa * r.rtNew * 1.05;
    r.spSyncI    = u.i_placa * r.rtNew * 1.25;
    r.kvaReq     = r.vSecProp * u.i_placa * Math.sqrt(3) / 1000;
  }

  /* El TAP propuesto tiene que existir en el transformador. Con el
     rango de la placa registrado esto se detecta antes de salir a
     campo; sin el, alguien lo descubre frente al equipo abierto. */
  r.tapFuera = (sut.tap_max != null && r.tapNew > sut.tap_max) ? 'alto'
             : (sut.tap_min != null && r.tapNew < sut.tap_min) ? 'bajo'
             : null;

  r.ok = true;
  return r;
}

/* Semaforos de la hoja: el TAP se juzga por su diferencia contra el
   optimo, y la tension medida por su diferencia contra la optima a
   la frecuencia de operacion. */
function koSemTap(d){
  if (d == null) return 'null';
  return Math.abs(d) >= koCfg.uTap ? 'crit' : 'ok';
}
function koSemVol(d){
  if (d == null) return 'null';
  if (d >= koCfg.uVolC) return 'crit';
  if (d >= koCfg.uVolA) return 'warn';
  return 'ok';
}
const KO_HEX = {ok:'#35a853', warn:'#e0a230', crit:'#d6584a', 'null':'#5f7d94'};

/* El alcance es el buscador mas el filtro de estado. La seleccion es
   otra cosa: sobre el alcance visible se marcan las unidades que van
   a entrar en una propuesta concreta, y los indicadores pasan a
   contar solo esas. Sin marcas, cuentan todo el alcance. */
function koAmbito(rs){
  const q = koBusca.trim().toUpperCase();
  return rs.filter(r => {
    if (koCampo !== 'all' && r.u.campo !== koCampo) return false;
    if (koPad   !== 'all' && r.u.pad   !== koPad)   return false;
    if (q && r.pozo.toUpperCase().indexOf(q) < 0
          && String(r.u.vsd || '').toUpperCase().indexOf(q) < 0) return false;
    if (koFiltro === 'tap')    return r.ok && koSemTap(r.dTap) === 'crit';
    if (koFiltro === 'vol')    return r.ok && koSemVol(r.dVol) === 'crit';
    if (koFiltro === 'ahorro') return r.ok && r.red != null && r.red > 0;
    if (koFiltro === 'filtro') return !!r.u.filtro;
    if (koFiltro === 'sin')    return !r.ok;
    return true;
  });
}

const KO_FILTROS = [
  ['all',    'Todas'],
  ['tap',    'TAP fuera de rango'],
  ['vol',    'Tensi\u00f3n en alerta'],
  ['ahorro', 'Con ahorro'],
  ['filtro', 'Con filtro seno'],
  ['sin',    'Sin datos']
];

let koCampo = 'all';
let koPad   = 'all';

/* Los campos y los PAD salen de los datos, no de una lista fija. */
function koSelectores(rs){
  const campos = [...new Set(rs.map(r => r.u.campo)
    .filter(c => c && c !== '\u2014'))].sort();
  const pads = [...new Set(rs
    .filter(r => koCampo === 'all' || r.u.campo === koCampo)
    .map(r => r.u.pad).filter(p => p && p !== '\u2014'))].sort();
  if (pads.indexOf(koPad) < 0) koPad = 'all';

  const op = (v, t, sel) => '<option value="' + koEsc(v) + '"'
    + (sel === v ? ' selected' : '') + '>' + koEsc(t) + '</option>';

  return '<select class="ko-sel2" id="koCampoSel">'
    + op('all', 'Todos los campos', koCampo)
    + campos.map(c => op(c, c, koCampo)).join('') + '</select>'
    + '<select class="ko-sel2" id="koPadSel">'
    + op('all', 'Todos los PAD', koPad)
    + pads.map(p => op(p, p, koPad)).join('') + '</select>';
}

function koBarra(amb, rs){
  const chips = KO_FILTROS.map(([k, t]) => {
    const n = k === 'all' ? rs.length : koAmbitoCuenta(rs, k);
    return '<button class="ko-chip' + (koFiltro === k ? ' on' : '') + '" data-f="' + k
      + '">' + t + ' <s>' + n + '</s></button>';
  }).join('');

  const marcadas = koMarca.size;
  return '<div class="ko-bar">'
    + '<div class="ko-chips">' + chips + '</div>'
    + '<div class="ko-bar2">'
    +   koSelectores(rs)
    +   '<input class="ko-bus" id="koBus" placeholder="Buscar unidad o variador" value="'
    +     koEsc(koBusca) + '">'
    +   '<button class="ko-chip" id="koSync" title="Trae la ultima ronda de cada unidad">'
    +     'Actualizar desde rondas</button>'
    +   '<button class="ko-chip" id="koSeg" title="Que se propuso, que se aprobo y '
    +     'que se recupero">Seguimiento</button>'
    +   '<button class="ko-chip" id="koMarcarTodas">Marcar las ' + amb.length
    +     ' visibles</button>'
    +   (marcadas ? '<button class="ko-chip on" id="koLimpiar">'
        + marcadas + ' marcada' + (marcadas === 1 ? '' : 's') + ' \u00b7 limpiar</button>'
        : '<span class="ko-hint">Marque unidades para armar una propuesta</span>')
    + '</div></div>';
}

/* Decir "sin datos" no ayuda a nadie: hay que decir cual falta,
   porque cada faltante se resuelve en un lugar distinto. */
function koFalta(r){
  const u = r.u, f = [];
  if (u.f_op == null)    f.push('frecuencia de operacion');
  if (u.carga == null)   f.push('carga del motor');
  if (u.v_placa == null) f.push('tension de placa del motor');
  if (u.i_vsd == null)   f.push('corriente del variador');
  if (u.i_mot == null)   f.push('corriente del motor');
  if (r.cable == null)   f.push('caida de cable (' + r.cableOrigen + ')');
  if (!f.length) return 'Sin datos suficientes';
  return 'Falta ' + f.join(', ') + '.';
}

function koAmbitoCuenta(rs, k){
  const g = koFiltro; koFiltro = k;
  const n = koAmbito(rs).length; koFiltro = g;
  return n;
}

function koEsc(t){
  return String(t == null ? '' : t).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ---------- vistas ---------- */

function koPintar(){
  if (koSel) return koPintarDetalle();
  const v = document.getElementById('koVista');
  document.getElementById('koBack').style.display = 'none';
  document.getElementById('koTitulo').textContent = 'Optimizaci\u00f3n Energ\u00e9tica';
  document.getElementById('koSub').innerHTML =
    'Propuesta de cambio de TAP por condici&oacute;n de operaci&oacute;n';

  const rs  = KO_DATOS.map(koCalcular);
  const amb = koAmbito(rs);
  /* Los indicadores siguen a la seleccion cuando hay marcas; si no,
     al alcance visible. Un total que no corresponde a lo que se esta
     mirando es peor que no tenerlo. */
  const base = koMarca.size ? rs.filter(r => koMarca.has(r.pozo)) : amb;
  const con = base.filter(r => r.ok);
  const sin = base.length - con.length;

  /* La suma de ahorro excluye las unidades cuya lectura es anterior al
     motor instalado. Sumar esos kW seria prometer un ahorro calculado
     sobre un equipo que ya no esta. */
  const viejas = con.filter(r => koDatoViejo(r.u));
  const kw    = con.filter(r => r.red != null && r.red > 0 && !koDatoViejo(r.u))
                   .reduce((a, r) => a + r.red, 0);
  /* Unidades subtensionadas: el TAP esta por debajo del optimo. No son
     oportunidad de ahorro sino correccion, y mezclarlas en la misma
     cifra es lo que hacia aparecer reducciones negativas. */
  const subT  = con.filter(r => r.dTap != null && r.dTap < -20 && !koDatoViejo(r.u));
  const tapAl = con.filter(r => koSemTap(r.dTap) === 'crit').length;
  const volAl = con.filter(r => koSemVol(r.dVol) === 'crit').length;
  const flt   = con.filter(r => r.u.filtro).length;

  const tile = (c, k, val, u, r2) => '<div class="ko-h ' + c + '">'
    + '<div class="k">' + k + '</div><div class="v">' + val
    + (u ? '<small>' + u + '</small>' : '') + '</div>'
    + (r2 ? '<div class="r2">' + r2 + '</div>' : '') + '</div>';

  let h = koConfig() + koBarra(amb, rs);

  const alc = koMarca.size ? 'de las marcadas'
            : (koFiltro === 'all' && !koBusca.trim() ? 'de la flota' : 'del alcance');

  h += '<div class="ko-hero">'
    + tile('',  'Unidades evaluadas', String(con.length), '',
           sin ? sin + ' sin datos suficientes' : 'todas con datos')
    /* La flecha en la cifra de ahorro dice lo que pasa con el consumo,
       que es lo que interesa: baja. Antes el numero solo iba en verde y
       habia que saber que verde significaba reduccion. */
    + tile('g', 'Consumo si se ejecuta', '\u2193 ' + kw.toFixed(0), 'kW',
           'suma de ' + alc + ' unidad' + (alc === 1 ? '' : 'es') + ' con ahorro')
    /* Separada del ahorro a proposito. Una unidad con el TAP por debajo
       del optimo no es una oportunidad de ahorro: es una correccion por
       subtension, y ejecutarla puede costar energia y valer la pena
       igual. Mezclarlas era lo que producia reducciones negativas. */
    + tile(subT.length ? 'w' : 'g', 'Subtensionadas', String(subT.length), '',
           subT.length ? 'el TAP est&aacute; por debajo del &oacute;ptimo'
                       : 'ninguna por debajo del &oacute;ptimo')
    + tile(tapAl ? 'r' : 'g', 'TAP fuera de rango', String(tapAl), '',
           'diferencia de 100 V o m&aacute;s')
    + tile(volAl ? 'w' : 'g', 'Tensi&oacute;n en alerta', String(volAl), '',
           'desviaci&oacute;n de 150 V o m&aacute;s')
    + (viejas.length
        ? tile('w', 'Datos previos al equipo', String(viejas.length), '',
               'lectura anterior al motor instalado')
        : tile('',  'Con filtro seno', String(flt), '',
               'factor ' + koCfg.kFiltro.toFixed(2) + ' sobre el TAP'))
    + '</div>';

  const filas = amb.map(r => {
    const u = r.u;
    const mk = '<td class="ko-mk" onclick="event.stopPropagation()">'
      + '<input type="checkbox" data-m="' + u.pozo + '"'
      + (koMarca.has(u.pozo) ? ' checked' : '') + '></td>';

    if (!r.ok){
      return '<tr>' + mk + '<td class="pz">' + u.pozo + '</td>'
        + '<td colspan="12" style="text-align:left" class="sd">'
        + koEsc(koFalta(r)) + '</td></tr>';
    }
    const edit = koProp[u.pozo] != null && koProp[u.pozo] !== koFBase(u);
    const viejo = koDatoViejo(u);
    return '<tr class="cl' + (koMarca.has(u.pozo) ? ' mk' : '')
      +   (viejo ? ' viejo' : '') + '" data-p="' + u.pozo + '">'
      + mk
      + '<td class="pz">' + u.pozo
      +   (u.filtro ? '<span class="ko-fl">FILTRO</span>' : '')
      +   (viejo ? '<span class="ko-adv" title="La lectura es del '
                 + u.fecha + ', anterior al motor instalado el '
                 + viejo + '">dato previo al cambio</span>' : '') + '</td>'
      + '<td>' + u.f_op.toFixed(1) + '</td>'
      + '<td>' + u.f_max.toFixed(1) + '</td>'
      + '<td onclick="event.stopPropagation()">'
      +   '<input class="ko-f' + (edit ? ' ed' : '') + '" type="number" step="0.1" '
      +   'value="' + r.fProp + '" data-p="' + u.pozo + '"></td>'
      + '<td>' + (u.carga * 100).toFixed(0) + '%</td>'
      + '<td>' + r.fCarga.toFixed(3) + '</td>'
      + '<td>' + u.tap.toFixed(0) + '</td>'
      + '<td>' + r.tapOpt.toFixed(0) + '</td>'
      + '<td>' + (r.tapNew !== r.tapOpt
                    ? '<span class="up">' + r.tapNew.toFixed(0) + '</span>'
                    : r.tapNew.toFixed(0)) + '</td>'
      + '<td>' + koAccionTap(r.dTap) + '</td>'
      + '<td>' + (r.dVol != null ? koEnt(r.dVol) : '\u2014')
      +   '<span class="ko-sem" style="background:' + KO_HEX[koSemVol(r.dVol)] + '"></span></td>'
      /* Desviacion de la salida del variador contra su patron V/Hz. Es
         la columna que se venia llevando a mano en la hoja de calculo.
         No lleva flecha de conveniencia porque ni sobrar ni faltar
         tension es deseable: lo bueno es estar en cero. */
      + '<td>' + (r.dVsdPatron != null
            ? (r.dVsdPatron > 0 ? '+' : '') + koEnt(r.dVsdPatron)
            : '<span class="sd">\u2014</span>')
      +   (r.dVsdPatron != null
            ? '<span class="ko-sem" style="background:'
              + KO_HEX[koSemSalida(r.dVsdPatron)] + '"></span>' : '') + '</td>'
      /* Corriente del variador y consumo: lo deseable es que bajen. */
      + '<td>' + koDelta(r.dAmp, { mejor:'baja', dec:1, umbral:0.5 }) + '</td>'
      + '<td>' + koDelta(r.red,  { mejor:'baja', dec:1, umbral:0.5 }) + '</td>'
      + '</tr>';
  }).join('');

  if (!amb.length){
    h += '<div class="ko-card"><div class="ko-vacio">'
      + 'Ninguna unidad coincide con el filtro.</div></div>';
    document.getElementById('koVista').innerHTML = h;
    return koEnlazar();
  }

  h += '<div class="ko-card"><div class="ct"><b>Unidades</b>'
    + '<span>' + amb.length + ' de ' + rs.length
    + ' &middot; toque una fila para ver la cadena</span></div>'
    + '<div class="ko-scroll"><table class="ko-t"><thead><tr>'
    + '<th class="ko-mk"></th><th>Unidad</th><th>F&nbsp;ope</th><th>F&nbsp;m&aacute;x</th>'
    + '<th>F&nbsp;m&aacute;x prop.</th><th>Carga</th><th>Factor</th>'
    + '<th>TAP actual</th><th>TAP &oacute;ptimo</th><th>TAP nuevo</th>'
    + '<th>Acci&oacute;n TAP</th><th>&Delta;&nbsp;Vol SUT</th>'
    + '<th>&Delta;&nbsp;salida VSD</th>'
    + '<th>Corriente VSD</th><th>Consumo</th></tr></thead><tbody>' + filas + '</tbody></table></div>'
    + '<div class="ko-leg">'
    +   '<span><span class="ko-d bien">\u2193</span>&nbsp;baja y conviene</span>'
    +   '<span><span class="ko-d mal">\u2191</span>&nbsp;sube y no conviene</span>'
    +   '<span><i style="background:#35a853"></i>Dentro de rango</span>'
    +   '<span><i style="background:#e0a230"></i>Desviaci&oacute;n de 80 a 150 V</span>'
    +   '<span><i style="background:#d6584a"></i>Alerta</span>'
    +   '<span><i style="background:#5f7d94"></i>Sin dato</span></div>'
    + '<p class="ko-nota">La desviaci&oacute;n de salida del VSD es la tensi&oacute;n '
    + 'medida menos la esperada seg&uacute;n el patr&oacute;n del variador '
    + '(V m&aacute;xima de salida &times; F operaci&oacute;n / F m&aacute;xima). '
    + 'Negativa: entrega menos de lo que su curva indica. Positiva: m&aacute;s. '
    + 'Ninguna de las dos se corrige con el TAP. '
    + 'El TAP se marca en alerta con 100 V o m&aacute;s de diferencia '
    + 'contra el &oacute;ptimo. La tensi&oacute;n medida en el SUT se compara contra la '
    + '&oacute;ptima a la frecuencia de operaci&oacute;n: bajo 80 V es normal, entre 80 y '
    + '150 V es regular, 150 V o m&aacute;s es alerta.</p></div>';

  if (koMarca.size) h += koPropuesta(rs);

  v.innerHTML = h;
  koEnlazar();
}

/* ══════════════════════════════════════════════════════════════════
   EXPORTAR PROPUESTAS A EXCEL
   ------------------------------------------------------------------
   Tres hojas: Resumen para presentar, Detalle para pivotear, Metodo
   para defender la cifra cuando alguien la cuestione.

   LAS GRAFICAS VAN COMO IMAGEN, y hay que decirlo de entrada: ni
   ExcelJS ni SheetJS pueden crear graficas nativas de Excel. Es una
   carencia conocida de las dos librerias, no algo que se resuelva
   con maña. Asi que se dibujan en canvas y se incrustan. Se ven
   exactamente como se disenaron e imprimen bien; el precio es que no
   se actualizan si alguien filtra la tabla. Por eso la hoja Detalle
   va cruda y con autofiltro: quien quiera su propia grafica la hace
   desde ahi.

   LA TARIFA NO SE INVENTA. Va como celda de entrada, vacia, y el
   ahorro en dinero es una FORMULA de Excel de verdad. Gerencia
   cambia el numero y todo se recalcula. Poner una tarifa supuesta
   seria darle a la cifra una precision que no tiene.

   ExcelJS se carga solo al exportar. Este modulo se usa sin senal en
   el PAD y una libreria de 900 KB desde un CDN no puede ser peso
   muerto en cada apertura.
   ══════════════════════════════════════════════════════════════════ */

/* ---------- formatos con flecha y color ----------
   El formato de numero personalizado de Excel tiene tres secciones
   separadas por punto y coma: positivo, negativo y cero. Cada una
   admite su color y su texto literal, asi que la flecha y el color
   los aplica Excel segun el signo, sin pintar celda por celda.

   Eso vale mas que el formato manual por tres razones: sobrevive al
   filtrar y al ordenar, el valor sigue siendo numerico para pivotear
   y graficar, y no hay que recorrer las filas para colorearlas.

   Ojo con la seccion negativa: Excel formatea el valor ABSOLUTO, asi
   que "\u2191 "#,##0 sobre un -55.7 muestra "\u2191 55.7" sin el signo.
   Es justo lo que se quiere: la flecha ya dice la direccion y el signo
   duplicado confunde.

   Donde CERO es lo deseable no se usa flecha. En la desviacion de
   tension ni sobrar ni faltar conviene, asi que ahi va escala de color
   por magnitud y no direccion. */
const KX_FMT = {
  /* Positivo = la magnitud baja = conviene. Es la convencion del
     modulo: r.red y r.dAmp son reducciones. */
  bajaConviene: '[Green]"\u2193 "#,##0.0;[Red]"\u2191 "#,##0.0;[Color15]"\u2192 "0.0',
  bajaConvieneEnt: '[Green]"\u2193 "#,##0;[Red]"\u2191 "#,##0;[Color15]"\u2192 "0',
  /* Accion sobre el TAP: ni subir ni bajar es bueno o malo en si, asi
     que un solo color y la flecha dice que hacer. */
  accionTap: '[Blue]"\u2191 subir "#,##0" V";[Blue]"\u2193 bajar "#,##0" V";"\u2192 en punto"',
  volts: '#,##0" V"',
  voltsFirmado: '"+"#,##0;"-"#,##0;0',
  amp: '#,##0" A"',
  kw: '#,##0.0" kW"',
  pct: '0"%"'
};

const KX_C = {
  azul:   'FF0C5292', azul2: 'FF316CA1', blanco: 'FFFFFFFF',
  verde:  'FF2E7D32', rojo:  'FFC62828', naranja: 'FFE08600',
  gris:   'FF666666', gris2: 'FF999999',
  fAzul:  'FFE3F2FD', fVerde: 'FFE8F5E9', fRojo: 'FFFFEBEE',
  fNaranja:'FFFFF3E0', fGris: 'FFF2F2F2', linea: 'FFD9D9D9',
  fAmar:  'FFFFF9E0'
};

/* ---------- carga diferida de ExcelJS ---------- */
async function kxExcelJS(){
  if (window.ExcelJS) return window.ExcelJS;
  /* La aplicacion padre ya la trae cargada; reusarla ahorra la
     descarga y funciona sin red. */
  try { if (window.parent && window.parent !== window && window.parent.ExcelJS)
    return window.parent.ExcelJS; } catch(e){}
  await new Promise((ok, err) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
    s.onload = ok;
    s.onerror = () => err(new Error('No se pudo descargar ExcelJS. '
      + 'La exportacion necesita conexion.'));
    document.head.appendChild(s);
  });
  if (!window.ExcelJS) throw new Error('ExcelJS no quedo disponible');
  return window.ExcelJS;
}

/* ---------- graficas en canvas ----------
   Se dibujan al doble de resolucion y se reducen al insertarlas, o en
   pantalla de alta densidad y al imprimir salen borrosas. */
function kxLienzo(anchoPx, altoPx){
  const e = 2;
  const c = document.createElement('canvas');
  c.width = anchoPx * e; c.height = altoPx * e;
  const g = c.getContext('2d');
  g.scale(e, e);
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, anchoPx, altoPx);
  g.textBaseline = 'middle';
  return { c, g, w: anchoPx, h: altoPx };
}

function kxHex(argb){ return '#' + argb.slice(2); }

/* Barras horizontales, una por unidad, ordenadas. Horizontales y no
   verticales porque las etiquetas son codigos de pozo: en vertical
   habria que girarlas y se vuelven ilegibles al proyectar. */
function kxGraficaBarras(datos, titulo, unidad){
  const filas = datos.length;
  const altoFila = 22, margenSup = 46, margenInf = 26;
  const { c, g, w } = kxLienzo(560, margenSup + filas * altoFila + margenInf);
  const izq = 76, der = 56;
  const ancho = w - izq - der;
  const max = Math.max(...datos.map(d => Math.abs(d.valor)), 1);

  g.fillStyle = kxHex(KX_C.azul);
  g.font = '600 14px Arial';
  g.fillText(titulo, 12, 18);
  g.fillStyle = kxHex(KX_C.gris2);
  g.font = '11px Arial';
  g.fillText(unidad, 12, 34);

  datos.forEach((d, i) => {
    const y = margenSup + i * altoFila;
    const largo = Math.max(2, Math.abs(d.valor) / max * ancho);
    g.fillStyle = kxHex(KX_C.gris);
    g.font = '11px Arial';
    g.textAlign = 'right';
    g.fillText(d.nombre, izq - 8, y + altoFila / 2);
    g.fillStyle = d.valor >= 0 ? kxHex(KX_C.verde) : kxHex(KX_C.rojo);
    g.fillRect(izq, y + 4, largo, altoFila - 9);
    g.font = '600 11px Arial';
    g.textAlign = 'left';
    g.fillText(d.valor.toFixed(1), izq + largo + 6, y + altoFila / 2);
    g.textAlign = 'left';
  });

  g.strokeStyle = kxHex(KX_C.linea);
  g.beginPath(); g.moveTo(izq, margenSup - 4);
  g.lineTo(izq, margenSup + filas * altoFila); g.stroke();
  return c.toDataURL('image/png');
}

/* Actual contra propuesto. Dos barras y nada mas: es la cifra de
   portada y cualquier adorno le resta. */
function kxGraficaAntesDespues(kwActual, kwPropuesto){
  const { c, g, w, h } = kxLienzo(420, 240);
  const base = h - 44, tope = 62;
  const max = Math.max(kwActual, kwPropuesto, 1);
  const bar = 92, x1 = 84, x2 = 236;

  g.fillStyle = kxHex(KX_C.azul);
  g.font = '600 14px Arial';
  g.fillText('Consumo de la flota propuesta', 12, 20);
  g.fillStyle = kxHex(KX_C.gris2);
  g.font = '11px Arial';
  g.fillText('kW en el punto de operacion actual', 12, 36);

  [[x1, kwActual, 'Hoy', KX_C.gris2], [x2, kwPropuesto, 'Con el cambio', KX_C.verde]]
    .forEach(([x, v, et, col]) => {
      const alto = Math.max(3, (v / max) * (base - tope));
      g.fillStyle = kxHex(col);
      g.fillRect(x, base - alto, bar, alto);
      g.fillStyle = kxHex(KX_C.azul);
      g.font = '600 15px Arial';
      g.textAlign = 'center';
      g.fillText(Math.round(v).toLocaleString('es-CO'), x + bar / 2, base - alto - 14);
      g.fillStyle = kxHex(KX_C.gris);
      g.font = '11px Arial';
      g.fillText(et, x + bar / 2, base + 16);
      g.textAlign = 'left';
    });

  const dif = kwActual - kwPropuesto;
  if (dif > 0){
    g.fillStyle = kxHex(KX_C.verde);
    g.font = '600 12px Arial';
    g.textAlign = 'center';
    g.fillText('\u2193 ' + dif.toFixed(0) + ' kW  ('
      + (dif / kwActual * 100).toFixed(1) + ' %)', w / 2, h - 12);
    g.textAlign = 'left';
  }
  return c.toDataURL('image/png');
}

/* ---------- el libro ----------
   Funcion pura: recibe filas y devuelve el libro. Igual que
   construirLibroReporte del modulo de materiales, para poder
   reutilizarla desde una Edge Function si algun dia el reporte se
   envia por correo. */
function kxLibroPropuestas(ExcelJS, filas, meta){
  const wb = new ExcelJS.Workbook();
  /* Sin autor ni empresa. El nombre de la herramienta no va solo en el
     pie visible: ExcelJS lo escribe tambien en las propiedades del
     archivo, que es donde Excel muestra el autor y donde nadie lo mira
     hasta que lo mira. Quitar el pie y dejar esto seria dejarlo
     igualmente. */
  wb.creator = '';
  wb.lastModifiedBy = '';
  wb.company = '';
  wb.created = new Date();

  const conAhorro = filas.filter(f => f.kw_red > 0);
  const conAumento = filas.filter(f => f.kw_red < 0);
  const kwBaja  = conAhorro.reduce((a, f) => a + f.kw_red, 0);
  const kwSube  = conAumento.reduce((a, f) => a - f.kw_red, 0);
  const kwActual = filas.reduce((a, f) => a + (f.kw_actual || 0), 0);

  /* ══ RESUMEN ══ */
  const rs = wb.addWorksheet('Resumen', {
    pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true,
                 fitToWidth: 1, fitToHeight: 0, margins:
                 { left:.4, right:.4, top:.5, bottom:.5, header:.2, footer:.2 } }
  });
  /* Ocho columnas: las cuatro tarjetas KPI se colocan en B, D, F y H,
     y sin la octava definida la ultima salia sin ancho ni formato. */
  rs.columns = [{ width: 3 }, { width: 26 }, { width: 16 }, { width: 18 },
                { width: 16 }, { width: 16 }, { width: 16 }, { width: 16 }];

  const tit = rs.getCell('B2');
  tit.value = 'Optimizacion energetica · propuestas de cambio de TAP';
  tit.font = { bold: true, size: 15, color: { argb: KX_C.azul } };
  rs.mergeCells('B2:H2');
  const sub = rs.getCell('B3');
  sub.value = meta.subtitulo;
  sub.font = { size: 10, color: { argb: KX_C.gris } };
  rs.mergeCells('B3:H3');
  rs.getRow(2).height = 22;

  /* KPI. Cada tarjeta es titulo arriba y cifra abajo: al proyectar,
     el ojo va primero al numero grande. */
  let f = 5;
  const kpi = [
    ['Unidades propuestas', filas.length, '', KX_C.azul, KX_C.fAzul, '#,##0'],
    /* La flecha va dentro del formato: dice que el consumo BAJA, que es
       lo que la cifra significa. Un "196,5 kW" suelto se puede leer como
       consumo y no como reduccion. */
    ['Consumo que baja', kwBaja, 'kW', KX_C.verde, KX_C.fVerde,
      '"\u2193 "#,##0.0" kW"'],
    ['Consumo que sube', kwSube, 'kW', kwSube > 0 ? KX_C.naranja : KX_C.gris2,
      kwSube > 0 ? KX_C.fNaranja : KX_C.fGris,
      kwSube > 0 ? '"\u2191 "#,##0.0" kW"' : '"\u2192 "#,##0.0" kW"'],
    ['Reduccion neta sobre el total', kwActual > 0 ? (kwBaja - kwSube) / kwActual : 0,
      '%', KX_C.azul, KX_C.fAzul, '"\u2193 "0.0%']
  ];
  kpi.forEach((k, i) => {
    const col = 2 + i * 1 + i;      /* B, D, F, H -> se usa merge de 2 */
    const c1 = rs.getCell(f, col), c2 = rs.getCell(f + 1, col);
    c1.value = k[0];
    c1.font = { size: 8.5, bold: true, color: { argb: KX_C.gris } };
    c1.alignment = { horizontal: 'left' };
    c2.value = k[1];
    c2.numFmt = k[5] || (k[2] === '%' ? '0.0%'
                       : k[2] === 'kW' ? '#,##0.0" kW"' : '#,##0');
    c2.font = { size: 16, bold: true, color: { argb: k[3] } };
    [c1, c2].forEach(c => {
      c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: k[4] } };
      c.border = { left: { style: 'thin', color: { argb: k[3] } } };
    });
  });
  rs.getRow(f + 1).height = 24;
  f += 3;

  /* Entradas editables. Van marcadas en amarillo porque son lo unico
     que se espera que alguien cambie. */
  rs.getCell(f, 2).value = 'Valorizacion';
  rs.getCell(f, 2).font = { bold: true, size: 11, color: { argb: KX_C.azul } };
  f += 1;
  const filaHoras = f, filaTarifa = f + 1, filaEnergia = f + 2, filaDinero = f + 3;

  const ent = [
    ['Horas de operacion al ano', 8760, '#,##0', true,
      'Marcha continua. Ajustar por factor de servicio si aplica.'],
    ['Costo de la energia (COP/kWh)', null, '#,##0', true,
      'Sin valor no se calcula el ahorro en dinero. Lo pone quien conoce la tarifa.']
  ];
  ent.forEach((e, i) => {
    const r = filaHoras + i;
    rs.getCell(r, 2).value = e[0];
    rs.getCell(r, 2).font = { size: 10 };
    const c = rs.getCell(r, 3);
    c.value = e[1];
    c.numFmt = e[2];
    c.font = { bold: true, size: 11 };
    c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: KX_C.fAmar } };
    c.border = { top:{style:'thin'}, left:{style:'thin'},
                 bottom:{style:'thin'}, right:{style:'thin'} };
    rs.getCell(r, 4).value = e[4];
    rs.getCell(r, 4).font = { size: 9, italic: true, color: { argb: KX_C.gris2 } };
    rs.mergeCells(r, 4, r, 8);
  });

  /* Formulas de verdad, con resultado precalculado: ExcelJS no evalua,
     asi que sin result la celda sale vacia hasta que Excel recalcule. */
  const kwhAno = kwBaja * 8760;
  rs.getCell(filaEnergia, 2).value = 'Energia que se deja de consumir al ano';
  rs.getCell(filaEnergia, 2).font = { size: 10 };
  const cE = rs.getCell(filaEnergia, 3);
  cE.value = { formula: kwBaja.toFixed(4) + '*C' + filaHoras, result: kwhAno };
  cE.numFmt = '#,##0" kWh"';
  cE.font = { bold: true, size: 11, color: { argb: KX_C.azul } };

  rs.getCell(filaDinero, 2).value = 'Ahorro anual estimado';
  rs.getCell(filaDinero, 2).font = { size: 10, bold: true };
  const cD = rs.getCell(filaDinero, 3);
  cD.value = { formula: 'IF(C' + filaTarifa + '="","",C' + filaEnergia
               + '*C' + filaTarifa + ')', result: '' };
  cD.numFmt = '"$"#,##0';
  cD.font = { bold: true, size: 13, color: { argb: KX_C.verde } };
  cD.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: KX_C.fVerde } };

  f = filaDinero + 3;

  /* Graficas */
  const top = conAhorro.slice().sort((a, b) => b.kw_red - a.kw_red).slice(0, 15)
    .map(x => ({ nombre: x.unidad, valor: x.kw_red }));

  if (top.length){
    const img1 = wb.addImage({ base64: kxGraficaBarras(top,
      'Reduccion por unidad', 'kW · ' + (conAhorro.length > 15
        ? 'las 15 mayores de ' + conAhorro.length : conAhorro.length + ' unidades')),
      extension: 'png' });
    rs.addImage(img1, { tl: { col: 1, row: f - 1 },
      ext: { width: 560, height: 46 + top.length * 22 + 26 } });
    f += Math.ceil((46 + top.length * 22 + 26) / 19) + 2;
  }

  if (kwActual > 0){
    const img2 = wb.addImage({
      base64: kxGraficaAntesDespues(kwActual, kwActual - kwBaja + kwSube),
      extension: 'png' });
    rs.addImage(img2, { tl: { col: 1, row: f - 1 },
      ext: { width: 420, height: 240 } });
    f += 14;
  }

  /* ══ DETALLE ══ */
  const dt = wb.addWorksheet('Detalle', {
    views: [{ state: 'frozen', ySplit: 1 }],
    pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1 }
  });
  const cols = [
    ['unidad','Unidad',11], ['campo','Campo',14], ['pad','PAD',12],
    ['f_op','F operacion (Hz)',13], ['f_max','F maxima (Hz)',13],
    ['f_prop','F maxima propuesta (Hz)',16],
    ['carga','Carga del motor',13], ['factor','Factor de carga',12],
    ['tap_actual','TAP actual (V)',12], ['tap_optimo','TAP optimo (V)',12],
    ['tap_nuevo','TAP a solicitar (V)',14],
    ['accion_tap','Accion sobre el TAP (V)',16],
    ['v_sut','V medida SUT (V)',14], ['v_sut_opt','V optima SUT (V)',14],
    ['d_vol','Desviacion SUT (V)',14],
    ['v_vsd','V salida VSD medida (V)',16],
    ['v_vsd_esp','V salida VSD esperada (V)',17],
    ['d_vsd','Desviacion salida VSD (V)',17],
    ['i_vsd','I variador (A)',12], ['i_motor','I motor (A)',11],
    ['d_amp','Cambio de I variador (A)',16],
    ['kw_actual','Consumo actual (kW)',14],
    ['kw_red','Cambio de consumo (kW)',16],
    ['filtro','Filtro seno',10],
    ['fecha','Fecha de la lectura',14], ['fuente','Origen',10],
    ['aviso','Aviso',34]
  ];
  dt.columns = cols.map(c => ({ header: c[1], key: c[0], width: c[2] }));
  const enc = dt.getRow(1);
  enc.font = { bold: true, size: 9, color: { argb: KX_C.blanco } };
  enc.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: KX_C.azul } };
  enc.alignment = { vertical: 'middle', wrapText: true };
  enc.height = 30;

  filas.forEach(x => {
    const r = dt.addRow(x);
    r.font = { size: 9.5 };
    r.getCell('carga').numFmt = '0%';
    ['tap_actual','tap_optimo','tap_nuevo','v_sut','v_sut_opt','v_vsd','v_vsd_esp']
      .forEach(k => r.getCell(k).numFmt = KX_FMT.volts);
    ['i_vsd','i_motor'].forEach(k => r.getCell(k).numFmt = KX_FMT.amp);
    ['d_vol'].forEach(k => r.getCell(k).numFmt = KX_FMT.volts);
    ['d_vsd'].forEach(k => r.getCell(k).numFmt = KX_FMT.voltsFirmado);
    ['f_op','f_max','f_prop'].forEach(k => r.getCell(k).numFmt = '0.0" Hz"');
    r.getCell('factor').numFmt = '0.000';
    r.getCell('kw_actual').numFmt = KX_FMT.kw;

    /* Las tres que llevan flecha. El formato hace el trabajo, asi que
       no hay que pintar nada a mano. */
    r.getCell('accion_tap').numFmt = KX_FMT.accionTap;
    r.getCell('d_amp').numFmt      = KX_FMT.bajaConvieneEnt;
    const c = r.getCell('kw_red');
    c.numFmt = KX_FMT.bajaConviene;
    c.font = { size: 9.5, bold: true };
    /* El fondo se reserva para lo que hay que mirar: una unidad cuyo
       consumo sube. La flecha roja lo dice, el fondo lo hace saltar al
       ojo en una hoja de sesenta filas. */
    if (x.kw_red < 0)
      c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: KX_C.fRojo } };

    if (x.aviso)
      r.getCell('aviso').font = { size: 9, italic: true, color: { argb: KX_C.naranja } };
  });
  dt.autoFilter = { from: 'A1', to: { row: 1, column: cols.length } };

  /* Leyenda. Una hoja que se manda por correo tiene que explicarse
     sola: quien la abra no estuvo en esta conversacion. */
  const fl = filas.length + 3;
  dt.getCell(fl, 1).value = 'Como leer las flechas: ↓ la magnitud baja y eso '
    + 'conviene · ↑ sube y no conviene · → sin cambio. '
    + 'En las desviaciones de tension no hay flecha porque lo deseable es cero: '
    + 'ahi el color va de verde en el centro a rojo en los extremos.';
  dt.getCell(fl, 1).font = { size: 9, italic: true, color: { argb: KX_C.gris } };
  dt.mergeCells(fl, 1, fl, Math.min(cols.length, 14));
  dt.getRow(fl).height = 26;
  dt.getCell(fl, 1).alignment = { wrapText: true, vertical: 'top' };

  /* ---------- escalas de color ----------
     Donde el cero es lo deseable no cabe flecha: ni sobrar ni faltar
     tension conviene. Ahi la magnitud la dice el color, con verde en el
     centro y rojo en los extremos. Se aplica como formato condicional
     para que siga funcionando si alguien ordena o filtra. */
  const ult = filas.length + 1;
  if (filas.length){
    const col = k => dt.getColumn(k).letter;

    /* Desviacion en el SUT: siempre positiva, verde en cero y rojo
       desde 150 V, los mismos umbrales de la pantalla. */
    dt.addConditionalFormatting({
      ref: col('d_vol') + '2:' + col('d_vol') + ult,
      rules: [{ type: 'colorScale', priority: 1,
        cfvo: [{ type: 'num', value: 0 }, { type: 'num', value: 80 },
               { type: 'num', value: 150 }],
        color: [{ argb: 'FF63BE7B' }, { argb: 'FFFFEB84' }, { argb: 'FFF8696B' }] }]
    });

    /* Desviacion de salida del variador: firmada, y las dos puntas son
       malas. Verde en el centro. */
    dt.addConditionalFormatting({
      ref: col('d_vsd') + '2:' + col('d_vsd') + ult,
      rules: [{ type: 'colorScale', priority: 2,
        cfvo: [{ type: 'num', value: -40 }, { type: 'num', value: 0 },
               { type: 'num', value: 40 }],
        color: [{ argb: 'FFF8696B' }, { argb: 'FF63BE7B' }, { argb: 'FFF8696B' }] }]
    });

    /* Carga del motor: por debajo del 60 % hay margen de ahorro, por
       encima del 100 % el motor esta sobrecargado. */
    dt.addConditionalFormatting({
      ref: col('carga') + '2:' + col('carga') + ult,
      rules: [{ type: 'colorScale', priority: 3,
        cfvo: [{ type: 'num', value: 0.5 }, { type: 'num', value: 0.85 },
               { type: 'num', value: 1.1 }],
        color: [{ argb: 'FFFFEB84' }, { argb: 'FF63BE7B' }, { argb: 'FFF8696B' }] }]
    });

    /* Barra de datos sobre el consumo actual: deja ver de un vistazo
       cuales unidades pesan de verdad en la factura. */
    dt.addConditionalFormatting({
      ref: col('kw_actual') + '2:' + col('kw_actual') + ult,
      rules: [{ type: 'dataBar', priority: 4,
        cfvo: [{ type: 'min' }, { type: 'max' }],
        color: { argb: 'FF9DC3E6' } }]
    });
  }

  /* ══ METODO ══ */
  const mt = wb.addWorksheet('Metodo y supuestos', {
    pageSetup: { paperSize: 9, fitToPage: true, fitToWidth: 1 }
  });
  mt.columns = [{ width: 3 }, { width: 34 }, { width: 82 }];
  mt.getCell('B2').value = 'Como se calcula y que hay que tener en cuenta';
  mt.getCell('B2').font = { bold: true, size: 13, color: { argb: KX_C.azul } };
  let fm = 4;
  const bloques = [
    ['TAP optimo',
     'Se parte de la tension de placa del motor, se corrige por el factor de carga '
     + 'segun la corriente medida, se suma la caida de tension en el cable y se '
     + 'escala a la frecuencia maxima propuesta. En unidades con filtro seno se '
     + 'aplica el factor del filtro sobre el TAP resultante.'],
    ['Cambio de consumo',
     'Raiz de tres por el cambio de corriente en el variador, por la tension '
     + 'nominal, por el factor de potencia, dividido en mil. El cambio de corriente '
     + 'es la corriente actual menos la que resultaria con la nueva relacion de '
     + 'transformacion.'],
    ['El estimado es optimista',
     'El calculo mantiene constante la corriente del motor. Al reducir tension esa '
     + 'corriente sube un poco, asi que la reduccion real siempre va a ser algo '
     + 'menor que la estimada. En motores con poca carga la diferencia es pequena '
     + 'porque domina la corriente de magnetizacion; en motores cargados no.'],
    ['Unidades cuyo consumo sube',
     'Son las que tienen el TAP por debajo del optimo: el motor esta subtensionado y '
     + 'jala mas corriente de la que necesita. Subir el TAP corrige eso y puede '
     + 'costar energia. Se listan aparte y NO se descuentan del ahorro, porque son '
     + 'una accion correctiva y no una oportunidad de ahorro.'],
    ['Desviacion de salida del variador',
     'Tension medida en la salida del variador menos la esperada segun su patron '
     + 'V/Hz, que es la tension maxima de salida por la frecuencia de operacion '
     + 'dividida en la frecuencia maxima ajustada. Una desviacion grande no se '
     + 'corrige con el TAP: apunta a parametrizacion del variador, caida en la '
     + 'acometida o limitacion por corriente.'],
    ['Vigencia de los datos',
     'Las unidades cuya ultima lectura es anterior a la instalacion del motor que '
     + 'tienen hoy quedan marcadas en la columna de aviso y fuera del total. Sus '
     + 'numeros corresponden a un equipo que ya no esta.'],
    ['Las graficas son imagenes',
     'Excel no admite graficas creadas desde el navegador, asi que las de la hoja '
     + 'Resumen se generaron como imagen y no se actualizan al filtrar. La hoja '
     + 'Detalle va cruda y con autofiltro para armar graficas propias desde ahi.'],
    ['La ejecucion la decide el tecnico',
     'La derivacion que se instala se escoge contra la tabla real del SUT, que tiene '
     + 'pasos discretos. El TAP a solicitar es el objetivo de calculo, no '
     + 'necesariamente una derivacion disponible.']
  ];
  bloques.forEach(b => {
    const c1 = mt.getCell(fm, 2), c2 = mt.getCell(fm, 3);
    c1.value = b[0];
    c1.font = { bold: true, size: 10, color: { argb: KX_C.azul2 } };
    c1.alignment = { vertical: 'top' };
    c2.value = b[1];
    c2.font = { size: 9.5 };
    c2.alignment = { vertical: 'top', wrapText: true };
    mt.getRow(fm).height = Math.max(30, Math.ceil(b[1].length / 95) * 13 + 14);
    fm += 1;
  });

  mt.getCell(fm + 1, 2).value = 'Fecha de emision: ' + meta.fechaTexto;
  mt.getCell(fm + 1, 2).font = { size: 9, color: { argb: KX_C.gris2 } };

  return wb;
}

/* ---------- accion de pantalla ---------- */
async function koExportar(boton){
  const rs = KO_DATOS.map(koCalcular);
  const sel = rs.filter(r => koMarca.has(r.pozo) && r.ok);
  const usar = sel.length ? sel : rs.filter(r => r.ok && r.red != null && r.red > 0);

  if (!usar.length){
    alert('No hay nada que exportar. Marque unidades o actualice las lecturas.');
    return;
  }
  if (!sel.length && !confirm('No hay unidades marcadas.\n\n'
      + 'Se exportan las ' + usar.length + ' que hoy muestran ahorro. '
      + '\u00bfContinuar?')) return;

  const previo = boton ? boton.textContent : '';
  if (boton){ boton.disabled = true; boton.textContent = 'Generando\u2026'; }

  try {
    const ExcelJS = await kxExcelJS();
    const k = koCfg.raiz === 'sqrt3' ? Math.sqrt(3) : Math.pow(3, 1/3);

    const filas = usar.map(r => {
      const u = r.u;
      const vNom = u.v_nom != null ? u.v_nom : koCfg.vNom;
      const viejo = koDatoViejo(u);
      const avisos = [];
      if (viejo) avisos.push('Lectura del ' + u.fecha + ', anterior al motor '
        + 'instalado el ' + viejo + ': los numeros son de otro equipo.');
      if (r.vVsdOrigen === 'implicada')
        avisos.push('Salida del variador no medida; implicada por el SUT.');
      if (r.vMaxOrigen !== 'unidad')
        avisos.push('Sin tension maxima de salida registrada; se usa la nominal '
          + 'del SUT.');
      if (r.dVsdPatron != null && Math.abs(r.dVsdPatron) >= 25)
        avisos.push('El variador esta ' + koEnt(Math.abs(r.dVsdPatron))
          + ' V fuera de su patron V/Hz.');
      return {
        unidad: u.pozo, campo: u.campo || '', pad: u.pad || '',
        f_op: u.f_op, f_max: u.f_max, f_prop: r.fProp,
        carga: u.carga, factor: r.fCarga,
        tap_actual: u.tap, tap_optimo: r.tapOpt, tap_nuevo: r.tapNew,
        accion_tap: r.dTap != null ? -r.dTap : null,
        v_sut: u.v_sut, v_sut_opt: r.vOptOp, d_vol: r.dVol,
        v_vsd: r.vVsdMed, v_vsd_esp: r.vVsdPatron, d_vsd: r.dVsdPatron,
        i_vsd: u.i_vsd, i_motor: u.i_mot, d_amp: r.dAmp,
        kw_actual: (u.i_vsd != null) ? k * u.i_vsd * vNom * koCfg.fp / 1000 : null,
        kw_red: r.red,
        filtro: u.filtro ? 'Si' : 'No',
        fecha: u.fecha || '', fuente: u.fuente || '',
        /* Las unidades con lectura vieja se exportan con aviso y con
           kw en cero, para que nadie las sume por error desde la hoja
           de detalle. */
        aviso: avisos.join(' ')
      };
    /* Las unidades con lectura anterior al equipo instalado se exportan
       con aviso pero SIN cifras de consumo. Dejarles el consumo actual
       inflaba la barra de "Hoy" en la grafica de portada con datos de un
       motor que ya no esta, y esa es la cifra que mira gerencia. */
    /* Unidades con lectura anterior al equipo instalado: se dejan las
       MEDIDAS, que son hechos, y se vacian las CONCLUSIONES, que son
       deducciones de datos que no corresponden al motor actual.

       El TAP a solicitar es la que mas importa vaciar. Esta hoja se
       manda por correo y alguien la puede ejecutar sin leer la columna
       de aviso; una derivacion calculada sobre otro motor puede dejar
       la unidad subtensionada. */
    }).map(x => (x.aviso.indexOf('anterior al motor') >= 0)
        ? Object.assign(x, { kw_red: null, kw_actual: null, tap_optimo: null,
            tap_nuevo: null, accion_tap: null, d_amp: null, f_prop: null,
            v_sut_opt: null, d_vol: null, v_vsd_esp: null, d_vsd: null })
        : x);

    const hoy = new Date();
    const fechaISO = hoy.toISOString().slice(0, 10);
    const ambito = [];
    if (koCampo && koCampo !== 'all') ambito.push(koCampo);
    if (koPad && koPad !== 'all') ambito.push('PAD ' + koPad);

    const wb = kxLibroPropuestas(ExcelJS, filas, {
      subtitulo: filas.length + ' unidad' + (filas.length === 1 ? '' : 'es')
        + (ambito.length ? ' \u00b7 ' + ambito.join(' \u00b7 ') : ' \u00b7 toda la flota')
        + ' \u00b7 ' + fechaISO
        + ' \u00b7 FP ' + koCfg.fp.toFixed(2)
        + ' \u00b7 factor de filtro ' + koCfg.kFiltro.toFixed(2),
      fechaTexto: fechaISO
    });

    const buf = await wb.xlsx.writeBuffer();
    const url = URL.createObjectURL(new Blob([buf],
      { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'propuestas-optimizacion-' + fechaISO + '.xlsx';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);

    if (boton){ boton.disabled = false; boton.textContent = previo; }
    const m = document.getElementById('koGuardarMsg');
    if (m) m.textContent = 'Exportadas ' + filas.length + ' unidades.';
  } catch(e){
    if (boton){ boton.disabled = false; boton.textContent = previo; }
    alert('No se pudo exportar. ' + e.message);
  }
}


/* Lo que se marca sirve para pedir algo concreto: un cambio de TAP
   por unidad. El resumen se deja en texto plano para copiarlo a un
   correo o a un aviso sin volver a teclear cifras. */
function koPropuesta(rs){
  const sel = rs.filter(r => koMarca.has(r.pozo) && r.ok);
  if (!sel.length){
    return '<div class="ko-card"><div class="ct"><b>Propuesta</b></div>'
      + '<div class="ko-vacio">Las unidades marcadas no tienen datos suficientes.</div></div>';
  }
  const kw = sel.filter(r => r.red > 0).reduce((a, r) => a + r.red, 0);
  const li = sel.slice().sort((a, b) => (b.red || 0) - (a.red || 0)).map(r =>
    r.pozo.padEnd(8) + ' TAP ' + r.u.tap.toFixed(0).padStart(5)
    + ' \u2192 ' + r.tapNew.toFixed(0).padStart(5) + ' V'
    + (r.u.filtro ? ' (con filtro)' : '')
    + '   F m\u00e1x ' + r.fProp.toFixed(1) + ' Hz'
    /* El resumen se copia a un correo o a un aviso, asi que no puede
       depender de una convencion de signos que el lector no tenga a la
       vista. "+33.8 kW" se lee como un aumento cuando es lo contrario.
       Se dice la direccion con palabras: baja o sube. */
    + '   ' + (r.red == null ? ''
        : Math.abs(r.red) < 0.05 ? 'consumo igual'
        : r.red > 0 ? 'consumo baja ' + r.red.toFixed(1) + ' kW'
                    : 'consumo SUBE ' + Math.abs(r.red).toFixed(1) + ' kW')
  ).join('\n');

  const yaGuardadas = sel.filter(r => r.u.prop_estado).length;
  /* Unidades marcadas cuyo consumo AUMENTA con el cambio. No es un
     error marcarlas: subir el TAP de una unidad subtensionada puede
     costar energia y valer la pena igual. Lo que no se puede es
     sumarlas al ahorro ni dejarlas pasar sin decirlo. */
  const suben = sel.filter(r => r.red != null && r.red < -0.05);
  return '<div class="ko-card"><div class="ct"><b>Propuesta</b><span>'
    + sel.length + ' unidad' + (sel.length === 1 ? '' : 'es')
    + ' &middot; consumo \u2193 ' + kw.toFixed(0) + ' kW</span></div>'
    + '<pre class="ko-pre">' + koEsc(li) + '</pre>'
    + '<div class="ko-bar2" style="margin-top:11px">'
    +   '<button class="ko-chip on" id="koGuardar">Registrar en Kronos-M</button>'
    +   '<button class="ko-chip" id="koExcel">Exportar a Excel</button>'
    +   '<span class="ko-hint" id="koGuardarMsg">'
    +     (yaGuardadas ? yaGuardadas + ' de estas unidades ya tienen una propuesta '
                       + 'vigente; registrarlas de nuevo reemplaza la anterior.'
                      : 'Queda registrada por unidad, con su frecuencia y su TAP.')
    +   '</span>'
    + '</div>'
    + (suben.length
        ? '<p class="ko-nota" style="color:var(--ko-warn)">'
          + suben.length + ' de estas unidades aumentan su consumo con el cambio ('
          + suben.map(r => r.pozo).join(', ') + '), porque su TAP est&aacute; por '
          + 'debajo del &oacute;ptimo. Ejecutarlas corrige una subtensi&oacute;n y '
          + 'puede valer la pena, pero no cuentan en los '
          + kw.toFixed(0) + ' kW de arriba.</p>'
        : '')
    + '<p class="ko-nota">Tensiones a frecuencia m&aacute;xima propuesta. La derivaci&oacute;n '
    + 'la escoge el t&eacute;cnico contra la tabla del SUT instalado.</p></div>';
}
