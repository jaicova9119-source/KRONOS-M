/* ============================================================
   CAPA DE DATOS
   Unico punto que toca la base. Al pasar MODO_DEMO a false,
   completar las dos funciones marcadas PENDIENTE.

/* Las RPC viven en public, asi que el cliente va con el esquema por
   defecto. La sesion se toma sola de localStorage porque el iframe
   corre en el mismo origen que Kronos-M. */
let kpSb = null;
function kpCliente(){
  if (KP.MODO_DEMO) return null;
  if (kpSb) return kpSb;
  kpSb = window.supabase.createClient(KP.SUPABASE_URL, KP.SUPABASE_ANON_KEY);
  return kpSb;
}

async function kpCargarFlota(){
  if (KP.MODO_DEMO) return kpDemoFlota;
  const { data, error } = await kpCliente().rpc('dp_flota');
  if (error) throw new Error(error.message);
  return (data || []).map(r => ({
    pozo_id:      r.pozo_id,
    pozo:         r.pozo,
    campo:        r.campo || '\u2014',
    sistema:      r.sistema || '\u2014',
    estado:       kpAfinar(r),
    resumen:      kpResumen(r),
    fecha_vector: r.fecha_vector || '\u2014'
  }));
}

/* Un pozo no evaluable puede serlo por dos razones muy distintas:
   nunca se le cargo un archivo, o el archivo llego incompleto. La
   primera se resuelve cargando datos; la segunda, averiguando por que
   faltan muestras. Mostrarlas juntas esconde esa diferencia. */
function kpAfinar(r){
  if (r.estado !== 'none') return r.estado;
  if (!r.fecha_vector) return 'sindatos';
  if (r.cobertura_pct != null) return 'cobertura';
  const m = (r.motivo_no_evaluable || '').toLowerCase();
  if (m.indexOf('cobertura') >= 0) return 'cobertura';
  return 'sindatos';
}

/* El resumen dice por que el pozo esta como esta. Un pozo sin vector
   no es un pozo sano: hay que decir que no se pudo evaluar. */
function kpResumen(r){
  if (!r.fecha_vector) return 'Sin vector calculado';
  if (r.evaluable !== true)
    return r.motivo_no_evaluable || 'No evaluable';
  const n = (r.n_alta || 0) + (r.n_atencion_alta || 0) + (r.n_atencion || 0);
  if (n === 0) return 'Sin hallazgos';
  return n + (n === 1 ? ' hallazgo' : ' hallazgos');
}

async function kpCargarPozo(codigo, pozoId){
  if (KP.MODO_DEMO) return kpDemoPozo[codigo] || null;
  const { data, error } = await kpCliente().rpc('dp_dictamen', { p_pozo_id: pozoId });
  if (error) throw new Error(error.message);
  if (!data || !data.dictamen) return null;
  return kpArmarPozo(data);
}

/* Traduce lo que devuelve la RPC a lo que la vista ya sabe pintar. */
function kpArmarPozo(d){
  const f  = d.features || {};
  const dc = d.dictamen || {};
  const hs = d.hallazgos || [];
  const porRegla = {};
  hs.forEach(h => { porRegla[h.regla_codigo] = h; });

  const nivel = n => (n === 'alta' ? 'crit' : 'warn');

  const reglas = (d.reglas || []).map(r => {
    const h = porRegla[r.codigo];
    if (h) return {
      codigo: r.codigo, nombre: r.nombre, estado: nivel(h.nivel),
      detalle: h.mensaje || (kpNum(h.valor_observado) + ' \u2014 umbral ' + kpNum(h.umbral_aplicado)),
      fuente: r.fuente_tipo || '\u2014'
    };
    const sinUmbral = (r.umbral_inf == null && r.umbral_sup == null);
    return {
      codigo: r.codigo, nombre: r.nombre,
      estado:  (!r.activa || sinUmbral) ? 'sinumbral' : 'ok',
      detalle: (!r.activa || sinUmbral) ? 'Regla inactiva o umbral sin parametrizar'
                                        : 'Dentro de umbral',
      fuente: r.fuente_tipo || '\u2014'
    };
  });

  const ind = [];
  const add = (etq, val, uni, ref) => {
    if (val == null) return;
    ind.push({ etiqueta: etq, valor: kpNum(val), unidad: uni, referencia: ref, estado: 'ok' });
  };
  add('Carga motor',    f.carga_pct_prom,  '%',   'p95 ' + kpNum(f.carga_pct_p95) + ' %');
  add('Frecuencia',     f.frec_prom_hz,    'Hz',  'Rango ' + kpNum(f.frec_min_hz) + ' \u2014 ' + kpNum(f.frec_max_hz));
  add('Presi\u00f3n intake', f.pip_prom_psi, 'psi', 'M\u00ednima ' + kpNum(f.pip_min_psi));
  add('Temp. motor',    f.t_motor_prom_c,  '\u00b0C', 'M\u00e1xima ' + kpNum(f.t_motor_max_c) + ' \u00b0C');
  add('Vibraci\u00f3n',     f.vib_max,     'G',   'Vx ' + kpNum(f.vib_x_prom));
  add('Desbalance I',   f.i_desbal_pct_prom, '%', 'M\u00e1ximo ' + kpNum(f.i_desbal_pct_max) + ' %');
  add('Disponibilidad', f.disponibilidad_pct, '%', kpNum(f.n_arranques) + ' arranques');
  add('Cobertura',      dc.cobertura_pct,  '%',   kpNum(f.muestras_recibidas) + ' muestras');

  return {
    pozo:    d.pozo ? d.pozo.nombre : '\u2014',
    campo:   d.pozo ? (d.pozo.campo || '\u2014') : '\u2014',
    sistema: d.pozo ? (d.pozo.sistema || '\u2014') : '\u2014',
    estado:  dc.n_alta > 0 ? 'crit'
             : ((dc.n_atencion_alta > 0 || dc.n_atencion > 0) ? 'warn' : 'ok'),
    fecha_vector: dc.fecha || '\u2014',
    indicadores:  ind,
    cadena:       [],
    reglas:       reglas
  };
}

async function kpCargarMedicion(pozoId){
  if (KP.MODO_DEMO || !pozoId) return null;
  const { data, error } = await kpCliente().rpc('dp_medicion', { p_pozo_id: pozoId });
  if (error) throw new Error(error.message);
  return data || null;
}

function kpNum(v){
  if (v == null) return '\u2014';
  const n = Number(v);
  if (!isFinite(n)) return '\u2014';
  return (Math.abs(n) >= 100) ? n.toFixed(0) : n.toFixed(2);
}

/* ============================================================
   CALCULO ELECTRICO SOBRE LA MEDICION DE CAMPO
   Formulas verificadas contra resultados conocidos:
     desbalance = max(|x - promedio|) / promedio * 100   (NEMA)
     carga      = I_promedio / I_nominal * 100
     kVA        = raiz(3) * V_promedio * I_promedio / 1000
     balance de rectificadores = |I1 - I2| / promedio(I1,I2) * 100
   ============================================================ */
const RT3 = Math.sqrt(3);

function kpProm(vs){
  const l = vs.filter(v => v != null && isFinite(v));
  if (!l.length) return null;
  return l.reduce((a,b) => a + b, 0) / l.length;
}
function kpDesbal(vs){
  const l = vs.filter(v => v != null && isFinite(v));
  if (l.length < 2) return null;
  const p = kpProm(l);
  if (!p) return null;
  return Math.max.apply(null, l.map(v => Math.abs(v - p))) / p * 100;
}
function kpEstadoCarga(pct){
  if (pct == null) return 'none';
  if (pct > 100) return 'crit';
  if (pct >= 95) return 'warn';
  return 'ok';
}
function kpEstadoDesbal(pct){
  if (pct == null) return 'none';
  if (pct > 2)   return 'crit';
  if (pct > 1)   return 'warn';
  return 'ok';
}

   nom:'sut_i_nominal_a'},

  /* Mismo valor medido que el SUT, contra el nominal del motor. */
  {nodo:'Motor', detalle:'Motor de fondo',
   i:['sutout_i_a','sutout_i_b','sutout_i_c'],
   v:['sutout_v_ab','sutout_v_ac','sutout_v_bc'],
   nom:'motor_i_nominal_a'}
];

function kpCalcularCadena(val, placa){
  const out = [];
  KP_ETAPAS.forEach(e => {
    let ii = null, ip = null;
    if (e.i_suma){
      const partes = e.i_suma.map(g => kpProm(g.map(c => val[c])));
      if (partes.some(x => x == null)) return;
      ip = partes.reduce((a,b) => a + b, 0);
    } else {
      ii = e.i.map(c => val[c]);
      ip = kpProm(ii);
    }
    const vv = e.v.map(c => val[c]);
    const vp = kpProm(vv);
    if (ip == null) return;
    const nominal = e.nom && placa ? placa[e.nom] : null;
    const pct = nominal ? (ip / nominal * 100) : null;
    out.push({
      nodo: e.nodo, detalle: e.detalle,
      medido: Math.round(ip * 10) / 10,
      nominal: nominal || null,
      unidad: 'A',
      v_prom: vp,
      kva: (vp != null) ? RT3 * vp * ip / 1000 : null,
      desbal_i: ii ? kpDesbal(ii) : null,
      desbal_v: kpDesbal(vv),
      carga_pct: pct,
      estado: nominal ? kpEstadoCarga(pct) : 'none'
    });
  });
  return out;
}

function kpBalanceRectificadores(val){
  const i1 = kpProm([val.conv1_i_a, val.conv1_i_b, val.conv1_i_c]);
  const i2 = kpProm([val.conv2_i_a, val.conv2_i_b, val.conv2_i_c]);
  if (i1 == null || i2 == null) return null;
  const prom = (i1 + i2) / 2;
  const dif = Math.abs(i1 - i2) / prom * 100;
  return {
    conv1: i1, conv2: i2, diferencia_pct: dif,
    mayor: (i1 >= i2) ? 'secundario delta' : 'secundario estrella',
    estado: dif > 10 ? 'crit' : (dif > 5 ? 'warn' : 'ok')
  };
}

/* Umbrales de FP y THD: los de FP son criterio operativo comun en
   O&G; los de THD de tension en salida de VFD no aplican como falla
   porque la onda PWM distorsiona por diseno. Se marcan como
   informativos y no como hallazgo. */
function kpCalidadEnergia(val){
  const p = [];
  const punto = (pref, nombre, esSalidaVfd) => {
    const fp = val[pref+'_fp'], thdv = val[pref+'_thdv'], thdi = val[pref+'_thd'];
    if (fp == null && thdv == null && thdi == null) return;
    const al = [];
    if (fp != null){
      if (fp <= 0.80)      al.push({t:'crit', m:'Factor de potencia ' + fp.toFixed(2) + ' (critico si es 0.80 o menos)'});
      else if (fp <= 0.85) al.push({t:'warn', m:'Factor de potencia ' + fp.toFixed(2) + ' (atencion si es 0.85 o menos)'});
    }
    if (thdv != null && esSalidaVfd)
      al.push({t:'info', m:'THD de tension ' + thdv.toFixed(1) + ' %. Valor esperable en salida de VFD sin filtro senoidal: la onda PWM distorsiona por diseno. No es falla.'});
    else if (thdv != null && thdv > 8)
      al.push({t:'warn', m:'THD de tension ' + thdv.toFixed(1) + ' % en red (IEEE 519 sugiere 8 % para sistemas de este nivel)'});
    p.push({
      nombre: nombre, fp: fp, thdv: thdv, thdi: thdi,
      factork: val[pref+'_factork'],
      kw: val[pref+'_kw'], kvar: val[pref+'_kvar'], kva: val[pref+'_kva'],
      alertas: al
    });
  };
  punto('pst_in',  'Entrada PST (red)', false);
  punto('vfdout',  'Salida VFD (al motor)', true);
  return p;
}

function kpTemperaturas(val){
  const defs = [
    ['hs1_c','Disipador 1'], ['hs2_c','Disipador 2'],
    ['hs3_c','Disipador 3'], ['hs4_c','Disipador 4'],
    ['temp_inductor_c','Inductor'], ['temp_controller_c','Controlador'],
    ['temp_igbt_u_c','IGBT U'], ['temp_igbt_v_c','IGBT V'], ['temp_igbt_w_c','IGBT W'],
    ['temp_pst_c','PST'], ['temp_sut_c','SUT']
  ];
  return defs.filter(d => val[d[0]] != null)
             .map(d => ({ nombre: d[1], valor: val[d[0]] }));
}

const KP_EST = {
  crit:     {txt:"Cr&iacute;tico", cls:"crit", ord:0},
  warn:     {txt:"Atenci&oacute;n",cls:"warn", ord:1},
  ok:       {txt:"Normal",         cls:"ok",   ord:2},
  cobertura:{txt:"Cobertura baja", cls:"none", ord:3},
  sindatos: {txt:"Sin datos",      cls:"none", ord:4},
  none:     {txt:"Sin vector",     cls:"none", ord:5},
  baseline: {txt:"Baseline",       cls:"none", ord:4},
  sindato:  {txt:"Sin dato",       cls:"none", ord:5},
  sinumbral:{txt:"Sin umbral",     cls:"none", ord:6}
};
const KP_HEX = {crit:"#c0392b", warn:"#c77700", ok:"#2ea44f", none:"#9a9aa0"};

let kpFiltro = "all";
let kpFlota = [];

function kpPeor(lista){
  let r = "ok";
  for (const x of lista){
    if (x.estado === "crit") return "crit";
    if (x.estado === "warn") r = "warn";
  }
  return r;
}

async function kpVerFlota(){
  document.getElementById("kpBack").style.display = "none";
  document.getElementById("kpFiltros").style.display = "flex";
  document.getElementById("kpTitulo").textContent = "An\u00e1lisis Predictivo";
  document.getElementById("kpSub").innerHTML = "Motor determinista &mdash; Kronos&#8209;M";
  const v = document.getElementById("kpVista");
  v.innerHTML = '<div class="kp-msg">Cargando&hellip;</div>';
  try {
    kpFlota = await kpCargarFlota();
  } catch (e) {
    v.innerHTML = '<div class="kp-msg">No se pudo cargar la flota.<br>' + e.message + '</div>';
    return;
  }
  kpPintarFlota();
}

function kpPintarFlota(){
  const d = kpFlota
    .filter(x => kpFiltro === "all" || x.sistema === kpFiltro)
    .sort((a,b) => KP_EST[a.estado].ord - KP_EST[b.estado].ord);
  const n = e => (e === 'none')
    ? d.filter(x => ['none','sindatos','cobertura'].includes(x.estado)).length
    : d.filter(x => x.estado === e).length;

  let h = '<h2>Flota</h2><p class="hint">' + d.length +
    ' pozos &middot; ordenados por severidad</p><div class="kp-stats">';
  [["Cr&iacute;tico","crit"],["Atenci&oacute;n","warn"],["Normal","ok"],["No evaluable","none"]]
    .forEach(([t,e]) => {
      h += '<div class="kp-stat"><div class="k">' + t + '</div><div class="v">' + n(e) + '</div></div>';
    });
  h += '</div>';

  if (!d.length){
    h += '<div class="kp-list"><div class="kp-msg">Sin pozos para este filtro.</div></div>';
  } else {
    h += '<div class="kp-list">';
    d.forEach(x => {
      const e = KP_EST[x.estado];
      h += '<div class="kp-row" onclick="kpVerPozo(\'' + x.pozo + '\',\'' + (x.pozo_id||'') + '\')">'
        +  '<div style="flex:1;min-width:0">'
        +  '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
        +  '<span class="nm">' + x.pozo + '</span>'
        +  '<span class="sys">' + x.sistema + '</span>'
        +  '<span style="font-size:12px;color:var(--kp-ink3)">' + x.campo + '</span></div>'
        +  '<div class="ds">' + x.resumen + '</div>'
        +  '<div class="ts">Vector: ' + x.fecha_vector + '</div></div>'
        +  '<span class="kp-pill ' + e.cls + '">' + e.txt + '</span></div>';
    });
    h += '</div>';
  }
  document.getElementById("kpVista").innerHTML = h;
}

/* ============================================================
   VISTA: POZO
   ============================================================ */
async function kpVerPozo(codigo, pozoId){
  document.getElementById("kpBack").style.display = "block";
  document.getElementById("kpFiltros").style.display = "none";
  const v = document.getElementById("kpVista");
  v.innerHTML = '<div class="kp-msg">Cargando&hellip;</div>';

  let p = null, med = null;
  try {
    const r = await Promise.all([
      kpCargarPozo(codigo, pozoId).catch(() => null),
      kpCargarMedicion(pozoId).catch(() => null)
    ]);
    p = r[0]; med = r[1];
  } catch (e) {
    v.innerHTML = '<div class="kp-msg">No se pudo cargar el pozo.<br>' + e.message + '</div>';
    return;
  }

  if (!p && !med){
    document.getElementById("kpTitulo").textContent = codigo;
    document.getElementById("kpSub").innerHTML = "Sin datos";
    v.innerHTML = '<div class="kp-card"><div class="kp-msg">'
      + 'Este pozo no tiene medici&oacute;n el&eacute;ctrica registrada '
      + 'ni vector diario calculado.</div></div>';
    return;
  }

  if (!p){
    p = { pozo: codigo, campo: '\u2014', sistema: '\u2014', estado: 'ok',
          fecha_vector: null, indicadores: [], cadena: [], reglas: [] };
  }

  document.getElementById("kpTitulo").textContent = p.pozo;
  document.getElementById("kpSub").innerHTML =
    "Sistema " + p.sistema + " &middot; " + p.campo
    + (p.fecha_vector ? (" &middot; vector " + p.fecha_vector) : "");

  let h = '';

  if (med) h += kpRenderMedicion(med);

  if (p.indicadores.length){
  h += '<h2 style="margin-top:22px">Indicadores operativos (SCADA)</h2>';
  h += '<p class="hint">Vector diario del ' + p.fecha_vector + '</p><div class="kp-kpis">';
  p.indicadores.forEach(i => {
    const c = KP_EST[i.estado].cls;
    h += '<div class="kp-kpi ' + c + '"><div class="k">' + i.etiqueta + '</div>'
      +  '<div class="v">' + i.valor + '<small>' + i.unidad + '</small></div>'
      +  '<div class="r">' + i.referencia + '</div>'
      +  '<span class="kp-pill ' + c + '">' + KP_EST[i.estado].txt + '</span></div>';
  });
  h += '</div>';
  }

  if (p.reglas.length){
  h += '<h2 style="margin-top:22px">Diagn&oacute;stico predictivo</h2>';
  const ev = p.reglas.filter(r => ["crit","warn","ok"].includes(r.estado)).length;
  h += '<p class="hint">' + p.reglas.length + ' reglas &middot; ' + ev + ' evaluadas</p>';
  h += '<div class="kp-list">' + kpDibujarReglas(p.reglas) + '</div>';
  }

  v.innerHTML = h;
}

function kpDibujarReglas(reglas){
  const bloques = [
    ["Hallazgos",     r => r.estado === "crit" || r.estado === "warn", true],
    ["Sin hallazgo",  r => r.estado === "ok",        false],
    ["No evaluadas",  r => ["baseline","sindato","sinumbral"].includes(r.estado), false]
  ];
  let h = '';
  bloques.forEach(([titulo, filtro, individual]) => {
    const g = reglas.filter(filtro);
    if (!g.length) return;
    h += '<div class="kp-grp">' + titulo + '</div>';
    if (individual){
      g.sort((a,b) => KP_EST[a.estado].ord - KP_EST[b.estado].ord).forEach(r => {
        const e = KP_EST[r.estado];
        h += '<div class="kp-rule ' + e.cls + '"><div>'
          +  '<div><span class="id">' + r.codigo + '</span> <span class="nm">' + r.nombre + '</span></div>'
          +  '<div class="dt">' + r.detalle + '</div>'
          +  '<div class="src">Fuente: ' + r.fuente + '</div></div>'
          +  '<span class="kp-pill ' + e.cls + '">' + e.txt + '</span></div>';
      });
    } else {
      const sub = {};
      g.forEach(r => { (sub[r.estado] = sub[r.estado] || []).push(r); });
      Object.keys(sub).forEach(k => {
        const l = sub[k];
        h += '<div class="kp-rule"><div>'
          +  '<div><span class="id">' + l.map(r => r.codigo).join(" &middot; ") + '</span></div>'
          +  '<div class="dt">' + l.map(r => r.nombre).join(", ") + '</div>'
          +  '<div class="src">' + l[0].detalle + '</div></div>'
          +  '<span class="kp-pill ' + KP_EST[k].cls + '">' + KP_EST[k].txt + '</span></div>';
      });
    }
  });
  return h;
}


/* ============================================================
   RENDER DE LA MEDICION ELECTRICA
   ============================================================ */
function kpRenderMedicion(m){
  const val   = m.valores || {};
  const placa = m.placa || {};
  const mc    = m.medicion || {};
  const cad   = kpCalcularCadena(val, placa);
  const bal   = kpBalanceRectificadores(val);
  const cal   = kpCalidadEnergia(val);
  const tmp   = kpTemperaturas(val);
  let h = '';

  const f = mc.medido_en ? String(mc.medido_en).slice(0,16).replace('T',' ') : '\u2014';
  h += '<h2>Medici&oacute;n el&eacute;ctrica de campo</h2>';
  h += '<p class="hint">' + f
     + (mc.realizado_por ? ' &middot; ' + mc.realizado_por : '')
     + (mc.frecuencia_hz != null ? ' &middot; ' + kpNum(mc.frecuencia_hz) + ' Hz' : '')
     + (mc.control_mode ? ' &middot; ' + mc.control_mode : '')
     + '</p>';

  if (cad.length){
    h += '<div class="kp-card">' + kpDibujarCadena(cad) + kpLeyenda() + '</div>';

    h += '<div class="kp-list" style="margin-bottom:18px">';
    h += '<div class="kp-grp">Detalle por etapa</div>';
    cad.forEach(n => {
      const e = KP_EST[n.estado] || KP_EST.none;
      h += '<div class="kp-rule ' + (e.cls === 'none' ? '' : e.cls) + '"><div>'
        +  '<div><span class="nm">' + n.nodo + '</span> '
        +  '<span class="id">' + n.detalle + '</span></div>'
        +  '<div class="dt">' + kpNum(n.medido) + ' A'
        +  (n.nominal ? ' de ' + kpNum(n.nominal) + ' A nominal' : ' &middot; sin placa')
        +  (n.v_prom != null ? ' &middot; ' + kpNum(n.v_prom) + ' V' : '')
        +  (n.kva != null ? ' &middot; ' + kpNum(n.kva) + ' kVA' : '')
        +  '</div>'
        +  '<div class="src">'
        +  (n.desbal_i != null ? 'Desbalance de corriente ' + kpNum(n.desbal_i) + ' %' : 'Valor calculado, sin desbalance propio')
        +  (n.desbal_v != null ? ' &middot; tensi&oacute;n ' + kpNum(n.desbal_v) + ' %' : '')
        +  '</div></div>'
        +  '<span class="kp-pill ' + e.cls + '">'
        +  (n.carga_pct != null ? kpNum(n.carga_pct) + ' %' : 'Sin placa')
        +  '</span></div>';
    });
    h += '</div>';
  }

  if (bal){
    const e = KP_EST[bal.estado];
    h += '<h2>Balance de rectificadores</h2>';
    h += '<p class="hint">Reparto de corriente entre los dos secundarios del PST</p>';
    h += '<div class="kp-card"><div style="display:flex;justify-content:space-between;'
      +  'align-items:baseline;gap:12px;flex-wrap:wrap">'
      +  '<div><div style="font-size:24px;font-weight:600">' + kpNum(bal.diferencia_pct) + ' %</div>'
      +  '<div style="font-size:13px;color:var(--kp-ink2);margin-top:4px">'
      +  'Delta ' + kpNum(bal.conv1) + ' A &middot; Estrella ' + kpNum(bal.conv2) + ' A'
      +  ' &middot; mayor en ' + bal.mayor + '</div>'
      +  '<div style="font-size:12px;color:var(--kp-ink3);margin-top:6px;max-width:640px">'
      +  'Cierto desbalance es inherente a un VFD multipulso: los devanados secundarios '
      +  'reparten corriente sin aislaci&oacute;n galv&aacute;nica plena. Por s&iacute; solo no constituye falla.'
      +  '</div></div>'
      +  '<span class="kp-pill ' + e.cls + '">' + e.txt + '</span></div></div>';
  }

  if (cal.length){
    h += '<h2>Calidad de energ&iacute;a</h2>';
    h += '<p class="hint">Medida con instrumento en campo</p>';
    h += '<div class="kp-kpis" style="margin-bottom:8px">';
    cal.forEach(pt => {
      const peor = pt.alertas.some(a => a.t === 'crit') ? 'crit'
                 : (pt.alertas.some(a => a.t === 'warn') ? 'warn' : 'ok');
      h += '<div class="kp-kpi ' + peor + '" style="grid-column:span 2">'
        +  '<div class="k">' + pt.nombre + '</div>'
        +  '<div class="v">' + (pt.fp != null ? pt.fp.toFixed(2) : '\u2014')
        +  '<small>factor de potencia</small></div>'
        +  '<div class="r">'
        +  (pt.kw   != null ? kpNum(pt.kw)   + ' kW &middot; ' : '')
        +  (pt.kvar != null ? kpNum(pt.kvar) + ' kVAR &middot; ' : '')
        +  (pt.kva  != null ? kpNum(pt.kva)  + ' kVA' : '')
        +  '</div>'
        +  '<div class="r">THD tensi&oacute;n ' + kpNum(pt.thdv) + ' %'
        +  ' &middot; THD corriente ' + kpNum(pt.thdi) + ' %'
        +  (pt.factork != null ? ' &middot; Factor K ' + kpNum(pt.factork) : '') + '</div>';
      pt.alertas.forEach(a => {
        const cls = (a.t === 'info') ? 'none' : a.t;
        h += '<div style="margin-top:6px"><span class="kp-pill ' + cls + '">'
          +  (a.t === 'info' ? 'Informativo' : (a.t === 'crit' ? 'Cr&iacute;tico' : 'Atenci&oacute;n'))
          +  '</span></div>'
          +  '<div class="r" style="margin-top:5px">' + a.m + '</div>';
      });
      h += '</div>';
    });
    h += '</div>';
  }

  if (tmp.length){
    h += '<h2>Temperaturas</h2>';
    h += '<p class="hint">Puntos medidos en el gabinete y transformadores</p>';
    h += '<div class="kp-kpis" style="margin-bottom:8px">';
    tmp.forEach(t => {
      h += '<div class="kp-kpi"><div class="k">' + t.nombre + '</div>'
        +  '<div class="v">' + kpNum(t.valor) + '<small>\u00b0C</small></div></div>';
    });
    h += '</div>';
  }

  if (placa.motor_i_nominal_a || placa.motor_potencia_hp){
    h += '<h2>Placa</h2>';
    h += '<p class="hint">Origen: ' + (placa.fuente || 'no indicado')
      +  (placa.actualizado_en ? ' &middot; actualizada ' + String(placa.actualizado_en).slice(0,10) : '')
      +  '</p>';
    h += '<div class="kp-kpis" style="margin-bottom:8px">';
    const pl = [
      ['Motor', placa.motor_potencia_hp, 'hp'],
      ['Tensi&oacute;n motor', placa.motor_v_nominal_v, 'V'],
      ['Corriente motor', placa.motor_i_nominal_a, 'A'],
      ['Corriente VFD', placa.vfd_i_nominal_a, 'A'],
      ['Motores', placa.n_motores, ''],
      ['Aislamiento', placa.motor_clase_aisl, '']
    ];
    pl.forEach(x => {
      if (x[1] == null) return;
      const vv = (typeof x[1] === 'number') ? kpNum(x[1]) : x[1];
      h += '<div class="kp-kpi"><div class="k">' + x[0] + '</div>'
        +  '<div class="v">' + vv + (x[2] ? '<small>' + x[2] + '</small>' : '') + '</div></div>';
    });
    h += '</div>';
  }

  return h;
}

function kpDibujarCadena(nodos){
  const alto = 150;
  const anchoTot = Math.max(680, nodos.length * 132);
  const n = nodos.length;
  const gap = 22;
  const w = Math.floor((anchoTot - 40 - gap * (n - 1)) / n);
  let s = '<svg class="kp-chain" viewBox="0 0 ' + anchoTot + ' ' + alto
        + '" role="img" xmlns="http://www.w3.org/2000/svg">'
        + '<title>Cadena energ&eacute;tica</title>'
        + '<defs><marker id="kpAr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" '
        + 'orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#94949a" stroke-width="1.5" '
        + 'stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';

  nodos.forEach((nd, i) => {
    const x = 20 + i * (w + gap);
    const col = KP_HEX[nd.estado] || KP_HEX.none;
    const pct = nd.nominal ? Math.round(nd.medido / nd.nominal * 100) : null;
    const cx = x + w / 2;

    s += '<rect x="' + x + '" y="20" width="' + w + '" height="112" rx="8" fill="#fff" '
      +  'stroke="' + col + '" stroke-width="1.5"/>';
    s += '<rect x="' + x + '" y="20" width="' + w + '" height="5" rx="2" fill="' + col + '"/>';
    s += kpSimbolo(nd.nodo, cx, 52, col);
    s += '<text x="' + cx + '" y="88" text-anchor="middle" font-size="13" font-weight="600" '
      +  'fill="#1c1c1e" font-family="inherit">' + nd.nodo + '</text>';
    s += '<text x="' + cx + '" y="105" text-anchor="middle" font-size="11.5" fill="#6b6b70" '
      +  'font-family="inherit">' + (pct === null ? nd.detalle : pct + ' % &middot; ' + nd.detalle) + '</text>';
    s += '<text x="' + cx + '" y="121" text-anchor="middle" font-size="11" fill="#94949a" '
      +  'font-family="inherit">' + (nd.nominal ? nd.medido + ' / ' + nd.nominal + ' ' + nd.unidad
      :  'sin placa') + '</text>';

    if (i < n - 1){
      const x1 = x + w + 3, x2 = x + w + gap - 3;
      s += '<line x1="' + x1 + '" y1="76" x2="' + x2 + '" y2="76" stroke="#94949a" '
        +  'stroke-width="1.5" marker-end="url(#kpAr)"/>';
    }
  });
  return s + '</svg>';
}

function kpSimbolo(nombre, cx, cy, col){
  const t = (nombre || "").toUpperCase();
  if (t.indexOf("VFD") >= 0){
    return '<rect x="' + (cx - 17) + '" y="' + (cy - 13) + '" width="34" height="26" rx="3" '
      + 'fill="none" stroke="' + col + '" stroke-width="1.6"/>'
      + '<path d="M' + (cx - 12) + ' ' + cy + ' q4 -10 7 0 q4 10 7 0" fill="none" stroke="' + col
      + '" stroke-width="1.4"/>';
  }
  if (t.indexOf("MOTOR") >= 0){
    return '<circle cx="' + cx + '" cy="' + cy + '" r="15" fill="none" stroke="' + col
      + '" stroke-width="1.6"/>'
      + '<text x="' + cx + '" y="' + (cy + 4) + '" text-anchor="middle" font-size="12" '
      + 'fill="' + col + '" font-family="inherit">M</text>';
  }
  return '<circle cx="' + (cx - 7) + '" cy="' + cy + '" r="11" fill="none" stroke="' + col
    + '" stroke-width="1.6"/>'
    + '<circle cx="' + (cx + 7) + '" cy="' + cy + '" r="11" fill="none" stroke="' + col
    + '" stroke-width="1.6"/>';
}

function kpLeyenda(){
  return '<div class="kp-leg">'
    + '<span><i style="background:' + KP_HEX.ok   + '"></i>hasta 95 %</span>'
    + '<span><i style="background:' + KP_HEX.warn + '"></i>95 a 100 %</span>'
    + '<span><i style="background:' + KP_HEX.crit + '"></i>sobre 100 %</span>'
    + '<span><i style="background:' + KP_HEX.none + '"></i>sin dato de placa</span></div>';
}

document.getElementById("kpFiltros").addEventListener("click", ev => {
  const b = ev.target.closest(".kp-chip");
  if (!b) return;
  kpFiltro = b.dataset.s;
  document.querySelectorAll(".kp-chip").forEach(x => x.classList.toggle("on", x === b));
  kpPintarFlota();
});

if (!KP.MODO_DEMO) document.getElementById("kpDemo").style.display = "none";
kpVerFlota();
