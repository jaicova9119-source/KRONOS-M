  if (!pozoId) return [];
  const { data, error } = await kpCliente().rpc('dp_eventos_pozo',
    { p_pozo_id: pozoId, p_dias: 90 });
  if (error) throw new Error(error.message);
  return data || [];
}

/* ══════════════════════════════════════════════════════════════════
   ARCHIVO DE ENTREGA POR CAMPO
   ------------------------------------------------------------------
   Seis hojas planas con filtro en cada columna. Reemplaza el libro
   que se llenaba a mano con una hoja por pozo: aquello eran treinta
   y ocho hojas que alguien tenia que actualizar una por una, y que
   quedaban viejas el mismo dia. Aqui es una hoja por tipo de dato y
   se filtra.

   El campo se pide siempre, aunque la pantalla ya este filtrada. Los
   archivos salen por campo y es facil olvidar que hay un filtro
   puesto y mandarle Norte al de Sur. Que el nombre del archivo lleve
   el campo cierra el circulo.

   No se omite ninguna unidad del ambito. Una que falta parece un
   olvido de quien armo el archivo; una con celdas vacias dice que
   falta medirla, que es la verdad y ademas es accionable. Por eso la
   primera hoja es de cobertura: dice que trae el archivo y que no.

   ExcelJS se descarga solo al exportar. Este modulo se abre en campo
   y una libreria de 900 KB no puede ser peso muerto en cada apertura.
   ══════════════════════════════════════════════════════════════════ */

const KE_C = {
  azul: 'FF0C5292', azul2: 'FF316CA1', blanco: 'FFFFFFFF',
  verde: 'FF2E7D32', rojo: 'FFC62828', naranja: 'FFE08600',
  gris: 'FF666666', gris2: 'FF999999',
  fAzul: 'FFE3F2FD', fVerde: 'FFE8F5E9', fRojo: 'FFFFEBEE',
  fNaranja: 'FFFFF3E0', fGris: 'FFF2F2F2'
};

async function keExcelJS(){
  if (window.ExcelJS) return window.ExcelJS;
  try { if (window.parent && window.parent !== window && window.parent.ExcelJS)
    return window.parent.ExcelJS; } catch(e){}
  await new Promise((ok, err) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
    s.onload = ok;
    s.onerror = () => err(new Error('No se pudo descargar ExcelJS. '
      + 'La exportacion necesita conexion.'));
    document.head.appendChild(s);
  });
  return window.ExcelJS;
}

/* Una hoja plana, encabezado congelado y autofiltro. Todas las hojas
   de datos se arman igual: es un entregable, no un tablero, y la
   uniformidad es lo que permite pivotear sin sorpresas. */
function keHoja(wb, nombre, cols, filas, opciones){
  const o = opciones || {};
  /* Con titulo, la cabecera baja dos filas y el panel se congela ahi.
     Una hoja suelta en un libro de nueve pestanas necesita decir que es:
     el nombre de la pestana se corta y no admite explicacion. */
  const desp = o.titulo ? 2 : 0;
  const ws = wb.addWorksheet(nombre, {
    views: [{ state: 'frozen', ySplit: 1 + desp }],
    pageSetup: { paperSize: 9, orientation: 'landscape',
                 fitToPage: true, fitToWidth: 1, fitToHeight: 0 }
  });
  ws.columns = cols.map(c => ({ key: c.k, width: c.w || 14 }));

  if (o.titulo){
    ws.getCell('A1').value = o.titulo;
    ws.getCell('A1').font = { bold:true, size:13, color:{ argb:KE_C.azul } };
    if (o.sub){
      ws.getCell('A2').value = o.sub;
      ws.getCell('A2').font = { size:9, italic:true, color:{ argb:KE_C.gris2 } };
    }
  }

  const fEnc = 1 + desp;
  cols.forEach((c, i) => { ws.getCell(fEnc, i + 1).value = c.t; });
  const enc = ws.getRow(fEnc);
  enc.font = { bold: true, size: 9, color: { argb: KE_C.blanco } };
  enc.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: KE_C.azul } };
  enc.alignment = { vertical: 'middle', wrapText: true };
  enc.height = 32;

  filas.forEach(x => {
    const r = ws.addRow(x);
    r.font = { size: 9.5 };
    cols.forEach(c => { if (c.f) r.getCell(c.k).numFmt = c.f; });
    /* Fila sin lectura: se atenua entera menos el nombre. Deja ver de
       un golpe cuantas unidades del campo estan sin medir. */
    if (o.vacioSi && o.vacioSi(x)){
      r.eachCell(c => { c.font = { size: 9.5, color: { argb: KE_C.gris2 },
                                   italic: true }; });
      r.getCell(cols[0].k).font = { size: 9.5, bold: true,
                                    color: { argb: KE_C.naranja } };
    }
  });
  if (filas.length)
    ws.autoFilter = { from: { row: fEnc, column: 1 },
                      to:   { row: fEnc, column: cols.length } };
  return ws;
}

/* ── Comparacion entre rondas ────────────────────────────────────────────
   "Se mantuvo igual" necesita una banda de tolerancia. Comparar contra
   cero marca como incremento que la temperatura pase de 243,0 a 243,4 °F,
   y con todas las filas en color el color deja de significar algo.

   Cada metrica tiene su umbral porque la sensibilidad del instrumento y
   la variabilidad natural no son iguales: la frecuencia se lee con
   decima de Hz y es estable; la vibracion oscila sola entre rondas.

   `abs` es tolerancia absoluta en la unidad de la variable; `rel` es
   relativa al valor anterior. Se considera igual si el cambio no supera
   NINGUNO de los dos, para que un valor pequeno no dispare por la
   relativa ni uno grande por la absoluta. */
/* Las temperaturas de fondo se leen en °F en el sensor y así se manejan
   en campo; en la base se guardan en °C. Se convierten al exportar usando
   el mismo criterio que la pantalla (kpTempF), incluido el descarte de
   valores de 0 °F o menos, que en un pozo en operación no son medición
   sino sensor caído. */
function keAF(celsius){
  const f = kpTempF(celsius);
  return f == null ? null : Math.round(f * 10) / 10;
}

const KE_METRICAS = [
  { k:'f_operacion_hz', t:'F operación', u:'Hz',  f:'0.0',  abs:0.2,  rel:0     },
  /* Los porcentajes de carga van arriba: son lo que responde "¿este equipo
     está holgado o apretado?", que es la pregunta con la que se abre el
     archivo. Tolerancia de 2 puntos porcentuales, no relativa: un cambio
     de 20 a 22 % y otro de 80 a 82 % son el mismo movimiento real. */
  { k:'carga_vfd_pct',   t:'Carga VFD',   u:'%', f:'0.0', abs:2, rel:0 },
  { k:'carga_sut_pct',   t:'Carga SUT',   u:'%', f:'0.0', abs:2, rel:0 },
  { k:'carga_pst_pct',   t:'Carga PST',   u:'%', f:'0.0', abs:2, rel:0 },
  { k:'carga_motor_pct', t:'Carga motor', u:'%', f:'0.0', abs:2, rel:0 },
  { k:'vfd_i',          t:'VFD salida',  u:'A',   f:'#,##0', abs:2,    rel:0.02  },
  { k:'motor_i',        t:'Motor',       u:'A',   f:'#,##0.0', abs:0.5, rel:0.02 },
  { k:'pst_kw',         t:'PST',         u:'kW',  f:'#,##0.0', abs:2,  rel:0.02  },
  { k:'pst_fp',         t:'PST FP',      u:'',    f:'0.00', abs:0.02, rel:0     },
  { k:'pip_psi',        t:'PIP',         u:'psi', f:'#,##0', abs:3,    rel:0.03  },
  /* Tolerancia de 3 °F, equivalente a los 2 °C que se usaban antes: la
     sensibilidad no cambia, solo la unidad en que se expresa. */
  { k:'t_motor_f',      t:'T motor',     u:'°F',  f:'#,##0.0', abs:3,  rel:0     },
  { k:'t_intake_f',     t:'T intake',    u:'°F',  f:'#,##0.0', abs:3,  rel:0     },
  { k:'vib_x',          t:'Vib X',       u:'g',   f:'0.00', abs:0.05, rel:0     },
  { k:'vib_y',          t:'Vib Y',       u:'g',   f:'0.00', abs:0.05, rel:0     },
];

/* Devuelve el delta y su clasificacion. `null` de delta significa que no
   hay con que comparar -primera ronda o dato ausente-, que no es lo
   mismo que "se mantuvo igual" y se muestra distinto. */
function keCambio(m, actual, previo){
  if (actual == null || previo == null) return { d:null, clase:'sd' };
  const d = Number(actual) - Number(previo);
  const lim = Math.max(m.abs || 0, (m.rel || 0) * Math.abs(Number(previo)));
  if (Math.abs(d) <= lim) return { d, clase:'igual' };
  return { d, clase: d > 0 ? 'sube' : 'baja' };
}

const KE_FLECHA = { sube:'▲', baja:'▼', igual:'=', sd:'' };

function keLibro(ExcelJS, d, meta){
  /* Se agregan las columnas en °F sobre los mismos objetos. Convertir aquí
     y no en cada hoja evita que dos hojas muestren temperaturas distintas
     por haber redondeado en momentos diferentes. */
  [d.operacional, d.historico].forEach(arr => (arr || []).forEach(r => {
    r.t_motor_f  = keAF(r.t_motor_c);
    r.t_intake_f = keAF(r.t_intake_c);
  }));

  const wb = new ExcelJS.Workbook();
  wb.creator = ''; wb.lastModifiedBy = ''; wb.company = '';
  wb.created = new Date();

  const V = '#,##0';         const V1 = '#,##0.0';
  const HZ = '0.0" Hz"';     const PCT = '0.0"%"';
  const FP = '0.00';         const F3 = '0.000';

  /* ── Resumen ──
     Es la hoja que se abre primero y por eso decide la impresion del
     archivo entero. Lleva cifras grandes, bandas de carga con barra y la
     lista corta de unidades que piden atencion; el detalle vive en las
     otras hojas.

     Las barras son formato condicional nativo, no imagenes: escalan al
     imprimir, no se pixelan y se recalculan solas si alguien filtra. */
  const cb = wb.addWorksheet('Resumen', {
    views: [{ showGridLines: false }],
    pageSetup: { paperSize: 9, orientation: 'portrait',
                 fitToPage: true, fitToWidth: 1 } });

  [3, 30, 12, 12, 12, 12, 12, 16].forEach((w, i) => { cb.getColumn(i + 1).width = w; });

  const tit = (fila, txt, sub) => {
    cb.mergeCells(fila, 2, fila, 8);
    const c = cb.getCell(fila, 2);
    c.value = txt;
    c.font = { bold: true, size: 11, color: { argb: KE_C.azul } };
    if (sub){
      cb.mergeCells(fila + 1, 2, fila + 1, 8);
      const s2 = cb.getCell(fila + 1, 2);
      s2.value = sub;
      s2.font = { size: 8.5, italic: true, color: { argb: KE_C.gris2 } };
      return fila + 2;
    }
    return fila + 1;
  };

  /* Banda de encabezado: color solido de lado a lado. Es lo unico del
     libro que existe solo para que se vea bien. */
  for (let r = 1; r <= 3; r++){
    for (let c = 1; c <= 8; c++){
      cb.getCell(r, c).fill = { type:'pattern', pattern:'solid',
                                fgColor:{ argb: KE_C.azul } };
    }
  }
  cb.getRow(1).height = 8; cb.getRow(2).height = 26; cb.getRow(3).height = 14;
  cb.getCell(2, 2).value = 'Monitoreo de condicion \u00b7 ' + meta.ambito;
  cb.getCell(2, 2).font = { bold:true, size:16, color:{ argb:'FFFFFFFF' } };
  cb.getCell(3, 2).value = 'Emitido el ' + meta.fecha;
  cb.getCell(3, 2).font = { size:9, color:{ argb:'FFD6E4F0' } };

  /* ── Datos que alimentan el tablero ─────────────────────────────── */
  const conL   = d.operacional.filter(x => x.fecha);
  const sinL   = d.operacional.filter(x => !x.fecha);
  const atras  = d.operacional.filter(x => x.dias_sin_medir > 90);
  const alDia  = conL.filter(x => !(x.dias_sin_medir > 90));

  /* La ultima ronda de cada unidad dentro del historico: es donde viven
     los porcentajes de carga, que operacional no trae. */
  const ultCarga = new Map();
  (d.historico || []).forEach(r => ultCarga.set(r.unidad, r));
  const cargas = [...ultCarga.values()];

  const propAbiertas = (d.propuestas || []).filter(p => p.estado);
  const kwPot = propAbiertas.reduce((a, p) =>
    a + (Number(p.reduccion_kw) < 0 ? -Number(p.reduccion_kw) : 0), 0);

  /* ── Tarjetas ─────────────────────────────────────────────────────
     Cifra grande arriba y etiqueta pequena abajo. Se usa una franja de
     color a la izquierda en vez de rellenar la tarjeta entera: rellena
     compite con los numeros y cansa a la tercera tarjeta. */
  const tarjeta = (col, ancho, etq, val, nota, color) => {
    cb.mergeCells(5, col, 5, col + ancho - 1);
    cb.mergeCells(6, col, 6, col + ancho - 1);
    cb.mergeCells(7, col, 7, col + ancho - 1);
    const e = cb.getCell(5, col), v = cb.getCell(6, col), n = cb.getCell(7, col);
    e.value = etq;
    e.font = { size:8, bold:true, color:{ argb:KE_C.gris } };
    e.alignment = { horizontal:'left', indent:1, vertical:'bottom' };
    v.value = val;
    v.font = { size:22, bold:true, color:{ argb: color || KE_C.azul } };
    v.alignment = { horizontal:'left', indent:1, vertical:'middle' };
    n.value = nota || '';
    n.font = { size:8, color:{ argb:KE_C.gris2 } };
    n.alignment = { horizontal:'left', indent:1, vertical:'top' };
    for (let r = 5; r <= 7; r++){
      cb.getCell(r, col).border = {
        left: { style:'thick', color:{ argb: color || KE_C.azul } },
        top:    r === 5 ? { style:'hair', color:{ argb:'FFE2E8EE' } } : undefined,
        bottom: r === 7 ? { style:'hair', color:{ argb:'FFE2E8EE' } } : undefined,
      };
    }
  };
  cb.getRow(4).height = 10;
  cb.getRow(5).height = 13; cb.getRow(6).height = 30; cb.getRow(7).height = 13;

  tarjeta(2, 2, 'UNIDADES EN EL AMBITO', d.operacional.length,
          conL.length + ' con lectura');
  tarjeta(4, 2, 'AL DIA', alDia.length,
          'ronda de los ultimos 90 dias', KE_C.verde);
  tarjeta(6, 2, 'RONDA VENCIDA', atras.length,
          atras.length ? 'mas de 90 dias sin medir' : 'ninguna',
          atras.length ? KE_C.naranja : KE_C.verde);
  tarjeta(8, 1, 'SIN LECTURA', sinL.length, 'nunca medidas',
          sinL.length ? KE_C.rojo : KE_C.verde);

  let f = 9;

  /* ── Carga de la cadena por banda ─────────────────────────────────
     Cuatro nodos y cinco bandas. Interesa el reparto, no el promedio:
     una flota con la mitad al 20 % y la otra al 95 % promedia 57 % y ese
     numero no describe a ninguna unidad. */
  if (cargas.length){
    f = tit(f, 'Carga de la cadena',
      'Reparto de unidades por nivel de utilizacion en la ultima ronda de cada una. '
      + 'La barra es proporcional al numero de unidades.');

    const BANDAS = [
      ['Muy holgado', 'menos de 40 %',   x => x < 40,             KE_C.verde],
      ['Holgado',     'de 40 a 60 %',    x => x >= 40 && x < 60,  KE_C.verde],
      ['Normal',      'de 60 a 90 %',    x => x >= 60 && x < 90,  KE_C.azul2],
      ['Ajustado',    'de 90 a 100 %',   x => x >= 90 && x < 100, KE_C.naranja],
      ['Topado',      '100 % o mas',     x => x >= 100,           KE_C.rojo],
    ];
    const NODOS = [['carga_vfd_pct','Variador'], ['carga_sut_pct','SUT'],
                   ['carga_pst_pct','PST'], ['carga_motor_pct','Motor']];

    const enc = f;
    cb.getCell(enc, 2).value = 'Nivel';
    NODOS.forEach((n, i) => { cb.getCell(enc, 3 + i).value = n[1]; });
    cb.getCell(enc, 7).value = 'Total';
    cb.getCell(enc, 8).value = 'Reparto';
    for (let c = 2; c <= 8; c++){
      const h = cb.getCell(enc, c);
      h.font = { bold:true, size:8.5, color:{ argb:'FFFFFFFF' } };
      h.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:KE_C.azul } };
      h.alignment = { horizontal: c === 2 ? 'left' : 'center', indent: c === 2 ? 1 : 0 };
    }
    f += 1;
    const filaIni = f;
    BANDAS.forEach(([nom, rango, test, color]) => {
      /* El rango va escrito en la celda, no como nota.
         Dos motivos. Uno: una nota no se ve hasta pasar el raton, y esto
         es justo lo que hace falta para leer la tabla. Dos, y decisivo:
         las notas escriben legacyDrawing y la barra de datos escribe una
         extension x14; ExcelJS las emite en orden invalido -extLst antes
         de legacyDrawing- y Excel descarta la hoja entera al abrirla. */
      cb.getCell(f, 2).value = nom + '  (' + rango + ')';
      cb.getCell(f, 2).font = { size:9, bold:true, color:{ argb:color } };
      cb.getCell(f, 2).alignment = { indent:1 };
      let tot = 0;
      NODOS.forEach((n, i) => {
        const q = cargas.filter(x => x[n[0]] != null && test(Number(x[n[0]]))).length;
        tot += q;
        const c = cb.getCell(f, 3 + i);
        c.value = q || null;
        c.font = { size:9.5 };
        c.alignment = { horizontal:'center' };
      });
      cb.getCell(f, 7).value = tot || null;
      cb.getCell(f, 7).font = { size:9.5, bold:true };
      cb.getCell(f, 7).alignment = { horizontal:'center' };
      /* La barra vive en su propia columna con el mismo valor: asi la
         longitud se lee sola sin competir con la cifra. */
      cb.getCell(f, 8).value = tot || null;
      cb.getCell(f, 8).font = { size:8, color:{ argb:'FF9AA7B4' } };
      f += 1;
    });
    cb.addConditionalFormatting({
      ref: 'H' + filaIni + ':H' + (f - 1),
      /* cfvo es obligatorio: sin los dos puntos de referencia -minimo y
         maximo del rango- ExcelJS falla al escribir el archivo, no al
         definir la regla. */
      rules: [{ type:'dataBar', gradient:false, showValue:true,
                cfvo: [{ type:'num', value:0 }, { type:'max' }],
                color: { argb: KE_C.azul2 } }],
    });
    f += 1;
  }

  /* ── Unidades que piden atencion ──────────────────────────────────
     Se listan con el motivo, no solo el nombre: una lista de codigos
     obliga a ir a buscar por que esta cada uno ahi. */
  const alertas = [];
  cargas.forEach(x => {
    const m = [];
    if (x.carga_motor_pct >= 100) m.push('motor al ' + x.carga_motor_pct + ' %');
    else if (x.carga_motor_pct >= 90) m.push('motor al ' + x.carga_motor_pct + ' %');
    if (x.carga_vfd_pct >= 100) m.push('variador al ' + x.carga_vfd_pct + ' %');
    else if (x.carga_vfd_pct >= 90) m.push('variador al ' + x.carga_vfd_pct + ' %');
    if (x.carga_sut_pct >= 95) m.push('SUT al ' + x.carga_sut_pct + ' %');
    if (x.vfd_desbal_i_pct >= 10) m.push('desbalance de corriente ' + x.vfd_desbal_i_pct + ' %');
    if (m.length) alertas.push({ unidad:x.unidad, campo:x.campo, fecha:x.fecha,
                                 motivo:m.join(' \u00b7 '),
                                 peor: Math.max(Number(x.carga_motor_pct) || 0,
                                                Number(x.carga_vfd_pct) || 0) });
  });
  atras.forEach(x => alertas.push({ unidad:x.unidad, campo:x.campo, fecha:x.fecha,
    motivo: x.dias_sin_medir + ' dias sin ronda', peor: 0 }));

  if (alertas.length){
    f = tit(f, 'Requieren atencion',
      'Unidades con algun nodo al 90 % o mas, desbalance sobre 10 % o ronda vencida.');
    const enc2 = f;
    ['Unidad','Campo','Ultima ronda','Motivo'].forEach((t, i) => {
      const anch = [2, 3, 4, 5];
      const c = cb.getCell(enc2, anch[i]);
      c.value = t;
      c.font = { bold:true, size:8.5, color:{ argb:'FFFFFFFF' } };
      c.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:KE_C.azul } };
      c.alignment = { horizontal:'left', indent:1 };
    });
    cb.mergeCells(enc2, 5, enc2, 8);
    f += 1;
    alertas.sort((a, b) => b.peor - a.peor).slice(0, 15).forEach(a => {
      cb.getCell(f, 2).value = a.unidad;
      cb.getCell(f, 2).font = { size:9, bold:true };
      cb.getCell(f, 2).alignment = { indent:1 };
      cb.getCell(f, 3).value = a.campo;
      cb.getCell(f, 4).value = a.fecha || '\u2014';
      cb.mergeCells(f, 5, f, 8);
      cb.getCell(f, 5).value = a.motivo;
      cb.getCell(f, 5).font = { size:9,
        color:{ argb: a.peor >= 100 ? KE_C.rojo : a.peor >= 90 ? KE_C.naranja : KE_C.gris } };
      [3, 4].forEach(c => { cb.getCell(f, c).font = { size:9 }; });
      f += 1;
    });
    if (alertas.length > 15){
      cb.getCell(f, 2).value = 'y ' + (alertas.length - 15) + ' mas \u00b7 la lista completa esta en Operacional';
      cb.getCell(f, 2).font = { size:8.5, italic:true, color:{ argb:KE_C.gris2 } };
      f += 1;
    }
    f += 1;
  }

  /* ── Optimizacion ─────────────────────────────────────────────── */
  if (d.propuestas && d.propuestas.length){
    f = tit(f, 'Optimizacion energetica');
    const lineas = [
      ['Unidades con propuesta vigente', propAbiertas.length + ' de ' + d.propuestas.length],
      ['Reduccion estimada si se ejecutan', kwPot ? Math.round(kwPot) + ' kW' : 'sin estimar'],
      ['Unidades sin evaluar', (d.propuestas.length - propAbiertas.length)],
    ];
    lineas.forEach(([e, v]) => {
      cb.getCell(f, 2).value = e;
      cb.getCell(f, 2).font = { size:9 };
      cb.getCell(f, 2).alignment = { indent:1 };
      cb.mergeCells(f, 4, f, 5);
      cb.getCell(f, 4).value = v;
      cb.getCell(f, 4).font = { size:10, bold:true, color:{ argb:KE_C.azul } };
      f += 1;
    });
    f += 1;
  }

  /* ── Cobertura del dato ───────────────────────────────────────────
     Va al final y no al principio: es control de calidad del archivo, no
     el mensaje. Pero se conserva completo porque es lo que evita que
     alguien lea un vacio como un cero. */
  f = tit(f, 'Cobertura del dato',
    'Que tan completo esta este archivo. Un hueco no es un cero.');
  const lin = (etq, val, nota, alerta) => {
    cb.getCell(f, 2).value = etq;
    cb.getCell(f, 2).font = { size:9 };
    cb.getCell(f, 2).alignment = { indent:1 };
    cb.mergeCells(f, 4, f, 5);
    const c = cb.getCell(f, 4);
    c.value = val;
    c.font = { bold:true, size:10, color:{ argb: alerta ? KE_C.naranja : KE_C.azul } };
    if (nota){
      cb.mergeCells(f, 6, f, 8);
      cb.getCell(f, 6).value = nota;
      cb.getCell(f, 6).font = { size:8, italic:true, color:{ argb:KE_C.gris2 } };
      cb.getCell(f, 6).alignment = { wrapText:true, vertical:'top' };
      cb.getRow(f).height = Math.max(14, Math.ceil(String(nota).length / 40) * 10 + 4);
    }
    f += 1;
  };
  lin('Unidades sin ninguna lectura', sinL.length,
      sinL.length ? sinL.map(x => x.unidad).join(', ') : '', sinL.length > 0);
  lin('Con lectura de mas de 90 dias', atras.length,
      atras.length ? atras.map(x => x.unidad + ' (' + x.dias_sin_medir + ' d)').join(', ') : '',
      atras.length > 0);
  lin('Unidades con datos de placa', d.placas.length);
  lin('Unidades con configuracion de variador', d.setup.length,
      d.setup.length < d.operacional.length
        ? 'Faltan ' + (d.operacional.length - d.setup.length)
          + '. Se registran desde Captura de datos de campo.' : '',
      d.setup.length < d.operacional.length);
  lin('Registros de protecciones', d.protecciones.length);
  lin('Unidades en el detalle', (d.detalle || []).length,
      (d.detalle || []).length
        ? (d.puntos || []).length + ' puntos distintos. Hoja Detalle.'
        : 'Sin detalle disponible.',
      !(d.detalle || []).length);
  lin('Rondas en el historico', (d.historico || []).length,
      (d.historico || []).length
        ? 'Ultimos 24 meses. Hojas Historico, Variacion y Consolidado.'
        : 'Sin historico disponible: el libro sale sin esas hojas.',
      !(d.historico || []).length);

  f += 1;
  f = tit(f, 'Que trae cada hoja');
  [['Operacional', 'Ultima lectura de cada unidad, etapa por etapa.'],
   ['Detalle', 'Todos los puntos medidos en la ultima ronda, sin normalizar.'],
   ['Historico', 'Todas las rondas de los ultimos 24 meses.'],
   ['Variacion', 'Cambio de cada metrica contra la ronda anterior.'],
   ['Consolidado', 'Una fila por unidad con su deriva del periodo.'],
   ['Placas', 'Datos de placa del equipo instalado hoy.'],
   ['Propuestas', 'Cambios de TAP propuestos y su efecto sobre el consumo.'],
   ['Configuracion VFD', 'Parametros vigentes del variador.'],
   ['Protecciones', 'Ajustes de proteccion por unidad, en formato largo.']
  ].forEach(([h, t]) => {
    cb.getCell(f, 2).value = h;
    cb.getCell(f, 2).font = { bold:true, size:9, color:{ argb:KE_C.azul2 } };
    cb.getCell(f, 2).alignment = { vertical:'top', indent:1 };
    cb.mergeCells(f, 4, f, 8);
    cb.getCell(f, 4).value = t;
    cb.getCell(f, 4).font = { size:8.5 };
    cb.getCell(f, 4).alignment = { wrapText:true, vertical:'top' };
    f += 1;
  });

  /* ── Operacional ── */
  keHoja(wb, 'Operacional', [
    { k:'unidad', t:'Unidad', w:11 }, { k:'campo', t:'Campo', w:13 },
    { k:'pad', t:'PAD', w:13 }, { k:'sistema', t:'Sistema', w:9 },
    { k:'fecha', t:'Fecha de lectura', w:13 },
    { k:'dias_sin_medir', t:'Dias sin medir', w:11, f:V },
    { k:'condicion', t:'Condicion', w:11 },
    { k:'modo_control', t:'Modo de control', w:13 },
    { k:'f_operacion_hz', t:'F operacion', w:11, f:HZ },
    { k:'f_maxima_hz', t:'F maxima', w:11, f:HZ },
    { k:'f_setpoint_hz', t:'F setpoint', w:11, f:HZ },
    { k:'hsc', t:'HSC', w:8, f:V1 },
    { k:'pst_v', t:'PST entrada V', w:11, f:V },
    { k:'pst_i', t:'PST entrada A', w:11, f:V },
    { k:'pst_fp', t:'PST FP', w:9, f:FP },
    { k:'pst_kw', t:'PST kW', w:10, f:V1 },
    { k:'pst_kva', t:'PST kVA', w:10, f:V1 },
    { k:'pst_thd_i', t:'PST THD I %', w:11, f:PCT },
    { k:'pst_thd_v', t:'PST THD V %', w:11, f:PCT },
    { k:'pst_desbal_v_pct', t:'PST desbal. V %', w:12, f:PCT },
    { k:'pst_desbal_i_pct', t:'PST desbal. I %', w:12, f:PCT },
    { k:'conv1_i', t:'Convertidor 1 A', w:12, f:V },
    { k:'conv2_i', t:'Convertidor 2 A', w:12, f:V },
    { k:'bus_dc_v', t:'Bus DC V', w:10, f:V },
    { k:'bus_ac_v', t:'Bus AC V', w:10, f:V },
    { k:'vfd_v', t:'VFD salida V', w:11, f:V },
    { k:'vfd_i', t:'VFD salida A', w:11, f:V },
    { k:'vfd_fp', t:'VFD FP', w:9, f:FP },
    { k:'vfd_kw', t:'VFD kW', w:10, f:V1 },
    { k:'vfd_desbal_i_pct', t:'VFD desbal. I %', w:12, f:PCT },
    { k:'sut_v', t:'SUT salida V', w:11, f:V },
    { k:'sut_i', t:'SUT salida A', w:11, f:V },
    { k:'motor_i', t:'Motor A', w:10, f:V },
    { k:'pip_psi', t:'PIP psi', w:10, f:V },
    { k:'pdesc_psi', t:'P descarga psi', w:12, f:V },
    { k:'t_motor_f', t:'T motor °F', w:10, f:V1 },
    { k:'t_intake_f', t:'T intake °F', w:10, f:V1 },
    { k:'vib_x', t:'Vibracion X', w:10, f:'0.00' },
    { k:'vib_y', t:'Vibracion Y', w:10, f:'0.00' }
  ], d.operacional, { vacioSi: x => !x.fecha,
      titulo: 'Datos operacionales \u00b7 ultima ronda \u00b7 ' + meta.ambito,
      sub: 'Una fila por unidad con su lectura mas reciente. Las unidades sin lectura aparecen atenuadas.' });

  /* ── Historico ──
     Mismas columnas que Operacional para que las dos hojas se lean igual,
     mas el numero de ronda y los dias transcurridos desde la anterior. Va
     en crudo: es la hoja para tablas dinamicas y para llevarse los datos. */
  if (d.historico && d.historico.length){
    keHoja(wb, 'Historico', [
      { k:'unidad', t:'Unidad', w:11 }, { k:'campo', t:'Campo', w:13 },
      { k:'pad', t:'PAD', w:13 }, { k:'sistema', t:'Sistema', w:9 },
      { k:'ronda', t:'Ronda', w:7, f:V },
      { k:'fecha', t:'Fecha', w:12 },
      { k:'dias_desde_anterior', t:'Dias desde anterior', w:14, f:V },
      { k:'condicion', t:'Condicion', w:11 },
      { k:'modo_control', t:'Modo de control', w:13 },
      { k:'f_operacion_hz', t:'F operacion', w:11, f:HZ },
      { k:'f_maxima_hz', t:'F maxima', w:11, f:HZ },
      { k:'f_setpoint_hz', t:'F setpoint', w:11, f:HZ },
      { k:'hsc', t:'HSC', w:8, f:V1 },
      /* Capacidad y carga juntas: el porcentaje sin la capacidad al lado
         obliga a recordar contra qué se calculó, y esa capacidad puede
         haber cambiado dentro del mismo periodo. */
      { k:'vfd_cap_a', t:'VFD capacidad A', w:12, f:V },
      { k:'carga_vfd_pct', t:'Carga VFD %', w:11, f:PCT },
      { k:'sut_cap_kva', t:'SUT capacidad kVA', w:13, f:V },
      { k:'carga_sut_pct', t:'Carga SUT %', w:11, f:PCT },
      { k:'pst_cap_kva', t:'PST capacidad kVA', w:13, f:V },
      { k:'carga_pst_pct', t:'Carga PST %', w:11, f:PCT },
      { k:'motor_cap_a', t:'Motor capacidad A', w:13, f:V1 },
      { k:'carga_motor_pct', t:'Carga motor %', w:12, f:PCT },
      { k:'pst_v', t:'PST entrada V', w:11, f:V },
      { k:'pst_i', t:'PST entrada A', w:11, f:V },
      { k:'pst_fp', t:'PST FP', w:9, f:FP },
      { k:'pst_kw', t:'PST kW', w:10, f:V1 },
      { k:'pst_kva', t:'PST kVA', w:10, f:V1 },
      { k:'pst_thd_i', t:'PST THD I %', w:11, f:PCT },
      { k:'pst_thd_v', t:'PST THD V %', w:11, f:PCT },
      { k:'pst_desbal_v_pct', t:'PST desbal. V %', w:12, f:PCT },
      { k:'pst_desbal_i_pct', t:'PST desbal. I %', w:12, f:PCT },
      { k:'conv1_i', t:'Convertidor 1 A', w:12, f:V },
      { k:'conv2_i', t:'Convertidor 2 A', w:12, f:V },
      { k:'bus_dc_v', t:'Bus DC V', w:10, f:V },
      { k:'bus_ac_v', t:'Bus AC V', w:10, f:V },
      { k:'vfd_v', t:'VFD salida V', w:11, f:V },
      { k:'vfd_i', t:'VFD salida A', w:11, f:V },
      { k:'vfd_fp', t:'VFD FP', w:9, f:FP },
      { k:'vfd_kw', t:'VFD kW', w:10, f:V1 },
      { k:'vfd_desbal_i_pct', t:'VFD desbal. I %', w:12, f:PCT },
      { k:'sut_v', t:'SUT salida V', w:11, f:V },
      { k:'sut_i', t:'SUT salida A', w:11, f:V },
      { k:'motor_i', t:'Motor A', w:10, f:V },
      { k:'pip_psi', t:'PIP psi', w:10, f:V },
      { k:'pdesc_psi', t:'P descarga psi', w:12, f:V },
      { k:'t_motor_f', t:'T motor °F', w:10, f:V1 },
      { k:'t_intake_f', t:'T intake °F', w:10, f:V1 },
      { k:'vib_x', t:'Vibracion X', w:10, f:'0.00' },
      { k:'vib_y', t:'Vibracion Y', w:10, f:'0.00' }
    ], d.historico, {
      titulo: 'Historico de rondas \u00b7 ' + meta.ambito,
      sub: 'Todas las rondas de los ultimos 24 meses. La capacidad y la carga se resuelven a la '
         + 'fecha de cada ronda y no con el equipo instalado hoy: un cambio de equipo mueve el '
         + 'porcentaje aunque la corriente no cambie.' });

    /* ── Variacion ──
       La hoja que se mira. Diez metricas con su valor y su cambio contra
       la ronda anterior de la MISMA unidad. Se construye a mano y no con
       keHoja porque cada delta lleva color propio segun suba, baje o se
       mantenga, y eso no cabe en una definicion de columnas. */
    const va = wb.addWorksheet('Variacion', {
      views: [{ state: 'frozen', xSplit: 3, ySplit: 3 }] });

    va.getCell('A1').value = 'Variacion entre rondas · ' + meta.ambito;
    va.getCell('A1').font = { bold:true, size:13, color:{ argb:KE_C.azul } };
    va.getCell('A2').value = 'Cada metrica se compara con la ronda anterior de la misma unidad. '
      + 'Se marca "=" cuando el cambio queda dentro de la tolerancia del instrumento.';
    va.getCell('A2').font = { size:9, italic:true, color:{ argb:KE_C.gris2 } };

    /* Cabecera en dos filas: la metrica arriba, valor y cambio abajo. Una
       sola fila obligaria a repetir el nombre en cada par de columnas. */
    const FILA_H1 = 3, FILA_H2 = 4;
    const fijas = [
      { t:'Unidad', w:11 }, { t:'Fecha', w:12 }, { t:'Ronda', w:7 },
      { t:'Dias', w:7 }, { t:'Condicion', w:11 },
    ];
    let col = 1;
    fijas.forEach(f => {
      va.getColumn(col).width = f.w;
      va.mergeCells(FILA_H1, col, FILA_H2, col);
      const c = va.getCell(FILA_H1, col);
      c.value = f.t;
      c.font = { bold:true, size:9, color:{ argb:'FFFFFFFF' } };
      c.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:KE_C.azul } };
      c.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
      col += 1;
    });
    const colMetrica = {};
    KE_METRICAS.forEach(m => {
      colMetrica[m.k] = col;
      va.mergeCells(FILA_H1, col, FILA_H1, col + 1);
      const h = va.getCell(FILA_H1, col);
      h.value = m.t + (m.u ? ' (' + m.u + ')' : '');
      h.font = { bold:true, size:9, color:{ argb:'FFFFFFFF' } };
      h.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:KE_C.azul } };
      h.alignment = { horizontal:'center' };
      ['Valor','Cambio'].forEach((t, i) => {
        va.getColumn(col + i).width = i === 0 ? 10 : 11;
        const c = va.getCell(FILA_H2, col + i);
        c.value = t;
        c.font = { bold:true, size:8, color:{ argb:KE_C.gris } };
        c.alignment = { horizontal:'center' };
      });
      col += 2;
    });

    /* Se recorre en orden y se guarda la fila previa por unidad: el
       historico ya viene ordenado por unidad y fecha desde la base, asi
       que basta con recordar la anterior. */
    const previa = {};
    let fila = FILA_H2 + 1;
    d.historico.forEach(r => {
      const p = previa[r.unidad];
      va.getCell(fila, 1).value = r.unidad;
      va.getCell(fila, 1).font = { bold:true, size:9 };
      va.getCell(fila, 2).value = r.fecha;
      va.getCell(fila, 3).value = r.ronda;
      va.getCell(fila, 4).value = r.dias_desde_anterior;
      va.getCell(fila, 5).value = r.condicion || '';
      for (let i = 1; i <= 5; i++) va.getCell(fila, i).font =
        Object.assign({ size:9 }, i === 1 ? { bold:true } : {});

      KE_METRICAS.forEach(m => {
        const cv = colMetrica[m.k];
        const v = r[m.k];
        const cel = va.getCell(fila, cv);
        if (v != null){ cel.value = Number(v); cel.numFmt = m.f; }
        cel.font = { size:9 };
        cel.alignment = { horizontal:'right' };

        const { d: dd, clase } = keCambio(m, v, p ? p[m.k] : null);
        const cc = va.getCell(fila, cv + 1);
        if (clase === 'sd'){
          cc.value = '';
        } else if (clase === 'igual'){
          cc.value = KE_FLECHA.igual;
          cc.font = { size:9, color:{ argb:KE_C.gris2 } };
        } else {
          cc.value = KE_FLECHA[clase] + ' ' +
            (Math.abs(dd) >= 100 ? Math.round(dd) : Math.round(dd * 100) / 100);
          /* Rojo para arriba y verde para abajo NO se usa: en estas
             variables subir no siempre es malo -mas frecuencia puede ser
             mas produccion- y pintar juicio donde solo hay direccion
             induce a error. Se usa un color por sentido, neutro. */
          cc.font = { size:9, bold:true,
                      color:{ argb: clase === 'sube' ? KE_C.naranja : KE_C.azul } };
        }
        cc.alignment = { horizontal:'right' };
      });

      previa[r.unidad] = r;
      fila += 1;
    });

    va.autoFilter = { from:{ row:FILA_H2, column:1 }, to:{ row:FILA_H2, column:col - 1 } };

    /* ── Consolidado ──
       Una fila por unidad. Responde "como esta cada pozo y hacia donde va"
       sin tener que recorrer la hoja de Variacion pozo por pozo.

       El cambio se mide entre la PRIMERA y la ULTIMA ronda del periodo, no
       contra la ronda anterior: entre dos rondas seguidas una variable
       puede ir y volver, y lo que interesa aqui es la deriva del periodo.
       Por eso se muestran tambien los meses que abarca: un cambio de 8 °F
       en dos meses y otro en dos anos no son el mismo hallazgo. */
    const cons = wb.addWorksheet('Consolidado', {
      views: [{ state:'frozen', xSplit:1, ySplit:4 }] });

    cons.getCell('A1').value = 'Consolidado por unidad · ' + meta.ambito;
    cons.getCell('A1').font = { bold:true, size:13, color:{ argb:KE_C.azul } };
    cons.getCell('A2').value = 'Valor de la ultima ronda y deriva entre la primera y la ultima del periodo. '
      + 'No es el cambio contra la ronda anterior: eso esta en la hoja Variacion.';
    cons.getCell('A2').font = { size:9, italic:true, color:{ argb:KE_C.gris2 } };

    const CF1 = 3, CF2 = 4;
    const cFijas = [
      { t:'Unidad', w:11 }, { t:'Campo', w:13 }, { t:'PAD', w:13 },
      { t:'Rondas', w:8 }, { t:'Primera', w:12 }, { t:'Ultima', w:12 },
      { t:'Meses', w:8 }, { t:'Dias sin medir', w:12 }, { t:'Condicion', w:11 },
    ];
    let cc2 = 1;
    cFijas.forEach(f => {
      cons.getColumn(cc2).width = f.w;
      cons.mergeCells(CF1, cc2, CF2, cc2);
      const c = cons.getCell(CF1, cc2);
      c.value = f.t;
      c.font = { bold:true, size:9, color:{ argb:'FFFFFFFF' } };
      c.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:KE_C.azul } };
      c.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
      cc2 += 1;
    });
    const colM2 = {};
    KE_METRICAS.forEach(m => {
      colM2[m.k] = cc2;
      cons.mergeCells(CF1, cc2, CF1, cc2 + 1);
      const h = cons.getCell(CF1, cc2);
      h.value = m.t + (m.u ? ' (' + m.u + ')' : '');
      h.font = { bold:true, size:9, color:{ argb:'FFFFFFFF' } };
      h.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:KE_C.azul } };
      h.alignment = { horizontal:'center' };
      ['Actual','Deriva'].forEach((t, i) => {
        cons.getColumn(cc2 + i).width = i === 0 ? 10 : 11;
        const c = cons.getCell(CF2, cc2 + i);
        c.value = t;
        c.font = { bold:true, size:8, color:{ argb:KE_C.gris } };
        c.alignment = { horizontal:'center' };
      });
      cc2 += 2;
    });

    /* Se agrupa el historico por unidad conservando el orden, que ya viene
       cronologico desde la base. */
    const porUnidad = new Map();
    d.historico.forEach(r => {
      if (!porUnidad.has(r.unidad)) porUnidad.set(r.unidad, []);
      porUnidad.get(r.unidad).push(r);
    });

    let fc = CF2 + 1;
    [...porUnidad.entries()].sort((a, b) => a[0].localeCompare(b[0])).forEach(([u, rs]) => {
      const pri = rs[0], ult = rs[rs.length - 1];
      const meses = (pri.fecha && ult.fecha)
        ? Math.round(((new Date(ult.fecha) - new Date(pri.fecha)) / 2629800000) * 10) / 10
        : null;
      const dSin = ult.fecha
        ? Math.round((Date.now() - new Date(ult.fecha)) / 86400000) : null;

      const fijos = [u, ult.campo, ult.pad, rs.length, pri.fecha, ult.fecha,
                     meses, dSin, ult.condicion || ''];
      fijos.forEach((v, i) => {
        const c = cons.getCell(fc, i + 1);
        c.value = v;
        c.font = { size:9, bold: i === 0 };
        if (i >= 3 && i !== 4 && i !== 5 && i !== 8) c.alignment = { horizontal:'right' };
      });
      /* Se resalta la unidad que lleva mucho sin ronda: sin eso, una fila
         con datos de hace ocho meses se lee igual que una de la semana
         pasada. */
      if (dSin != null && dSin > 90){
        cons.getCell(fc, 8).font = { size:9, bold:true, color:{ argb:KE_C.naranja } };
      }

      KE_METRICAS.forEach(m => {
        const cv = colM2[m.k];
        const cel = cons.getCell(fc, cv);
        if (ult[m.k] != null){ cel.value = Number(ult[m.k]); cel.numFmt = m.f; }
        cel.font = { size:9 };
        cel.alignment = { horizontal:'right' };

        /* Si la ultima o la primera no tienen el dato se busca el primer y
           ultimo valor disponible de esa metrica: descartar la unidad
           entera por un hueco puntual perderia la deriva del resto. */
        const conDato = rs.filter(x => x[m.k] != null);
        const cc3 = cons.getCell(fc, cv + 1);
        if (conDato.length < 2){
          cc3.value = '';
        } else {
          const { d: dd, clase } =
            keCambio(m, conDato[conDato.length - 1][m.k], conDato[0][m.k]);
          if (clase === 'igual'){
            cc3.value = KE_FLECHA.igual;
            cc3.font = { size:9, color:{ argb:KE_C.gris2 } };
          } else {
            cc3.value = KE_FLECHA[clase] + ' ' +
              (Math.abs(dd) >= 100 ? Math.round(dd) : Math.round(dd * 100) / 100);
            cc3.font = { size:9, bold:true,
                         color:{ argb: clase === 'sube' ? KE_C.naranja : KE_C.azul } };
          }
        }
        cc3.alignment = { horizontal:'right' };
      });
      fc += 1;
    });

    cons.autoFilter = { from:{ row:CF2, column:1 }, to:{ row:CF2, column:cc2 - 1 } };
    fc += 1;
    cons.getCell(fc, 1).value =
      'Deriva = ultima ronda menos primera del periodo. ▲ subio · ▼ bajo · '
      + '= sin cambio significativo · vacio: menos de dos rondas con ese dato.';
    cons.getCell(fc, 1).font = { size:9, italic:true, color:{ argb:KE_C.gris2 } };

    /* Leyenda al pie: sin ella el "=" se lee como dato faltante. */
    fila += 1;
    va.getCell(fila, 1).value =
      '▲ subio · ▼ bajo · = sin cambio significativo · vacio: primera ronda o sin dato';
    va.getCell(fila, 1).font = { size:9, italic:true, color:{ argb:KE_C.gris2 } };
    fila += 1;
    va.getCell(fila, 1).value = 'Tolerancias: '
      + KE_METRICAS.map(m => m.t + ' ' +
          (m.abs ? '±' + m.abs + (m.u ? ' ' + m.u : '') : '') +
          (m.rel ? (m.abs ? ' o ' : '±') + (m.rel * 100) + '%' : '')).join(' · ');
    va.getCell(fila, 1).font = { size:8, color:{ argb:KE_C.gris2 } };
  }

  /* ── Detalle punto por punto ──
     Una fila por unidad y una columna por punto de medicion. Las columnas
     se arman desde lo que realmente se capturo, no desde una lista fija:
     si Captura empieza a registrar un punto nuevo aparece solo.

     Va aparte de Operacional a proposito. Operacional se lee de un
     vistazo, una fila por unidad; con setenta columnas dejaria de servir
     para eso. Aqui se viene a revisar una unidad a fondo. */
  if (d.detalle && d.detalle.length && d.puntos && d.puntos.length){
    /* Orden de columnas: por grupo de nodo siguiendo el recorrido de la
       cadena, y dentro de cada grupo por el orden del catalogo. */
    /* El catalogo de columnas llega aparte de los datos. Antes ambos
       venian en el mismo arreglo largo -una fila por unidad y punto- y
       eso hacia ~2.500 filas, por encima del tope de PostgREST: la
       respuesta se truncaba y las ultimas unidades desaparecian sin que
       nada fallara. */
    const ORDEN_GRUPO = ['PST entrada','Convertidor 1','Convertidor 2','Bus',
                         'VFD salida','SUT salida','Temperaturas',
                         'Sensor de fondo','Otros'];
    const cols = (d.puntos || []).slice().sort((a, b) => {
      const ga = ORDEN_GRUPO.indexOf(a.grupo), gb = ORDEN_GRUPO.indexOf(b.grupo);
      if (ga !== gb) return (ga < 0 ? 99 : ga) - (gb < 0 ? 99 : gb);
      if (a.orden !== b.orden) return a.orden - b.orden;
      return a.punto_codigo.localeCompare(b.punto_codigo);
    }).map(p => ({ cod:p.punto_codigo, etq:p.etiqueta, grupo:p.grupo,
                   uds:p.unidades_med || '', mezcla:!!p.mezcla_ud }));

    /* Decimales por columna, no un formato unico.
       Con '#,##0.###' Excel deja el separador decimal a la vista aunque no
       haya decimales -"467," en configuracion espanola- porque el punto
       del formato se conserva. Y poner todo a cero decimales rompe el
       factor de potencia y la vibracion. Se mira cuantos decimales trae
       realmente cada punto y se fija el formato de esa columna: asi la
       columna queda alineada y ningun valor pierde precision. */
    const decDe = v => {
      if (v == null) return 0;
      const t = String(v);
      const i = t.indexOf('.');
      if (i < 0) return 0;
      return t.slice(i + 1).replace(/0+$/, '').length;
    };
    cols.forEach(p => {
      let dmax = 0;
      d.detalle.forEach(r => {
        const v = (r.valores || {})[p.cod];
        if (v != null) dmax = Math.max(dmax, Math.min(3, decDe(v)));
      });
      p.fmt = dmax === 0 ? '#,##0' : '#,##0.' + '0'.repeat(dmax);
    });

    const filas = new Map();
    d.detalle.forEach(r => {
      filas.set(r.unidad, { unidad:r.unidad, campo:r.campo, pad:r.pad,
                            fecha:r.fecha,
                            v: r.valores || {}, dudoso: r.dudosos || {} });
    });

    const det = wb.addWorksheet('Detalle', {
      views: [{ state:'frozen', xSplit:4, ySplit:5 }],
      pageSetup: { paperSize:9, orientation:'landscape', fitToPage:true, fitToWidth:1 }
    });
    det.getCell('A1').value = 'Detalle por punto de medicion \u00b7 ' + meta.ambito;
    det.getCell('A1').font = { bold:true, size:13, color:{ argb:KE_C.azul } };
    det.getCell('A2').value = 'Ultima ronda de cada unidad, valores tal como se registraron en campo '
      + '(sin normalizar). Es la vista para revisar una unidad a fondo o rastrear un dato dudoso.';
    det.getCell('A2').font = { size:9, italic:true, color:{ argb:KE_C.gris2 } };

    const FIJAS = ['Unidad','Campo','PAD','Fecha'];
    const ANCHO = [11, 13, 13, 12];
    /* Tres filas de cabecera: grupo, etiqueta y unidad de medida. Sin el
       grupo, setenta columnas de codigos son ilegibles. */
    const F_GRP = 3, F_ETQ = 4, F_UDS = 5;
    FIJAS.forEach((t, i) => {
      det.getColumn(i + 1).width = ANCHO[i];
      det.mergeCells(F_GRP, i + 1, F_UDS, i + 1);
      const c = det.getCell(F_GRP, i + 1);
      c.value = t;
      c.font = { bold:true, size:9, color:{ argb:'FFFFFFFF' } };
      c.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:KE_C.azul } };
      c.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
    });

    let cx = FIJAS.length + 1;
    let grpIni = cx, grpAct = null;
    const cerrarGrupo = (hasta) => {
      if (grpAct == null || hasta < grpIni) return;
      if (hasta > grpIni) det.mergeCells(F_GRP, grpIni, F_GRP, hasta);
      const g = det.getCell(F_GRP, grpIni);
      g.value = grpAct;
      g.font = { bold:true, size:9, color:{ argb:'FFFFFFFF' } };
      g.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:KE_C.azul } };
      /* A la izquierda y con sangria, no centrado: un grupo puede abarcar
         veinte columnas y el rotulo centrado cae fuera de la pantalla,
         dejando la fila en blanco justo donde debia orientar. */
      g.alignment = { horizontal:'left', indent:1 };
    };
    cols.forEach(p => {
      if (p.grupo !== grpAct){ cerrarGrupo(cx - 1); grpAct = p.grupo; grpIni = cx; }
      det.getColumn(cx).width = 11;
      const e = det.getCell(F_ETQ, cx);
      e.value = p.etq;
      e.font = { bold:true, size:8, color:{ argb:KE_C.gris } };
      e.alignment = { horizontal:'center', wrapText:true };
      const u = det.getCell(F_UDS, cx);
      /* Un punto capturado con dos unidades distintas entre pozos mezcla
         escalas en la misma columna. Se marca en vez de ocultarlo. */
      u.value = p.mezcla ? p.uds + ' \u26a0' : p.uds;
      u.font = { size:8, italic:true,
                 color:{ argb: p.mezcla ? KE_C.naranja : KE_C.gris2 } };
      u.alignment = { horizontal:'center' };
      p.col = cx;
      cx += 1;
    });
    cerrarGrupo(cx - 1);
    det.getRow(F_ETQ).height = 26;

    let fy = F_UDS + 1;
    [...filas.values()].sort((a, b) => a.unidad.localeCompare(b.unidad)).forEach(f => {
      det.getCell(fy, 1).value = f.unidad;
      det.getCell(fy, 1).font = { size:9, bold:true };
      det.getCell(fy, 2).value = f.campo;
      det.getCell(fy, 3).value = f.pad;
      det.getCell(fy, 4).value = f.fecha;
      for (let i = 2; i <= 4; i++) det.getCell(fy, i).font = { size:9 };
      cols.forEach(p => {
        const c = det.getCell(fy, p.col);
        const v = f.v[p.cod];
        if (v != null) c.value = Number(v);
        c.numFmt = p.fmt;
        c.font = f.dudoso[p.cod]
          ? { size:9, italic:true, color:{ argb:KE_C.naranja } }
          : { size:9 };
        c.alignment = { horizontal:'right' };
      });
      fy += 1;
    });

    det.autoFilter = { from:{ row:F_ETQ, column:1 }, to:{ row:F_ETQ, column:cx - 1 } };
    fy += 1;
    det.getCell(fy, 1).value = 'En ambar: valor marcado como no valido en captura, o punto '
      + 'capturado con mas de una unidad de medida entre pozos.';
    det.getCell(fy, 1).font = { size:9, italic:true, color:{ argb:KE_C.gris2 } };
  }

  /* ── Placas ── */
  keHoja(wb, 'Placas', [
    { k:'unidad', t:'Unidad', w:11 }, { k:'campo', t:'Campo', w:13 },
    { k:'pad', t:'PAD', w:13 }, { k:'sistema', t:'Sistema', w:9 },
    { k:'motor_serial', t:'Motor serie', w:16 },
    { k:'motor_marca', t:'Motor marca', w:14 },
    { k:'motor_modelo', t:'Motor modelo', w:14 },
    { k:'motor_desde', t:'Motor instalado', w:13 },
    { k:'motor_sap', t:'Motor SAP', w:12 },
    { k:'motor_hp', t:'Motor HP', w:10, f:V },
    { k:'motor_v', t:'Motor V nominal', w:12, f:V },
    { k:'motor_i', t:'Motor A nominal', w:12, f:V },
    { k:'motor_aislamiento', t:'Sistema de aislamiento', w:16 },
    { k:'motor_temp_max_c', t:'T max devanado °C', w:13, f:V },
    { k:'cable_serial', t:'Cable serie', w:15 },
    { k:'cable_marca', t:'Cable marca', w:13 },
    { k:'cable_modelo', t:'Cable modelo', w:13 },
    { k:'sut_serial', t:'SUT serie', w:15 },
    { k:'sut_marca', t:'SUT marca', w:13 },
    { k:'sut_modelo', t:'SUT modelo', w:13 },
    { k:'sut_sap', t:'SUT SAP', w:11 },
    { k:'vfd_serial', t:'VFD serie', w:15 },
    { k:'vfd_marca', t:'VFD marca', w:13 },
    { k:'vfd_modelo', t:'VFD modelo', w:20 },
    { k:'vfd_sap', t:'VFD SAP', w:11 },
    { k:'pst_serial', t:'PST serie', w:15 },
    { k:'pst_marca', t:'PST marca', w:13 },
    { k:'pst_modelo', t:'PST modelo', w:13 },
    { k:'pst_sap', t:'PST SAP', w:11 }
  ], d.placas, { vacioSi: x => !x.motor_serial });

  /* ── Propuestas ── */
  if (d.propuestas.length)
    keHoja(wb, 'Propuestas', [
      { k:'unidad', t:'Unidad', w:11 }, { k:'campo', t:'Campo', w:13 },
      { k:'estado', t:'Estado', w:12 },
      { k:'creado_en', t:'Emitida', w:12 },
      { k:'f_max_previa_hz', t:'F maxima actual', w:12, f:HZ },
      { k:'f_max_propuesta', t:'F maxima propuesta', w:14, f:HZ },
      { k:'tap_previo_v', t:'TAP actual V', w:11, f:V },
      { k:'tap_solicitado_v', t:'TAP solicitado V', w:12, f:V },
      { k:'accion_tap', t:'Accion sobre el TAP', w:16,
        f:'[Blue]"\u2191 subir "#,##0" V";[Blue]"\u2193 bajar "#,##0" V";"\u2192 en punto"' },
      { k:'kw_previo', t:'Consumo actual kW', w:13, f:V1 },
      { k:'reduccion_kw', t:'Cambio de consumo kW', w:16,
        f:'[Green]"\u2193 "#,##0.0;[Red]"\u2191 "#,##0.0;[Color15]"\u2192 "0.0' },
      { k:'nota', t:'Nota', w:34 }, { k:'motivo', t:'Motivo', w:28 }
    ], d.propuestas, {
      titulo: 'Propuesta de optimizacion energetica \u00b7 ' + meta.ambito,
      sub: 'Cambio de TAP por condicion de operacion. Se listan TODAS las unidades del ambito: '
         + 'las que aun no tienen propuesta aparecen atenuadas, para ver cuantas faltan por evaluar.',
      vacioSi: x => !x.estado
    });

  /* ── Configuracion ── */
  if (d.setup.length)
    keHoja(wb, 'Configuracion VFD', [
      { k:'unidad', t:'Unidad', w:11 }, { k:'campo', t:'Campo', w:13 },
      { k:'pad', t:'PAD', w:13 }, { k:'sistema', t:'Sistema', w:9 },
      { k:'ajustado_el', t:'Ajustado el', w:12 },
      { k:'realizado_por', t:'Realizado por', w:18 },
      { k:'marca', t:'Marca del variador', w:18 },
      { k:'modo_control', t:'Modo de control', w:14 },
      { k:'modo_operacion', t:'Modo de operacion', w:15 },
      { k:'frec_min_hz', t:'F minima', w:10, f:HZ },
      { k:'frec_max_hz', t:'F maxima', w:10, f:HZ },
      { k:'frec_operacion_hz', t:'F operacion', w:11, f:HZ },
      { k:'rampa_acel_s', t:'Rampa acel. s', w:11, f:V1 },
      { k:'rampa_desacel_s', t:'Rampa desacel. s', w:12, f:V1 },
      { k:'motor_v_nominal', t:'Motor V nominal', w:12, f:V },

async function kpExportarEntrega(){
  let campos = [];
  try {
    const { data } = await kpCliente().rpc('dp_entrega_operacional');
    campos = Array.from(new Set((data || []).map(x => x.campo).filter(Boolean))).sort();
  } catch(e){}

  /* Se pregunta siempre, aunque la pantalla este filtrada: los archivos
     salen por campo y confundirlos es un error caro de deshacer. */
  const campo = prompt('Campo a exportar:\n\n' + campos.join('\n')
    + '\n\nEscriba el nombre exacto, o deje vacio para todos.',
    campos.length === 1 ? campos[0] : '');
  if (campo === null) return;
  const sistema = prompt('Sistema:  BES, HPUM o UBH.\n\n'
    + 'Deje vacio para incluir todos.', 'BES');
  if (sistema === null) return;

  const c = campo.trim() || null;
  const s = sistema.trim().toUpperCase() || null;
  const btn = document.getElementById('kpExportar');
  const previo = btn ? btn.textContent : '';
  if (btn){ btn.disabled = true; btn.textContent = 'Generando\u2026'; }

  try {
    const ExcelJS = await keExcelJS();
    const sb = kpCliente();
    const pedir = async (fn) => {
      const { data, error } = await sb.rpc(fn, { p_campo: c, p_sistema: s });
      if (error) throw new Error(fn + ': ' + error.message);
      return data || [];
    };
    const [operacional, placas, setup, protecciones] = await Promise.all([
      pedir('dp_entrega_operacional'), pedir('dp_entrega_placas'),
      pedir('dp_entrega_setup'),       pedir('dp_entrega_protecciones')
    ]);

    /* El historico va aparte del Promise.all y con su propio try: es el
       unico dato opcional del libro. Si falla -por volumen o porque la
       funcion no esta desplegada- el resto del archivo debe salir igual,
       que es lo que la gente necesita casi siempre. */
    let detalle = [], puntos = [];
    try {
      const [dd, pp] = await Promise.all([
        sb.rpc('dp_entrega_detalle',        { p_campo: c, p_sistema: s }),
        sb.rpc('dp_entrega_detalle_puntos', { p_campo: c, p_sistema: s }),
      ]);
      if (dd.error) throw new Error(dd.error.message);
      if (pp.error) throw new Error(pp.error.message);
      detalle = dd.data || [];
      puntos  = pp.data || [];
    } catch(e){
      console.warn('[Kronos-M] Detalle por punto no disponible:', e.message);
    }

    let historico = [];
    try {
      const { data, error } = await sb.rpc('dp_entrega_historico',
        { p_campo: c, p_sistema: s, p_meses: 24 });
      if (error) throw new Error(error.message);
      historico = data || [];
    } catch(e){
      console.warn('[Kronos-M] Historico no disponible:', e.message);
    }

    if (!operacional.length)
      throw new Error('No hay unidades en ese ambito. Revise el nombre del campo.');

    /* Las propuestas no se filtran por campo en la base: opt_propuestas
       no lo conoce. Se cruzan aqui contra las unidades del ambito, que
       es lo mismo y evita tocar esa funcion. */
    /* Se parte de TODAS las unidades del ambito y se cruzan las propuestas
       encima. Listar solo las que tienen propuesta oculta la pregunta mas
       util del ejercicio: cuantas faltan por evaluar. Las que no tienen
       quedan con el resto de columnas vacias y la hoja las atenua. */
    let propuestas = operacional.map(x => ({ unidad: x.unidad, campo: x.campo }));
    try {
      const { data } = await sb.rpc('opt_propuestas');
      const conProp = new Map();
      (data || [])
        .filter(p => p.estado !== 'descartada')
        .forEach(p => conProp.set(p.pozo, p));

      propuestas = operacional.map(x => {
        const p = conProp.get(x.unidad);
        if (!p) return { unidad: x.unidad, campo: x.campo };
        return {
          unidad: x.unidad, campo: x.campo, estado: p.estado,
          creado_en: (p.creado_en || '').slice(0, 10),
          f_max_previa_hz: p.f_max_previa_hz,
          f_max_propuesta: p.f_max_propuesta,
          tap_previo_v: p.tap_previo_v,
          tap_solicitado_v: p.tap_solicitado_v,
          accion_tap: (p.tap_solicitado_v != null && p.tap_previo_v != null)
            ? p.tap_solicitado_v - p.tap_previo_v : null,
          kw_previo: p.kw_previo, reduccion_kw: p.reduccion_kw,
          nota: p.nota, motivo: p.motivo
        };
      });
    } catch(e){ console.warn('[Kronos-M] Propuestas no disponibles:', e.message); }

    const hoy = new Date().toISOString().slice(0, 10);
    const ambito = (c || 'Todos los campos') + (s ? ' · ' + s : '');
    const wb = keLibro(ExcelJS,
      { operacional, placas, setup, protecciones, propuestas, historico, detalle, puntos },
      { ambito: ambito, fecha: hoy });

    const buf = await wb.xlsx.writeBuffer();
    const url = URL.createObjectURL(new Blob([buf],
      { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'datos-operacionales-'
      + (c || 'todos').replace(/[^A-Za-z0-9]+/g, '-').toLowerCase()
      + (s ? '-' + s.toLowerCase() : '') + '-' + hoy + '.xlsx';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);

    if (btn){ btn.disabled = false; btn.textContent = previo; }
  } catch(e){
    if (btn){ btn.disabled = false; btn.textContent = previo; }
    alert('No se pudo exportar. ' + e.message);
  }
}


async function kpCargarContexto(pozoId){
  if (!pozoId) return null;
  const { data, error } = await kpCliente().rpc('dp_contexto', { p_pozo_id: pozoId });
  if (error) throw new Error(error.message);
  const ctx = data || null;
  if (!ctx) return null;

  /* El aislamiento ya no sale de dp_contexto. Esa parte venia de la
     tabla de la app de captura, que quedo fuera de uso: los ensayos
     viven ahora en el modulo de Ensayos Electricos, donde quedan
     firmados, con dictamen IEEE 43 e informe.

     dp_contexto se sigue usando para la bitacora, que no cambio. Se
     pide aparte y si falla no se tumba la pantalla: el aislamiento es
     contexto, la medicion de la ronda es lo principal. */
  try {
    const r = await kpCliente().rpc('dp_aislamiento_unidad', { p_pozo_id: pozoId });
    if (!r.error) ctx.aislamiento = r.data || [];
  } catch (e) {
    console.warn('[Kronos-M] Aislamiento no disponible:', e.message);
    ctx.aislamiento = [];
  }
  return ctx;
}

function kpNum(v){
  if (v == null) return '\u2014';
  const n = Number(v);
  if (!isFinite(n)) return '\u2014';
  return (Math.abs(n) >= 100) ? n.toFixed(0) : n.toFixed(2);
}

/* Los porcentajes llevan siempre un decimal. Con kpNum, una carga de
   119.58 % se redondeaba a "120" en el resumen y salia "119.6" en la
   cadena: dos cifras distintas del mismo dato en la misma pantalla. */
/* Etiqueta de eje: sin decimales de relleno. 10, no 10.00. */
function kpEje(v){
  const n = Number(v);
  if (!isFinite(n)) return '';
  return (Math.abs(n) >= 10 || n === Math.round(n))
    ? String(Math.round(n * 100) / 100)
    : n.toFixed(1);
}

/* Temperaturas en Fahrenheit. El panel de superficie las entrega en F,
   el tecnico las captura en F y las piensa en F; la base las guarda en
   la unidad canonica (C) para poder compararlas entre pozos. Aqui se
   devuelven a la escala en la que se leyeron.

   Ademas se descarta el cero espurio: -17.78 C son exactamente 0 F, y
   un 0 F en un motor de fondo operando no existe. Es el campo que
   quedo vacio y se guardo como cero. Mostrarlo como temperatura seria
   dar por medido algo que nadie midio. */
function kpTempF(celsius){
  if (celsius == null) return null;
  const c = Number(celsius);
  if (!isFinite(c)) return null;
  const f = c * 9 / 5 + 32;
  if (f <= 0.01) return null;          /* 0 F o menos: dato invalido */
  return f;
}

function kpNumF(celsius){
  const f = kpTempF(celsius);
  return f == null ? '\u2014' : f.toFixed(1);
}

function kpPct(v){
  if (v == null) return '\u2014';
  const n = Number(v);
  return isFinite(n) ? n.toFixed(1) : '\u2014';
}

/* ============================================================
   DATOS DE DEMOSTRACION
   ============================================================ */
/* ============================================================
   CALCULO ELECTRICO SOBRE LA MEDICION DE CAMPO
   Formulas verificadas contra resultados conocidos:
     desbalance = max(|x - promedio|) / promedio * 100   (NEMA)
     carga      = I_promedio / I_nominal * 100
     kVA        = raiz(3) * V_promedio * I_promedio / 1000
     balance de rectificadores = |I1 - I2| / promedio(I1,I2) * 100
   ============================================================ */
const RT3 = Math.sqrt(3);

function kpProm(vs){
  const l = vs.filter(v => v != null && isFinite(v));
  if (!l.length) return null;
  return l.reduce((a,b) => a + b, 0) / l.length;
}
function kpDesbal(vs){
  const l = vs.filter(v => v != null && isFinite(v));
  if (l.length < 2) return null;
  const p = kpProm(l);
  if (!p) return null;
  return Math.max.apply(null, l.map(v => Math.abs(v - p))) / p * 100;
}
function kpEstadoCarga(pct){
  if (pct == null) return 'none';
  if (pct > 100) return 'crit';
  if (pct >= 95) return 'warn';
  return 'ok';
}
/* Desbalance de TENSION. NEMA MG-1 marca el derateo del motor desde
   1 % y desaconseja operar por encima de 5 %. */
function kpEstadoDesbal(pct){
  if (pct == null) return 'none';
  if (pct > 2)   return 'crit';
  if (pct > 1)   return 'warn';
  return 'ok';
}

/* Desbalance de CORRIENTE. No lleva el mismo umbral que la tension:
   un desbalance de tension pequeno produce uno de corriente entre seis
   y diez veces mayor, asi que juzgar la corriente contra el 2 % de la
   tension pinta en rojo una flota que esta bien. La practica en ESP es
   revisar desde 5 % y actuar sobre 10 %.

   Con el criterio anterior, las cinco etapas de CYC-54 salian en
   critico con valores de 4 a 6 %, que son normales. */
function kpEstadoDesbalI(pct){
  if (pct == null) return 'none';
  if (pct > 10)  return 'crit';
  if (pct > 5)   return 'warn';
  return 'ok';
}

/* Cada etapa declara sus tres corrientes, sus tres tensiones y de
   donde sale su nominal. Si no hay nominal, no se inventa carga. */
/* `tipo` decide el simbolo y de que lado de la linea de terreno se
   dibuja. `nom_kva` es la placa en kVA cuando existe: el PST y el SUT la
   traen, los secundarios no -repartir el kVA del PST entre sus dos
   devanados supondria mitad y mitad, que no siempre es cierto- y el motor
   tampoco, porque se especifica en HP. */
const KP_ETAPAS = [
  {nodo:'PST entrada', detalle:'Primario', tipo:'trafo', zona:'sup',
   i:['pst_in_i_a','pst_in_i_b','pst_in_i_c'],
   v:['pst_in_v_ab','pst_in_v_ac','pst_in_v_bc'],
   nom:'pst_i_entrada_a', nom_kva:'pst_kva'},

  {nodo:'PST \u0394', detalle:'Sec. delta', tipo:'trafo', zona:'sup',
   i:['conv1_i_a','conv1_i_b','conv1_i_c'],
   v:['conv1_v_ab','conv1_v_ac','conv1_v_bc'],
   nom:'pst_i_secundario_a'},

  {nodo:'PST Y', detalle:'Sec. estrella', tipo:'trafo', zona:'sup',
   i:['conv2_i_a','conv2_i_b','conv2_i_c'],
   v:['conv2_v_ab','conv2_v_ac','conv2_v_bc'],
   nom:'pst_i_secundario_a'},

  /* La entrada del VFD no se mide: es la suma de los dos
     secundarios del PST, contrastada contra el Amp Input. */
  {nodo:'VFD entrada', detalle:'Suma \u0394 + Y', tipo:'vfd', zona:'sup', nom_kva:'vfd_kva',
   i_suma:[['conv1_i_a','conv1_i_b','conv1_i_c'],
           ['conv2_i_a','conv2_i_b','conv2_i_c']],
   v:['conv1_v_ab','conv1_v_ac','conv1_v_bc'],
   nom:'vfd_i_entrada_a'},

  {nodo:'VFD salida', detalle:'Salida', tipo:'vfd', zona:'sup', nom_kva:'vfd_kva',
   i:['vfdout_i_a','vfdout_i_b','vfdout_i_c'],
   v:['vfdout_v_ab','vfdout_v_ac','vfdout_v_bc'],
   nom:'vfd_i_nominal_a'},

  {nodo:'SUT salida', detalle:'Al cable', tipo:'trafo', zona:'sup', nom_kva:'sut_kva',
   i:['sutout_i_a','sutout_i_b','sutout_i_c'],
   v:['sutout_v_ab','sutout_v_ac','sutout_v_bc'],
   nom:'sut_i_nominal_a'},

  /* Mismo valor medido que el SUT, contra el nominal del motor. */
  {nodo:'Motor', detalle:'De fondo', tipo:'motor', zona:'fondo',
   i:['sutout_i_a','sutout_i_b','sutout_i_c'],
   v:['sutout_v_ab','sutout_v_ac','sutout_v_bc'],
   nom:'motor_i_nominal_a'}
];

function kpCalcularCadena(val, placa){
  const out = [];
  KP_ETAPAS.forEach(e => {
    let ii = null, ip = null;
    if (e.i_suma){
      const partes = e.i_suma.map(g => kpProm(g.map(c => val[c])));
      if (partes.some(x => x == null)) return;
      ip = partes.reduce((a,b) => a + b, 0);
    } else {
      ii = e.i.map(c => val[c]);
      ip = kpProm(ii);
    }
    const vv = e.v.map(c => val[c]);
    const vp = kpProm(vv);
    if (ip == null) return;
    const nominal = e.nom && placa ? placa[e.nom] : null;
    const pct = nominal ? (ip / nominal * 100) : null;
    const kvaNom = e.nom_kva && placa ? placa[e.nom_kva] : null;
    out.push({
      nodo: e.nodo, detalle: e.detalle,
      tipo: e.tipo || 'trafo', zona: e.zona || 'sup',
      kva_nom: kvaNom || null,
      medido: Math.round(ip * 10) / 10,
      nominal: nominal || null,
      unidad: 'A',
      v_prom: vp,
      kva: (vp != null) ? RT3 * vp * ip / 1000 : null,
      desbal_i: ii ? kpDesbal(ii) : null,
      desbal_v: kpDesbal(vv),
      carga_pct: pct,
      estado: nominal ? kpEstadoCarga(pct) : 'none'
    });
  });
  return out;
}

function kpBalanceRectificadores(val){
  const i1 = kpProm([val.conv1_i_a, val.conv1_i_b, val.conv1_i_c]);
  const i2 = kpProm([val.conv2_i_a, val.conv2_i_b, val.conv2_i_c]);
  if (i1 == null || i2 == null) return null;
  const prom = (i1 + i2) / 2;
  const dif = Math.abs(i1 - i2) / prom * 100;
  return {
    conv1: i1, conv2: i2, diferencia_pct: dif,
    mayor: (i1 >= i2) ? 'secundario delta' : 'secundario estrella',
    estado: dif > 10 ? 'crit' : (dif > 5 ? 'warn' : 'ok')
  };
}

/* Umbrales de FP y THD: los de FP son criterio operativo comun en
   O&G; los de THD de tension en salida de VFD no aplican como falla
   porque la onda PWM distorsiona por diseno. Se marcan como
   informativos y no como hallazgo. */
function kpCalidadEnergia(val){
  const p = [];
  const punto = (pref, nombre, esSalidaVfd) => {
    const fp = val[pref+'_fp'], thdv = val[pref+'_thdv'], thdi = val[pref+'_thd'];
    if (fp == null && thdv == null && thdi == null) return;
    const al = [];
    if (fp != null){
      if (fp <= 0.80)      al.push({t:'crit', m:'Factor de potencia ' + fp.toFixed(2) + ' (critico si es 0.80 o menos)'});
      else if (fp <= 0.85) al.push({t:'warn', m:'Factor de potencia ' + fp.toFixed(2) + ' (atencion si es 0.85 o menos)'});
    }
    if (thdv != null && esSalidaVfd)
      al.push({t:'info', m:'THD de tension ' + thdv.toFixed(1) + ' %. Valor esperable en salida de VFD sin filtro senoidal: la onda PWM distorsiona por diseno. No es falla.'});
    else if (thdv != null && thdv > 8)
      al.push({t:'warn', m:'THD de tension ' + thdv.toFixed(1) + ' % en red (IEEE 519 sugiere 8 % para sistemas de este nivel)'});
    p.push({
      nombre: nombre, fp: fp, thdv: thdv, thdi: thdi,
      factork: val[pref+'_factork'],
      kw: val[pref+'_kw'], kvar: val[pref+'_kvar'], kva: val[pref+'_kva'],
      alertas: al
    });
  };
  punto('pst_in',  'Entrada PST (red)', false);
  punto('vfdout',  'Salida VFD (al motor)', true);
  return p;
}

function kpTemperaturas(val){
  const defs = [
    ['hs1_c','Disipador 1'], ['hs2_c','Disipador 2'],
    ['hs3_c','Disipador 3'], ['hs4_c','Disipador 4'],
    ['temp_inductor_c','Inductor'], ['temp_controller_c','Controlador'],
    ['temp_igbt_u_c','IGBT U'], ['temp_igbt_v_c','IGBT V'], ['temp_igbt_w_c','IGBT W'],
    ['temp_pst_c','PST'], ['temp_sut_c','SUT']
  ];
  return defs.filter(d => kpTempF(val[d[0]]) != null)
             .map(d => ({ nombre: d[1], valor: kpTempF(val[d[0]]) }));
}

/* El buscador y el boton Limpiar se mueven entre las dos barras en
   lugar de duplicarse: asi no hay dos valores que sincronizar y lo
   escrito sobrevive a un giro de pantalla. */
function kpUbicarControles(){
  const b = document.getElementById('kpBuscar');
  const l = document.getElementById('kpLimpiar');
  if (!b || !l) return;
  const destino = kpMQ.matches ? document.getElementById('kpFBus')
                               : document.getElementById('kpFiltros2');
  if (b.parentNode !== destino){
    destino.appendChild(b);
    destino.appendChild(l);

  /* El boton de exportar nacio dentro de kpFBar, que es la barra compacta
     y esta oculta por CSS en pantalla ancha: en escritorio el boton
     desaparecia con ella. Se reubica igual que el buscador. */
  const x = document.getElementById('kpExportar');
  if (x && x.parentNode !== destino) destino.appendChild(x);
}

/* Deja los dos juegos de controles diciendo lo mismo. */
function kpSincronizar(){
  document.querySelectorAll('#kpFiltros .kp-chip[data-s]')
    .forEach(x => x.classList.toggle('on', x.dataset.s === kpFiltro));
  document.querySelectorAll('#kpCampos .kp-chip')
    .forEach(x => x.classList.toggle('on', x.dataset.c === kpCampo));
  const e = document.getElementById('kpEstadoSel'); if (e) e.value = kpFiltro;
  const c = document.getElementById('kpCampoSel');  if (c) c.value = kpCampo;
  const p = document.getElementById('kpPad');       if (p) p.value = kpPad;
  const m = document.getElementById('kpPadSel');    if (m) m.value = kpPad;

     que decide si la barra de desplegables existe segun el ancho. */
  document.getElementById('kpFBar').style.display  = v ? '' : 'none';
  document.getElementById('kpPanel').style.display = v ? '' : 'none';
}

function kpPeor(lista){
  let r = "ok";
  for (const x of lista){
    if (x.estado === "crit") return "crit";
    if (x.estado === "warn") r = "warn";
  }
  return r;
}

/* ============================================================
   VISTA: FLOTA
   ============================================================ */
async function kpVerFlota(){
  kpVistaActual = 'flota';
  kpEnDemanda   = false;
  kpDemPozo     = null;
  document.body.classList.remove('kp-oscuro');
  document.getElementById("kpBack").style.display = "none";
  document.getElementById("kpBack").innerHTML = '&larr; Volver a flota';
  kpMostrarFiltros(true);
  document.getElementById("kpTitulo").textContent = "Monitoreo de Condici\u00f3n";
  document.getElementById("kpSub").innerHTML =
    "Monitoreo de condici&oacute;n y diagn&oacute;stico de m&aacute;quinas";
  const v = document.getElementById("kpVista");
  v.innerHTML = '<div class="kp-msg">Cargando&hellip;</div>';
  try {
    kpFlota = await kpCargarFlota();
  } catch (e) {
    v.innerHTML = '<div class="kp-msg">No se pudo cargar la flota.<br>' + e.message + '</div>';
    return;
  }
  /* La potencia es informacion adicional: si su RPC falla o todavia no
     esta desplegada, la pantalla de flota tiene que seguir sirviendo. */
  try {
    kpPot = await kpCargarPotencia();
  } catch (e) {
    kpPot = {};
    console.warn('[Kronos-M] Sin potencia en acometida:', e.message);
  }
  kpPoblarFiltros();
  kpPintarFlota();
}

/* Los campos y los PAD salen de los datos, no de una lista fija: si
   entra un pozo de un PAD nuevo aparece solo, y si un PAD se retira
   deja de estorbar en el filtro. */
function kpPoblarFiltros(){
  const campos = [...new Set(kpFlota.map(x => x.campo).filter(c => c && c !== '\u2014'))].sort();
  let h = '<button class="kp-chip on" data-c="all">Todos</button>';
  campos.forEach(c => {
    h += '<button class="kp-chip" data-c="' + kpEsc(c) + '">' + kpEsc(c) + '</button>';
  });
  document.getElementById('kpCampos').innerHTML = h;

  const sel = document.getElementById('kpCampoSel');
  if (sel) {
    sel.innerHTML = '<option value="all">Todos los campos</option>'
      + campos.map(c => '<option value="' + kpEsc(c) + '">' + kpEsc(c) + '</option>').join('');
  }
  kpPoblarPads();
  kpSincronizar();
}

/* Los PAD se limitan al campo elegido. Ofrecer los PAD de Put Sur
   cuando esta filtrado Put Norte solo produce listas vacias. */
function kpPoblarPads(){
  const pads = [...new Set(kpFlota
    .filter(x => kpCampo === 'all' || x.campo === kpCampo)
    .map(x => x.pad).filter(p => p && p !== '\u2014'))].sort();

  /* Se conserva la seleccion si el PAD sigue existiendo en el campo
     nuevo; si no, se vuelve a Todos en lugar de dejar un filtro
     invisible que no coincide con nada. */
  if (pads.indexOf(kpPad) < 0) kpPad = 'all';

  const ops = pads.map(p => '<option value="' + kpEsc(p) + '">' + kpEsc(p) + '</option>').join('');
  const sel = document.getElementById('kpPad');
  if (sel) { sel.innerHTML = '<option value="all">Todos</option>' + ops; sel.value = kpPad; }
  const mov = document.getElementById('kpPadSel');
  if (mov) { mov.innerHTML = '<option value="all">Todos los PAD</option>' + ops; mov.value = kpPad; }
}

function kpLimpiarFiltros(){
  kpFiltro = 'all';
  kpCampo  = 'all';
  kpPad    = 'all';
  document.getElementById('kpBuscar').value = '';
  kpPoblarPads();
  kpSincronizar();
  kpPintarFlota();
}

/* ============================================================
   DEMANDA ENERGETICA
   La acometida dejo de ser un panel plegado dentro de la lista de
   rondas y paso a ser una pantalla propia. Motivos: la pregunta que
   responde es distinta (cuanto consume el activo, no a que unidad
   hay que ir), y para responderla bien hace falta jerarquia. Un
   total de flota no dice nada; un total por PAD decide una compra
   de transformador.

   La navegacion del tablero escribe sobre kpCampo y kpPad, los
   mismos filtros de la vista de flota. Asi, bajar a un PAD aqui y
   cerrar el tablero deja la lista de unidades en ese mismo PAD: no
   hay dos estados que sincronizar.

   El estado de ronda (vigente / vencida) no participa. La demanda
   de un PAD es la que es, sin importar si la ronda esta vencida.
   ============================================================ */

let kpEnDemanda   = false;
let kpDemPozo     = null;   /* hoja de la jerarquia: unidad individual */
let kpVistaActual = 'flota';

const KD_HEX = ['var(--serie-1)','var(--serie-2)','var(--serie-3)','var(--serie-4)',
                     'var(--serie-5)','var(--serie-6)','var(--serie-7)'];

/* El boton informa plegado: quien no entre al tablero igual se lleva
   el total del alcance que esta mirando. */
function kpBotonDemanda(ambito){
  const con = ambito.map(x => ({ u: x, p: kpPot[x.pozo] }))
                    .filter(r => r.p && r.p.kw != null);

  if (!con.length){
    return '<div class="kp-dem-btn nd">'
      + '<span class="ic">&#9889;</span>'
      + '<span class="tx"><span class="t1">Demanda energ&eacute;tica</span>'
      +   '<span class="t2">Sin acometidas medidas en este alcance</span></span>'
      + '<span class="vl"><span>sin datos</span></span>'
      + '<span class="fw">&nbsp;</span></div>';
  }

  const t = kpDemTotales(con);
  return '<button class="kp-dem-btn" onclick="kpVerDemanda()">'
    + '<span class="ic">&#9889;</span>'
    + '<span class="tx"><span class="t1">Demanda energ&eacute;tica</span>'
    +   '<span class="t2">Tablero por campo, PAD y unidad</span></span>'
    + '<span class="vl"><b>' + t.kw.toFixed(0) + '<small>kW</small></b>'
    +   '<span>' + con.length + (con.length === 1 ? ' unidad' : ' unidades')
    +   ' &middot; FP ' + (t.fp != null ? t.fp.toFixed(2) : '\u2014') + '</span></span>'
    + '<span class="fw">&rsaquo;</span></button>';
}

/* Optimizacion no es una vista de esta pantalla: lee sus propias
   tablas y produce una propuesta que se registra y se sigue. Por eso
   vive en su archivo y aqui solo hay la puerta. Se abre encima, con
   el campo y el PAD que el usuario ya tenga puestos, para que no
   tenga que volver a filtrar lo mismo. */
function kpBotonOptimizacion(){
  return '<button class="kp-dem-btn kp-opt-btn" onclick="kpAbrirOptimizacion()">'
    + '<span class="ic">&#9881;</span>'
    + '<span class="tx"><span class="t1">Optimizaci&oacute;n energ&eacute;tica</span>'
    +   '<span class="t2">Propuesta de cambio de TAP por condici&oacute;n de operaci&oacute;n</span></span>'
    + '<span class="fw">&rsaquo;</span></button>';
}

function kpAbrirOptimizacion(){
  const cap = document.getElementById('kpOptCapa');
  const marco = document.getElementById('kpOptMarco');
  const q = [];
  if (kpCampo !== 'all') q.push('campo=' + encodeURIComponent(kpCampo));
  if (kpPad   !== 'all') q.push('pad='   + encodeURIComponent(kpPad));
  /* Se apunta cada vez: el alcance de la pantalla de atras pudo
     cambiar entre una apertura y otra. */
  marco.src = 'optimizacion.html' + (q.length ? '?' + q.join('&') : '');
  document.getElementById('kpOptCtx').textContent =
    (kpCampo === 'all' ? 'Toda la flota' : kpCampo)
    + (kpPad === 'all' ? '' : ' \u00b7 ' + kpPad);
  cap.classList.add('abierta');
  document.body.classList.add('kp-sin-scroll');
}

function kpCerrarOptimizacion(){
  document.getElementById('kpOptCapa').classList.remove('abierta');
  document.body.classList.remove('kp-sin-scroll');
  /* Se libera el iframe para que no siga consumiendo ni conserve
     una sesion de trabajo a medias que confunda al reabrir. */
  document.getElementById('kpOptMarco').src = 'about:blank';
}

/* Total del conjunto. La aparente se recompone de la activa y la
   reactiva sumadas: sumar kVA individuales da de mas siempre que los
   factores de potencia difieran, que es el caso normal en campo. */
function kpDemTotales(rs){
  const s = k => rs.reduce((a, r) => a + (r.p[k] != null ? r.p[k] : 0), 0);
  const kw   = s('kw');
  const kvar = s('kvar');
  const kva  = Math.sqrt(kw * kw + kvar * kvar);
  const thds = rs.map(r => r.p.thd_i).filter(v => v != null);
  return {
    kw: kw, kvar: kvar, kva: kva,
    fp: kva ? kw / kva : null,
    n: rs.length,
    thd: thds.length ? thds.reduce((a, b) => a + b, 0) / thds.length : null
  };
}

/* Las filas del tablero salen del cruce entre la flota (que tiene
   campo y PAD) y la RPC de potencia (que tiene la medida). Una
   unidad sin acometida medida no entra al total, y eso se dice en
   la nota al pie en lugar de disimularlo. */
function kpDemFilas(){
  return kpFlota
    .filter(x => kpCampo === 'all' || x.campo === kpCampo)
    .filter(x => kpPad   === 'all' || x.pad   === kpPad)
    .filter(x => !kpDemPozo || x.pozo === kpDemPozo)
    .map(x => ({ u: x, p: kpPot[x.pozo] }));
}

function kpDemNivel(){
  if (kpDemPozo)        return 3;
  if (kpPad   !== 'all') return 2;
  if (kpCampo !== 'all') return 1;
  return 0;
}

/* Agrupa por la dimension que corresponde al nivel y ordena por
   demanda descendente: lo que mas pesa arriba. */
function kpDemGrupos(con, clave){
  const m = new Map();
  con.forEach(r => {
    const k = r.u[clave] || '\u2014';
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(r);
  });
  return [...m.entries()]
    .map(([k, v]) => Object.assign({ nombre: k }, kpDemTotales(v)))
    .sort((a, b) => b.kw - a.kw);
}

function kpDemBajar(valor){
  const n = kpDemNivel();
  if (n === 0){ kpCampo = valor; kpPoblarPads(); }
  else if (n === 1){ kpPad = valor; }
  else if (n === 2){ kpDemPozo = valor; }
  kpSincronizar();
  kpPintarDemanda();
}

/* La miga de pan sube: el nivel al que se toca queda como ultimo. */
function kpDemSubir(n){
  if (n <= 0){ kpCampo = 'all'; kpPad = 'all'; kpDemPozo = null; kpPoblarPads(); }
  else if (n === 1){ kpPad = 'all'; kpDemPozo = null; kpPoblarPads(); }
  else if (n === 2){ kpDemPozo = null; }
  kpSincronizar();
  kpPintarDemanda();
}

function kpVerDemanda(){
  if (!kpEnDemanda) kpDemPozo = null;   /* entrada nueva: desde la raiz */
  kpEnDemanda   = true;
  kpVistaActual = 'demanda';
  document.body.classList.add('kp-oscuro');
  kpMostrarFiltros(false);
  const b = document.getElementById('kpBack');
  b.style.display = 'block';
  b.innerHTML = '&larr; Volver a flota';
  document.getElementById('kpTitulo').textContent = 'Demanda Energ\u00e9tica';
  document.getElementById('kpSub').innerHTML =
    'Acometida medida por campo, PAD y unidad';
  kpPintarDemanda();
}

function kpCerrarDemanda(){
  kpEnDemanda   = false;
  kpDemPozo     = null;
  kpVistaActual = 'flota';
  document.body.classList.remove('kp-oscuro');
  document.getElementById('kpBack').style.display = 'none';
  document.getElementById('kpBack').innerHTML = '&larr; Volver a flota';
  kpMostrarFiltros(true);
  document.getElementById('kpTitulo').textContent = 'Monitoreo de Condici\u00f3n';
  document.getElementById('kpSub').innerHTML =
    'Monitoreo de condici&oacute;n y diagn&oacute;stico de m&aacute;quinas';
  kpSincronizar();
  kpPintarFlota();
}

/* Un solo boton de cabecera para tres vistas. Desde el diagnostico de
   una unidad abierta desde el tablero se vuelve al tablero, no a la
   flota: se perderia el punto de la jerarquia en el que estaba. */
function kpAtras(){
  if (kpVistaActual === 'pozo' && kpEnDemanda) kpVerDemanda();
  else if (kpVistaActual === 'demanda')        kpCerrarDemanda();
  else                                         kpVerFlota();
}

function kpPintarDemanda(){
  const v = document.getElementById('kpVista');
  const todas = kpDemFilas();
  const con   = todas.filter(r => r.p && r.p.kw != null);
  const sin   = todas.length - con.length;
  const nivel = kpDemNivel();

  let h = '<div class="kd">' + kpDemMiga();

  if (!con.length){
    h += '<div class="kd-card"><div class="kd-vacio">'
      +  'Ninguna de las ' + todas.length
      +  (todas.length === 1 ? ' unidad de este alcance tiene'
                             : ' unidades de este alcance tienen')
      +  ' acometida medida.<br>La demanda se calcula sobre el punto de '
      +  'entrada al PST capturado en ronda.</div></div></div>';
    v.innerHTML = h;
    return;
  }

  const t = kpDemTotales(con);
  h += kpDemHero(t, con, nivel);

  if (nivel < 3){
    const clave = nivel === 0 ? 'campo' : (nivel === 1 ? 'pad' : 'pozo');
    const gr    = kpDemGrupos(con, clave);
    const tit   = nivel === 0 ? 'Demanda por campo'
                : (nivel === 1 ? 'Demanda por PAD' : 'Demanda por unidad');

    h += '<div class="kd-grid">'
      +  '<div class="kd-card"><div class="ct"><b>' + tit + '</b>'
      +    '<span>Toque para bajar</span></div>'
      +    kpDemBarras(gr, nivel) + '</div>'
      +  '<div class="kd-card"><div class="ct"><b>Participaci&oacute;n</b>'
      +    '<span>% de kW</span></div>' + kpDemDonut(gr, t.kw) + '</div>'
      +  '</div>';
  } else {
    h += kpDemUnidad(con[0]);
  }
