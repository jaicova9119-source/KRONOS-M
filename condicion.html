        +  (pt.kva  != null ? kpNum(pt.kva)  + ' kVA' : '')
        +  '</div>'
        +  '<div class="r">THD tensi&oacute;n ' + kpNum(pt.thdv) + ' %'
        +  ' &middot; THD corriente ' + kpNum(pt.thdi) + ' %'
        +  (pt.factork != null ? ' &middot; Factor K ' + kpNum(pt.factork) : '') + '</div>';
      pt.alertas.forEach(a => {
        const cls = (a.t === 'info') ? 'none' : a.t;
        h += '<div style="margin-top:6px"><span class="kp-pill ' + cls + '">'
          +  (a.t === 'info' ? 'Informativo' : (a.t === 'crit' ? 'Cr&iacute;tico' : 'Atenci&oacute;n'))
          +  '</span></div>'
          +  '<div class="r" style="margin-top:5px">' + a.m + '</div>';
      });
      h += '</div>';
    });
    h += '</div>';
  }

  if (tmp.length){
    h += '<h2>Temperaturas</h2>';
    h += '<p class="hint">Puntos medidos en el gabinete y transformadores</p>';
    h += '<div class="kp-kpis" style="margin-bottom:8px">';
    tmp.forEach(t => {
      h += '<div class="kp-kpi"><div class="k">' + t.nombre + '</div>'
        +  '<div class="v">' + kpNum(t.valor) + '<small>\u00b0C</small></div></div>';
    });
    h += '</div>';
  }

  if (placa.motor_i_nominal_a || placa.motor_potencia_hp){
    h += '<h2>Placa</h2>';
    h += '<p class="hint">Origen: ' + (placa.fuente || 'no indicado')
      +  (placa.actualizado_en ? ' &middot; actualizada ' + String(placa.actualizado_en).slice(0,10) : '')
      +  '</p>';
    h += '<div class="kp-kpis" style="margin-bottom:8px">';
    const pl = [
      ['Motor', placa.motor_potencia_hp, 'hp'],
      ['Tensi&oacute;n motor', placa.motor_v_nominal_v, 'V'],
      ['Corriente motor', placa.motor_i_nominal_a, 'A'],
      ['Corriente VFD', placa.vfd_i_nominal_a, 'A'],
      ['Motores', placa.n_motores, ''],
      ['Aislamiento', placa.motor_clase_aisl, '']
    ];
    pl.forEach(x => {
      if (x[1] == null) return;
      const vv = (typeof x[1] === 'number') ? kpNum(x[1]) : x[1];
      h += '<div class="kp-kpi"><div class="k">' + x[0] + '</div>'
        +  '<div class="v">' + vv + (x[2] ? '<small>' + x[2] + '</small>' : '') + '</div></div>';
    });
    h += '</div>';
  }

  return h;
}

function kpDibujarCadena(nodos){
  const n = nodos.length;
  const w = 132, gap = 20, mx = 20, alto = 178;
  const anchoTot = mx * 2 + n * w + (n - 1) * gap;

  /* Tope duro de ancho: si el texto estimado excede la caja, se
     comprime con textLength en lugar de desbordarse. */
  const cab = (txt, cx, y, px, peso, color, max) => {
    const est = String(txt).length * px * 0.53;
    const tl = (est > max) ? ' textLength="' + max + '" lengthAdjust="spacingAndGlyphs"' : '';
    return '<text x="' + cx + '" y="' + y + '" text-anchor="middle" font-size="' + px
         + '" font-weight="' + peso + '" fill="' + color + '" font-family="inherit"'
         + tl + '>' + txt + '</text>';
  };

  let s = '<div class="kp-chain-wrap" style="--kp-chain-w:' + anchoTot + 'px">'
        + '<svg class="kp-chain" viewBox="0 0 ' + anchoTot + ' ' + alto
        + '" width="' + anchoTot + '" height="' + alto
        + '" role="img" xmlns="http://www.w3.org/2000/svg">'
        + '<title>Cadena energ&eacute;tica</title>'
        + '<defs><marker id="kpAr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" '
        + 'markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#94949a" '
        + 'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';

  nodos.forEach((nd, i) => {
    const x = mx + i * (w + gap);
    const cx = x + w / 2;
    const col = KP_HEX[nd.estado] || KP_HEX.none;
    const pct = (nd.nominal && nd.medido != null) ? (nd.medido / nd.nominal * 100) : null;
    const max = w - 12;

    s += '<rect x="' + x + '" y="18" width="' + w + '" height="132" rx="8" fill="#fff" '
      +  'stroke="' + col + '" stroke-width="1.5"/>';
    s += '<rect x="' + x + '" y="18" width="' + w + '" height="5" rx="2" fill="' + col + '"/>';
    s += kpSimbolo(nd.nodo, cx, 50, col);

    s += cab(nd.nodo, cx, 90, 13, 600, '#1c1c1e', max);
    s += cab(pct == null ? 'Sin placa' : (Math.round(pct * 10) / 10) + ' %',
             cx, 110, pct == null ? 12 : 16, 600, pct == null ? '#94949a' : col, max);
    s += cab(nd.detalle || '', cx, 126, 10.5, 400, '#6b6b70', max);
    s += cab(nd.nominal ? (kpNum(nd.medido) + ' / ' + kpNum(nd.nominal) + ' ' + nd.unidad)
                        : (kpNum(nd.medido) + ' ' + nd.unidad),
             cx, 141, 10.5, 400, '#94949a', max);

    if (i < n - 1){
      s += '<line x1="' + (x + w + 3) + '" y1="84" x2="' + (x + w + gap - 3) + '" y2="84" '
        +  'stroke="#94949a" stroke-width="1.5" marker-end="url(#kpAr)"/>';
    }
  });
  return s + '</svg></div>'
       + '<div class="kp-chain-hint">Desliza en horizontal para ver las '
       + n + ' etapas.</div>';
}

function kpSimbolo(nombre, cx, cy, col){
  const t = (nombre || "").toUpperCase();
  if (t.indexOf("VFD") >= 0){
    return '<rect x="' + (cx - 17) + '" y="' + (cy - 13) + '" width="34" height="26" rx="3" '
      + 'fill="none" stroke="' + col + '" stroke-width="1.6"/>'
      + '<path d="M' + (cx - 12) + ' ' + cy + ' q4 -10 7 0 q4 10 7 0" fill="none" stroke="' + col
      + '" stroke-width="1.4"/>';
  }
  if (t.indexOf("MOTOR") >= 0){
    return '<circle cx="' + cx + '" cy="' + cy + '" r="15" fill="none" stroke="' + col
      + '" stroke-width="1.6"/>'
      + '<text x="' + cx + '" y="' + (cy + 4) + '" text-anchor="middle" font-size="12" '
      + 'fill="' + col + '" font-family="inherit">M</text>';
  }
  return '<circle cx="' + (cx - 7) + '" cy="' + cy + '" r="11" fill="none" stroke="' + col
    + '" stroke-width="1.6"/>'
    + '<circle cx="' + (cx + 7) + '" cy="' + cy + '" r="11" fill="none" stroke="' + col
    + '" stroke-width="1.6"/>';
}

function kpLeyenda(){
  return '<div class="kp-leg">'
    + '<span><i style="background:' + KP_HEX.ok   + '"></i>hasta 95 %</span>'
    + '<span><i style="background:' + KP_HEX.warn + '"></i>95 a 100 %</span>'
    + '<span><i style="background:' + KP_HEX.crit + '"></i>sobre 100 %</span>'
    + '<span><i style="background:' + KP_HEX.none + '"></i>sin dato de placa</span></div>';
}

document.getElementById("kpCampos").addEventListener("click", ev => {
  const b = ev.target.closest(".kp-chip");
  if (!b || !b.dataset.c) return;
  kpCampo = b.dataset.c;
  document.querySelectorAll("#kpCampos .kp-chip")
    .forEach(x => x.classList.toggle("on", x === b));
  kpPoblarPads();   /* los PAD del campo anterior ya no aplican */
  kpPintarFlota();
});

document.getElementById("kpFiltros").addEventListener("click", ev => {
  const b = ev.target.closest(".kp-chip");
  /* El buscador comparte la clase kp-chip por estetica pero no es un
     filtro: sin este guardia, tocarlo dejaba kpFiltro en undefined y la
     lista se vaciaba entera. */
  if (!b || !b.dataset.s) return;
  kpFiltro = b.dataset.s;
  document.querySelectorAll(".kp-chip[data-s]").forEach(x => x.classList.toggle("on", x === b));
  kpPintarFlota();
});

kpVerFlota();
