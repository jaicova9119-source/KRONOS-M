  h += '<div class="kd-grid">'
    +  '<div class="kd-card"><div class="ct"><b>Factor de potencia</b>'
    +    '<span>' + con.length + ' unidades</span></div>'
    +    kpDemFP(con) + '</div>'
    +  '<div class="kd-card"><div class="ct"><b>Mayor demanda</b>'
    +    '<span>Top ' + Math.min(6, con.length) + '</span></div>'
    +    kpDemRanking(con) + '</div>'
    +  '</div>';

  h += '<div class="kd-card"><div class="ct"><b>Detalle de unidades</b>'
    +  '<span>' + con.length + '</span></div>'
    +  kpDemTabla(con) + kpDemNota(con, sin) + '</div>';

  h += '</div>';
  v.innerHTML = h;
}

function kpDemMiga(){
  let h = '<div class="kd-mig">';
  const n = kpDemNivel();
  const paso = (txt, i, act) => act
    ? '<button class="aq">' + txt + '</button>'
    : '<button onclick="kpDemSubir(' + i + ')">' + txt + '</button>';

  h += paso('Todos los campos', 0, n === 0);
  if (n >= 1) h += '<span class="sep">&rsaquo;</span>'
    + paso(kpEsc(kpCampo), 1, n === 1);
  if (n >= 2) h += '<span class="sep">&rsaquo;</span>'
    + paso(kpEsc(kpPad), 2, n === 2);
  if (n >= 3) h += '<span class="sep">&rsaquo;</span>'
    + paso(kpEsc(kpDemPozo), 3, true);
  return h + '</div>';
}

function kpDemHero(t, con, nivel){
  const kwu = t.n ? t.kw / t.n : null;
  const fpc = t.fp == null ? '' : (t.fp < 0.85 ? ' r' : (t.fp < 0.90 ? ' w' : ' g'));
  const thc = t.thd == null ? '' : (t.thd > 8 ? ' w' : ' g');
  const tile = (cls, k, v, u, r) => '<div class="kd-h' + cls + '">'
    + '<div class="k">' + k + '</div>'
    + '<div class="v">' + v + (u ? '<small>' + u + '</small>' : '') + '</div>'
    + (r ? '<div class="r2">' + r + '</div>' : '') + '</div>';

  return '<div class="kd-hero">'
    + tile('',    'Activa',   t.kw.toFixed(0),   'kW',   'demanda medida')
    + tile('',    'Aparente', t.kva.toFixed(0),  'kVA',  'recompuesta')
    + tile('',    'Reactiva', t.kvar.toFixed(0), 'kVAr', 'inductiva')
    + tile(fpc,   'Factor de potencia',
           t.fp != null ? t.fp.toFixed(3) : '\u2014', '',
           t.fp == null ? '' : (t.fp < 0.90 ? 'bajo 0.90' : 'dentro de rango'))
    + tile('g',   'Unidades', String(t.n), '',
           kwu != null ? kwu.toFixed(0) + ' kW promedio' : '')
    + tile(thc,   'THD-I promedio',
           t.thd != null ? t.thd.toFixed(1) : '\u2014',
           t.thd != null ? '%' : '',
           t.thd != null ? (t.thd > 8 ? 'sobre IEEE 519' : 'dentro de IEEE 519') : 'sin medida')
    + '</div>';
}

function kpDemBarras(gr, nivel){
  const max = Math.max.apply(null, gr.map(g => g.kw).concat([1]));
  return gr.map(g => {
    const w   = Math.max(2, Math.round(g.kw / max * 100));
    const baj = nivel < 3;
    const at  = baj ? ' class="kd-bar cl" onclick="kpDemBajar(this.dataset.v)"'
                    : ' class="kd-bar"';
    return '<button' + at + ' data-v="' + kpEsc(g.nombre) + '">'
      + '<span class="lb"><span><i>' + kpEsc(g.nombre) + '</i>'
      +   '<u>' + g.n + (g.n === 1 ? ' unidad' : ' unidades')
      +   (g.fp != null ? ' \u00b7 FP ' + g.fp.toFixed(2) : '') + '</u></span>'
      +   '<em>' + g.kw.toFixed(0) + '<s> kW</s></em></span>'
      + '<span class="tk"><span class="fl" style="width:' + w + '%"></span></span>'
      + '</button>';
  }).join('');
}

/* Rosco por porcentaje de kW. Mas de seis rebanadas no se distinguen,
   asi que el resto se agrupa. */
function kpDemDonut(gr, kwTot){
  if (!kwTot) return '<div class="kd-vacio">Sin demanda para repartir</div>';

  let items = gr.slice(0, 6).map((g, i) => ({ n: g.nombre, kw: g.kw, c: KD_HEX[i] }));
  if (gr.length > 6){
    const resto = gr.slice(6).reduce((a, g) => a + g.kw, 0);
    items.push({ n: 'Otros ' + (gr.length - 6), kw: resto, c: KD_HEX[6] });
  }

  const R = 52, SW = 15, C = 2 * Math.PI * R;
  let off = 0;
  const anillos = items.map(it => {
    const len = C * (it.kw / kwTot);
    const s = '<circle cx="66" cy="66" r="' + R + '" fill="none" stroke="' + it.c
      + '" stroke-width="' + SW + '" stroke-dasharray="' + len.toFixed(2)
      + ' ' + (C - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2)
      + '" transform="rotate(-90 66 66)"></circle>';
    off += len;
    return s;
  }).join('');

  const leyenda = items.map(it =>
    '<div><i style="background:' + it.c + '"></i>'
    + '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
    + kpEsc(it.n) + '</span><b>' + (it.kw / kwTot * 100).toFixed(0) + '%</b></div>'
  ).join('');

  return '<div class="kd-don"><svg width="132" height="132" viewBox="0 0 132 132">'
    + '<circle cx="66" cy="66" r="' + R + '" fill="none" stroke="rgba(255,255,255,.07)" '
    +   'stroke-width="' + SW + '"></circle>'
    + anillos
    + '<text x="66" y="62" text-anchor="middle" fill="#fff" font-size="20" '
    +   'font-weight="600">' + kwTot.toFixed(0) + '</text>'
    + '<text x="66" y="79" text-anchor="middle" fill="var(--t3)" font-size="11">kW</text>'
    + '</svg><div class="lg">' + leyenda + '</div></div>';
}

/* Cuatro cajones de FP. El corte en 0.90 es el que factura: por
   debajo hay penalizacion, y por eso los dos primeros van en calido. */
function kpDemFP(con){
  const fps = con.map(r => r.p.fp).filter(v => v != null);
  if (!fps.length) return '<div class="kd-vacio">Sin factor de potencia medido</div>';

  const cajones = [
    { t: '< 0.85',      f: v => v <  0.85,             c: 'var(--crit)' },
    { t: '0.85 - 0.90', f: v => v >= 0.85 && v < 0.90, c: 'var(--warn)' },
    { t: '0.90 - 0.95', f: v => v >= 0.90 && v < 0.95, c: 'var(--ok)' },
    { t: '\u2265 0.95', f: v => v >= 0.95,             c: 'var(--accent)' }
  ].map(c => Object.assign(c, { n: fps.filter(c.f).length }));

  const max = Math.max.apply(null, cajones.map(c => c.n).concat([1]));
  const cols = cajones.map(c => '<div class="cl2">'
    + '<div class="n">' + c.n + '</div>'
    + '<div class="cb" style="height:' + Math.round(c.n / max * 74) + 'px;'
    +   'background:' + c.c + (c.n ? '' : ';opacity:.25') + '"></div>'
    + '<div class="lg2">' + c.t + '</div></div>').join('');

  const bajos = con.filter(r => r.p.fp != null && r.p.fp < 0.90)
                   .sort((a, b) => a.p.fp - b.p.fp).slice(0, 3);
  let pie = '';
  if (bajos.length){
    pie = '<p class="kd-nota"><span class="al">Bajo 0.90:</span> '
      + bajos.map(r => kpEsc(r.u.pozo) + ' (' + r.p.fp.toFixed(2) + ')').join(' \u00b7 ')
      + (con.filter(r => r.p.fp != null && r.p.fp < 0.90).length > 3
          ? ' y otras' : '') + '.</p>';
  } else {
    pie = '<p class="kd-nota">Todas las unidades medidas est&aacute;n en 0.90 o m&aacute;s.</p>';
  }
  return '<div class="kd-fp">' + cols + '</div>' + pie;
}

function kpDemRanking(con){
  const top = con.slice().sort((a, b) => (b.p.kw || 0) - (a.p.kw || 0)).slice(0, 6);
  const max = Math.max.apply(null, top.map(r => r.p.kw || 0).concat([1]));
  return top.map((r, i) =>
    '<button class="kd-bar cl" onclick="kpVerPozo(this.dataset.p)" '
    + 'data-p="' + kpEsc(r.u.pozo) + '">'
    + '<span class="lb"><span><i>' + (i + 1) + '. ' + kpEsc(r.u.pozo) + '</i>'
    +   '<u>' + kpEsc(r.u.pad && r.u.pad !== '\u2014' ? r.u.pad : r.u.campo) + '</u></span>'
    +   '<em>' + r.p.kw.toFixed(0) + '<s> kW</s></em></span>'
    + '<span class="tk"><span class="fl" style="width:'
    +   Math.max(2, Math.round(r.p.kw / max * 100)) + '%"></span></span>'
    + '</button>'
  ).join('');
}

/* Hoja de la jerarquia: una sola unidad. Aqui la pregunta ya no es
   cuanto suma, es como esta esa acometida. */
function kpDemUnidad(r){
  const p = r.p;
  const c = (k, v, u) => '<div class="kd-h"><div class="k">' + k + '</div>'
    + '<div class="v">' + v + (u ? '<small>' + u + '</small>' : '') + '</div></div>';

  return '<div class="kd-card">'
    + '<div class="ct"><b>' + kpEsc(r.u.pozo) + ' \u00b7 ' + kpEsc(r.u.marca) + '</b>'
    +   '<span>' + kpEsc(r.u.campo)
    +   (r.u.pad && r.u.pad !== '\u2014' ? ' \u00b7 ' + kpEsc(r.u.pad) : '') + '</span></div>'
    + '<div class="kd-hero" style="margin-bottom:0">'
    +   c('Corriente', kpNum(p.i), 'A')
    +   c('Tensi&oacute;n', kpNum(p.v), 'V')
    +   c('Frecuencia', p.hz != null ? p.hz.toFixed(1) : '\u2014', 'Hz')
    +   c('THD-I', p.thd_i != null ? p.thd_i.toFixed(1) : '\u2014', '%')
    +   c('THD-V', p.thd_v != null ? p.thd_v.toFixed(1) : '\u2014', '%')
    +   c('Factor K', p.factor_k != null ? p.factor_k.toFixed(2) : '\u2014', '')
    + '</div>'
    + '<p class="kd-nota">Condici&oacute;n de la medida: <b>'
    +   kpEsc(p.condicion || 'no registrada') + '</b>'
    +   (p.medido_en ? ' \u00b7 ' + kpEsc(p.medido_en) : '')
    +   (p.dias != null ? ' \u00b7 hace ' + p.dias + ' d\u00edas' : '')
    +   (p.corrida_actual === false
          ? ' \u00b7 <span class="al">corresponde a la corrida anterior</span>' : '')
    +   '</p>'
    + '<button class="kd-abrir" onclick="kpVerPozo(this.dataset.p)" '
    +   'data-p="' + kpEsc(r.u.pozo) + '">Abrir diagn&oacute;stico de la unidad</button>'
    + '</div>';
}

function kpDemTabla(con){
  const filas = con.slice()
    .sort((a, b) => (b.p.kw || 0) - (a.p.kw || 0))
    .map(r => {
      const p  = r.p;
      const vj = (p.dias != null && p.dias > 120);
      const ba = (p.fp != null && p.fp < 0.90);
      return '<tr>'
        + '<td class="pz" onclick="kpDemVer(this.dataset.p)" data-p="'
        +   kpEsc(r.u.pozo) + '">' + kpEsc(r.u.pozo) + '</td>'
        + '<td>' + kpEsc(r.u.pad && r.u.pad !== '\u2014' ? r.u.pad : r.u.campo) + '</td>'
        + '<td>' + kpNum(p.kw)   + '</td>'
        + '<td>' + kpNum(p.kva)  + '</td>'
        + '<td>' + kpNum(p.kvar) + '</td>'
        + '<td class="' + (ba ? 'ba' : '') + '">'
        +   (p.fp != null ? p.fp.toFixed(2) : '\u2014') + '</td>'
        + '<td>' + kpNum(p.i)    + '</td>'
        + '<td>' + kpNum(p.v)    + '</td>'
        + '<td>' + (p.thd_i != null ? p.thd_i.toFixed(1) : '\u2014') + '</td>'
        + '<td>' + (p.hz != null ? p.hz.toFixed(1) : '\u2014') + '</td>'
        + '<td class="' + (vj ? 'vj' : '') + '">'
        +   (p.medido_en ? kpEsc(p.medido_en) : '\u2014') + '</td>'
        + '</tr>';
    }).join('');

  return '<div class="kd-scroll"><table class="kd-tabla">'
    + '<thead><tr><th>Unidad</th><th>Ubicaci&oacute;n</th><th>kW</th><th>kVA</th>'
    + '<th>kVAr</th><th>FP</th><th>A</th><th>V</th><th>THD-I&nbsp;%</th>'
    + '<th>Hz</th><th>Medida</th></tr></thead>'
    + '<tbody>' + filas + '</tbody></table></div>';
}

/* Desde la tabla se baja a la unidad dentro del tablero, no se sale
   al diagnostico: quien esta comparando acometidas quiere ver esa
   acometida, y para el diagnostico ya hay un boton explicito. */
function kpDemVer(pozo){
  const u = kpFlota.find(x => x.pozo === pozo);
  if (!u) return;
  kpCampo   = u.campo;
  kpPad     = u.pad;
  kpDemPozo = pozo;
  kpPoblarPads();
  kpSincronizar();
  kpPintarDemanda();
}

/* Lo que la cifra no dice hay que escribirlo. Quien mira un total de
   kW asume que es la demanda simultanea del PAD, y no lo es: cada
   unidad aporta su ultima ronda, y las rondas son de fechas
   distintas. */
function kpDemNota(con, sin){
  const dias    = con.map(r => r.p.dias).filter(d => d != null).sort((a, b) => a - b);
  const mediana = dias.length ? dias[Math.floor(dias.length / 2)] : null;
  const viejas  = con.filter(r => r.p.dias != null && r.p.dias > 120).length;
  const otra    = con.filter(r => r.p.corrida_actual === false).length;

  let n = '<p class="kd-nota">Medido en la entrada del PST desde la red, sobre la '
    + '&uacute;ltima ronda de cada unidad que incluy&oacute; ese punto. '
    + '<b>No es demanda simult&aacute;nea</b>: las rondas son de fechas distintas'
    + (mediana != null ? ', la mediana tiene ' + mediana + ' d\u00edas' : '') + '.';
  if (viejas) n += ' <span class="al">' + viejas
    + (viejas === 1 ? ' unidad supera' : ' unidades superan') + ' los 4 meses.</span>';
  if (otra) n += ' ' + otra
    + (otra === 1 ? ' corresponde' : ' corresponden') + ' a la corrida anterior.';
  if (sin) n += ' ' + sin + (sin === 1 ? ' unidad no tiene' : ' unidades no tienen')
    + ' acometida medida y queda' + (sin === 1 ? '' : 'n') + ' fuera del total.';
  return n + '</p>';
}

function kpPintarFlota(){
  const q   = (document.getElementById('kpBuscar')?.value || '').trim().toUpperCase();
  const pad = kpPad;

  /* El ambito es campo + PAD + busqueda. El estado se aplica despues,
     aparte, para que los contadores de arriba sigan mostrando el total
     del ambito aunque se este mirando solo un estado: si al tocar
     "Vencidas" el contador de vencidas pasara a ser el total, no habria
     con que compararlo. */
  const ambito = kpFlota
    .filter(x => kpCampo === 'all' || x.campo === kpCampo)
    .filter(x => pad === 'all' || x.pad === pad)
    .filter(x => !q || x.pozo.toUpperCase().includes(q)
                    || (x.campo || '').toUpperCase().includes(q)
                    || (x.pad   || '').toUpperCase().includes(q));

  const d = ambito.filter(x => kpFiltro === "all" || x.estado === kpFiltro);

  const hayFiltro = (kpFiltro !== 'all' || kpCampo !== 'all' || pad !== 'all' || q);
  const bl = document.getElementById('kpLimpiar');
  if (bl) bl.style.display = hayFiltro ? '' : 'none';

  /* Orden: primero las que llevan mas tiempo sin ronda. Es lo que hay
     que salir a hacer, y por eso encabeza la lista. Las que nunca se
     han medido van al final: no son urgentes, son un pendiente de
     otra naturaleza. */
  d.sort((a,b) => {
    if (!a.ultima && !b.ultima) return a.pozo.localeCompare(b.pozo);
    if (!a.ultima) return 1;
    if (!b.ultima) return -1;
    return a.ultima.localeCompare(b.ultima);
  });

  const cuenta = e => ambito.filter(x => x.estado === e).length;
  const conRondas = ambito.filter(x => x.rondas > 0);
  const totalRondas = ambito.reduce((a,x) => a + x.rondas, 0);

  const alcance = [];
  if (kpCampo !== 'all') alcance.push(kpEsc(kpCampo));
  if (pad !== 'all')     alcance.push(kpEsc(pad));
  if (q)                 alcance.push('"' + kpEsc(q) + '"');

  let h = '<h2>Unidades BES' + (alcance.length ? ' \u00b7 ' + alcance.join(' \u00b7 ') : '')
        + '</h2><p class="hint">'
        + ambito.length + (ambito.length === 1 ? ' unidad' : ' unidades')
        + ' &middot; ' + totalRondas + ' rondas registradas'
        + (alcance.length ? ' &middot; de ' + kpFlota.length + ' en total' : '')
        + ' &middot; ordenadas por antig&uuml;edad de la &uacute;ltima ronda</p>';

  h += '<div class="kp-stats">'
    +  '<div class="kp-stat"><div class="k">Al d&iacute;a</div><div class="v" style="color:var(--kp-ok)">'
    +  cuenta('vigente') + '</div></div>'
    +  '<div class="kp-stat"><div class="k">Vencidas</div><div class="v" style="color:var(--kp-warn)">'
    +  cuenta('vencida') + '</div></div>'
    +  '<div class="kp-stat"><div class="k">Sin rondas</div><div class="v" style="color:var(--kp-null)">'
    +  cuenta('sin') + '</div></div>'
    +  '<div class="kp-stat"><div class="k">Rondas / unidad</div><div class="v">'
    +  (conRondas.length ? (totalRondas / conRondas.length).toFixed(1) : '0')
    +  '</div></div></div>';

  h += kpBotonDemanda(ambito);
  h += kpBotonOptimizacion();

  if (!d.length){
    h += '<div class="kp-list"><div class="kp-msg">'
      +  (ambito.length
            ? 'Ninguna de las ' + ambito.length + ' unidades de este alcance est&aacute; en ese estado.'
            : 'Ninguna unidad con estos filtros.')
      +  (hayFiltro ? '<br><br><button class="kp-chip" onclick="kpLimpiarFiltros()">'
                    + 'Quitar los filtros</button>' : '')
      +  '</div></div>';
    document.getElementById("kpVista").innerHTML = h;
    return;
  }

  h += '<div class="kp-list">';
  d.forEach(x => {
    const cls = x.estado === 'vigente' ? 'ok' : (x.estado === 'vencida' ? 'warn' : 'none');
    const txt = x.estado === 'vigente' ? 'Al d\u00eda'
              : (x.estado === 'vencida' ? 'Vencida' : 'Sin rondas');
    h += '<div class="kp-row" onclick="kpVerPozo(\'' + x.pozo + '\')">'
      +  '<div style="flex:1;min-width:0">'
      +  '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
      +  '<span class="nm">' + x.pozo + '</span>'
      +  '<span class="sys">' + x.marca + '</span>'
      +  '<span style="font-size:12px;color:var(--kp-ink3)">' + x.campo
      +  (x.pad && x.pad !== '\u2014' ? ' \u00b7 ' + x.pad : '') + '</span></div>'
      +  '<div class="ds">' + (x.rondas
            ? x.rondas + (x.rondas === 1 ? ' ronda' : ' rondas')
              + (x.corrida ? ' en la corrida actual' : '')
            : (x.historicas
                ? '<span style="color:var(--kp-warn)">Sin rondas desde el cambio de equipo</span>'
                : 'Sin rondas registradas')) + '</div>'
      +  '<div class="ts">' + (x.ultima
            ? '\u00daltima: ' + x.ultima + ' \u00b7 ' + kpDiasDesde(x.ultima)
            : (x.historicas
                ? 'Equipo de fondo cambiado el ' + x.corrida + ' \u00b7 '
                  + x.historicas + ' rondas del equipo anterior'
                : 'Nunca se ha medido')) + '</div></div>'
      +  '<span class="kp-pill ' + cls + '">' + txt + '</span></div>';
  });
  h += '</div>';
  document.getElementById("kpVista").innerHTML = h;
}

/* "hace 47 dias" se entiende de una; una fecha sola obliga a restar
   mentalmente para saber si eso esta bien o mal. */
function kpDiasDesde(iso){
  const d = Math.floor((Date.now() - new Date(iso + 'T12:00:00').getTime()) / 86400000);
  if (d <= 0) return 'hoy';
  if (d === 1) return 'ayer';
  if (d < 60) return 'hace ' + d + ' d\u00edas';
  return 'hace ' + Math.round(d / 30) + ' meses';
}

/* ============================================================
   VISTA: POZO
   ============================================================ */
async function kpVerPozo(codigo){
  kpVistaActual = 'pozo';
  document.body.classList.remove('kp-oscuro');
  document.getElementById("kpBack").style.display = "block";
  document.getElementById("kpBack").innerHTML = kpEnDemanda
    ? '&larr; Volver a demanda' : '&larr; Volver a flota';
  kpMostrarFiltros(false);
  const v = document.getElementById("kpVista");
  v.innerHTML = '<div class="kp-msg">Cargando&hellip;</div>';
  document.getElementById("kpTitulo").textContent = codigo;
  document.getElementById("kpSub").innerHTML = "Cargando&hellip;";

  /* Estado de la grafica por unidad: si no se reinicia, al abrir otro
     pozo se conservaria el zoom y los canales del anterior. */
  KP_SER = null; KP_SER_ON = null; KP_SER_ZOOM = null;
  KP_SER = await kpCargarSeries(codigo);

  let pozoId = null;
  try { pozoId = await kpIdDe(codigo); } catch(e){}
  if (!pozoId){
    v.innerHTML = '<div class="kp-card"><div class="kp-msg">'
      + 'No se pudo resolver el activo ' + kpEsc(codigo) + '.</div></div>';
    return;
  }

  /* Las cuatro consultas van en paralelo y cada una con su propio
     catch: en un PAD es normal que una responda y otra no, y perder
     la cadena porque fallaron los eventos seria absurdo. */
  let med = null, ctx = null, evs = [], tend = [], bal = [], cor = [];
  const r = await Promise.all([
    kpCargarMedicion(pozoId).catch(() => null),
    kpCargarContexto(pozoId).catch(() => null),
    kpCargarEventos(pozoId).catch(() => []),
    kpCargarTendencia(pozoId).catch(() => []),
    kpCargarBalance(pozoId).catch(() => []),
    kpCargarCorridas(pozoId).catch(() => [])
  ]);
  med = r[0]; ctx = r[1]; evs = r[2] || []; tend = r[3] || []; bal = r[4] || []; cor = r[5] || [];

  /* Se cambio el equipo de fondo y todavia no hay rondas del nuevo. No
     se muestran los numeros del anterior contra la placa nueva: serian
     corriente de un equipo contra la nominal de otro. */
  if (med && med.sin_rondas_corrida){
    document.getElementById("kpSub").innerHTML =
      'BES &middot; equipo de fondo cambiado el ' + med.inicio_corrida;
    document.getElementById("kpVista").innerHTML =
      kpAvisoCorrida(med, cor)
      + '<div class="kp-sec"><h2>Rondas del equipo anterior</h2>'
      + '<p class="hint">Se conservan y se pueden consultar, pero no se '
      + 'mezclan con las del equipo actual.</p>'
      + kpRenderCorridas(cor) + '</div>';
    return;
  }

  const hayCtx = ctx && ((ctx.bitacora||[]).length || (ctx.aislamiento||[]).length);
  if (!med && !hayCtx && !evs.length){
    document.getElementById("kpSub").innerHTML = "Sin rondas registradas";
    v.innerHTML = '<div class="kp-card"><div class="kp-msg">'
      + 'Esta unidad no tiene rondas de campo confirmadas.<br>'
      + 'Los indicadores se calculan a partir de la captura en campo: '
      + 'en cuanto se registre una ronda, aparecen aqu&iacute;.</div></div>';
    return;
  }

  const mc = (med && med.medicion) || {};
  document.getElementById("kpSub").innerHTML =
    'BES' + (mc.medido_en ? ' &middot; &uacute;ltima ronda ' + kpFechaCorta(mc.medido_en) : '')
    + (med && med.rondas ? ' &middot; ' + med.rondas + ' rondas' : '')
    + (med && med.inicio_corrida ? ' &middot; corrida desde ' + med.inicio_corrida : '');

  KP_EV = evs;
  /* Los controles se cablean tras insertar el HTML de las secciones; se
     agenda aqui para no depender de donde termine el render. */
  setTimeout(kpSerCablear, 0);
  const angosta = window.matchMedia('(max-width:640px)').matches;
  const sec = [];

  /* Orden de lectura:
       1 resumen        -> como esta la unidad ahora, en cuatro cifras
       2 cadena         -> donde esta el margen, etapa por etapa
       3 tendencia      -> hacia donde va, que es lo que no se ve en una foto
       4 eventos        -> que paso en el periodo
       5 contexto       -> informacion sobre el dato, al final */

  if (med){
    sec.push(kpSeccion('resumen', 'Estado de la unidad',
      kpSubRonda(mc), kpRenderResumen(med, bal), { plegable:false }));

    sec.push(kpSeccion('cadena', 'Cadena de potencia',
      'Cada etapa contra su propia nominal de placa',
      kpRenderMedicion(med), { cerrada:false }));
  }

  if (KP_SER && (KP_SER.series || []).length){
    const s0 = KP_SER.series[0];
    const t1 = new Date(Date.parse(s0.desde) + s0.paso_seg * 1000 * (s0.max.length - 1));
    sec.push(kpSeccion('serie', 'Tendencia de la descarga',
      KP_SER.series.length + ' canales &middot; hasta el '
      + t1.toLocaleDateString('es-CO', { day:'2-digit', month:'short' })
      + ' &middot; banda de m&iacute;nimo y m&aacute;ximo en cubos de 5 minutos',
      kpRenderSeries(), { cerrada: angosta }));
  }

  if (tend.length){
    const nRondas = new Set(tend.map(t => t.fecha)).size;
    sec.push(kpSeccion('tendencia', 'Tendencia entre rondas',
      nRondas + (nRondas === 1 ? ' ronda' : ' rondas') + ' &middot; una foto no dice si algo se est&aacute; moviendo',
      kpRenderTendencia(tend, bal), { cerrada: angosta }));
  }

  if (cor.length > 1){
    sec.push(kpSeccion('corridas', 'Equipo de fondo',
      cor.length + ' corridas registradas',
      kpRenderCorridas(cor), { cerrada:true }));
  }

  const ev = kpRenderEventos(KP_EV);
  if (ev) sec.push(ev);

  if (ctx){
    sec.push(kpSeccion('contexto', 'Contexto y calidad del dato', null,
      kpRenderContexto(ctx), { cerrada:true }));
  }

  let h = '';
  if (sec.length > 3){
    h += '<div class="kp-nav">'
      +  sec.map(x => '<a href="#sec-' + x.id + '">' + x.titulo + '</a>').join('')
      +  '</div>';
  }
  h += sec.map(x => x.html).join('');
  v.innerHTML = h;
  if (KP_EV.length) kpEvPintar();
}

/* ============================================================
   CORRIDAS DE FONDO
   ============================================================
   Una corrida es el periodo entre la bajada del conjunto de fondo y su
   recuperacion. Cortar las series ahi no es una preferencia de
   presentacion: la placa vigente es la del equipo actual, asi que
   calcular carga sobre mediciones del equipo anterior compara la
   corriente de uno contra la nominal de otro.                      */
function kpAvisoCorrida(med, cor){
  const act = (cor || []).find(c => c.actual);
  const eq = act && act.equipos && act.equipos.length ? act.equipos : [];
  let h = '<div class="kp-sec" style="border-left:4px solid var(--kp-warn)">'
        + '<h2>Se cambi&oacute; el equipo de fondo</h2>'
        + '<p class="hint" style="margin-bottom:12px">'
        + 'El conjunto actual se instal&oacute; el <b>' + med.inicio_corrida
        + '</b> y todav&iacute;a no tiene rondas de campo. '
        + 'Las ' + med.rondas_anteriores + ' rondas anteriores '
        + '(la &uacute;ltima del ' + med.ultima_anterior + ') son del equipo retirado: '
        + 'calcular carga con ellas contra la placa nueva dar&iacute;a un porcentaje '
        + 'que no corresponde a ning&uacute;n equipo real.</p>';
  if (eq.length){
    h += '<div class="kp-list" style="margin-bottom:12px"><div class="kp-grp">Equipo instalado</div>';
    eq.forEach(e => {
      h += '<div class="kp-rule"><div>'
        +  '<div><span class="nm">' + kpEsc(e.rol) + '</span> '
        +  '<span class="id">' + kpEsc(e.serial || '\u2014') + '</span></div>'
        +  '<div class="dt">' + kpEsc(e.marca || '\u2014')
        +  (e.modelo ? ' \u00b7 ' + kpEsc(e.modelo) : '') + '</div>'
        +  '<div class="src">Instalado el ' + e.instalado_el + '</div>'
        +  '</div></div>';
    });
    h += '</div>';
  }
  h += '<p class="hint" style="margin:0">Registra una ronda de campo para que la unidad '
    +  'vuelva a evaluarse. Los indicadores aparecen en cuanto haya la primera medici&oacute;n '
    +  'del equipo nuevo.</p></div>';
  return h;
}

function kpRenderCorridas(cor){
  if (!cor || !cor.length)
    return '<p class="hint">Sin instalaciones de fondo registradas para este activo.</p>';
  let h = '<div class="kp-list">';
  cor.forEach(c => {
    const eq = (c.equipos || []).map(e =>
      kpEsc(e.rol) + ' ' + kpEsc(e.marca || '') + ' ' + kpEsc(e.modelo || '')
      + (e.serial ? ' (' + kpEsc(e.serial) + ')' : '')).join(' \u00b7 ');
    /* Los dias de corrida son el run life, que es como se juzga un
       equipo de fondo. Una corrida de ocho anos es informacion, no
       relleno. */
    const fin = c.fin ? new Date(c.fin) : new Date();
    const dias = Math.round((fin - new Date(c.inicio)) / 86400000);
    h += '<div class="kp-rule' + (c.actual ? ' ok' : '') + '"><div>'
      +  '<div><span class="nm">' + c.inicio + (c.fin ? ' a ' + c.fin : ' \u2014 en servicio')
      +  '</span></div>'
      +  '<div class="dt">' + (eq || 'Sin detalle de equipo') + '</div>'
      +  '<div class="src">' + c.rondas + (c.rondas === 1 ? ' ronda' : ' rondas')
      +  ' &middot; ' + (dias >= 365 ? (dias/365).toFixed(1) + ' a\u00f1os' : dias + ' d\u00edas')
      +  (c.actual ? ' en servicio' : ' de corrida') + '</div>'
      +  '</div><span class="kp-pill ' + (c.actual ? 'ok' : 'none') + '">'
      +  (c.actual ? 'Actual' : 'Anterior') + '</span></div>';
  });
  return h + '</div>';
}

function kpSubRonda(mc){
  if (!mc || !mc.medido_en) return null;
  /* Solo cuando y quien. La frecuencia, el modo y la condicion pasaron
     a fichas propias: repetirlos aqui era ruido. */
  const p = [kpFechaCorta(mc.medido_en)];
  if (mc.realizado_por) p.push(kpEsc(mc.realizado_por));
  return p.join(' &middot; ');
}

/* ============================================================
   RESUMEN: las cuatro cifras que deciden si hay que hacer algo
   ============================================================
   Se eligen las que un electricista mira primero al llegar: cuanto
   carga el motor, si las corrientes vienen parejas, como reparten los
   dos puentes y como esta el factor de potencia en la acometida.
   El resto esta abajo para quien quiera entrar en detalle.        */
function kpRenderResumen(med, bal){
  const val = med.valores || {}, placa = med.placa || {};
  const mc  = med.medicion || {};
  const cad = kpCalcularCadena(val, placa);
  const b   = (bal && bal.length) ? bal[bal.length - 1] : kpBalanceRectificadores(val);

  let h = '';

  /* ---- Operacion: como esta puesta la maquina -------------------
     Antes esto vivia en una linea de texto gris bajo el titulo y las
     cuatro tarjetas grandes repetian lo que ya dice la cadena. Los
     parametros de operacion son lo primero que se contrasta al llegar
     -- si la frecuencia no es la esperada, todo lo demas se lee
     distinto -- asi que suben aqui.                                */
  const op = [];
  const chip = (k, v, u) => { if (v != null && v !== '') op.push({k, v, u: u || ''}); };
  chip('Frecuencia',  kpNum(mc.frecuencia_hz), 'Hz');
  chip('Setpoint',    kpNum(mc.setpoint_hz), 'Hz');
  chip('HSC',         kpNum(mc.hsc), 'Hz');
  chip('LSC',         kpNum(mc.lsc), 'Hz');
  chip('Modo',        mc.control_mode ? kpEsc(mc.control_mode) : null);
  chip('Condici\u00f3n', mc.condicion ? kpEsc(mc.condicion) : null);

  if (op.length){
    h += '<div class="kp-chips">';
    op.forEach(x => {
      h += '<div class="kp-dato"><div class="k">' + x.k + '</div>'
        +  '<div class="v">' + x.v + (x.u ? '<small>' + x.u + '</small>' : '') + '</div></div>';
    });
    h += '</div>';
  }

  /* ---- Sensor de fondo -------------------------------------------
     Se muestra aparte porque es el unico bloque que habla de la bomba
     y no de la instalacion electrica. Cuando no viene, se dice: en la
     flota solo una de cada cuarenta rondas lo trae, y un hueco mudo
     haria pensar que el equipo esta bien cuando en realidad nadie lo
     midio.                                                          */
  /* Los ceros no son mediciones: un PIP de 0 psi o una vibracion de 0 g
     con la unidad operando es un campo que quedo vacio. Se descartan
     igual que el 0 F de las temperaturas. */
  const vivo = (v) => v != null && Number(v) !== 0;
  const sf = [
    ['sf_pip_psi','PIP','psi',      v => vivo(v) ? kpNum(v) : null],
    ['sf_pdesc_psi','Descarga','psi', v => vivo(v) ? kpNum(v) : null],
    ['sf_t_motor_c','T motor','\u00b0F',  v => kpTempF(v) == null ? null : kpNumF(v)],
    ['sf_t_intake_c','T intake','\u00b0F', v => kpTempF(v) == null ? null : kpNumF(v)],
    ['sf_vib_x_g','Vib X','g',      v => vivo(v) ? kpNum(v) : null],
    ['sf_vib_y_g','Vib Y','g',      v => vivo(v) ? kpNum(v) : null],
    ['sf_ct_ma','CT','mA',          v => vivo(v) ? kpNum(v) : null],
    ['sf_vt_v','Vt','V',            v => vivo(v) ? kpNum(v) : null]
  ].map(d => [d[0], d[1], d[2], d[3](val[d[0]])])
   .filter(d => d[3] != null);

  h += '<div class="kp-sub" style="margin-top:16px">Sensor de fondo</div>';
  if (sf.length){
    h += '<div class="kp-chips">';
    sf.forEach(d => {
      h += '<div class="kp-dato"><div class="k">' + d[1] + '</div>'
        +  '<div class="v">' + d[3] + '<small>' + d[2] + '</small></div></div>';
    });
    /* El delta se calcula en F, no en C convertido: una diferencia de
       temperatura no se convierte con la formula de una temperatura,
       y el tecnico compara este numero contra referencias en F. */
    const tm = kpTempF(val.sf_t_motor_c), ti = kpTempF(val.sf_t_intake_c);
    if (tm != null && ti != null){
      h += '<div class="kp-dato"><div class="k">\u0394T motor-intake</div>'
        +  '<div class="v">' + (tm - ti).toFixed(1) + '<small>\u00b0F</small></div></div>';
    }
    h += '</div>';
  } else {
    h += '<p class="hint" style="margin:2px 0 0">No se registr&oacute; en esta ronda. '
      +  'Sin estos valores no hay lectura de la bomba: presi&oacute;n de entrada, '
      +  'temperaturas y vibraci&oacute;n quedan sin evaluar.</p>';
  }

  /* ---- Que revisar ------------------------------------------------
     Recorre lo medido y deja arriba solo lo que se sale de rango. Es
     lo que reemplaza a las cuatro tarjetas: en vez de mostrar cuatro
     cifras siempre, aunque esten bien, muestra las que piden atencion
     y calla cuando no hay ninguna.                                  */
  const av = [];
  const nota = (nivel, que, detalle) => av.push({nivel, que, detalle});

  cad.forEach(n => {
    if (n.carga_pct != null){
      const e = kpEstadoCarga(n.carga_pct);
      if (e !== 'ok') nota(e, n.nodo + ': carga ' + kpPct(n.carga_pct) + ' %',
        kpNum(n.medido) + ' A de ' + kpNum(n.nominal) + ' A nominal');
    }
    if (n.desbal_i != null){
      const e = kpEstadoDesbalI(n.desbal_i);
      if (e !== 'ok' && e !== 'none')
        nota(e, n.nodo + ': desbalance de corriente ' + kpPct(n.desbal_i) + ' %',
             'Se revisa desde 5 %, se act\u00faa sobre 10 %');
    }
    if (n.desbal_v != null){
      const e = kpEstadoDesbal(n.desbal_v);
      /* La salida del variador no lleva criterio NEMA: la onda es PWM. */
      if (e !== 'ok' && e !== 'none' && n.nodo.indexOf('VFD salida') < 0)
        nota(e, n.nodo + ': desbalance de tensi\u00f3n ' + kpPct(n.desbal_v) + ' %',
             'NEMA MG-1 marca derateo del motor desde 1 %');
    }
  });

  if (b && b.diferencia_pct != null && b.diferencia_pct > 5){
    nota(b.diferencia_pct > 10 ? 'crit' : 'warn',
      'Reparto \u0394 / Y desigual: ' + kpPct(b.diferencia_pct) + ' %',
      'Carga m\u00e1s el secundario '
        + ((b.mayor === 'delta' || b.mayor === 'secundario delta') ? '\u0394' : 'Y'));
  }

  const fp = val.pst_in_fp;
  if (fp != null && fp <= 0.85)
    nota(fp <= 0.80 ? 'crit' : 'warn', 'Factor de potencia ' + Number(fp).toFixed(2),
         'Medido en la acometida');

  const thdv = val.pst_in_thdv;
  if (thdv != null && thdv > 8)
    nota('warn', 'Distorsi\u00f3n de tensi\u00f3n ' + kpNum(thdv) + ' % en la red',
         'IEEE 519 sugiere 8 % para sistemas de este nivel');

  const tmax = placa.motor_temp_max_c;
  const tmot = kpTempF(val.sf_t_motor_c) == null ? null : Number(val.sf_t_motor_c);
  if (tmot != null && tmax > 0){
    /* El porcentaje se calcula en la escala absoluta de la placa (C) y
       se muestra en F, que es como se leyo. */
    const pct = 100 * tmot / tmax;
    if (pct >= 90) nota(pct >= 100 ? 'crit' : 'warn',
      'Temperatura de motor al ' + pct.toFixed(0) + ' % del l\u00edmite',
      kpNumF(tmot) + ' \u00b0F de ' + kpNumF(tmax) + ' \u00b0F de placa');
  }

  av.sort((x, y) => (x.nivel === 'crit' ? 0 : 1) - (y.nivel === 'crit' ? 0 : 1));

  h += '<div class="kp-sub" style="margin-top:18px">Requiere revisi&oacute;n</div>';
  if (!av.length){
    h += '<div class="kp-ok">Nada fuera de rango en esta ronda.'
      +  (sf.length ? '' : ' Ten en cuenta que el sensor de fondo no se midi&oacute;.')
      +  '</div>';
  } else {
    h += '<div class="kp-avisos">';
    av.forEach(a => {
      h += '<div class="kp-aviso ' + a.nivel + '">'
        +  '<div class="q">' + a.que + '</div>'
        +  '<div class="d">' + a.detalle + '</div></div>';
    });
    h += '</div>';
  }

  return h;
}

/* ============================================================
   TENDENCIA
   ============================================================
   Un desbalance de 1,6 % no dice nada por si solo. Que venia en 0,4 %
   hace tres rondas lo dice todo. Por eso la tendencia no es un extra:
   es donde aparece lo que una medicion aislada esconde.

   Los graficos son SVG sin librerias: se dibujan igual sin conexion y
   no agregan 200 kB de descarga a una app que se usa en campo.     */
function kpRenderTendencia(tend, bal){
  const porNodo = {};
  tend.forEach(t => { (porNodo[t.nodo] = porNodo[t.nodo] || []).push(t); });

  /* La clave es medicion_id, no la fecha ni la hora. Con fecha, dos
     rondas del mismo dia se colapsan y la tabla suma sus etapas:
     mostraba "24 etapas" donde una ronda tiene 6. Y con medido_en
     tampoco alcanza, porque los guardados repetidos comparten esa
     marca al segundo: viene del formulario, no del reloj del envio.
     Cada medicion es un punto. */
  const claves = [...new Set(tend.map(t => t.medicion_id))];
  claves.sort((a2,b2) => {
    const ta = (tend.find(t => t.medicion_id === a2) || {}).medido_en || '';
    const tb = (tend.find(t => t.medicion_id === b2) || {}).medido_en || '';
    return ta.localeCompare(tb) || String(a2).localeCompare(String(b2));
  });
  const fechaDe = k => (tend.find(t => t.medicion_id === k) || {}).medido_en || '';

  let h = '';

  /* 1. Reparto entre puentes: el indicador que mas dice de un 12
        pulsos y que no se ve en ningun nodo por separado. */
  if (bal && bal.length){
    const ult = bal[bal.length - 1];
    const est = ult.diferencia_pct > 10 ? 'crit' : (ult.diferencia_pct > 5 ? 'warn' : 'ok');
    /* Una linea de la diferencia obliga a traducir "13 %" a que puente
       carga mas y cuanto. La barra lo muestra directo: dos bloques
       proporcionales y una marca en el centro, que es donde deberian
       encontrarse si el reparto fuera parejo. La evolucion va debajo,
       en la misma linea pequena que usa el resto de la pantalla. */
    h += '<div class="kp-card" style="border-left:4px solid ' + KP_HEX[est] + '">'
      +  '<div style="font-weight:600;margin-bottom:2px">Reparto entre secundarios \u0394 y Y</div>'
      +  '<p class="hint" style="margin:0 0 14px">Los dos puentes pueden estar cada uno dentro de '
      +  'su carga y aun as\u00ed repartirse mal. Sumados dan la misma corriente de entrada, '
      +  'as\u00ed que esto no se ve en ning\u00fan otro indicador.</p>'
      +  kpReparto(bal) + '</div>';
  }

  /* 2 y 3. Corriente y desbalance por etapa.
     Antes iban como graficos de cinco lineas superpuestas. Con cinco
     etapas en un rango parecido, las lineas se cruzan y no se lee ni
     el valor de una ni la diferencia entre dos: ocupa media pantalla
     y no responde ni "esta mal" ni "se esta moviendo".
     Una fila por etapa si responde las dos: el numero de ahora, cuanto
     cambio desde la ronda anterior, y una linea propia para la forma. */
  const serie = (campo) => {
    const out = [];
    Object.keys(porNodo).forEach(nodo => {
      const pts = porNodo[nodo].filter(p => p[campo] != null)
        .map(p => ({x: p.medicion_id, y: Number(p[campo])}));
      if (pts.length) out.push({nombre: porNodo[nodo][0].etiqueta_corta || nodo,
                                orden: porNodo[nodo][0].orden || 999, pts});
    });
    return out.sort((a2,b2) => a2.orden - b2.orden);
  };

  const sI = serie('i_prom');
  if (sI.length){
    h += '<div class="kp-card"><div style="font-weight:600;margin-bottom:2px">'
      +  'Corriente por etapa</div>'
      +  '<p class="hint" style="margin:0 0 10px">Amperios medidos en cada punto de la cadena, '
      +  'en orden de flujo de energ&iacute;a.</p>'
      +  kpFilasEtapa(sI, 'A') + '</div>';
  }

  /* Corriente y tension van en la misma tarjeta, en dos columnas.
     Se leen juntas porque un desbalance de corriente alto con la
     tension equilibrada apunta al motor o al cable, y si las dos estan
     desbalanceadas el origen esta aguas arriba. Separarlas en dos
     tarjetas obliga a bajar y subir para hacer esa comparacion. */
  const sD = serie('i_desbal_pct');
  const sV = serie('v_desbal_pct');
  if (sD.length || sV.length){
    h += '<div class="kp-card"><div style="font-weight:600;margin-bottom:2px">'
      +  'Desbalance por etapa</div>'
      +  '<p class="hint" style="margin:0 0 12px">M&aacute;xima desviaci&oacute;n respecto al '
      +  'promedio, criterio NEMA. Los umbrales no son los mismos: un desbalance de '
      +  'tensi&oacute;n peque&ntilde;o produce uno de corriente varias veces mayor. '
      +  'Si la corriente est&aacute; desbalanceada y la tensi&oacute;n no, el origen suele '
      +  'estar en el motor o el cable; si las dos lo est&aacute;n, viene de aguas arriba.</p>'
      +  '<div class="kp-dos">';
    if (sD.length){
      h += '<div><div class="kp-sub">Corriente <span>revisar sobre 5 %</span></div>'
        +  kpFilasEtapa(sD, '%', {warn:5, crit:10}) + '</div>';
    }
    if (sV.length){
      h += '<div><div class="kp-sub">Tensi&oacute;n <span>revisar sobre 1 %</span></div>'
        +  kpFilasEtapa(sV, '%', {warn:1, crit:2})
        /* El criterio NEMA vale para una senoidal. A la salida del
           variador la onda es PWM y la lectura depende del instrumento,
           igual que pasa con el THD: sirve para ver si cambia entre
           rondas, no para juzgarla contra la norma. */
        + (sV.some(x => x.nombre === 'VFD OUT')
            ? '<p class="hint" style="margin:8px 0 0;font-size:11.5px">En VFD OUT la onda es '
              + 'PWM y la lectura depende del instrumento: mira si cambia entre rondas, no el '
              + 'valor contra la norma.</p>'
            : '')
        +  '</div>';
    }
    h += '</div></div>';
  }

  /* 4. Calidad de energia: entrada contra salida.
     Iba como grafico de dos series, pero la entrada ronda el 11 % y la
     salida el 5 %: dos lineas planas separadas por un hueco que ocupaba
     la mitad de la tarjeta sin decir nada. La diferencia de nivel se
     lee mejor en los numeros, y la tendencia de cada una en su propia
     linea. */
  const cal = [];
  const calDef = [['pst_in','Entrada (red)'], ['vfdout','Salida (al motor)']];
  calDef.forEach(([n, etq], k) => {
    if (!porNodo[n]) return;
    const pts = porNodo[n].filter(p => p.thd_i_pct != null)
                          .map(p => ({x: p.medicion_id, y: Number(p.thd_i_pct)}));
    if (pts.length) cal.push({nombre: etq, orden: k, pts});
  });
  const calV = [];
  calDef.forEach(([n, etq], k) => {
    if (!porNodo[n]) return;
    const pts = porNodo[n].filter(p => p.thd_v_pct != null)
                          .map(p => ({x: p.medicion_id, y: Number(p.thd_v_pct)}));
    if (pts.length) calV.push({nombre: etq, orden: k, pts});
  });

  if (cal.length || calV.length){
    h += '<div class="kp-card"><div style="font-weight:600;margin-bottom:2px">'
      +  'Distorsi&oacute;n arm&oacute;nica</div>'
      +  '<p class="hint" style="margin:0 0 12px">En la acometida se compara contra IEEE 519, '
      +  'que para sistemas de este nivel sugiere 8 % en tensi&oacute;n. En la salida del '
      +  'variador la distorsi&oacute;n es propia de la onda PWM y no constituye falla: '
      +  'sirve para ver si cambia entre rondas, no para juzgarla contra una norma.</p>'
      +  '<div class="kp-dos">';
    if (cal.length){
      h += '<div><div class="kp-sub">Corriente <span>THD-I</span></div>'
        +  kpFilasEtapa(cal, '%') + '</div>';
    }
    if (calV.length){
      h += '<div><div class="kp-sub">Tensi&oacute;n <span>IEEE 519: 8 % en la red</span></div>'
        +  kpFilasEtapa(calV, '%', {warn:5, crit:8, soloPrimero:true}) + '</div>';
    }
    h += '</div></div>';
  }

  /* 5. Tabla de rondas, una fila por medicion */
  const porDia = {};
  claves.forEach(k => {
    const f = String(fechaDe(k)).slice(0,10);
    porDia[f] = (porDia[f] || 0) + 1;
  });
  const repetidos = Object.keys(porDia).filter(f => porDia[f] > 1);

  /* La lista crece con cada ronda: a doce rondas ya son doce filas
     empujando hacia abajo lo que sigue. Se muestran las cuatro mas
     recientes y el resto queda detras de un boton. Las recientes son
     las que se consultan; el historico se abre cuando hace falta. */
  /* El bloque entero se pliega y arranca cerrado. Es la parte que mas
     crece -- una fila por ronda, para siempre -- y casi nunca es lo
     que se viene a mirar: los indicadores de arriba ya resumen lo que
     importa. Dentro, ademas, solo se listan las cuatro mas recientes
     hasta que se pidan las demas. */
  const VISIBLES = 4;
  const total = claves.length;
  h += '<div class="kp-list kp-plegada" id="kp-rondas">'
    +  '<div class="kp-grp kp-cab" onclick="kpPlegarRondas(this)">'
    +  '<span class="tw">\u25b8</span>Rondas registradas'
    +  '<span style="text-transform:none;letter-spacing:0">&middot; '
    +  total + (total === 1 ? ' ronda' : ' rondas') + '</span></div>';
  claves.slice().reverse().forEach((k, idx) => {
    const dia = tend.filter(t => t.medicion_id === k);
    const m = dia.find(t => t.nodo === 'sutout') || dia[0];
    const p = dia.find(t => t.nodo === 'pst_in');
    const f = String(fechaDe(k)).slice(0,10);
    h += '<div class="kp-rule' + (porDia[f] > 1 ? ' warn' : '')
      +  (idx >= VISIBLES ? ' kp-oculta' : '') + '"><div>'
      +  '<div><span class="nm">' + kpFechaCorta(fechaDe(k)) + '</span> '
      +  '<span class="id">' + dia.length + (dia.length === 1 ? ' etapa' : ' etapas') + '</span></div>'
      +  '<div class="dt">'
      +  (m && m.i_prom != null ? 'Al motor ' + kpNum(m.i_prom) + ' A' : 'Sin corriente de salida')
      +  (m && m.frec_hz != null ? ' &middot; ' + kpNum(m.frec_hz) + ' Hz' : '')
      +  (p && p.fp != null ? ' &middot; FP ' + Number(p.fp).toFixed(2) : '')
      +  '</div>'
      +  '<div class="src">' + (m && m.condicion ? kpEsc(m.condicion) : '') + '</div>'
      +  '</div></div>';
  });
  if (total > VISIBLES){
    h += '<button class="kp-mas" onclick="kpMasRondas(this)">'
      +  'Ver las ' + (total - VISIBLES) + ' rondas anteriores</button>';
  }
  h += '</div>';

  /* Varias rondas con la misma marca de tiempo casi siempre son
     reintentos de guardado, no mediciones distintas. Se avisa en vez de
     dejar que inflen la serie en silencio. */
  if (repetidos.length){
    h += '<div class="kp-card" style="border-left:4px solid var(--kp-warn);margin-top:14px">'
      +  '<div style="font-weight:600;margin-bottom:2px">Rondas repetidas el mismo d&iacute;a</div>'
      +  '<p class="hint" style="margin:0">'
      +  repetidos.map(f => f + ' \u2014 ' + porDia[f] + ' registros').join(', ')
      +  '. Cuando coinciden en fecha y hora suelen ser reintentos de guardado, '
      +  'no mediciones distintas: inflan la serie y desplazan el promedio. '
      +  'Conviene revisarlas y dejar una sola.</p></div>';
  }

  return h;
}

/* ============================================================
   GRAFICOS
   ============================================================
   SVG a mano, sin libreria. Escala al ancho disponible con viewBox,
   asi que se ve igual en un telefono que en un monitor sin recalcular
   nada al rotar la pantalla.                                      */
const KP_SERIE = ['var(--serie-1)','var(--serie-2)','var(--serie-3)','var(--serie-4)',
                     'var(--serie-5)','var(--serie-6)','var(--serie-7)'];

/* ============================================================
   REPARTO ENTRE SECUNDARIOS
   ============================================================
   Dos bloques proporcionales a lo que carga cada puente, con una marca
   en el 50 %. Si el reparto fuera parejo, la division caeria justo
   sobre esa marca; cuanto se corre de ahi es el desequilibrio, sin
   tener que interpretar un porcentaje.                              */
function kpReparto(bal){
  const u = bal[bal.length - 1];
  const d = Number(u.delta) || 0, y = Number(u.estrella) || 0;
  const tot = d + y;
  if (!tot) return '<p class="hint">Sin lectura de los dos secundarios.</p>';
  const pd = 100 * d / tot, py = 100 * y / tot;
  const dif = Number(u.diferencia_pct) || 0;
  const est = dif > 10 ? 'crit' : (dif > 5 ? 'warn' : 'ok');
  const col = KP_HEX[est];

  let h = '<div class="kp-rep">'
    + '<div class="ext"><span><b>\u0394</b> ' + kpNum(d) + ' A</span>'
    + '<span>' + kpNum(y) + ' A <b>Y</b></span></div>'
    + '<div class="barra">'
    +   '<div class="a" style="width:' + pd.toFixed(1) + '%;background:'
    +     (pd >= py ? col : 'var(--null)') + '"><span>' + pd.toFixed(0) + '%</span></div>'
    +   '<div class="b" style="width:' + py.toFixed(1) + '%;background:'
    +     (py > pd ? col : 'var(--null)') + '"><span>' + py.toFixed(0) + '%</span></div>'
    +   '<i class="mitad" title="Reparto parejo"></i>'
    + '</div>'
    + '<div class="pie"><span>Reparto parejo</span></div>'
    + '<div class="res"><b style="color:' + col + '">' + kpNum(dif) + ' %</b> de diferencia'
    +   (dif > 5 ? ' \u00b7 carga m\u00e1s el secundario '
                 + (u.mayor === 'delta' ? '\u0394' : 'Y') : ' \u00b7 dentro de lo normal')
    + '</div>';

  /* La evolucion, solo si hay con que compararla. */
  if (bal.length > 1){
    const ys = bal.map(b => Number(b.diferencia_pct)).filter(v => isFinite(v));
    h += '<div class="hist"><div class="et">Diferencia entre rondas</div>'
      +  '<div class="sp">' + kpSpark(ys, {warn:5, crit:10}) + '</div>'
      +  '<div class="ra">' + kpNum(Math.min(...ys)) + ' a ' + kpNum(Math.max(...ys)) + ' %</div>'
      +  '</div>';
  }
  return h + '</div>';
}

function kpPlegarRondas(cab){
  const lista = cab.closest('.kp-list');
  const cerrada = lista.classList.toggle('kp-plegada');
  cab.querySelector('.tw').textContent = cerrada ? '\u25b8' : '\u25be';
}

/* Despliega el resto de la lista. Se alterna en lugar de solo abrir:
   una vez consultado el historico, poder cerrarlo devuelve la pantalla
   a su tamano util. */
function kpMasRondas(boton){
  const lista = boton.closest('.kp-list');
  const abierto = lista.classList.toggle('kp-abierta');
  const n = lista.querySelectorAll('.kp-oculta').length;
  boton.textContent = abierto ? 'Ver menos'
                              : 'Ver las ' + n + ' rondas anteriores';
}

/* ============================================================
   FILAS POR ETAPA
   ============================================================
   Una fila por nodo: valor actual, cuanto cambio desde la ronda
   anterior, y una linea pequena con la forma de la serie. Responde de
   un vistazo lo unico que se le pregunta a esta seccion -- si el valor
   esta fuera de rango y si se esta moviendo -- sin obligar a
   distinguir cinco colores cruzados.                               */
function kpFilasEtapa(series, unidad, um){
  um = um || {};
  const estado = (v, i) => {
    if (v == null || um.warn == null) return null;
    /* soloPrimero: el umbral vale para la acometida y no para la salida
       del variador, donde la onda PWM distorsiona por diseno. Pintar
       en rojo la salida por superar un limite que no le aplica seria
       una alarma falsa permanente. */
    if (um.soloPrimero && i > 0) return null;
    if (um.crit != null && v >= um.crit) return 'crit';
    if (v >= um.warn) return 'warn';
    return 'ok';
  };

  let h = '<div class="kp-etapas">';
  series.forEach((se, idx) => {
    const ys = se.pts.map(p => p.y);
    const ult = ys[ys.length - 1];
    const ant = ys.length > 1 ? ys[ys.length - 2] : null;
    const est = estado(ult, idx);

    /* La variacion se mide contra la ronda anterior, no contra la
       primera: lo que interesa es si algo cambio desde la ultima vez
       que se estuvo en el pozo. */
    let delta = '';
    if (ant != null){
      const d = ult - ant;
      const rel = Math.abs(ant) > 0 ? Math.abs(d / ant) : 0;
      if (rel < 0.03) delta = '<span class="ig">sin cambio</span>';
      else delta = '<span class="' + (d > 0 ? 'sube' : 'baja') + '">'
                 + (d > 0 ? '\u2191' : '\u2193') + ' ' + kpNum(Math.abs(d)) + '</span>';
    } else {
      delta = '<span class="ig">1.\u00aa ronda</span>';
    }

    h += '<div class="kp-etapa' + (est ? ' ' + est : '') + '">'
      +  '<div class="nb">' + kpEsc(se.nombre) + '</div>'
      +  '<div class="vl">' + kpNum(ult) + '<small>' + unidad + '</small></div>'
      +  '<div class="dl">' + delta + '</div>'
      +  '<div class="sp">' + kpSpark(ys, um) + '</div>'
      +  '</div>';
  });
  return h + '</div>';
}

/* Linea minima, sin ejes ni etiquetas: aqui la forma es el dato y el
   numero exacto ya esta en la columna de al lado. */
function kpSpark(ys, um){
  /* viewBox ancho y width al 100 %: la linea se estira con la columna
     en vez de dejar un hueco a su izquierda. En pantalla ancha eso
     convierte el espacio sobrante en mas resolucion horizontal, que es
     justo donde se lee la forma de la serie. */
  const W = 260, H = 34, m = 4;
  const val = ys.filter(y => y != null && isFinite(y));
  if (val.length < 2) return '<span class="ig">\u2014</span>';
  let lo = Math.min(...val), hi = Math.max(...val);
  if (hi === lo){ hi = lo + 1; lo = lo - 1; }   /* serie plana: linea al centro */
  const px = i => m + i * (W - m*2) / (ys.length - 1);
  const py = y => m + (H - m*2) * (1 - (y - lo) / (hi - lo));

  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" '
        + 'aria-hidden="true" xmlns="http://www.w3.org/2000/svg">';
  const col = (um && um.crit != null && ys[ys.length-1] >= um.crit) ? KP_HEX.crit
            : (um && um.warn != null && ys[ys.length-1] >= um.warn) ? KP_HEX.warn
            : 'var(--accent)';
  s += '<polyline points="' + ys.map((y,i) => px(i) + ',' + py(y)).join(' ')
    +  '" fill="none" stroke="' + col + '" stroke-width="1.8" '
    +  'vector-effect="non-scaling-stroke" '
    +  'stroke-linejoin="round" stroke-linecap="round"/>';
  /* Solo el ultimo punto lleva marca: es el que se esta leyendo. */
  /* El circulo se deforma con preserveAspectRatio none, asi que se
     dibuja como una barra vertical fina en el ultimo punto. */
  s += '<line x1="' + px(ys.length-1) + '" y1="' + (py(ys[ys.length-1]) - 4)
    +  '" x2="' + px(ys.length-1) + '" y2="' + (py(ys[ys.length-1]) + 4)
    +  '" stroke="' + col + '" stroke-width="3" vector-effect="non-scaling-stroke" '
    +  'stroke-linecap="round"/>';
  return s + '</svg>';
}

function kpGrafico(pts, unidad, op){
  return kpGraficoMulti([{nombre:'', pts:pts}], unidad, op);
}

/* Redondea el eje a pasos que una persona lee de un vistazo. Sin
   esto las marcas salen del minimo y el maximo crudos -- 0.82, 13.70,
   26.58 -- y hay que hacer cuentas para ubicar un valor. */
function kpEscala(lo, hi, divisiones){
  const rango = (hi - lo) || Math.abs(hi) || 1;
  const bruto = rango / divisiones;
  const mag   = Math.pow(10, Math.floor(Math.log10(bruto)));
  const norm  = bruto / mag;
  const paso  = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  return { min: Math.floor(lo / paso) * paso,
           max: Math.ceil(hi / paso) * paso,
           paso: paso };
}

function kpGraficoMulti(series, unidad, op){
  op = op || {};
  /* Alto reducido de 200 a 150. Con dos series separadas -- 11 % en la
     entrada y 5 % en la salida -- el hueco entre ellas es inevitable,
     pero no hace falta darle 200 px de alto para verlo. */
  const W = 640, H = 150, ml = 44, mr = 12, mt = 12, mb = 28;
  const todas = series.flatMap(s => s.pts).filter(p => p.y != null && isFinite(p.y));
  if (todas.length < 2) return '<p class="hint">Hace falta m&aacute;s de una ronda.</p>';

  const xs = [...new Set(series.flatMap(s => s.pts.map(p => p.x)))].sort();
  let yMin = Math.min(...todas.map(p => p.y));
  let yMax = Math.max(...todas.map(p => p.y));
  if (op.umbral_crit != null) yMax = Math.max(yMax, op.umbral_crit * 1.15);
  /* Un margen del 12 % evita que la linea toque el borde y que un
     tramo plano parezca pegado al eje. */
  const rango = (yMax - yMin) || Math.abs(yMax) || 1;
  yMin = Math.max(0, yMin - rango * 0.08);
  yMax = yMax + rango * 0.08;
  const esc = kpEscala(yMin, yMax, 2);
  yMin = esc.min; yMax = esc.max;

  const px = i => ml + (xs.length === 1 ? (W-ml-mr)/2
                        : i * (W - ml - mr) / (xs.length - 1));
  const py = y => mt + (H - mt - mb) * (1 - (y - yMin) / (yMax - yMin));

  let s = '<div style="overflow-x:auto"><svg viewBox="0 0 ' + W + ' ' + H
        + '" style="width:100%;height:auto;display:block;min-width:280px" '
        + 'role="img" xmlns="http://www.w3.org/2000/svg">';

  /* Bandas de umbral al fondo: dicen cuando un valor deja de ser
     normal sin tener que leer una leyenda aparte. */
  if (op.umbral_warn != null){
    const y1 = py(Math.min(op.umbral_crit != null ? op.umbral_crit : yMax, yMax));
    const y2 = py(op.umbral_warn);
    if (op.umbral_crit != null)
      s += '<rect x="' + ml + '" y="' + mt + '" width="' + (W-ml-mr) + '" height="'
        +  Math.max(0, py(op.umbral_crit) - mt) + '" fill="var(--crit)" opacity="0.14"/>';
    s += '<rect x="' + ml + '" y="' + y1 + '" width="' + (W-ml-mr) + '" height="'
      +  Math.max(0, y2 - y1) + '" fill="var(--warn)" opacity="0.14"/>';
  }

  /* Rejilla horizontal con cuatro marcas: mas lineas ensucian y no
     ayudan a leer. */
  for (let i = 0; i <= 2; i++){
    const y = mt + (H - mt - mb) * i / 2;
    const v = yMax - (yMax - yMin) * i / 2;
    s += '<line x1="' + ml + '" y1="' + y + '" x2="' + (W-mr) + '" y2="' + y
      +  '" stroke="var(--line)" stroke-width="1"/>'
      +  '<text x="' + (ml-6) + '" y="' + (y+4) + '" text-anchor="end" font-size="11" '
      +  'fill="var(--t3)" font-family="inherit">' + kpEje(v) + '</text>';
  }

  series.forEach((se, k) => {
    const col = KP_SERIE[k % KP_SERIE.length];
    const d = se.pts.filter(p => p.y != null)
      .map(p => (px(xs.indexOf(p.x))) + ',' + py(p.y));
    if (d.length < 2) return;
    s += '<polyline points="' + d.join(' ') + '" fill="none" stroke="' + col
      +  '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    se.pts.filter(p => p.y != null).forEach(p => {
      s += '<circle cx="' + px(xs.indexOf(p.x)) + '" cy="' + py(p.y) + '" r="3.2" fill="'
        +  col + '"><title>' + (op.fmtX ? op.fmtX(p.x) : p.x) + ': '
        +  kpNum(p.y) + ' ' + unidad + '</title></circle>';
    });
  });

  /* Solo primera y ultima fecha en el eje: con doce rondas las
     etiquetas se encaballan y no se lee ninguna. */
  const fx = op.fmtX || (v => String(v).slice(0,10));
  s += '<text x="' + ml + '" y="' + (H-10) + '" font-size="11" fill="var(--t3)" '
    +  'font-family="inherit">' + fx(xs[0]) + '</text>'
    +  '<text x="' + (W-mr) + '" y="' + (H-10) + '" text-anchor="end" font-size="11" '
    +  'fill="var(--t3)" font-family="inherit">' + fx(xs[xs.length-1]) + '</text>';
  s += '</svg></div>';

  if (series.length > 1 || series[0].nombre){
    s += '<div class="kp-leg">';
    series.forEach((se, k) => {
      if (!se.nombre) return;
      s += '<span><i style="background:' + KP_SERIE[k % KP_SERIE.length] + '"></i>'
        +  kpEsc(se.nombre) + '</span>';
    });
    s += '</div>';
  }
  return s;
}

/* Envuelve un bloque como seccion plegable. Devuelve id, titulo y html
   para que el indice se arme del mismo arreglo y no se desincronice. */
function kpSeccion(id, titulo, subtitulo, cuerpo, op){
  op = op || {};
  const plegable = op.plegable !== false;
  const cerrada = !!op.cerrada;
  let h = '<section class="kp-sec' + (plegable ? ' plegable' : '')
        + (cerrada ? ' cerrada' : '') + '" id="sec-' + id + '">';
  h += plegable
    ? '<h2 onclick="kpPlegar(\'' + id + '\')"><span class="tw">'
      + (cerrada ? '\u25b8' : '\u25be') + '</span>' + titulo + '</h2>'
    : '<h2>' + titulo + '</h2>';
  if (subtitulo) h += '<p class="hint">' + subtitulo + '</p>';
  h += '<div class="cuerpo">' + cuerpo + '</div></section>';
  return { id: id, titulo: titulo, html: h };
}

function kpPlegar(id){
  const s = document.getElementById('sec-' + id);
  if (!s) return;
  s.classList.toggle('cerrada');
  const tw = s.querySelector('h2 .tw');
  if (tw) tw.textContent = s.classList.contains('cerrada') ? '\u25b8' : '\u25be';
}

/* Veredicto: el estado y por que, sin numeros que haya que interpretar */

/* ── Eventos y paros del variador ─────────────────────────────────────
   Se agrupa por causa ANTES de listar: 60 paros con la misma causa son
   un problema de suministro, no 60 incidentes sueltos. Esa lectura se
   pierde si solo se muestra la cronologia. */
function kpRenderEventos(eventos){
  KP_EV = eventos || [];
  if (!KP_EV.length){
    return kpSeccion('eventos', 'Eventos y paros', null,
      '<p class="hint" style="margin:0">Sin eventos cargados para este per\u00edodo. '
      + 'Se cargan junto con la DATA desde el Analizador.</p>', { cerrada:true });
  }

  /* Severidades reales del analizador. Son cinco, no dos: agrupar todo lo
     que no sea 'accion' como alarma metia Startup y Return to normal en el
     conteo de fallas. */
  const n = sv => KP_EV.filter(e => e.severidad === sv).length;
  const partes = [];
  if (n('crit'))   partes.push('<b>' + n('crit') + '</b> disparo(s)');
  if (n('att'))    partes.push(n('att') + ' de atenci\u00f3n');
  if (n('obs'))    partes.push(n('obs') + ' observaci\u00f3n(es)');
  if (n('accion')) partes.push(n('accion') + ' de operador');
  if (n('ok'))     partes.push(n('ok') + ' normalizaci\u00f3n(es)');

  let h = '';

  /* Filtro por severidad. Solo se ofrecen las que existen en los datos:
     un filtro que devuelve vacio siempre no aporta nada. En movil la fila
     se desliza en lugar de envolverse en tres lineas. */
  h += '<div id="kpEvFiltros" class="kp-nav" style="padding:0 0 10px">';
  h += kpEvBoton('equipo', 'Del equipo', KP_EV.filter(e => kpEvMeta(e.severidad).equipo).length);
  ['crit','att','obs','accion','ok'].forEach(sv => {
    if (n(sv)) h += kpEvBoton(sv, kpEvMeta(sv).txt, n(sv));
  });
  h += kpEvBoton('todo', 'Todo', KP_EV.length);
  h += '</div>';

  h += '<div id="kpEvCuerpo"></div>';
  return kpSeccion('eventos', 'Eventos y paros',
    KP_EV.length + ' evento(s) &middot; ' + partes.join(' &middot; '), h, {});
}

var KP_EV = [], KP_EV_FILTRO = 'equipo', KP_EV_ABIERTAS = {};

const KP_SEV = {
  crit:   { cls:'crit', txt:'Disparo',        equipo:true,  rank:0 },
  att:    { cls:'warn', txt:'Atenci\u00f3n',      equipo:true,  rank:1 },
  obs:    { cls:'warn', txt:'Observaci\u00f3n',   equipo:true,  rank:2 },
  ok:     { cls:'ok',   txt:'Normalizaci\u00f3n', equipo:false, rank:3 },
  accion: { cls:'ok',   txt:'Operador',       equipo:false, rank:4 }
};
function kpEvMeta(sv){
  return KP_SEV[sv] || { cls:'warn', txt:(sv || 'sin clasificar'), equipo:true, rank:9 };
}

function kpEvBoton(id, txt, n){
  const act = KP_EV_FILTRO === id;
  return '<button class="kp-chip' + (act ? ' on' : '') + '"'
    + ' onclick="kpEvFiltrar(\'' + id + '\')"'
    + ' style="border:1px solid ' + (act ? 'transparent' : 'var(--line,#dde5e8)')
    + ';background:' + (act ? 'var(--accent,#0f7d8c)' : 'transparent')
    + ';color:' + (act ? '#fff' : 'inherit')
    + ';border-radius:16px;padding:5px 12px;font:600 12.5px inherit;cursor:pointer">'
    + txt + ' <span style="opacity:.7">' + n + '</span></button>';
}

function kpEvFiltrar(id){
  KP_EV_FILTRO = id;
  KP_EV_ABIERTAS = {};
  const cont = document.getElementById('kpEvFiltros');
  if (cont){
    const n = sv => KP_EV.filter(e => e.severidad === sv).length;
    let h = kpEvBoton('equipo', 'Del equipo',
              KP_EV.filter(e => kpEvMeta(e.severidad).equipo).length);
    ['crit','att','obs','accion','ok'].forEach(sv => {
      if (n(sv)) h += kpEvBoton(sv, kpEvMeta(sv).txt, n(sv));
    });
    h += kpEvBoton('todo', 'Todo', KP_EV.length);
    cont.innerHTML = h;
  }
  kpEvPintar();
}

/* Agrupado y colapsado: cada causa es una fila que se abre para ver sus
   ocurrencias. Con 225 eventos la lista plana no se puede leer, y lo que
   importa primero es CUALES causas y cuantas veces, no la cronologia. */
function kpEvPintar(){
  const caja = document.getElementById('kpEvCuerpo');
  if (!caja) return;

  const f = KP_EV_FILTRO;
  const evs = KP_EV.filter(e =>
    f === 'todo'   ? true :
    f === 'equipo' ? kpEvMeta(e.severidad).equipo :
                     e.severidad === f);

  if (!evs.length){ caja.innerHTML = '<p class="hint">Sin eventos en este filtro.</p>'; return; }

  const g = {};
  evs.forEach(e => {
    const k = (e.severidad || '') + '\u0000' + (e.etiqueta || 'Sin causa registrada');
    if (!g[k]) g[k] = { causa:e.etiqueta || 'Sin causa registrada',
                        sev:e.severidad, items:[] };
    g[k].items.push(e);
  });

  /* Primero por gravedad, luego por recurrencia. El color viene de la
     severidad y no del conteo: un solo disparo por sobrecorriente pesa
     mas que 170 cambios de setpoint. */
  const claves = Object.keys(g).sort((a,b) => {
    const A = kpEvMeta(g[a].sev).rank, B = kpEvMeta(g[b].sev).rank;
    return A !== B ? A - B : g[b].items.length - g[a].items.length;
  });

  let h = '<div class="kp-list">';
  claves.forEach(k => {
    const d = g[k], m = kpEvMeta(d.sev);
    d.items.sort((x,y) => (x.ocurrio < y.ocurrio ? 1 : -1));
    const abierta = !!KP_EV_ABIERTAS[k];
    const kEsc = k.replace(/\u0000/g, '::').replace(/'/g, "\\'");

    h += '<div class="kp-row ' + m.cls + '" style="cursor:pointer"'
      +  ' onclick="kpEvAbrir(\'' + kEsc + '\')">'
      +  '<div class="kp-row-t">'
      +  '<span style="display:inline-block;width:12px;opacity:.55">'
      +  (abierta ? '\u2212' : '+') + '</span> '
      +  kpEsc(d.causa)
      +  ' <span class="kp-pill ' + m.cls + '">' + m.txt + '</span></div>'
      +  '<div class="kp-row-d" style="padding-left:12px">'
      +  d.items.length + ' vez(ces) &middot; &uacute;ltima '
      +  kpFechaCorta(d.items[0].ocurrio)
      +  (d.items.length > 1 ? ' &middot; primera ' + kpFechaCorta(d.items[d.items.length-1].ocurrio) : '')
      +  '</div>';

    if (abierta){
      h += '<div style="margin:8px 0 2px 12px;border-left:2px solid var(--line,#dde5e8);'
        +  'padding-left:10px">';
      d.items.slice(0, 100).forEach(e => {
        h += '<div style="font-size:12.5px;padding:3px 0;opacity:.85">'
          +  kpFechaCorta(e.ocurrio)
          +  (e.detalle ? ' &middot; ' + kpEsc(e.detalle) : '')
          +  '</div>';
      });
      if (d.items.length > 100)
        h += '<div class="hint">y ' + (d.items.length - 100) + ' m\u00e1s</div>';
      h += '</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  caja.innerHTML = h;
}

function kpEvAbrir(kEsc){
  const k = kEsc.replace(/::/, '\u0000');
  KP_EV_ABIERTAS[k] = !KP_EV_ABIERTAS[k];
  kpEvPintar();
}

function kpEsc(t){
  return String(t == null ? '' : t).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function kpFechaCorta(iso){
  if (!iso) return '\u2014';
  const d = new Date(iso);
  if (isNaN(d)) return String(iso).slice(0,16).replace('T',' ');
  const p = n => (n<10?'0':'') + n;
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate())
       + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}



/* ============================================================
   RENDER DEL CONTEXTO: AISLAMIENTO Y BITACORA
   ============================================================ */

/* Referencias de IEEE 43 para el indice de polarizacion. Se
   muestran como referencia y no como dictamen: la norma matiza
   segun clase de aislamiento y temperatura, y el valor absoluto
   minimo depende de la tension nominal. */

/* Indice de polarizacion segun IEEE 43-2013. Los rangos son los de la
   norma para sistemas de aislamiento termoestables.

   El caso de IP menor a 1 no se marca solo como malo: en devanados con
   resistencia de aislamiento muy alta la corriente de absorcion es tan
   pequena que el IP pierde sentido, y la propia norma lo advierte. Se
   dice, en lugar de dar una alarma que puede no significar nada. */
function kpEstadoIP(ip){
  if (ip == null || !isFinite(Number(ip)))
    return { cls:'none', txt:'Sin IP' };
  const v = Number(ip);
  if (v >= 4)   return { cls:'ok',   txt:'IP excelente' };
  if (v >= 2)   return { cls:'ok',   txt:'IP aceptable' };
  if (v >= 1)   return { cls:'warn', txt:'IP cuestionable' };
  return { cls:'crit', txt:'IP bajo' };
}

function kpRenderContexto(ctx){
  const ais = ctx.aislamiento || [];
  const bit = ctx.bitacora || [];
  let h = '';

  if (ais.length){
    h += '<h2 style="margin-top:22px">Aislamiento</h2>';
    h += '<p class="hint">' + ais.length
      +  (ais.length === 1 ? ' prueba registrada' : ' pruebas registradas')
      +  ' &middot; referencia IEEE 43 para el &iacute;ndice de polarizaci&oacute;n</p>';
    h += '<div class="kp-list" style="margin-bottom:6px">';
    /* Que se ensayo, dicho en palabras. En un BES instalado no se puede
       separar el motor del cable: se mega desde superficie y el valor
       incluye la fuga del cable, asi que sale por debajo del motor solo
       y no es comparable contra una medicion en bornes. */
    const COMP = {
      MOTOR: 'motor en bornes',
      MOTOR_CABLE: 'motor + cable, desde superficie',
      CABLE: 'cable solo',
      SUT: 'transformador elevador',
      GENERADOR: 'generador'
    };

    ais.forEach(a => {
      const e = kpEstadoIP(a.ip);
      const bal = [a.balance_ab, a.balance_ac, a.balance_bc]
        .filter(v => v != null).length;

      h += '<div class="kp-rule ' + (e.cls === 'none' ? '' : e.cls) + '"><div>'
        +  '<div><span class="nm">' + (a.fecha_prueba || '\u2014') + '</span>'
        +  (a.realizado_por ? ' <span class="id">' + a.realizado_por + '</span>' : '')
        +  '</div>'
        /* La maquina va en cada fila, no en el encabezado. El historial de
           un pozo atraviesa mas de un motor, y sin decir de cual es cada
           medicion, un cambio de equipo se lee como una recuperacion. */
        +  (a.maquina
              ? '<div class="src">' + a.maquina
                + (a.serial ? ' &middot; serie ' + a.serial : '')
                + (a.maquina_estado === 'RETIRADA'
                    ? ' &middot; motor ya retirado' : '') + '</div>'
              : '')
        +  '<div class="dt">Aislamiento ' + kpNum(a.aislamiento) + ' M&Omega;'
        +  ' &middot; IP ' + kpNum(a.ip) + ' &middot; DAR ' + kpNum(a.dar) + '</div>'
        +  '<div class="src">'
        +  (a.componente ? (COMP[a.componente] || a.componente) : '')
        +  (a.alcance === 'RUTINA' ? ' &middot; rutina de campo' : '')
        +  (bal ? ' &middot; balance ' + kpNum(a.balance_ab) + ' / '
                  + kpNum(a.balance_ac) + ' / ' + kpNum(a.balance_bc) + ' \u03a9' : '')
        +  (a.equipo ? ' &middot; ' + a.equipo : '') + '</div>'
        /* Dos salvedades que cambian como se lee el numero, y que sin
           decirlas hacen comparar cosas que no son comparables. */
        +  (a.corregible === false
              ? '<div class="src" style="margin-top:4px">Sin temperatura de '
                + 'devanado: no se puede corregir a 40 &deg;C ni comparar con '
                + 'otros ensayos.</div>' : '')
        +  (a.corregible && a.extrapolado
              ? '<div class="src" style="margin-top:4px">Correcci&oacute;n a '
                + '40 &deg;C extrapolada: este motor opera por encima del rango '
                + 'definido en IEEE 43.</div>' : '')
        +  (a.observaciones ? '<div class="src" style="margin-top:5px;color:var(--kp-ink2)">'
              + a.observaciones + '</div>' : '')
        +  '</div><span class="kp-pill ' + e.cls + '">' + e.txt + '</span></div>';
    });
    h += '</div>';
  }

  if (bit.length){
    /* Configuracion son 21 de 37 registros en el historico y taparian
       los eventos de operacion y falla, que son los que interesan al
       diagnosticar. Por eso el filtro. */
    h += '<h2 style="margin-top:22px">Bit&aacute;cora</h2>';
    h += '<p class="hint">' + bit.length + ' registros &middot; toca una categor&iacute;a para filtrar</p>';

    const cats = [];
    bit.forEach(b => {
      const c = b.categoria || 'Sin categor\u00eda';
      if (cats.indexOf(c) < 0) cats.push(c);
    });
    h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">';
    h += '<button class="kp-chip on" data-cat="__all__" onclick="kpFiltrarBitacora(this)">Todas</button>';
    cats.forEach(c => {
      h += '<button class="kp-chip" data-cat="' + c + '" onclick="kpFiltrarBitacora(this)">'
        +  c + '</button>';
    });
    h += '</div>';

    h += '<div class="kp-list" id="kp-bitacora">';
    bit.forEach(b => {
      const f = b.ocurrido_en
        ? String(b.ocurrido_en).slice(0,16).replace('T',' ')
        : 'sin fecha en el origen';
      const sev = String(b.severidad || '').toLowerCase();
      const cls = (sev.indexOf('crit') >= 0 || sev.indexOf('alta') >= 0) ? 'crit'
                : (sev.indexOf('atenc') >= 0 ? 'warn' : '');
      h += '<div class="kp-rule ' + cls + '" data-cat="'
        +  (b.categoria || 'Sin categor\u00eda') + '"><div>'
        +  '<div><span class="nm">' + (b.categoria || 'Evento') + '</span> '
        +  '<span class="id">' + f + '</span></div>'
        +  (b.observaciones ? '<div class="dt">' + b.observaciones + '</div>' : '')
        +  (b.recomendaciones ? '<div class="src" style="margin-top:4px">Recomendaci&oacute;n: '
              + b.recomendaciones + '</div>' : '')
        +  (b.realizado_por ? '<div class="src">' + b.realizado_por + '</div>' : '')
        +  '</div>'
        +  '<span class="kp-pill ' + (cls || 'none') + '">'
        +  (b.estado || b.severidad || '\u2014') + '</span></div>';
    });
    h += '</div>';
  }

  return h;
}

function kpFiltrarBitacora(boton){
  const cat = boton.dataset.cat;
  boton.parentElement.querySelectorAll('.kp-chip')
    .forEach(b => b.classList.toggle('on', b === boton));
  document.querySelectorAll('#kp-bitacora .kp-rule').forEach(f => {
    f.style.display = (cat === '__all__' || f.dataset.cat === cat) ? '' : 'none';
  });
}

/* ============================================================
   RENDER DE LA MEDICION ELECTRICA
   ============================================================ */
/* ── Tendencia de 15 dias ────────────────────────────────────────────────
   Los datos vienen del analizador en cubos de 5 minutos con minimo y
   maximo. Se dibuja la BANDA entre ambos, no una linea: cada cubo agrupa
   60 muestras y pintar solo el centro escondería las excursiones cortas,
   que es justo lo que se quiere ver en una tendencia.

   Cada canal tiene su propia escala vertical: conviven 65 Hz con 3.089 V
   y 1,2 G. Un eje comun dejaria todo plano menos la tension. */

/* Los cuatro primeros -frecuencia, corriente A, presion y temperatura de
   motor- son los que se muestran por defecto, asi que llevan los colores
   mas separados entre si. Antes corriente A y temperatura de motor eran
   dos rojos casi iguales y con las dos activas no se distinguian. */
const KP_SER_DEF = [
  ['f_out',    'Frecuencia',        '#0C5292'],
  ['i_out_a',  'Corriente A',       '#C62828'],
  ['pip',      'Presión admisión',  '#2E7D32'],
  ['t_motor',  'Temp. motor',       '#6A1B9A'],
  ['i_out_b',  'Corriente B',       '#EF6C00'],
  ['i_out_c',  'Corriente C',       '#F9A825'],
  ['v_out',    'Tensión salida',    '#00695C'],
  ['v_motor',  'Tensión motor',     '#0097A7'],
  ['i_motor',  'Corriente motor',   '#AD1457'],
  ['t_intake', 'Temp. admisión',    '#5D4037'],
  ['vib_x',    'Vibración X',       '#4527A0'],
  ['vib_y',    'Vibración Y/Z',     '#37474F'],
];

let KP_SER      = null;   // series crudas del pozo
let KP_SER_ON   = null;   // canales visibles
let KP_SER_ZOOM = null;   // [t0, t1] en ms, null = ventana completa
/* Separado por defecto: con escalas independientes, cuatro bandas
   superpuestas se pisan y no se distingue cual sube. Superpuesto sigue
   disponible para comparar la FORMA de dos curvas, que es lo unico para
   lo que sirve de verdad. */
let KP_SER_SEP  = true;

async function kpCargarSeries(pozo){
  try {
    const { data, error } = await kpCliente().rpc('dp_series_pozo', { p_pozo: pozo });
    if (error) throw error;
    return (data && data.ok) ? data : null;
  } catch(e){
    console.warn('[Kronos-M] Tendencia no disponible:', e.message);
    return null;
  }
}

function kpSerDibujar(){
  const cont = document.getElementById('kpSerBox');
  if (!cont || !KP_SER) return;
  const series = (KP_SER.series || []).filter(s => KP_SER_ON.has(s.canal));

  const W = 1000, ML = 8, MR = 8, MT = 12, MB = 26;
  const nVis = Math.max(1, series.length);
  /* En separado el alto crece con el numero de canales: repartir 300 px
     entre doce daria carriles de 22 px, donde una banda no se ve. */
  const H  = KP_SER_SEP ? MT + MB + Math.max(56, Math.min(78, 300 / nVis)) * nVis : 300;
  const iw = W - ML - MR, ih = H - MT - MB;

  /* Rango temporal: el de la ventana completa o el del zoom. */
  let t0 = Infinity, t1 = -Infinity;
  (KP_SER.series || []).forEach(s => {
    const a = Date.parse(s.desde);
    const b = a + s.paso_seg * 1000 * (s.max.length - 1);
    if (a < t0) t0 = a;
    if (b > t1) t1 = b;
  });
  const zT0 = KP_SER_ZOOM ? KP_SER_ZOOM[0] : t0;
  const zT1 = KP_SER_ZOOM ? KP_SER_ZOOM[1] : t1;
  const X = t => ML + (t - zT0) / (zT1 - zT0) * iw;

  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" '
        + 'xmlns="http://www.w3.org/2000/svg" id="kpSerSvg">';

  /* Rejilla y marcas de tiempo. El paso se elige segun el rango visible
     para que al ampliar aparezcan horas y no siga mostrando dias. */
  const span = zT1 - zT0;
  const paso = span > 10*86400000 ? 86400000*2
             : span > 3*86400000  ? 86400000
             : span > 12*3600000  ? 6*3600000
             : span > 3*3600000   ? 3600000 : 900000;
  const fmt = span > 3*86400000
    ? (d => d.toLocaleDateString('es-CO', { day:'2-digit', month:'short' }))
    : (d => d.toLocaleString('es-CO', { day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false }));
  for (let t = Math.ceil(zT0 / paso) * paso; t <= zT1; t += paso){
    const x = X(t);
    s += '<line x1="' + x.toFixed(1) + '" y1="' + MT + '" x2="' + x.toFixed(1)
      +  '" y2="' + (MT + ih) + '" stroke="var(--rule3,#eee)" stroke-width="1"/>'
      +  '<text x="' + x.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" '
      +  'font-size="10" fill="var(--t3)" font-family="inherit">' + fmt(new Date(t)) + '</text>';
  }

  if (!series.length){
    s += '<text x="' + (W/2) + '" y="' + (MT + ih/2) + '" text-anchor="middle" font-size="13" '
      +  'fill="var(--t3)" font-family="inherit">Ning&uacute;n canal seleccionado</text>';
    cont.innerHTML = s + '</svg>';
    return;
  }

  const hCarril = ih / nVis;
  series.forEach((sr, k) => {
    const def = KP_SER_DEF.find(d => d[0] === sr.canal) || [,'', '#666'];
    const col = def[2];
    /* Cada canal ocupa su franja en separado, o el alto completo en
       superpuesto. Todo lo demas del trazado es identico. */
    const yTop = KP_SER_SEP ? MT + hCarril * k : MT;
    const hUso = (KP_SER_SEP ? hCarril : ih) - (KP_SER_SEP ? 10 : 0);
    const paso_ms = sr.paso_seg * 1000;
    const base = Date.parse(sr.desde);

    /* Escala propia por canal, calculada SOBRE EL TRAMO VISIBLE. Si se
       calculara sobre los 15 dias, al ampliar en un dia plano la curva
       seguiria pegada a una esquina en vez de llenar el alto. */
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < sr.max.length; i++){
      const t = base + paso_ms * i;
      if (t < zT0 || t > zT1) continue;
      const a = sr.min[i], b = sr.max[i];
      if (a != null && a < lo) lo = a;
      if (b != null && b > hi) hi = b;
    }
    if (!isFinite(lo)) return;
    if (hi === lo){ hi = lo + Math.max(1e-6, Math.abs(lo) * 0.01); lo -= (hi - lo); }
    /* Piso de escala del 2 % de la magnitud del canal, el mismo criterio
       del analizador. Sin el, la frecuencia con su rango de 65,0 a 65,3
       se estira a todo el alto y cada paso de cuantizacion se vuelve un
       pico de pantalla completa: la curva parece oscilar violentamente
       cuando en realidad esta plana. Los canales con recorrido amplio no
       se ven afectados porque ya superan ese piso. */
    const med  = (lo + hi) / 2;
    const piso = Math.abs(med) * 0.02;
    if (piso > 0 && (hi - lo) < piso){ lo = med - piso / 2; hi = med + piso / 2; }
    const m = (hi - lo) * 0.08; lo -= m; hi += m;
    const Y = v => yTop + hUso - (v - lo) / (hi - lo) * hUso;

    /* Banda min-max como poligono cerrado: arriba los maximos, de vuelta
       por los minimos. */
    const arr = [], aba = [];
    for (let i = 0; i < sr.max.length; i++){
      const t = base + paso_ms * i;
      if (t < zT0 || t > zT1) continue;
      if (sr.max[i] == null) continue;
      arr.push(X(t).toFixed(1) + ',' + Y(sr.max[i]).toFixed(1));
      aba.push(X(t).toFixed(1) + ',' + Y(sr.min[i]).toFixed(1));
    }
    if (!arr.length) return;
    aba.reverse();
    s += '<polygon points="' + arr.concat(aba).join(' ') + '" fill="' + col
      +  '" fill-opacity="0.20" stroke="none"/>'
      +  '<polyline points="' + arr.join(' ') + '" fill="none" stroke="' + col
