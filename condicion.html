      +  '" stroke-width="1.1" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';

    if (KP_SER_SEP){
      /* Nombre y rango del carril. Sin el rango, dos carriles con la
         misma forma parecen el mismo movimiento aunque uno varie 0,3 Hz
         y el otro 60 A. */
      if (k) s += '<line x1="' + ML + '" y1="' + yTop.toFixed(1) + '" x2="' + (W - MR)
        +  '" y2="' + yTop.toFixed(1) + '" stroke="var(--rule3,#eee)" stroke-width="1"/>';
      /* Halo blanco bajo el texto: cuando la curva sube hasta el borde
         superior del carril, la etiqueta le quedaba encima y ninguna de
         las dos se leia. paint-order dibuja el trazo antes del relleno. */
      const halo = ' paint-order="stroke" stroke="var(--panel,#fff)" stroke-width="3" '
                 + 'stroke-linejoin="round"';
      s += '<text x="' + (ML + 4) + '" y="' + (yTop + 11) + '" font-size="10" font-weight="600" '
        +  'fill="' + col + '" font-family="inherit"' + halo + '>' + def[1] + '</text>'
        +  '<text x="' + (W - MR - 4) + '" y="' + (yTop + 11) + '" font-size="9.5" '
        +  'text-anchor="end" fill="var(--t3)" font-family="inherit"' + halo + '>'
        +  kpNum(lo + (hi - lo) * 0.08) + ' a ' + kpNum(hi - (hi - lo) * 0.08)
        +  ' ' + (sr.unidad || '') + '</text>';
    }
  });

  s += '<line id="kpSerCur" x1="-9" y1="' + MT + '" x2="-9" y2="' + (MT + ih)
    +  '" stroke="var(--acc,#0C5292)" stroke-width="1" stroke-dasharray="3 3"/>';
  s += '<rect id="kpSerSel" x="0" y="' + MT + '" width="0" height="' + ih
    +  '" fill="var(--acc,#0C5292)" fill-opacity="0.12" stroke="none"/>';
  cont.innerHTML = s + '</svg>';
  kpSerInteraccion(zT0, zT1, ML, iw);
}

/* Cursor y seleccion para ampliar. Pointer Events para que arrastrar con
   el dedo funcione igual que con el raton en la caseta. */
function kpSerInteraccion(zT0, zT1, ML, iw){
  const svg = document.getElementById('kpSerSvg');
  const lec = document.getElementById('kpSerLec');
  if (!svg) return;
  const W = 1000;
  const aT = px => zT0 + (px - ML) / iw * (zT1 - zT0);
  const aPx = ev => {
    const r = svg.getBoundingClientRect();
    return (ev.clientX - r.left) / r.width * W;
  };

  let arr0 = null;
  const cur = document.getElementById('kpSerCur');
  const sel = document.getElementById('kpSerSel');

  const leer = t => {
    const partes = [];
    (KP_SER.series || []).filter(s => KP_SER_ON.has(s.canal)).forEach(s => {
      const i = Math.round((t - Date.parse(s.desde)) / (s.paso_seg * 1000));
      if (i < 0 || i >= s.max.length || s.max[i] == null) return;
      const d = KP_SER_DEF.find(x => x[0] === s.canal) || [,''];
      const a = s.min[i], b = s.max[i];
      const txt = (Math.abs(b - a) < Math.abs(b) * 0.001)
        ? kpNum(b) : kpNum(a) + '\u2013' + kpNum(b);
      partes.push('<span style="color:' + d[2] + '">\u25a0</span> ' + d[1]
                  + ' <b>' + txt + '</b> ' + (s.unidad || ''));
    });
    return partes.join(' &nbsp; ');
  };

  svg.addEventListener('pointermove', ev => {
    const px = aPx(ev), t = aT(px);
    cur.setAttribute('x1', px); cur.setAttribute('x2', px);
    if (arr0 != null){
      const x0 = Math.min(arr0, px), x1 = Math.max(arr0, px);
      sel.setAttribute('x', x0); sel.setAttribute('width', x1 - x0);
    }
    if (lec) lec.innerHTML =
      '<b>' + new Date(t).toLocaleString('es-CO', { day:'2-digit', month:'short',
        hour:'2-digit', minute:'2-digit', hour12:false }) + '</b> &nbsp; ' + leer(t);
  });
  svg.addEventListener('pointerdown', ev => {
    arr0 = aPx(ev); svg.setPointerCapture(ev.pointerId); ev.preventDefault();
  });
  const fin = ev => {
    if (arr0 == null) return;
    const px = aPx(ev);
    /* Un arrastre corto es un toque para leer, no una seleccion: sin este
       umbral cada clic ampliaba a un rango de milisegundos. */
    if (Math.abs(px - arr0) > 12){
      const a = aT(Math.min(arr0, px)), b = aT(Math.max(arr0, px));
      KP_SER_ZOOM = [a, b];
      kpSerDibujar();
      const bz = document.getElementById('kpSerReset');
      if (bz) bz.style.display = '';
    }
    arr0 = null;
    if (sel) sel.setAttribute('width', 0);
  };
  svg.addEventListener('pointerup', fin);
  svg.addEventListener('pointercancel', () => { arr0 = null; sel.setAttribute('width', 0); });
}

function kpSerCablear(){
  const box = document.getElementById('kpSerBox');
  if (!box || !KP_SER) return;
  document.querySelectorAll('[data-ser]').forEach(b => {
    b.onclick = () => {
      const c = b.dataset.ser;
      /* No se permite apagar el ultimo canal: una grafica sin nada no
         comunica que se apago todo, parece que fallo la carga. */
      if (KP_SER_ON.has(c) && KP_SER_ON.size === 1) return;
      if (KP_SER_ON.has(c)) KP_SER_ON.delete(c); else KP_SER_ON.add(c);
      b.classList.toggle('off', !KP_SER_ON.has(c));
      kpSerDibujar();
    };
  });
  const r = document.getElementById('kpSerReset');
  if (r) r.onclick = () => {
    KP_SER_ZOOM = null; r.style.display = 'none'; kpSerDibujar();
  };
  const md = document.getElementById('kpSerModo');
  if (md) md.onclick = () => {
    KP_SER_SEP = !KP_SER_SEP;
    md.textContent = KP_SER_SEP ? 'Superponer' : 'Separar';
    kpSerDibujar();
  };
  kpSerDibujar();
}

function kpRenderSeries(){
  if (!KP_SER || !(KP_SER.series || []).length) return '';
  const hay = new Set(KP_SER.series.map(s => s.canal));
  const defs = KP_SER_DEF.filter(d => hay.has(d[0]));
  if (!KP_SER_ON){
    /* Arranca con cuatro canales y no con doce: doce bandas superpuestas
       no se leen, y el resto esta a un toque. */
    KP_SER_ON = new Set(['f_out', 'i_out_a', 'pip', 't_motor'].filter(c => hay.has(c)));
    if (!KP_SER_ON.size) defs.slice(0, 4).forEach(d => KP_SER_ON.add(d[0]));
  }
  let h = '<div class="kp-card"><div class="kp-ser-chips">';
  defs.forEach(([c, n, col]) => {
    h += '<button class="kp-ser-chip' + (KP_SER_ON.has(c) ? '' : ' off') + '" data-ser="' + c
      +  '"><i style="background:' + col + '"></i>' + n + '</button>';
  });
  h += '</div><div class="kp-ser-barra">'
    +  '<button class="kp-chip" id="kpSerModo">' + (KP_SER_SEP ? 'Superponer' : 'Separar') + '</button>'
    +  '<button class="kp-chip" id="kpSerReset" style="display:none">Ver los 15 d&iacute;as</button>'
    +  '<span style="font-size:11.5px;color:var(--t3)">Arrastra sobre la gr&aacute;fica para ampliar</span>'
    +  '</div>'
    +  '<div class="kp-ser" id="kpSerBox"></div>'
    +  '<div class="kp-ser-lec" id="kpSerLec"></div></div>';
  return h;
}

function kpRenderMedicion(m){
  const val   = m.valores || {};
  const placa = m.placa || {};
  const mc    = m.medicion || {};
  const cad   = kpCalcularCadena(val, placa);
  const bal   = kpBalanceRectificadores(val);
  const cal   = kpCalidadEnergia(val);
  const tmp   = kpTemperaturas(val);
  let h = '';

  /* Antes se cortaba el ISO en crudo, que esta en UTC, mientras la
     cabecera usaba kpFechaCorta con hora local: la misma ronda salia
     como 19:00 arriba y 00:00 aqui. Se usa la misma funcion en los dos
     sitios. */
  /* La fecha, la frecuencia y el modo ya salen como fichas en el
     bloque de arriba. Repetirlos aqui era una linea de ruido. */

  if (cad.length){
    /* Se elimino la lista "Detalle por etapa": repetia el diagrama nodo
       por nodo. La carga y la corriente ya estan en cada caja, los
       desbalances tienen su propia seccion en la tendencia, y lo unico
       que solo vivia alli -- tension y kVA -- pasa al tooltip de cada
       nodo del diagrama, donde no ocupa pantalla. */
    h += '<div class="kp-card">' + kpDibujarCadena(cad, val) + kpLeyenda() + '</div>';
  }
  if (bal){
    const e = KP_EST[bal.estado];
    h += '<h2>Balance de rectificadores</h2>';
    h += '<p class="hint">Reparto de corriente entre los dos secundarios del PST</p>';
    h += '<div class="kp-card"><div style="display:flex;justify-content:space-between;'
      +  'align-items:baseline;gap:12px;flex-wrap:wrap">'
      +  '<div><div style="font-size:24px;font-weight:600">' + kpNum(bal.diferencia_pct) + ' %</div>'
      +  '<div style="font-size:13px;color:var(--kp-ink2);margin-top:4px">'
      +  'Delta ' + kpNum(bal.conv1) + ' A &middot; Estrella ' + kpNum(bal.conv2) + ' A'
      +  ' &middot; mayor en ' + bal.mayor + '</div>'
      +  '<div style="font-size:12px;color:var(--kp-ink3);margin-top:6px;max-width:640px">'
      +  'Cierto desbalance es inherente a un VFD multipulso: los devanados secundarios '
      +  'reparten corriente sin aislaci&oacute;n galv&aacute;nica plena. Por s&iacute; solo no constituye falla.'
      +  '</div></div>'
      +  '<span class="kp-pill ' + e.cls + '">' + e.txt + '</span></div></div>';
  }

  if (cal.length){
    h += '<h2>Calidad de energ&iacute;a</h2>';
    h += '<p class="hint">Medida con instrumento en campo</p>';
    h += '<div class="kp-kpis" style="margin-bottom:8px">';
    cal.forEach(pt => {
      const peor = pt.alertas.some(a => a.t === 'crit') ? 'crit'
                 : (pt.alertas.some(a => a.t === 'warn') ? 'warn' : 'ok');
      h += '<div class="kp-kpi ' + peor + '" style="grid-column:span 2">'
        +  '<div class="k">' + pt.nombre + '</div>'
        +  '<div class="v">' + (pt.fp != null ? pt.fp.toFixed(2) : '\u2014')
        +  '<small>factor de potencia</small></div>'
        +  '<div class="r">'
        +  (pt.kw   != null ? kpNum(pt.kw)   + ' kW &middot; ' : '')
        +  (pt.kvar != null ? kpNum(pt.kvar) + ' kVAR &middot; ' : '')
        +  (pt.kva  != null ? kpNum(pt.kva)  + ' kVA' : '')
        +  '</div>'
        +  '<div class="r">THD tensi&oacute;n ' + kpNum(pt.thdv) + ' %'
        +  ' &middot; THD corriente ' + kpNum(pt.thdi) + ' %'
        +  (pt.factork != null ? ' &middot; Factor K ' + kpNum(pt.factork) : '') + '</div>';
      pt.alertas.forEach(a => {
        const cls = (a.t === 'info') ? 'none' : a.t;
        h += '<div style="margin-top:6px"><span class="kp-pill ' + cls + '">'
          +  (a.t === 'info' ? 'Informativo' : (a.t === 'crit' ? 'Cr&iacute;tico' : 'Atenci&oacute;n'))
          +  '</span></div>'
          +  '<div class="r" style="margin-top:5px">' + a.m + '</div>';
      });
      h += '</div>';
    });
    h += '</div>';
  }

  if (tmp.length){
    h += '<h2>Temperaturas</h2>';
    h += '<p class="hint">Puntos medidos en el gabinete y transformadores</p>';
    h += '<div class="kp-kpis" style="margin-bottom:8px">';
    tmp.forEach(t => {
      h += '<div class="kp-kpi"><div class="k">' + t.nombre + '</div>'
        +  '<div class="v">' + kpNum(t.valor) + '<small>\u00b0F</small></div></div>';
    });
    h += '</div>';
  }

  if (placa.motor_i_nominal_a || placa.motor_potencia_hp){
    h += '<h2>Placa</h2>';
    h += '<p class="hint">Origen: ' + (placa.fuente || 'no indicado')
      +  (placa.actualizado_en ? ' &middot; actualizada ' + String(placa.actualizado_en).slice(0,10) : '')
      +  '</p>';
    h += '<div class="kp-kpis" style="margin-bottom:8px">';
    const pl = [
      ['Motor', placa.motor_potencia_hp, 'hp'],
      ['Tensi&oacute;n motor', placa.motor_v_nominal_v, 'V'],
      ['Corriente motor', placa.motor_i_nominal_a, 'A'],
      ['Corriente VFD', placa.vfd_i_nominal_a, 'A'],
      ['Motores', placa.n_motores, ''],
      ['Aislamiento', placa.motor_clase_aisl, '']
    ];
    pl.forEach(x => {
      if (x[1] == null) return;
      const vv = (typeof x[1] === 'number') ? kpNum(x[1]) : x[1];
      h += '<div class="kp-kpi"><div class="k">' + x[0] + '</div>'
        +  '<div class="v">' + vv + (x[2] ? '<small>' + x[2] + '</small>' : '') + '</div></div>';
    });
    h += '</div>';
  }

  return h;
}

function kpDibujarCadena(nodos, val){
  const n = nodos.length;
  const w = 148, gap = 26, mx = 22;
  const yTerr = 214;                 /* linea de terreno */
  const hCard = 152;
  /* El alto se calcula, no se fija: la tarjeta de fondo arranca 34 px bajo
     el terreno y antes quedaba recortada por el borde del SVG. */
  const alto  = yTerr + 34 + hCard + 14;
  const anchoTot = mx * 2 + n * w + (n - 1) * gap;

  const esc = t => String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  /* Tope duro de ancho: si el texto estimado excede la caja se comprime
     con textLength en lugar de desbordarse sobre el nodo vecino. */
  const cab = (txt, cx, y, px, peso, color, max, ancla) => {
    const est = String(txt).length * px * 0.53;
    const tl = (est > max) ? ' textLength="' + max + '" lengthAdjust="spacingAndGlyphs"' : '';
    return '<text x="' + cx + '" y="' + y + '" text-anchor="' + (ancla || 'middle')
         + '" font-size="' + px + '" font-weight="' + peso + '" fill="' + color
         + '" font-family="inherit"' + tl + '>' + esc(txt) + '</text>';
  };

  /* Barra de carga: comunica el margen de un vistazo. El numero solo
     obliga a comparar dos cifras mentalmente en cada nodo. */
  const barra = (x, y, ancho, pct, col) => {
    if (pct == null) return '';
    const p = Math.max(0, Math.min(100, pct));
    let s = '<rect x="' + x + '" y="' + y + '" width="' + ancho + '" height="5" rx="2.5" '
          + 'fill="var(--kp-line,#e4e9ee)"/>'
          + '<rect x="' + x + '" y="' + y + '" width="' + (ancho * p / 100).toFixed(1)
          + '" height="5" rx="2.5" fill="' + col + '"/>';
    /* Marca del 100 % cuando la carga se pasa: sin ella una barra llena
       al 100 y otra al 130 se ven igual. */
    if (pct > 100){
      s += '<line x1="' + (x + ancho) + '" y1="' + (y - 2) + '" x2="' + (x + ancho)
        +  '" y2="' + (y + 7) + '" stroke="var(--t1)" stroke-width="1"/>';
    }
    return s;
  };

  let s = '<div class="kp-chain-wrap" style="--kp-chain-w:' + anchoTot + 'px">'
        + '<svg class="kp-chain" viewBox="0 0 ' + anchoTot + ' ' + alto
        + '" width="' + anchoTot + '" height="' + alto
        + '" role="img" xmlns="http://www.w3.org/2000/svg">'
        + '<title>Cadena de potencia de la unidad</title>'
        + '<defs>'
        + '<marker id="kpAr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" '
        + 'markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--t3)" '
        + 'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>'
        + '<pattern id="kpSuelo" width="7" height="7" patternUnits="userSpaceOnUse" '
        + 'patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" '
        + 'stroke="var(--t3)" stroke-width="0.7" opacity="0.35"/></pattern>'
        + '</defs>';

  /* ── Linea de terreno ──
     Separa lo que esta en la caseta de lo que esta a 2.000 pies. Sin esa
     separacion, el motor se lee como un equipo mas del patio. */
  s += '<line x1="0" y1="' + yTerr + '" x2="' + anchoTot + '" y2="' + yTerr
    +  '" stroke="var(--t3)" stroke-width="1.2"/>'
    +  '<rect x="0" y="' + yTerr + '" width="' + anchoTot + '" height="7" fill="url(#kpSuelo)"/>'
    +  cab('SUPERFICIE', 6, yTerr - 7, 9, 600, 'var(--t3)', 200, 'start')
    +  cab('FONDO DE POZO', 6, yTerr + 22, 9, 600, 'var(--t3)', 200, 'start');

  nodos.forEach((nd, i) => {
    const x = mx + i * (w + gap);
    const cx = x + w / 2;
    const col = KP_HEX[nd.estado] || KP_HEX.none;
    const pct = (nd.nominal && nd.medido != null) ? (nd.medido / nd.nominal * 100) : null;
    const max = w - 14;
    const fondo = nd.zona === 'fondo';
    const yc = fondo ? yTerr + 34 : 16;      /* tope de la tarjeta */
    const hc = hCard;

    const kvaPct = (nd.kva_nom && nd.kva != null) ? (nd.kva / nd.kva_nom * 100) : null;

    const det = [nd.nodo + (nd.detalle ? ' \u00b7 ' + nd.detalle : ''),
      kpNum(nd.medido) + ' A' + (nd.nominal ? ' de ' + kpNum(nd.nominal) + ' A nominal' : ''),
      (nd.v_prom != null ? kpNum(nd.v_prom) + ' V' : null),
      (nd.kva != null ? kpNum(nd.kva) + ' kVA demandados'
        + (nd.kva_nom ? ' de ' + kpNum(nd.kva_nom) + ' kVA de placa' : '') : null),
      (nd.desbal_i != null ? 'Desbalance de corriente ' + kpPct(nd.desbal_i) + ' %' : null),
      (nd.desbal_v != null ? 'Desbalance de tension ' + kpPct(nd.desbal_v) + ' %' : null)
    ].filter(Boolean).join('\n');

    s += '<g><title>' + esc(det) + '</title>';

    /* Bajante al motor: el cable de potencia dibujado, no un tercer
       recuadro igual a los de superficie. */
    if (fondo){
      /* Codo desde la salida del ultimo equipo de superficie hasta la
         cabeza de pozo y de ahi hacia abajo. Sin ese tramo horizontal el
         motor quedaba suelto, sin nada que lo conectara con el SUT. */
      const xPrev = mx + (i - 1) * (w + gap) + w;
      const yMid  = 16 + hCard / 2;
      s += '<path d="M' + xPrev + ' ' + yMid + ' H' + cx + ' V' + yc + '" fill="none" '
        +  'stroke="' + col + '" stroke-width="2" stroke-dasharray="1 5" '
        +  'stroke-linecap="round"/>'
        +  '<rect x="' + (cx - 13) + '" y="' + (yTerr - 12) + '" width="26" height="14" rx="2" '
        +  'fill="#fff" stroke="var(--t3)" stroke-width="1.2"/>'
        +  cab('cable', cx + 26, yTerr - 2, 9, 400, 'var(--t3)', 60, 'start');
    }

    s += '<rect x="' + x + '" y="' + yc + '" width="' + w + '" height="' + hc + '" rx="9" '
      +  'fill="#fff" stroke="' + col + '" stroke-width="1.5"/>'
      +  '<rect x="' + x + '" y="' + yc + '" width="' + w + '" height="5" rx="2.5" fill="' + col + '"/>';

    s += kpSimbolo(nd.tipo || nd.nodo, cx, yc + 34, col);

    s += cab(nd.nodo, cx, yc + 72, 13, 600, 'var(--t1)', max);
    s += cab(pct == null ? 'Sin placa' : (Math.round(pct * 10) / 10) + ' %',
             cx, yc + 94, pct == null ? 12 : 19, 700,
             pct == null ? 'var(--t3)' : col, max);

    /* Corriente con su barra */
    s += barra(x + 12, yc + 102, w - 24, pct, col);
    s += cab(nd.nominal ? kpNum(nd.medido) + ' / ' + kpNum(nd.nominal) + ' A'
                        : kpNum(nd.medido) + ' A',
             cx, yc + 121, 10.5, 500, 'var(--t2)', max);

    /* Potencia aparente. Se muestra siempre lo demandado; la nominal solo
       cuando existe de placa, y ahi va tambien su barra. */
    if (nd.kva != null){
      s += cab(nd.kva_nom
                 ? kpNum(nd.kva) + ' / ' + kpNum(nd.kva_nom) + ' kVA'
                 : kpNum(nd.kva) + ' kVA',
               cx, yc + 137, 10.5, 500,
               kvaPct != null ? col : 'var(--t3)', max);
      if (kvaPct != null) s += barra(x + 12, yc + 143, w - 24, kvaPct, col);
    } else {
      s += cab(nd.detalle || '', cx, yc + 137, 10, 400, 'var(--t3)', max);
    }

    s += '</g>';

    /* Flecha entre nodos de superficie. Del ultimo de superficie al motor
       no va flecha: ahi el recorrido lo cuenta el cable. */
    if (i < n - 1 && !fondo && nodos[i + 1].zona !== 'fondo'){
      s += '<line x1="' + (x + w + 4) + '" y1="' + (yc + hc / 2) + '" x2="'
        +  (x + w + gap - 4) + '" y2="' + (yc + hc / 2) + '" '
        +  'stroke="var(--t3)" stroke-width="1.5" marker-end="url(#kpAr)"/>';
    }
  });

  /* ── Sensor de fondo ──
     Ocupa la zona bajo la linea de terreno, que estaba vacia. Los datos
     del sensor pertenecen al fondo del pozo, no a una lista aparte de la
     cadena: es la misma profundidad y el mismo instante.

     Los umbrales de alerta son deliberadamente conservadores y solo se
     usan para colorear: la vibracion y la temperatura de un ESP dependen
     del diseno de cada pozo, y marcar en rojo con un valor generico
     seria dar por falla lo que puede ser normal en esa unidad. */
  const V = val || {};
  const SENSOR = [
    ['sf_pip_psi',    'Presi\u00f3n de admisi\u00f3n', 'psi',  0, null],
    ['sf_pdesc_psi',  'Presi\u00f3n de descarga',      'psi',  0, null],
    ['sf_t_motor_c',  'Temperatura de motor',          '\u00b0F', 1, 260],
    ['sf_t_intake_c', 'Temperatura de admisi\u00f3n',  '\u00b0F', 1, 240],
    ['sf_vib_x_g',    'Vibraci\u00f3n X',              'g',    2, 0.8],
    ['sf_vib_y_g',    'Vibraci\u00f3n Y',              'g',    2, 0.8],
    ['sf_ct_ma',      'Corriente de fuga',             'mA',   2, null],
    ['sf_vt_v',       'Tensi\u00f3n del sensor',       'V',    0, null],
  ];
  /* Las dos temperaturas se guardan en C y el sensor las reporta en F,
     que es como se leen en campo. Se convierte solo esas dos. */
  const leerSensor = (cod) => {
    const v = V[cod];
    if (v == null) return null;
    return (cod === 'sf_t_motor_c' || cod === 'sf_t_intake_c')
      ? Number(v) * 9 / 5 + 32 : Number(v);
  };
  const hay = SENSOR.some(([c]) => leerSensor(c) != null);

  const xS = mx, yS = yTerr + 34, wS = Math.min(4 * (w + gap) - gap, anchoTot - mx * 2 - w - gap * 2);
  s += '<rect x="' + xS + '" y="' + yS + '" width="' + wS + '" height="' + hCard + '" rx="9" '
    +  'fill="#fff" stroke="var(--kp-line,#e4e9ee)" stroke-width="1.5" '
    +  'stroke-dasharray="' + (hay ? '0' : '4 4') + '"/>'
    +  cab('SENSOR DE FONDO', xS + 14, yS + 20, 9.5, 700, 'var(--t3)', wS - 28, 'start');

  if (!hay){
    s += cab('No se registr\u00f3 en esta ronda', xS + 14, yS + 44, 11.5, 500, 'var(--t2)', wS - 28, 'start')
      +  cab('Sin estos valores no hay lectura de la bomba: presi\u00f3n de entrada,',
             xS + 14, yS + 62, 10, 400, 'var(--t3)', wS - 28, 'start')
      +  cab('temperaturas y vibraci\u00f3n quedan sin evaluar.',
             xS + 14, yS + 76, 10, 400, 'var(--t3)', wS - 28, 'start');
  } else {
    /* Dos columnas de cuatro: cabe en el alto de la tarjeta sin apretar y
       agrupa presiones con presiones, temperaturas con temperaturas. */
    const colAncho = (wS - 28) / 2;
    SENSOR.forEach(([cod, etq, ud, dec, lim], k) => {
      const cxs = xS + 14 + (k % 2) * colAncho;
      const ys  = yS + 44 + Math.floor(k / 2) * 27;
      const v   = leerSensor(cod);
      const alto2 = (lim != null && v != null && v > lim);
      s += cab(etq, cxs, ys, 9.5, 400, 'var(--t3)', colAncho - 70, 'start')
        +  cab(v == null ? '\u2014'
                         : (Math.round(v * Math.pow(10, dec)) / Math.pow(10, dec))
                             .toString().replace('.', ',') + ' ' + ud,
               cxs + colAncho - 14, ys, 12, 600,
               v == null ? 'var(--t3)' : (alto2 ? KP_HEX.warn : 'var(--t1)'),
               72, 'end');
    });
  }

  const conKva = nodos.filter(x => x.kva_nom).length;
  return s + '</svg></div>'
       + '<div class="kp-chain-hint"><span class="sol-movil">Desliza en horizontal para ver '
       + 'las ' + n + ' etapas. </span>Toca una etapa para ver tensi\u00f3n, kVA y desbalances.'
       + (conKva < nodos.length
          ? ' Los secundarios del PST y el motor no llevan kVA de placa: el PST se especifica '
            + 'por el conjunto y el motor en HP.'
          : '')
       + '</div>';
}

/* Simbolos por tipo de equipo. Un transformador y un variador no son la
   misma caja: el objetivo del diagrama es reconocer el equipo antes de
   leer la etiqueta. */
function kpSimbolo(tipo, cx, cy, col){
  const t = String(tipo || '').toLowerCase();

  if (t === 'vfd' || t.indexOf('vfd') >= 0){
    /* Gabinete con las tres etapas: rectificador, bus y ondulador. */
    return '<rect x="' + (cx - 24) + '" y="' + (cy - 15) + '" width="48" height="30" rx="3" '
      + 'fill="none" stroke="' + col + '" stroke-width="1.7"/>'
      + '<line x1="' + (cx - 8) + '" y1="' + (cy - 15) + '" x2="' + (cx - 8) + '" y2="' + (cy + 15)
      + '" stroke="' + col + '" stroke-width="1"/>'
      + '<line x1="' + (cx + 8) + '" y1="' + (cy - 15) + '" x2="' + (cx + 8) + '" y2="' + (cy + 15)
      + '" stroke="' + col + '" stroke-width="1"/>'
      /* rectificador: media onda a diodo */
      + '<path d="M' + (cx - 20) + ' ' + (cy + 4) + ' q4 -12 8 0" fill="none" stroke="' + col
      + '" stroke-width="1.3"/>'
      + '<line x1="' + (cx - 20) + '" y1="' + (cy + 4) + '" x2="' + (cx - 12) + '" y2="' + (cy + 4)
      + '" stroke="' + col + '" stroke-width="1.3"/>'
      /* bus de continua */
      + '<line x1="' + (cx - 4) + '" y1="' + (cy - 4) + '" x2="' + (cx + 4) + '" y2="' + (cy - 4)
      + '" stroke="' + col + '" stroke-width="1.3"/>'
      + '<line x1="' + (cx - 4) + '" y1="' + (cy + 2) + '" x2="' + (cx + 4) + '" y2="' + (cy + 2)
      + '" stroke="' + col + '" stroke-width="1.3" stroke-dasharray="2 2"/>'
      /* ondulador: onda completa */
      + '<path d="M' + (cx + 12) + ' ' + cy + ' q3 -9 5.5 0 q3 9 5.5 0" fill="none" stroke="'
      + col + '" stroke-width="1.3"/>';
  }

  if (t === 'motor' || t.indexOf('motor') >= 0){
    /* Motor sumergible: circulo alargado, como el equipo real. */
    return '<rect x="' + (cx - 11) + '" y="' + (cy - 17) + '" width="22" height="34" rx="11" '
      + 'fill="none" stroke="' + col + '" stroke-width="1.7"/>'
      + '<text x="' + cx + '" y="' + (cy + 5) + '" text-anchor="middle" font-size="13" '
      + 'font-weight="600" fill="' + col + '" font-family="inherit">M</text>'
      + '<line x1="' + (cx - 6) + '" y1="' + (cy + 21) + '" x2="' + (cx + 6) + '" y2="' + (cy + 21)
      + '" stroke="' + col + '" stroke-width="1.3"/>';
  }

  /* Transformador: dos devanados acoplados, simbolo IEC. */
  return '<circle cx="' + (cx - 8) + '" cy="' + cy + '" r="12" fill="none" stroke="' + col
    + '" stroke-width="1.7"/>'
    + '<circle cx="' + (cx + 8) + '" cy="' + cy + '" r="12" fill="none" stroke="' + col
    + '" stroke-width="1.7"/>';
}

function kpLeyenda(){
  return '<div class="kp-leg">'
    + '<span><i style="background:' + KP_HEX.ok   + '"></i>hasta 95 %</span>'
    + '<span><i style="background:' + KP_HEX.warn + '"></i>95 a 100 %</span>'
    + '<span><i style="background:' + KP_HEX.crit + '"></i>sobre 100 %</span>'
    + '<span><i style="background:' + KP_HEX.none + '"></i>sin dato de placa</span></div>';
}

<!-- Capa de Optimizacion Energetica. Vive fuera del flujo de la
     pantalla y solo aparece al pedirla, igual que el tablero de
     demanda pero con su propio archivo detras. -->
<div id="kpOptCapa">
  <div class="kp-opt-barra">
    <button onclick="kpCerrarOptimizacion()">&larr; Volver a condici&oacute;n</button>
    <span id="kpOptCtx"></span>
  </div>
  <iframe id="kpOptMarco" title="Optimizaci&oacute;n Energ&eacute;tica"></iframe>
</div>


<script>
/* Reporte de scroll al contenedor de Kronos-M.
   Este archivo tambien se abre en pestana aparte; ahi no hay padre a quien
   avisar y el bloque no hace nada. Solo sirve cuando corre dentro del
   iframe: el boton del asistente vive en la pagina padre y sin este aviso
   no se entera de que aqui adentro se esta bajando. */
(function () {
  if (window.parent === window) return;
  var ultimo = 0;
  window.addEventListener("scroll", function () {
    var y = window.scrollY || document.documentElement.scrollTop || 0;
    if (Math.abs(y - ultimo) < 4) return;
    ultimo = y;
    try { window.parent.postMessage({ tipo: "kx-scroll", y: y }, "*"); }
    catch (e) { /* origen distinto: se ignora */ }
  }, { passive: true });
})();
</script>
