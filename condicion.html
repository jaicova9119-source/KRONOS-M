     Recorre lo medido y deja arriba solo lo que se sale de rango. Es
     lo que reemplaza a las cuatro tarjetas: en vez de mostrar cuatro
     cifras siempre, aunque esten bien, muestra las que piden atencion
     y calla cuando no hay ninguna.                                  */
  const av = [];
  const nota = (nivel, que, detalle) => av.push({nivel, que, detalle});

  cad.forEach(n => {
    if (n.carga_pct != null){
      const e = kpEstadoCarga(n.carga_pct);
      if (e !== 'ok') nota(e, n.nodo + ': carga ' + kpPct(n.carga_pct) + ' %',
        kpNum(n.medido) + ' A de ' + kpNum(n.nominal) + ' A nominal');
    }
    if (n.desbal_i != null){
      const e = kpEstadoDesbalI(n.desbal_i);
      if (e !== 'ok' && e !== 'none')
        nota(e, n.nodo + ': desbalance de corriente ' + kpPct(n.desbal_i) + ' %',
             'Se revisa desde 5 %, se act\u00faa sobre 10 %');
    }
    if (n.desbal_v != null){
      const e = kpEstadoDesbal(n.desbal_v);
      /* La salida del variador no lleva criterio NEMA: la onda es PWM. */
      if (e !== 'ok' && e !== 'none' && n.nodo.indexOf('VFD salida') < 0)
        nota(e, n.nodo + ': desbalance de tensi\u00f3n ' + kpPct(n.desbal_v) + ' %',
             'NEMA MG-1 marca derateo del motor desde 1 %');
    }
  });

  if (b && b.diferencia_pct != null && b.diferencia_pct > 5){
    nota(b.diferencia_pct > 10 ? 'crit' : 'warn',
      'Reparto \u0394 / Y desigual: ' + kpPct(b.diferencia_pct) + ' %',
      'Carga m\u00e1s el secundario '
        + ((b.mayor === 'delta' || b.mayor === 'secundario delta') ? '\u0394' : 'Y'));
  }

  const fp = val.pst_in_fp;
  if (fp != null && fp <= 0.85)
    nota(fp <= 0.80 ? 'crit' : 'warn', 'Factor de potencia ' + Number(fp).toFixed(2),
         'Medido en la acometida');

  const thdv = val.pst_in_thdv;
  if (thdv != null && thdv > 8)
    nota('warn', 'Distorsi\u00f3n de tensi\u00f3n ' + kpNum(thdv) + ' % en la red',
         'IEEE 519 sugiere 8 % para sistemas de este nivel');

  const tmax = placa.motor_temp_max_c;
  const tmot = kpTempF(val.sf_t_motor_c) == null ? null : Number(val.sf_t_motor_c);
  if (tmot != null && tmax > 0){
    /* El porcentaje se calcula en la escala absoluta de la placa (C) y
       se muestra en F, que es como se leyo. */
    const pct = 100 * tmot / tmax;
    if (pct >= 90) nota(pct >= 100 ? 'crit' : 'warn',
      'Temperatura de motor al ' + pct.toFixed(0) + ' % del l\u00edmite',
      kpNumF(tmot) + ' \u00b0F de ' + kpNumF(tmax) + ' \u00b0F de placa');
  }

  av.sort((x, y) => (x.nivel === 'crit' ? 0 : 1) - (y.nivel === 'crit' ? 0 : 1));

  h += '<div class="kp-sub" style="margin-top:18px">Requiere revisi&oacute;n</div>';
  if (!av.length){
    h += '<div class="kp-ok">Nada fuera de rango en esta ronda.'
      +  (sf.length ? '' : ' Ten en cuenta que el sensor de fondo no se midi&oacute;.')
      +  '</div>';
  } else {
    h += '<div class="kp-avisos">';
    av.forEach(a => {
      h += '<div class="kp-aviso ' + a.nivel + '">'
        +  '<div class="q">' + a.que + '</div>'
        +  '<div class="d">' + a.detalle + '</div></div>';
    });
    h += '</div>';
  }

  return h;
}

/* ============================================================
   TENDENCIA
   ============================================================
   Un desbalance de 1,6 % no dice nada por si solo. Que venia en 0,4 %
   hace tres rondas lo dice todo. Por eso la tendencia no es un extra:
   es donde aparece lo que una medicion aislada esconde.

   Los graficos son SVG sin librerias: se dibujan igual sin conexion y
   no agregan 200 kB de descarga a una app que se usa en campo.     */
function kpRenderTendencia(tend, bal){
  const porNodo = {};
  tend.forEach(t => { (porNodo[t.nodo] = porNodo[t.nodo] || []).push(t); });

  /* La clave es medicion_id, no la fecha ni la hora. Con fecha, dos
     rondas del mismo dia se colapsan y la tabla suma sus etapas:
     mostraba "24 etapas" donde una ronda tiene 6. Y con medido_en
     tampoco alcanza, porque los guardados repetidos comparten esa
     marca al segundo: viene del formulario, no del reloj del envio.
     Cada medicion es un punto. */
  const claves = [...new Set(tend.map(t => t.medicion_id))];
  claves.sort((a2,b2) => {
    const ta = (tend.find(t => t.medicion_id === a2) || {}).medido_en || '';
    const tb = (tend.find(t => t.medicion_id === b2) || {}).medido_en || '';
    return ta.localeCompare(tb) || String(a2).localeCompare(String(b2));
  });
  const fechaDe = k => (tend.find(t => t.medicion_id === k) || {}).medido_en || '';

  let h = '';

  /* 1. Reparto entre puentes: el indicador que mas dice de un 12
        pulsos y que no se ve en ningun nodo por separado. */
  if (bal && bal.length){
    const ult = bal[bal.length - 1];
    const est = ult.diferencia_pct > 10 ? 'crit' : (ult.diferencia_pct > 5 ? 'warn' : 'ok');
    /* Una linea de la diferencia obliga a traducir "13 %" a que puente
       carga mas y cuanto. La barra lo muestra directo: dos bloques
       proporcionales y una marca en el centro, que es donde deberian
       encontrarse si el reparto fuera parejo. La evolucion va debajo,
       en la misma linea pequena que usa el resto de la pantalla. */
    h += '<div class="kp-card" style="border-left:4px solid ' + KP_HEX[est] + '">'
      +  '<div style="font-weight:600;margin-bottom:2px">Reparto entre secundarios \u0394 y Y</div>'
      +  '<p class="hint" style="margin:0 0 14px">Los dos puentes pueden estar cada uno dentro de '
      +  'su carga y aun as\u00ed repartirse mal. Sumados dan la misma corriente de entrada, '
      +  'as\u00ed que esto no se ve en ning\u00fan otro indicador.</p>'
      +  kpReparto(bal) + '</div>';
  }

  /* 2 y 3. Corriente y desbalance por etapa.
     Antes iban como graficos de cinco lineas superpuestas. Con cinco
     etapas en un rango parecido, las lineas se cruzan y no se lee ni
     el valor de una ni la diferencia entre dos: ocupa media pantalla
     y no responde ni "esta mal" ni "se esta moviendo".
     Una fila por etapa si responde las dos: el numero de ahora, cuanto
     cambio desde la ronda anterior, y una linea propia para la forma. */
  const serie = (campo) => {
    const out = [];
    Object.keys(porNodo).forEach(nodo => {
      const pts = porNodo[nodo].filter(p => p[campo] != null)
        .map(p => ({x: p.medicion_id, y: Number(p[campo])}));
      if (pts.length) out.push({nombre: porNodo[nodo][0].etiqueta_corta || nodo,
                                orden: porNodo[nodo][0].orden || 999, pts});
    });
    return out.sort((a2,b2) => a2.orden - b2.orden);
  };

  const sI = serie('i_prom');
  if (sI.length){
    h += '<div class="kp-card"><div style="font-weight:600;margin-bottom:2px">'
      +  'Corriente por etapa</div>'
      +  '<p class="hint" style="margin:0 0 10px">Amperios medidos en cada punto de la cadena, '
      +  'en orden de flujo de energ&iacute;a.</p>'
      +  kpFilasEtapa(sI, 'A') + '</div>';
  }

  /* Corriente y tension van en la misma tarjeta, en dos columnas.
     Se leen juntas porque un desbalance de corriente alto con la
     tension equilibrada apunta al motor o al cable, y si las dos estan
     desbalanceadas el origen esta aguas arriba. Separarlas en dos
     tarjetas obliga a bajar y subir para hacer esa comparacion. */
  const sD = serie('i_desbal_pct');
  const sV = serie('v_desbal_pct');
  if (sD.length || sV.length){
    h += '<div class="kp-card"><div style="font-weight:600;margin-bottom:2px">'
      +  'Desbalance por etapa</div>'
      +  '<p class="hint" style="margin:0 0 12px">M&aacute;xima desviaci&oacute;n respecto al '
      +  'promedio, criterio NEMA. Los umbrales no son los mismos: un desbalance de '
      +  'tensi&oacute;n peque&ntilde;o produce uno de corriente varias veces mayor. '
      +  'Si la corriente est&aacute; desbalanceada y la tensi&oacute;n no, el origen suele '
      +  'estar en el motor o el cable; si las dos lo est&aacute;n, viene de aguas arriba.</p>'
      +  '<div class="kp-dos">';
    if (sD.length){
      h += '<div><div class="kp-sub">Corriente <span>revisar sobre 5 %</span></div>'
        +  kpFilasEtapa(sD, '%', {warn:5, crit:10}) + '</div>';
    }
    if (sV.length){
      h += '<div><div class="kp-sub">Tensi&oacute;n <span>revisar sobre 1 %</span></div>'
        +  kpFilasEtapa(sV, '%', {warn:1, crit:2})
        /* El criterio NEMA vale para una senoidal. A la salida del
           variador la onda es PWM y la lectura depende del instrumento,
           igual que pasa con el THD: sirve para ver si cambia entre
           rondas, no para juzgarla contra la norma. */
        + (sV.some(x => x.nombre === 'VFD OUT')
            ? '<p class="hint" style="margin:8px 0 0;font-size:11.5px">En VFD OUT la onda es '
              + 'PWM y la lectura depende del instrumento: mira si cambia entre rondas, no el '
              + 'valor contra la norma.</p>'
            : '')
        +  '</div>';
    }
    h += '</div></div>';
  }

  /* 4. Calidad de energia: entrada contra salida.
     Iba como grafico de dos series, pero la entrada ronda el 11 % y la
     salida el 5 %: dos lineas planas separadas por un hueco que ocupaba
     la mitad de la tarjeta sin decir nada. La diferencia de nivel se
     lee mejor en los numeros, y la tendencia de cada una en su propia
     linea. */
  const cal = [];
  const calDef = [['pst_in','Entrada (red)'], ['vfdout','Salida (al motor)']];
  calDef.forEach(([n, etq], k) => {
    if (!porNodo[n]) return;
    const pts = porNodo[n].filter(p => p.thd_i_pct != null)
                          .map(p => ({x: p.medicion_id, y: Number(p.thd_i_pct)}));
    if (pts.length) cal.push({nombre: etq, orden: k, pts});
  });
  const calV = [];
  calDef.forEach(([n, etq], k) => {
    if (!porNodo[n]) return;
    const pts = porNodo[n].filter(p => p.thd_v_pct != null)
                          .map(p => ({x: p.medicion_id, y: Number(p.thd_v_pct)}));
    if (pts.length) calV.push({nombre: etq, orden: k, pts});
  });

  if (cal.length || calV.length){
    h += '<div class="kp-card"><div style="font-weight:600;margin-bottom:2px">'
      +  'Distorsi&oacute;n arm&oacute;nica</div>'
      +  '<p class="hint" style="margin:0 0 12px">En la acometida se compara contra IEEE 519, '
      +  'que para sistemas de este nivel sugiere 8 % en tensi&oacute;n. En la salida del '
      +  'variador la distorsi&oacute;n es propia de la onda PWM y no constituye falla: '
      +  'sirve para ver si cambia entre rondas, no para juzgarla contra una norma.</p>'
      +  '<div class="kp-dos">';
    if (cal.length){
      h += '<div><div class="kp-sub">Corriente <span>THD-I</span></div>'
        +  kpFilasEtapa(cal, '%') + '</div>';
    }
    if (calV.length){
      h += '<div><div class="kp-sub">Tensi&oacute;n <span>IEEE 519: 8 % en la red</span></div>'
        +  kpFilasEtapa(calV, '%', {warn:5, crit:8, soloPrimero:true}) + '</div>';
    }
    h += '</div></div>';
  }

  /* 5. Tabla de rondas, una fila por medicion */
  const porDia = {};
  claves.forEach(k => {
    const f = String(fechaDe(k)).slice(0,10);
    porDia[f] = (porDia[f] || 0) + 1;
  });
  const repetidos = Object.keys(porDia).filter(f => porDia[f] > 1);

  /* La lista crece con cada ronda: a doce rondas ya son doce filas
     empujando hacia abajo lo que sigue. Se muestran las cuatro mas
     recientes y el resto queda detras de un boton. Las recientes son
     las que se consultan; el historico se abre cuando hace falta. */
  /* El bloque entero se pliega y arranca cerrado. Es la parte que mas
     crece -- una fila por ronda, para siempre -- y casi nunca es lo
     que se viene a mirar: los indicadores de arriba ya resumen lo que
     importa. Dentro, ademas, solo se listan las cuatro mas recientes
     hasta que se pidan las demas. */
  const VISIBLES = 4;
  const total = claves.length;
  h += '<div class="kp-list kp-plegada" id="kp-rondas">'
    +  '<div class="kp-grp kp-cab" onclick="kpPlegarRondas(this)">'
    +  '<span class="tw">\u25b8</span>Rondas registradas'
    +  '<span style="text-transform:none;letter-spacing:0">&middot; '
    +  total + (total === 1 ? ' ronda' : ' rondas') + '</span></div>';
  claves.slice().reverse().forEach((k, idx) => {
    const dia = tend.filter(t => t.medicion_id === k);
    const m = dia.find(t => t.nodo === 'sutout') || dia[0];
    const p = dia.find(t => t.nodo === 'pst_in');
    const f = String(fechaDe(k)).slice(0,10);
    h += '<div class="kp-rule' + (porDia[f] > 1 ? ' warn' : '')
      +  (idx >= VISIBLES ? ' kp-oculta' : '') + '"><div>'
      +  '<div><span class="nm">' + kpFechaCorta(fechaDe(k)) + '</span> '
      +  '<span class="id">' + dia.length + (dia.length === 1 ? ' etapa' : ' etapas') + '</span></div>'
      +  '<div class="dt">'
      +  (m && m.i_prom != null ? 'Al motor ' + kpNum(m.i_prom) + ' A' : 'Sin corriente de salida')
      +  (m && m.frec_hz != null ? ' &middot; ' + kpNum(m.frec_hz) + ' Hz' : '')
      +  (p && p.fp != null ? ' &middot; FP ' + Number(p.fp).toFixed(2) : '')
      +  '</div>'
      +  '<div class="src">' + (m && m.condicion ? kpEsc(m.condicion) : '') + '</div>'
      +  '</div></div>';
  });
  if (total > VISIBLES){
    h += '<button class="kp-mas" onclick="kpMasRondas(this)">'
      +  'Ver las ' + (total - VISIBLES) + ' rondas anteriores</button>';
  }
  h += '</div>';

  /* Varias rondas con la misma marca de tiempo casi siempre son
     reintentos de guardado, no mediciones distintas. Se avisa en vez de
     dejar que inflen la serie en silencio. */
  if (repetidos.length){
    h += '<div class="kp-card" style="border-left:4px solid var(--kp-warn);margin-top:14px">'
      +  '<div style="font-weight:600;margin-bottom:2px">Rondas repetidas el mismo d&iacute;a</div>'
      +  '<p class="hint" style="margin:0">'
      +  repetidos.map(f => f + ' \u2014 ' + porDia[f] + ' registros').join(', ')
      +  '. Cuando coinciden en fecha y hora suelen ser reintentos de guardado, '
      +  'no mediciones distintas: inflan la serie y desplazan el promedio. '
      +  'Conviene revisarlas y dejar una sola.</p></div>';
  }

  return h;
}

/* ============================================================
   GRAFICOS
   ============================================================
   SVG a mano, sin libreria. Escala al ancho disponible con viewBox,
   asi que se ve igual en un telefono que en un monitor sin recalcular
   nada al rotar la pantalla.                                      */
const KP_SERIE = ['#12a5b8','#c77700','#7b5ea7','#2ea44f','#c0392b','#2f6fb0','#8a6d3b'];

/* ============================================================
   REPARTO ENTRE SECUNDARIOS
   ============================================================
   Dos bloques proporcionales a lo que carga cada puente, con una marca
   en el 50 %. Si el reparto fuera parejo, la division caeria justo
   sobre esa marca; cuanto se corre de ahi es el desequilibrio, sin
   tener que interpretar un porcentaje.                              */
function kpReparto(bal){
  const u = bal[bal.length - 1];
  const d = Number(u.delta) || 0, y = Number(u.estrella) || 0;
  const tot = d + y;
  if (!tot) return '<p class="hint">Sin lectura de los dos secundarios.</p>';
  const pd = 100 * d / tot, py = 100 * y / tot;
  const dif = Number(u.diferencia_pct) || 0;
  const est = dif > 10 ? 'crit' : (dif > 5 ? 'warn' : 'ok');
  const col = KP_HEX[est];

  let h = '<div class="kp-rep">'
    + '<div class="ext"><span><b>\u0394</b> ' + kpNum(d) + ' A</span>'
    + '<span>' + kpNum(y) + ' A <b>Y</b></span></div>'
    + '<div class="barra">'
    +   '<div class="a" style="width:' + pd.toFixed(1) + '%;background:'
    +     (pd >= py ? col : '#9fb3bb') + '"><span>' + pd.toFixed(0) + '%</span></div>'
    +   '<div class="b" style="width:' + py.toFixed(1) + '%;background:'
    +     (py > pd ? col : '#9fb3bb') + '"><span>' + py.toFixed(0) + '%</span></div>'
    +   '<i class="mitad" title="Reparto parejo"></i>'
    + '</div>'
    + '<div class="pie"><span>Reparto parejo</span></div>'
    + '<div class="res"><b style="color:' + col + '">' + kpNum(dif) + ' %</b> de diferencia'
    +   (dif > 5 ? ' \u00b7 carga m\u00e1s el secundario '
                 + (u.mayor === 'delta' ? '\u0394' : 'Y') : ' \u00b7 dentro de lo normal')
    + '</div>';

  /* La evolucion, solo si hay con que compararla. */
  if (bal.length > 1){
    const ys = bal.map(b => Number(b.diferencia_pct)).filter(v => isFinite(v));
    h += '<div class="hist"><div class="et">Diferencia entre rondas</div>'
      +  '<div class="sp">' + kpSpark(ys, {warn:5, crit:10}) + '</div>'
      +  '<div class="ra">' + kpNum(Math.min(...ys)) + ' a ' + kpNum(Math.max(...ys)) + ' %</div>'
      +  '</div>';
  }
  return h + '</div>';
}

function kpPlegarRondas(cab){
  const lista = cab.closest('.kp-list');
  const cerrada = lista.classList.toggle('kp-plegada');
  cab.querySelector('.tw').textContent = cerrada ? '\u25b8' : '\u25be';
}

/* Despliega el resto de la lista. Se alterna en lugar de solo abrir:
   una vez consultado el historico, poder cerrarlo devuelve la pantalla
   a su tamano util. */
function kpMasRondas(boton){
  const lista = boton.closest('.kp-list');
  const abierto = lista.classList.toggle('kp-abierta');
  const n = lista.querySelectorAll('.kp-oculta').length;
  boton.textContent = abierto ? 'Ver menos'
                              : 'Ver las ' + n + ' rondas anteriores';
}

/* ============================================================
   FILAS POR ETAPA
   ============================================================
   Una fila por nodo: valor actual, cuanto cambio desde la ronda
   anterior, y una linea pequena con la forma de la serie. Responde de
   un vistazo lo unico que se le pregunta a esta seccion -- si el valor
   esta fuera de rango y si se esta moviendo -- sin obligar a
   distinguir cinco colores cruzados.                               */
function kpFilasEtapa(series, unidad, um){
  um = um || {};
  const estado = (v, i) => {
    if (v == null || um.warn == null) return null;
    /* soloPrimero: el umbral vale para la acometida y no para la salida
       del variador, donde la onda PWM distorsiona por diseno. Pintar
       en rojo la salida por superar un limite que no le aplica seria
       una alarma falsa permanente. */
    if (um.soloPrimero && i > 0) return null;
    if (um.crit != null && v >= um.crit) return 'crit';
    if (v >= um.warn) return 'warn';
    return 'ok';
  };

  let h = '<div class="kp-etapas">';
  series.forEach((se, idx) => {
    const ys = se.pts.map(p => p.y);
    const ult = ys[ys.length - 1];
    const ant = ys.length > 1 ? ys[ys.length - 2] : null;
    const est = estado(ult, idx);

    /* La variacion se mide contra la ronda anterior, no contra la
       primera: lo que interesa es si algo cambio desde la ultima vez
       que se estuvo en el pozo. */
    let delta = '';
    if (ant != null){
      const d = ult - ant;
      const rel = Math.abs(ant) > 0 ? Math.abs(d / ant) : 0;
      if (rel < 0.03) delta = '<span class="ig">sin cambio</span>';
      else delta = '<span class="' + (d > 0 ? 'sube' : 'baja') + '">'
                 + (d > 0 ? '\u2191' : '\u2193') + ' ' + kpNum(Math.abs(d)) + '</span>';
    } else {
      delta = '<span class="ig">1.\u00aa ronda</span>';
    }

    h += '<div class="kp-etapa' + (est ? ' ' + est : '') + '">'
      +  '<div class="nb">' + kpEsc(se.nombre) + '</div>'
      +  '<div class="vl">' + kpNum(ult) + '<small>' + unidad + '</small></div>'
      +  '<div class="dl">' + delta + '</div>'
      +  '<div class="sp">' + kpSpark(ys, um) + '</div>'
      +  '</div>';
  });
  return h + '</div>';
}

/* Linea minima, sin ejes ni etiquetas: aqui la forma es el dato y el
   numero exacto ya esta en la columna de al lado. */
function kpSpark(ys, um){
  /* viewBox ancho y width al 100 %: la linea se estira con la columna
     en vez de dejar un hueco a su izquierda. En pantalla ancha eso
     convierte el espacio sobrante en mas resolucion horizontal, que es
     justo donde se lee la forma de la serie. */
  const W = 260, H = 34, m = 4;
  const val = ys.filter(y => y != null && isFinite(y));
  if (val.length < 2) return '<span class="ig">\u2014</span>';
  let lo = Math.min(...val), hi = Math.max(...val);
  if (hi === lo){ hi = lo + 1; lo = lo - 1; }   /* serie plana: linea al centro */
  const px = i => m + i * (W - m*2) / (ys.length - 1);
  const py = y => m + (H - m*2) * (1 - (y - lo) / (hi - lo));

  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" '
        + 'aria-hidden="true" xmlns="http://www.w3.org/2000/svg">';
  const col = (um && um.crit != null && ys[ys.length-1] >= um.crit) ? KP_HEX.crit
            : (um && um.warn != null && ys[ys.length-1] >= um.warn) ? KP_HEX.warn
            : '#12a5b8';
  s += '<polyline points="' + ys.map((y,i) => px(i) + ',' + py(y)).join(' ')
    +  '" fill="none" stroke="' + col + '" stroke-width="1.8" '
    +  'vector-effect="non-scaling-stroke" '
    +  'stroke-linejoin="round" stroke-linecap="round"/>';
  /* Solo el ultimo punto lleva marca: es el que se esta leyendo. */
  /* El circulo se deforma con preserveAspectRatio none, asi que se
     dibuja como una barra vertical fina en el ultimo punto. */
  s += '<line x1="' + px(ys.length-1) + '" y1="' + (py(ys[ys.length-1]) - 4)
    +  '" x2="' + px(ys.length-1) + '" y2="' + (py(ys[ys.length-1]) + 4)
    +  '" stroke="' + col + '" stroke-width="3" vector-effect="non-scaling-stroke" '
    +  'stroke-linecap="round"/>';
  return s + '</svg>';
}

function kpGrafico(pts, unidad, op){
  return kpGraficoMulti([{nombre:'', pts:pts}], unidad, op);
}

/* Redondea el eje a pasos que una persona lee de un vistazo. Sin
   esto las marcas salen del minimo y el maximo crudos -- 0.82, 13.70,
   26.58 -- y hay que hacer cuentas para ubicar un valor. */
function kpEscala(lo, hi, divisiones){
  const rango = (hi - lo) || Math.abs(hi) || 1;
  const bruto = rango / divisiones;
  const mag   = Math.pow(10, Math.floor(Math.log10(bruto)));
  const norm  = bruto / mag;
  const paso  = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  return { min: Math.floor(lo / paso) * paso,
           max: Math.ceil(hi / paso) * paso,
           paso: paso };
}

function kpGraficoMulti(series, unidad, op){
  op = op || {};
  /* Alto reducido de 200 a 150. Con dos series separadas -- 11 % en la
     entrada y 5 % en la salida -- el hueco entre ellas es inevitable,
     pero no hace falta darle 200 px de alto para verlo. */
  const W = 640, H = 150, ml = 44, mr = 12, mt = 12, mb = 28;
  const todas = series.flatMap(s => s.pts).filter(p => p.y != null && isFinite(p.y));
  if (todas.length < 2) return '<p class="hint">Hace falta m&aacute;s de una ronda.</p>';

  const xs = [...new Set(series.flatMap(s => s.pts.map(p => p.x)))].sort();
  let yMin = Math.min(...todas.map(p => p.y));
  let yMax = Math.max(...todas.map(p => p.y));
  if (op.umbral_crit != null) yMax = Math.max(yMax, op.umbral_crit * 1.15);
  /* Un margen del 12 % evita que la linea toque el borde y que un
     tramo plano parezca pegado al eje. */
  const rango = (yMax - yMin) || Math.abs(yMax) || 1;
  yMin = Math.max(0, yMin - rango * 0.08);
  yMax = yMax + rango * 0.08;
  const esc = kpEscala(yMin, yMax, 2);
  yMin = esc.min; yMax = esc.max;

  const px = i => ml + (xs.length === 1 ? (W-ml-mr)/2
                        : i * (W - ml - mr) / (xs.length - 1));
  const py = y => mt + (H - mt - mb) * (1 - (y - yMin) / (yMax - yMin));

  let s = '<div style="overflow-x:auto"><svg viewBox="0 0 ' + W + ' ' + H
        + '" style="width:100%;height:auto;display:block;min-width:280px" '
        + 'role="img" xmlns="http://www.w3.org/2000/svg">';

  /* Bandas de umbral al fondo: dicen cuando un valor deja de ser
     normal sin tener que leer una leyenda aparte. */
  if (op.umbral_warn != null){
    const y1 = py(Math.min(op.umbral_crit != null ? op.umbral_crit : yMax, yMax));
    const y2 = py(op.umbral_warn);
    if (op.umbral_crit != null)
      s += '<rect x="' + ml + '" y="' + mt + '" width="' + (W-ml-mr) + '" height="'
        +  Math.max(0, py(op.umbral_crit) - mt) + '" fill="#c0392b" opacity="0.07"/>';
    s += '<rect x="' + ml + '" y="' + y1 + '" width="' + (W-ml-mr) + '" height="'
      +  Math.max(0, y2 - y1) + '" fill="#c77700" opacity="0.07"/>';
  }

  /* Rejilla horizontal con cuatro marcas: mas lineas ensucian y no
     ayudan a leer. */
  for (let i = 0; i <= 2; i++){
    const y = mt + (H - mt - mb) * i / 2;
    const v = yMax - (yMax - yMin) * i / 2;
    s += '<line x1="' + ml + '" y1="' + y + '" x2="' + (W-mr) + '" y2="' + y
      +  '" stroke="#e3e3e6" stroke-width="1"/>'
      +  '<text x="' + (ml-6) + '" y="' + (y+4) + '" text-anchor="end" font-size="11" '
      +  'fill="#94949a" font-family="inherit">' + kpEje(v) + '</text>';
  }

  series.forEach((se, k) => {
    const col = KP_SERIE[k % KP_SERIE.length];
    const d = se.pts.filter(p => p.y != null)
      .map(p => (px(xs.indexOf(p.x))) + ',' + py(p.y));
    if (d.length < 2) return;
    s += '<polyline points="' + d.join(' ') + '" fill="none" stroke="' + col
      +  '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    se.pts.filter(p => p.y != null).forEach(p => {
      s += '<circle cx="' + px(xs.indexOf(p.x)) + '" cy="' + py(p.y) + '" r="3.2" fill="'
        +  col + '"><title>' + (op.fmtX ? op.fmtX(p.x) : p.x) + ': '
        +  kpNum(p.y) + ' ' + unidad + '</title></circle>';
    });
  });

  /* Solo primera y ultima fecha en el eje: con doce rondas las
     etiquetas se encaballan y no se lee ninguna. */
  const fx = op.fmtX || (v => String(v).slice(0,10));
  s += '<text x="' + ml + '" y="' + (H-10) + '" font-size="11" fill="#94949a" '
    +  'font-family="inherit">' + fx(xs[0]) + '</text>'
    +  '<text x="' + (W-mr) + '" y="' + (H-10) + '" text-anchor="end" font-size="11" '
    +  'fill="#94949a" font-family="inherit">' + fx(xs[xs.length-1]) + '</text>';
  s += '</svg></div>';

  if (series.length > 1 || series[0].nombre){
    s += '<div class="kp-leg">';
    series.forEach((se, k) => {
      if (!se.nombre) return;
      s += '<span><i style="background:' + KP_SERIE[k % KP_SERIE.length] + '"></i>'
        +  kpEsc(se.nombre) + '</span>';
    });
    s += '</div>';
  }
  return s;
}

/* Envuelve un bloque como seccion plegable. Devuelve id, titulo y html
   para que el indice se arme del mismo arreglo y no se desincronice. */
function kpSeccion(id, titulo, subtitulo, cuerpo, op){
  op = op || {};
  const plegable = op.plegable !== false;
  const cerrada = !!op.cerrada;
  let h = '<section class="kp-sec' + (plegable ? ' plegable' : '')
        + (cerrada ? ' cerrada' : '') + '" id="sec-' + id + '">';
  h += plegable
    ? '<h2 onclick="kpPlegar(\'' + id + '\')"><span class="tw">'
      + (cerrada ? '\u25b8' : '\u25be') + '</span>' + titulo + '</h2>'
    : '<h2>' + titulo + '</h2>';
  if (subtitulo) h += '<p class="hint">' + subtitulo + '</p>';
  h += '<div class="cuerpo">' + cuerpo + '</div></section>';
  return { id: id, titulo: titulo, html: h };
}

function kpPlegar(id){
  const s = document.getElementById('sec-' + id);
  if (!s) return;
  s.classList.toggle('cerrada');
  const tw = s.querySelector('h2 .tw');
  if (tw) tw.textContent = s.classList.contains('cerrada') ? '\u25b8' : '\u25be';
}

/* Veredicto: el estado y por que, sin numeros que haya que interpretar */

/* ── Eventos y paros del variador ─────────────────────────────────────
   Se agrupa por causa ANTES de listar: 60 paros con la misma causa son
   un problema de suministro, no 60 incidentes sueltos. Esa lectura se
   pierde si solo se muestra la cronologia. */
function kpRenderEventos(eventos){
  KP_EV = eventos || [];
  if (!KP_EV.length){
    return kpSeccion('eventos', 'Eventos y paros', null,
      '<p class="hint" style="margin:0">Sin eventos cargados para este per\u00edodo. '
      + 'Se cargan junto con la DATA desde el Analizador.</p>', { cerrada:true });
  }

  /* Severidades reales del analizador. Son cinco, no dos: agrupar todo lo
     que no sea 'accion' como alarma metia Startup y Return to normal en el
     conteo de fallas. */
  const n = sv => KP_EV.filter(e => e.severidad === sv).length;
  const partes = [];
  if (n('crit'))   partes.push('<b>' + n('crit') + '</b> disparo(s)');
  if (n('att'))    partes.push(n('att') + ' de atenci\u00f3n');
  if (n('obs'))    partes.push(n('obs') + ' observaci\u00f3n(es)');
  if (n('accion')) partes.push(n('accion') + ' de operador');
  if (n('ok'))     partes.push(n('ok') + ' normalizaci\u00f3n(es)');

  let h = '';

  /* Filtro por severidad. Solo se ofrecen las que existen en los datos:
     un filtro que devuelve vacio siempre no aporta nada. En movil la fila
     se desliza en lugar de envolverse en tres lineas. */
  h += '<div id="kpEvFiltros" class="kp-nav" style="padding:0 0 10px">';
  h += kpEvBoton('equipo', 'Del equipo', KP_EV.filter(e => kpEvMeta(e.severidad).equipo).length);
  ['crit','att','obs','accion','ok'].forEach(sv => {
    if (n(sv)) h += kpEvBoton(sv, kpEvMeta(sv).txt, n(sv));
  });
  h += kpEvBoton('todo', 'Todo', KP_EV.length);
  h += '</div>';

  h += '<div id="kpEvCuerpo"></div>';
  return kpSeccion('eventos', 'Eventos y paros',
    KP_EV.length + ' evento(s) &middot; ' + partes.join(' &middot; '), h, {});
}

var KP_EV = [], KP_EV_FILTRO = 'equipo', KP_EV_ABIERTAS = {};

const KP_SEV = {
  crit:   { cls:'crit', txt:'Disparo',        equipo:true,  rank:0 },
  att:    { cls:'warn', txt:'Atenci\u00f3n',      equipo:true,  rank:1 },
  obs:    { cls:'warn', txt:'Observaci\u00f3n',   equipo:true,  rank:2 },
  ok:     { cls:'ok',   txt:'Normalizaci\u00f3n', equipo:false, rank:3 },
  accion: { cls:'ok',   txt:'Operador',       equipo:false, rank:4 }
};
function kpEvMeta(sv){
  return KP_SEV[sv] || { cls:'warn', txt:(sv || 'sin clasificar'), equipo:true, rank:9 };
}

function kpEvBoton(id, txt, n){
  const act = KP_EV_FILTRO === id;
  return '<button class="kp-chip' + (act ? ' on' : '') + '"'
    + ' onclick="kpEvFiltrar(\'' + id + '\')"'
    + ' style="border:1px solid ' + (act ? 'transparent' : 'var(--line,#dde5e8)')
    + ';background:' + (act ? 'var(--accent,#0f7d8c)' : 'transparent')
    + ';color:' + (act ? '#fff' : 'inherit')
    + ';border-radius:16px;padding:5px 12px;font:600 12.5px inherit;cursor:pointer">'
    + txt + ' <span style="opacity:.7">' + n + '</span></button>';
}

function kpEvFiltrar(id){
  KP_EV_FILTRO = id;
  KP_EV_ABIERTAS = {};
  const cont = document.getElementById('kpEvFiltros');
  if (cont){
    const n = sv => KP_EV.filter(e => e.severidad === sv).length;
    let h = kpEvBoton('equipo', 'Del equipo',
              KP_EV.filter(e => kpEvMeta(e.severidad).equipo).length);
    ['crit','att','obs','accion','ok'].forEach(sv => {
      if (n(sv)) h += kpEvBoton(sv, kpEvMeta(sv).txt, n(sv));
    });
    h += kpEvBoton('todo', 'Todo', KP_EV.length);
    cont.innerHTML = h;
  }
  kpEvPintar();
}

/* Agrupado y colapsado: cada causa es una fila que se abre para ver sus
   ocurrencias. Con 225 eventos la lista plana no se puede leer, y lo que
   importa primero es CUALES causas y cuantas veces, no la cronologia. */
function kpEvPintar(){
  const caja = document.getElementById('kpEvCuerpo');
  if (!caja) return;

  const f = KP_EV_FILTRO;
  const evs = KP_EV.filter(e =>
    f === 'todo'   ? true :
    f === 'equipo' ? kpEvMeta(e.severidad).equipo :
                     e.severidad === f);

  if (!evs.length){ caja.innerHTML = '<p class="hint">Sin eventos en este filtro.</p>'; return; }

  const g = {};
  evs.forEach(e => {
    const k = (e.severidad || '') + '\u0000' + (e.etiqueta || 'Sin causa registrada');
    if (!g[k]) g[k] = { causa:e.etiqueta || 'Sin causa registrada',
                        sev:e.severidad, items:[] };
    g[k].items.push(e);
  });

  /* Primero por gravedad, luego por recurrencia. El color viene de la
     severidad y no del conteo: un solo disparo por sobrecorriente pesa
     mas que 170 cambios de setpoint. */
  const claves = Object.keys(g).sort((a,b) => {
    const A = kpEvMeta(g[a].sev).rank, B = kpEvMeta(g[b].sev).rank;
    return A !== B ? A - B : g[b].items.length - g[a].items.length;
  });

  let h = '<div class="kp-list">';
  claves.forEach(k => {
    const d = g[k], m = kpEvMeta(d.sev);
    d.items.sort((x,y) => (x.ocurrio < y.ocurrio ? 1 : -1));
    const abierta = !!KP_EV_ABIERTAS[k];
    const kEsc = k.replace(/\u0000/g, '::').replace(/'/g, "\\'");

    h += '<div class="kp-row ' + m.cls + '" style="cursor:pointer"'
      +  ' onclick="kpEvAbrir(\'' + kEsc + '\')">'
      +  '<div class="kp-row-t">'
      +  '<span style="display:inline-block;width:12px;opacity:.55">'
      +  (abierta ? '\u2212' : '+') + '</span> '
      +  kpEsc(d.causa)
      +  ' <span class="kp-pill ' + m.cls + '">' + m.txt + '</span></div>'
      +  '<div class="kp-row-d" style="padding-left:12px">'
      +  d.items.length + ' vez(ces) &middot; &uacute;ltima '
      +  kpFechaCorta(d.items[0].ocurrio)
      +  (d.items.length > 1 ? ' &middot; primera ' + kpFechaCorta(d.items[d.items.length-1].ocurrio) : '')
      +  '</div>';

    if (abierta){
      h += '<div style="margin:8px 0 2px 12px;border-left:2px solid var(--line,#dde5e8);'
        +  'padding-left:10px">';
      d.items.slice(0, 100).forEach(e => {
        h += '<div style="font-size:12.5px;padding:3px 0;opacity:.85">'
          +  kpFechaCorta(e.ocurrio)
          +  (e.detalle ? ' &middot; ' + kpEsc(e.detalle) : '')
          +  '</div>';
      });
      if (d.items.length > 100)
        h += '<div class="hint">y ' + (d.items.length - 100) + ' m\u00e1s</div>';
      h += '</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  caja.innerHTML = h;
}

function kpEvAbrir(kEsc){
  const k = kEsc.replace(/::/, '\u0000');
  KP_EV_ABIERTAS[k] = !KP_EV_ABIERTAS[k];
  kpEvPintar();
}

function kpEsc(t){
  return String(t == null ? '' : t).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function kpFechaCorta(iso){
  if (!iso) return '\u2014';
  const d = new Date(iso);
  if (isNaN(d)) return String(iso).slice(0,16).replace('T',' ');
  const p = n => (n<10?'0':'') + n;
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate())
       + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}



/* ============================================================
   RENDER DEL CONTEXTO: AISLAMIENTO Y BITACORA
   ============================================================ */

/* Referencias de IEEE 43 para el indice de polarizacion. Se
   muestran como referencia y no como dictamen: la norma matiza
   segun clase de aislamiento y temperatura, y el valor absoluto
   minimo depende de la tension nominal. */

/* Indice de polarizacion segun IEEE 43-2013. Los rangos son los de la
   norma para sistemas de aislamiento termoestables.

   El caso de IP menor a 1 no se marca solo como malo: en devanados con
   resistencia de aislamiento muy alta la corriente de absorcion es tan
   pequena que el IP pierde sentido, y la propia norma lo advierte. Se
   dice, en lugar de dar una alarma que puede no significar nada. */
function kpEstadoIP(ip){
  if (ip == null || !isFinite(Number(ip)))
    return { cls:'none', txt:'Sin IP' };
  const v = Number(ip);
  if (v >= 4)   return { cls:'ok',   txt:'IP excelente' };
  if (v >= 2)   return { cls:'ok',   txt:'IP aceptable' };
  if (v >= 1)   return { cls:'warn', txt:'IP cuestionable' };
  return { cls:'crit', txt:'IP bajo' };
}

function kpRenderContexto(ctx){
  const ais = ctx.aislamiento || [];
  const bit = ctx.bitacora || [];
  let h = '';

  if (ais.length){
    h += '<h2 style="margin-top:22px">Aislamiento</h2>';
    h += '<p class="hint">' + ais.length
      +  (ais.length === 1 ? ' prueba registrada' : ' pruebas registradas')
      +  ' &middot; referencia IEEE 43 para el &iacute;ndice de polarizaci&oacute;n</p>';
    h += '<div class="kp-list" style="margin-bottom:6px">';
    ais.forEach(a => {
      const e = kpEstadoIP(a.ip);
      h += '<div class="kp-rule ' + (e.cls === 'none' ? '' : e.cls) + '"><div>'
        +  '<div><span class="nm">' + (a.fecha_prueba || '\u2014') + '</span>'
        +  (a.realizado_por ? ' <span class="id">' + a.realizado_por + '</span>' : '')
        +  '</div>'
        +  '<div class="dt">Aislamiento ' + kpNum(a.aislamiento) + ' M&Omega;'
        +  ' &middot; IP ' + kpNum(a.ip) + ' &middot; DAR ' + kpNum(a.dar) + '</div>'
        +  '<div class="src">Balance ' + kpNum(a.balance_ab) + ' / ' + kpNum(a.balance_ac)
        +  ' / ' + kpNum(a.balance_bc) + ' \u03a9'
        +  (a.equipo ? ' &middot; ' + a.equipo : '') + '</div>'
        +  (a.observaciones ? '<div class="src" style="margin-top:5px;color:var(--kp-ink2)">'
              + a.observaciones + '</div>' : '')
        +  '</div><span class="kp-pill ' + e.cls + '">' + e.txt + '</span></div>';
    });
    h += '</div>';
  }

  if (bit.length){
    /* Configuracion son 21 de 37 registros en el historico y taparian
       los eventos de operacion y falla, que son los que interesan al
       diagnosticar. Por eso el filtro. */
    h += '<h2 style="margin-top:22px">Bit&aacute;cora</h2>';
    h += '<p class="hint">' + bit.length + ' registros &middot; toca una categor&iacute;a para filtrar</p>';

    const cats = [];
    bit.forEach(b => {
      const c = b.categoria || 'Sin categor\u00eda';
      if (cats.indexOf(c) < 0) cats.push(c);
    });
    h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">';
    h += '<button class="kp-chip on" data-cat="__all__" onclick="kpFiltrarBitacora(this)">Todas</button>';
    cats.forEach(c => {
      h += '<button class="kp-chip" data-cat="' + c + '" onclick="kpFiltrarBitacora(this)">'
        +  c + '</button>';
    });
    h += '</div>';

    h += '<div class="kp-list" id="kp-bitacora">';
    bit.forEach(b => {
      const f = b.ocurrido_en
        ? String(b.ocurrido_en).slice(0,16).replace('T',' ')
        : 'sin fecha en el origen';
      const sev = String(b.severidad || '').toLowerCase();
      const cls = (sev.indexOf('crit') >= 0 || sev.indexOf('alta') >= 0) ? 'crit'
                : (sev.indexOf('atenc') >= 0 ? 'warn' : '');
      h += '<div class="kp-rule ' + cls + '" data-cat="'
        +  (b.categoria || 'Sin categor\u00eda') + '"><div>'
        +  '<div><span class="nm">' + (b.categoria || 'Evento') + '</span> '
        +  '<span class="id">' + f + '</span></div>'
        +  (b.observaciones ? '<div class="dt">' + b.observaciones + '</div>' : '')
        +  (b.recomendaciones ? '<div class="src" style="margin-top:4px">Recomendaci&oacute;n: '
              + b.recomendaciones + '</div>' : '')
        +  (b.realizado_por ? '<div class="src">' + b.realizado_por + '</div>' : '')
        +  '</div>'
        +  '<span class="kp-pill ' + (cls || 'none') + '">'
        +  (b.estado || b.severidad || '\u2014') + '</span></div>';
    });
    h += '</div>';
  }

  return h;
}

function kpFiltrarBitacora(boton){
  const cat = boton.dataset.cat;
  boton.parentElement.querySelectorAll('.kp-chip')
    .forEach(b => b.classList.toggle('on', b === boton));
  document.querySelectorAll('#kp-bitacora .kp-rule').forEach(f => {
    f.style.display = (cat === '__all__' || f.dataset.cat === cat) ? '' : 'none';
  });
}

/* ============================================================
   RENDER DE LA MEDICION ELECTRICA
   ============================================================ */
function kpRenderMedicion(m){
  const val   = m.valores || {};
  const placa = m.placa || {};
  const mc    = m.medicion || {};
  const cad   = kpCalcularCadena(val, placa);
  const bal   = kpBalanceRectificadores(val);
  const cal   = kpCalidadEnergia(val);
  const tmp   = kpTemperaturas(val);
  let h = '';

  /* Antes se cortaba el ISO en crudo, que esta en UTC, mientras la
     cabecera usaba kpFechaCorta con hora local: la misma ronda salia
     como 19:00 arriba y 00:00 aqui. Se usa la misma funcion en los dos
     sitios. */
  /* La fecha, la frecuencia y el modo ya salen como fichas en el
     bloque de arriba. Repetirlos aqui era una linea de ruido. */

  if (cad.length){
    /* Se elimino la lista "Detalle por etapa": repetia el diagrama nodo
       por nodo. La carga y la corriente ya estan en cada caja, los
       desbalances tienen su propia seccion en la tendencia, y lo unico
       que solo vivia alli -- tension y kVA -- pasa al tooltip de cada
       nodo del diagrama, donde no ocupa pantalla. */
    h += '<div class="kp-card">' + kpDibujarCadena(cad) + kpLeyenda() + '</div>';
  }
  if (bal){
    const e = KP_EST[bal.estado];
    h += '<h2>Balance de rectificadores</h2>';
    h += '<p class="hint">Reparto de corriente entre los dos secundarios del PST</p>';
    h += '<div class="kp-card"><div style="display:flex;justify-content:space-between;'
      +  'align-items:baseline;gap:12px;flex-wrap:wrap">'
      +  '<div><div style="font-size:24px;font-weight:600">' + kpNum(bal.diferencia_pct) + ' %</div>'
      +  '<div style="font-size:13px;color:var(--kp-ink2);margin-top:4px">'
      +  'Delta ' + kpNum(bal.conv1) + ' A &middot; Estrella ' + kpNum(bal.conv2) + ' A'
      +  ' &middot; mayor en ' + bal.mayor + '</div>'
      +  '<div style="font-size:12px;color:var(--kp-ink3);margin-top:6px;max-width:640px">'
      +  'Cierto desbalance es inherente a un VFD multipulso: los devanados secundarios '
      +  'reparten corriente sin aislaci&oacute;n galv&aacute;nica plena. Por s&iacute; solo no constituye falla.'
      +  '</div></div>'
      +  '<span class="kp-pill ' + e.cls + '">' + e.txt + '</span></div></div>';
  }

  if (cal.length){
    h += '<h2>Calidad de energ&iacute;a</h2>';
    h += '<p class="hint">Medida con instrumento en campo</p>';
    h += '<div class="kp-kpis" style="margin-bottom:8px">';
    cal.forEach(pt => {
      const peor = pt.alertas.some(a => a.t === 'crit') ? 'crit'
                 : (pt.alertas.some(a => a.t === 'warn') ? 'warn' : 'ok');
      h += '<div class="kp-kpi ' + peor + '" style="grid-column:span 2">'
        +  '<div class="k">' + pt.nombre + '</div>'
        +  '<div class="v">' + (pt.fp != null ? pt.fp.toFixed(2) : '\u2014')
        +  '<small>factor de potencia</small></div>'
        +  '<div class="r">'
        +  (pt.kw   != null ? kpNum(pt.kw)   + ' kW &middot; ' : '')
        +  (pt.kvar != null ? kpNum(pt.kvar) + ' kVAR &middot; ' : '')
        +  (pt.kva  != null ? kpNum(pt.kva)  + ' kVA' : '')
        +  '</div>'
        +  '<div class="r">THD tensi&oacute;n ' + kpNum(pt.thdv) + ' %'
        +  ' &middot; THD corriente ' + kpNum(pt.thdi) + ' %'
        +  (pt.factork != null ? ' &middot; Factor K ' + kpNum(pt.factork) : '') + '</div>';
      pt.alertas.forEach(a => {
        const cls = (a.t === 'info') ? 'none' : a.t;
        h += '<div style="margin-top:6px"><span class="kp-pill ' + cls + '">'
          +  (a.t === 'info' ? 'Informativo' : (a.t === 'crit' ? 'Cr&iacute;tico' : 'Atenci&oacute;n'))
          +  '</span></div>'
          +  '<div class="r" style="margin-top:5px">' + a.m + '</div>';
      });
      h += '</div>';
    });
    h += '</div>';
  }

  if (tmp.length){
    h += '<h2>Temperaturas</h2>';
    h += '<p class="hint">Puntos medidos en el gabinete y transformadores</p>';
    h += '<div class="kp-kpis" style="margin-bottom:8px">';
    tmp.forEach(t => {
      h += '<div class="kp-kpi"><div class="k">' + t.nombre + '</div>'
        +  '<div class="v">' + kpNum(t.valor) + '<small>\u00b0F</small></div></div>';
    });
    h += '</div>';
  }

  if (placa.motor_i_nominal_a || placa.motor_potencia_hp){
    h += '<h2>Placa</h2>';
    h += '<p class="hint">Origen: ' + (placa.fuente || 'no indicado')
      +  (placa.actualizado_en ? ' &middot; actualizada ' + String(placa.actualizado_en).slice(0,10) : '')
      +  '</p>';
    h += '<div class="kp-kpis" style="margin-bottom:8px">';
    const pl = [
      ['Motor', placa.motor_potencia_hp, 'hp'],
      ['Tensi&oacute;n motor', placa.motor_v_nominal_v, 'V'],
      ['Corriente motor', placa.motor_i_nominal_a, 'A'],
      ['Corriente VFD', placa.vfd_i_nominal_a, 'A'],
      ['Motores', placa.n_motores, ''],
      ['Aislamiento', placa.motor_clase_aisl, '']
    ];
    pl.forEach(x => {
      if (x[1] == null) return;
      const vv = (typeof x[1] === 'number') ? kpNum(x[1]) : x[1];
      h += '<div class="kp-kpi"><div class="k">' + x[0] + '</div>'
        +  '<div class="v">' + vv + (x[2] ? '<small>' + x[2] + '</small>' : '') + '</div></div>';
    });
    h += '</div>';
  }

  return h;
}

function kpDibujarCadena(nodos){
  const n = nodos.length;
  const w = 132, gap = 20, mx = 20, alto = 178;
  const anchoTot = mx * 2 + n * w + (n - 1) * gap;

  /* Tope duro de ancho: si el texto estimado excede la caja, se
     comprime con textLength en lugar de desbordarse. */
  const cab = (txt, cx, y, px, peso, color, max) => {
    const est = String(txt).length * px * 0.53;
    const tl = (est > max) ? ' textLength="' + max + '" lengthAdjust="spacingAndGlyphs"' : '';
    return '<text x="' + cx + '" y="' + y + '" text-anchor="middle" font-size="' + px
         + '" font-weight="' + peso + '" fill="' + color + '" font-family="inherit"'
         + tl + '>' + txt + '</text>';
  };

  let s = '<div class="kp-chain-wrap" style="--kp-chain-w:' + anchoTot + 'px">'
        + '<svg class="kp-chain" viewBox="0 0 ' + anchoTot + ' ' + alto
        + '" width="' + anchoTot + '" height="' + alto
        + '" role="img" xmlns="http://www.w3.org/2000/svg">'
        + '<title>Cadena energ&eacute;tica</title>'
        + '<defs><marker id="kpAr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" '
        + 'markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#94949a" '
        + 'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';

  nodos.forEach((nd, i) => {
    const x = mx + i * (w + gap);
    const cx = x + w / 2;
    const col = KP_HEX[nd.estado] || KP_HEX.none;
    const pct = (nd.nominal && nd.medido != null) ? (nd.medido / nd.nominal * 100) : null;
    const max = w - 12;

    /* Todo el detalle que antes ocupaba una lista aparte cabe aqui:
       se lee al posar el dedo o el cursor sobre el nodo. */
    const det = [nd.nodo + (nd.detalle ? ' \u00b7 ' + nd.detalle : ''),
      kpNum(nd.medido) + ' A' + (nd.nominal ? ' de ' + kpNum(nd.nominal) + ' A nominal' : ''),
      (nd.v_prom != null ? kpNum(nd.v_prom) + ' V' : null),
      (nd.kva != null ? kpNum(nd.kva) + ' kVA' : null),
      (nd.desbal_i != null ? 'Desbalance de corriente ' + kpPct(nd.desbal_i) + ' %' : null),
      (nd.desbal_v != null ? 'Desbalance de tension ' + kpPct(nd.desbal_v) + ' %' : null)
    ].filter(Boolean).join('\n');

    s += '<g><title>' + det + '</title>';
    s += '<rect x="' + x + '" y="18" width="' + w + '" height="132" rx="8" fill="#fff" '
      +  'stroke="' + col + '" stroke-width="1.5"/>';
    s += '<rect x="' + x + '" y="18" width="' + w + '" height="5" rx="2" fill="' + col + '"/>';
    s += kpSimbolo(nd.nodo, cx, 50, col);

    s += cab(nd.nodo, cx, 90, 13, 600, '#1c1c1e', max);
    s += cab(pct == null ? 'Sin placa' : (Math.round(pct * 10) / 10) + ' %',
             cx, 110, pct == null ? 12 : 16, 600, pct == null ? '#94949a' : col, max);
    s += cab(nd.detalle || '', cx, 126, 10.5, 400, '#6b6b70', max);
    s += cab(nd.nominal ? (kpNum(nd.medido) + ' / ' + kpNum(nd.nominal) + ' ' + nd.unidad)
                        : (kpNum(nd.medido) + ' ' + nd.unidad),
             cx, 141, 10.5, 400, '#94949a', max);

    s += '</g>';

    if (i < n - 1){
      s += '<line x1="' + (x + w + 3) + '" y1="84" x2="' + (x + w + gap - 3) + '" y2="84" '
        +  'stroke="#94949a" stroke-width="1.5" marker-end="url(#kpAr)"/>';
    }
  });
  return s + '</svg></div>'
       + '<div class="kp-chain-hint"><span class="sol-movil">Desliza en horizontal para ver '
       + 'las ' + n + ' etapas. </span>Toca una etapa para ver tensi\u00f3n, kVA y '
       + 'desbalances.</div>';
}

function kpSimbolo(nombre, cx, cy, col){
  const t = (nombre || "").toUpperCase();
  if (t.indexOf("VFD") >= 0){
    return '<rect x="' + (cx - 17) + '" y="' + (cy - 13) + '" width="34" height="26" rx="3" '
      + 'fill="none" stroke="' + col + '" stroke-width="1.6"/>'
      + '<path d="M' + (cx - 12) + ' ' + cy + ' q4 -10 7 0 q4 10 7 0" fill="none" stroke="' + col
      + '" stroke-width="1.4"/>';
  }
  if (t.indexOf("MOTOR") >= 0){
    return '<circle cx="' + cx + '" cy="' + cy + '" r="15" fill="none" stroke="' + col
      + '" stroke-width="1.6"/>'
      + '<text x="' + cx + '" y="' + (cy + 4) + '" text-anchor="middle" font-size="12" '
      + 'fill="' + col + '" font-family="inherit">M</text>';
  }
  return '<circle cx="' + (cx - 7) + '" cy="' + cy + '" r="11" fill="none" stroke="' + col
    + '" stroke-width="1.6"/>'
    + '<circle cx="' + (cx + 7) + '" cy="' + cy + '" r="11" fill="none" stroke="' + col
    + '" stroke-width="1.6"/>';
}

function kpLeyenda(){
  return '<div class="kp-leg">'
    + '<span><i style="background:' + KP_HEX.ok   + '"></i>hasta 95 %</span>'
    + '<span><i style="background:' + KP_HEX.warn + '"></i>95 a 100 %</span>'
    + '<span><i style="background:' + KP_HEX.crit + '"></i>sobre 100 %</span>'
    + '<span><i style="background:' + KP_HEX.none + '"></i>sin dato de placa</span></div>';
}

document.getElementById("kpCampos").addEventListener("click", ev => {
  const b = ev.target.closest(".kp-chip");
  if (!b || !b.dataset.c) return;
  kpSetCampo(b.dataset.c);   /* los PAD del campo anterior ya no aplican */
});

document.getElementById("kpFiltros").addEventListener("click", ev => {
  const b = ev.target.closest(".kp-chip");
  /* El buscador comparte la clase kp-chip por estetica pero no es un
     filtro: sin este guardia, tocarlo dejaba kpFiltro en undefined y la
     lista se vaciaba entera. */
  if (!b || !b.dataset.s) return;
  kpSetEstado(b.dataset.s);
});

/* Los controles se colocan antes del primer pintado y se reacomodan si
   el telefono gira o si la ventana cambia de ancho. */
kpUbicarControles();
if (kpMQ.addEventListener) kpMQ.addEventListener('change', kpUbicarControles);
else kpMQ.addListener(kpUbicarControles);

kpVerFlota();
