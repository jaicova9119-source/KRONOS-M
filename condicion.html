<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoreo de Condici&oacute;n</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --kp-teal:#12a5b8; --kp-green:#35a853;
  --kp-ink:#1c1c1e; --kp-ink2:#6b6b70; --kp-ink3:#94949a;
  --kp-line:#e3e3e6; --kp-page:#f5f6f7; --kp-card:#fff;
  --kp-ok:#2ea44f; --kp-warn:#c77700; --kp-crit:#c0392b; --kp-null:#9a9aa0;
  --kp-ok-bg:#e8f6ec; --kp-warn-bg:#fdf2e0; --kp-crit-bg:#fbeae8; --kp-null-bg:#f0f0f2;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--kp-page);color:var(--kp-ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}

.kp-top{background:linear-gradient(100deg,var(--kp-teal),var(--kp-green));color:#fff;
  padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.kp-top h1{margin:0;font-size:20px;font-weight:600}
.kp-top .sub{margin:3px 0 0;font-size:13px;opacity:.9}
.kp-back{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;
  border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer}

.kp-bar{background:#fff;border-bottom:1px solid var(--kp-line);padding:10px 20px;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kp-bar .lb{font-size:13px;color:var(--kp-ink2);margin-right:2px}
.kp-chip{border:1px solid var(--kp-line);background:#fff;border-radius:6px;padding:5px 13px;
  font-size:13px;cursor:pointer;color:var(--kp-ink)}
.kp-chip.on{background:#2f9fd4;border-color:#2f9fd4;color:#fff}

.kp-wrap{padding:18px 20px;max-width:1180px;margin:0 auto}

/* En monitores anchos la cadena y los graficos ganan mucho con mas
   ancho; el texto no, porque una linea larguisima se lee peor. Por eso
   crece el contenedor y no el cuerpo de los parrafos. */
@media(min-width:1500px){
  .kp-wrap{max-width:1400px}
}
/* Tablet: dos columnas para las tarjetas de seccion que se leen en
   paralelo, en vez de una fila larga de scroll. */
@media(min-width:900px) and (max-width:1400px){
  .kp-kpis{grid-template-columns:repeat(4,1fr)}
}
.kp-wrap h2{font-size:17px;font-weight:600;margin:0 0 4px}
.kp-wrap .hint{margin:0 0 14px;font-size:13px;color:var(--kp-ink2)}

.kp-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:10px;margin-bottom:16px}
.kp-stat{background:#fff;border:1px solid var(--kp-line);border-radius:8px;padding:10px 14px}
.kp-stat .k{font-size:11px;color:var(--kp-ink3);text-transform:uppercase;letter-spacing:.7px}
.kp-stat .v{font-size:22px;font-weight:600;margin-top:3px}

.kp-list{background:#fff;border:1px solid var(--kp-line);border-radius:8px;overflow:hidden}
.kp-row{display:flex;gap:12px;align-items:center;padding:12px 15px;
  border-bottom:1px solid var(--kp-line);cursor:pointer}
.kp-row:last-child{border-bottom:none}
.kp-row:hover{background:#fafafb}
.kp-row .nm{font-size:15px;font-weight:600}
.kp-row .sys{font-size:11px;color:var(--kp-ink3);border:1px solid var(--kp-line);
  padding:1px 7px;border-radius:4px}
.kp-row .ds{font-size:13px;color:var(--kp-ink2);margin-top:3px}
.kp-row .ts{font-size:11px;color:var(--kp-ink3);margin-top:2px}

.kp-pill{font-size:11px;padding:3px 10px;border-radius:4px;white-space:nowrap;font-weight:500}
.kp-pill.ok{background:var(--kp-ok-bg);color:#1d6b32}
.kp-pill.warn{background:var(--kp-warn-bg);color:#8a5300}
.kp-pill.crit{background:var(--kp-crit-bg);color:#8f2a1f}
.kp-pill.none{background:var(--kp-null-bg);color:#5f5f66;border:1px solid var(--kp-line)}

.kp-card{background:#fff;border:1px solid var(--kp-line);border-radius:8px;
  padding:16px;margin-bottom:14px}
.kp-card:last-child{margin-bottom:0}
.kp-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kp-kpi{background:#fff;border:1px solid var(--kp-line);border-left:4px solid var(--kp-ok);
  border-radius:8px;padding:12px 14px}
.kp-kpi.warn{border-left-color:var(--kp-warn)}
.kp-kpi.crit{border-left-color:var(--kp-crit)}
.kp-kpi.none{border-left-color:var(--kp-null)}
.kp-kpi .k{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--kp-ink3)}
.kp-kpi .v{font-size:24px;font-weight:600;margin:4px 0 2px}
.kp-kpi .v small{font-size:12px;font-weight:400;color:var(--kp-ink2);margin-left:3px}
.kp-kpi .r{font-size:12px;color:var(--kp-ink2);margin-bottom:8px}

.kp-grp{padding:8px 15px;background:#fafafb;border-bottom:1px solid var(--kp-line);
  font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--kp-ink3)}
.kp-rule{padding:12px 15px;border-bottom:1px solid var(--kp-line);display:flex;
  justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.kp-rule:last-child{border-bottom:none}
.kp-rule.crit{border-left:3px solid var(--kp-crit)}
.kp-rule.warn{border-left:3px solid var(--kp-warn)}
.kp-rule .id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--kp-ink3)}
.kp-rule .nm{font-size:14px;font-weight:500}
.kp-rule .dt{font-size:12.5px;color:var(--kp-ink2);margin-top:3px}
.kp-rule .src{font-size:11px;color:var(--kp-ink3);margin-top:2px}

/* La cadena se dibuja en unidades fijas (132 por nodo). Si se fuerza a
   ancho de pantalla en movil la escala cae a ~0.30 y el texto queda
   ilegible. En pantalla ancha entra completa; en movil se conserva la
   escala natural y se desliza en horizontal. */
.kp-chain-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;overscroll-behavior-x:contain}
.kp-chain-wrap::-webkit-scrollbar{display:none}
.kp-chain{width:100%;height:auto;display:block}
.kp-chain-hint{display:block;margin-top:8px;font-size:11.5px;color:var(--kp-ink3)}
.kp-chain-hint .sol-movil{display:none}
.kp-leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--kp-ink2)}
.kp-leg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.kp-msg{padding:26px 18px;text-align:center;color:var(--kp-ink2);font-size:14px}
.kp-chip{border:1px solid var(--kp-line);background:#fff;border-radius:6px;padding:5px 12px;
  font-size:12.5px;cursor:pointer;color:var(--kp-ink)}
.kp-chip.on{background:#2f9fd4;border-color:#2f9fd4;color:#fff}
.kp-demo{background:#fff6d9;border:1px solid #e8d08a;color:#6b5410;
  padding:8px 20px;font-size:12.5px}
/* ── Estructura de secciones ─────────────────────────────────────
   Cada bloque es una tarjeta con su encabezado. En movil el ancho
   manda: las rejillas bajan a una o dos columnas y los indicadores
   se compactan en lugar de encogerse hasta ser ilegibles. */
.kp-sec{background:var(--kp-card);border:1px solid var(--kp-line);border-radius:10px;
  padding:16px;margin-bottom:14px}
.kp-sec > h2{margin:0 0 2px;font-size:15px;font-weight:600}
.kp-sec > .hint{margin:0 0 12px}
.kp-sec.plegable > h2{cursor:pointer;display:flex;align-items:center;gap:8px}
.kp-sec.plegable > h2 .tw{font-size:12px;opacity:.5;width:12px;flex:none}
.kp-sec .cuerpo{display:block}
.kp-sec.cerrada .cuerpo{display:none}
.kp-sec .cuerpo > *:first-child{margin-top:0}

/* Veredicto: lo primero que se lee */
.kp-vd{display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  border-left:4px solid var(--kp-ok);padding-left:14px}
.kp-vd.warn{border-left-color:var(--kp-warn)}
.kp-vd.crit{border-left-color:var(--kp-crit)}
.kp-vd .est{font-size:22px;font-weight:600;line-height:1.15}
.kp-vd .det{font-size:13px;color:var(--kp-ink2)}

/* Indice de secciones, pegado arriba para no perder el rumbo al bajar */
.kp-nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.kp-nav::-webkit-scrollbar{display:none}
.kp-nav a{flex:none;font:600 12px inherit;color:var(--kp-ink2);text-decoration:none;
  border:1px solid var(--kp-line);border-radius:16px;padding:5px 11px;background:var(--kp-card)}
.kp-nav a:active{background:#eef3f5}

.kp-chip{white-space:nowrap}

/* Filas por etapa. Rejilla de cuatro columnas en pantalla ancha; en
   movil el nombre y el valor van arriba y la linea abajo, en lugar de
   comprimir cuatro columnas hasta que no se lea ninguna. */
/* Dos bloques lado a lado en pantalla ancha, apilados en angosta.
   Es donde se aprovecha el ancho de un monitor sin estirar el texto. */
.kp-dos{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:1000px){
  .kp-dos{grid-template-columns:1fr 1fr;gap:26px}
}
.kp-sub{font-size:11px;letter-spacing:.7px;text-transform:uppercase;
  color:var(--kp-ink3);margin-bottom:2px;display:flex;justify-content:space-between;
  align-items:baseline;gap:8px}
.kp-sub span{text-transform:none;letter-spacing:0;font-size:11.5px}

/* Datos de operacion y sensor: fichas pequenas que se acomodan solas.
   Cuatro tarjetas grandes ocupaban una pantalla para decir lo que la
   cadena ya dice; estas caben en dos filas y no repiten nada. */
.kp-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.kp-dato{border:1px solid var(--kp-line);border-radius:7px;padding:7px 11px;
  background:#fff;min-width:78px}
.kp-dato .k{font-size:10px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--kp-ink3);white-space:nowrap}
.kp-dato .v{font-size:15px;font-weight:600;margin-top:2px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.kp-dato .v small{font-size:10.5px;font-weight:400;color:var(--kp-ink2);margin-left:2px}

/* Avisos: solo aparece lo que se sale de rango. Cuando no hay nada,
   una linea verde vale mas que cuatro tarjetas repitiendo cifras. */
.kp-ok{margin-top:6px;padding:11px 13px;border-radius:7px;font-size:13px;
  background:var(--kp-ok-bg);color:#1d6b32;border-left:3px solid var(--kp-ok)}
.kp-avisos{display:grid;grid-template-columns:1fr;gap:8px;margin-top:6px}
@media(min-width:900px){ .kp-avisos{grid-template-columns:1fr 1fr} }
.kp-aviso{padding:10px 13px;border-radius:7px;border-left:3px solid var(--kp-warn);
  background:var(--kp-warn-bg)}
.kp-aviso.crit{border-left-color:var(--kp-crit);background:var(--kp-crit-bg)}
.kp-aviso .q{font-size:13.5px;font-weight:600;color:#7a4a00}
.kp-aviso.crit .q{color:#8f2a1f}
.kp-aviso .d{font-size:12px;color:var(--kp-ink2);margin-top:2px}

.kp-rep .ext{display:flex;justify-content:space-between;font-size:13px;
  color:var(--kp-ink2);margin-bottom:5px}
.kp-rep .ext b{color:var(--kp-ink);font-size:14px}
.kp-rep .barra{position:relative;display:flex;height:30px;border-radius:6px;
  overflow:hidden;background:var(--kp-page)}
.kp-rep .barra > div{display:flex;align-items:center;transition:width .25s}
.kp-rep .barra .a{justify-content:flex-start;padding-left:9px}
.kp-rep .barra .b{justify-content:flex-end;padding-right:9px}
.kp-rep .barra span{font-size:12px;font-weight:600;color:#fff}
/* La marca del 50 % va por encima de los dos bloques: es la referencia
   contra la que se lee todo lo demas. */
.kp-rep .mitad{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;
  background:var(--kp-ink);opacity:.55;transform:translateX(-1px)}
.kp-rep .pie{position:relative;height:14px;font-size:10.5px;color:var(--kp-ink3)}
.kp-rep .pie span{position:absolute;left:50%;transform:translateX(-50%);top:1px;
  white-space:nowrap}
.kp-rep .res{font-size:13px;margin-top:8px}
.kp-rep .hist{display:grid;grid-template-columns:auto minmax(90px,1fr) auto;
  gap:12px;align-items:center;margin-top:14px;padding-top:12px;
  border-top:1px solid var(--kp-line)}
.kp-rep .hist .et{font-size:12px;color:var(--kp-ink2)}
.kp-rep .hist .ra{font-size:12px;color:var(--kp-ink3);white-space:nowrap}
.kp-rep .hist .sp{line-height:0}
.kp-rep .hist .sp svg{width:100%;height:34px;display:block}
@media(max-width:560px){
  .kp-rep .hist{grid-template-columns:1fr auto;grid-template-areas:"et ra" "sp sp";
    row-gap:6px}
  .kp-rep .hist .et{grid-area:et} .kp-rep .hist .ra{grid-area:ra}
  .kp-rep .hist .sp{grid-area:sp}
}

.kp-list .kp-oculta{display:none}
.kp-list.kp-abierta .kp-oculta{display:flex}
/* Plegado del bloque completo: se oculta todo menos su encabezado. */
.kp-list.kp-plegada > *:not(.kp-cab){display:none}
.kp-cab{cursor:pointer;display:flex;align-items:center;gap:7px;user-select:none}
.kp-cab:hover{background:#f2f6f7}
.kp-cab .tw{font-size:11px;opacity:.5;width:10px;flex:none}
.kp-mas{display:block;width:100%;border:none;border-top:1px solid var(--kp-line);
  background:#fafafb;color:var(--kp-teal);font:600 12.5px inherit;
  padding:11px;cursor:pointer;text-align:center}
.kp-mas:hover{background:#f2f6f7}

.kp-etapas{display:flex;flex-direction:column}
.kp-etapa{display:grid;grid-template-columns:104px 78px 74px minmax(90px,1fr);
  gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--kp-line)}
.kp-etapa:first-child{border-top:none}
.kp-etapa.warn{border-left:3px solid var(--kp-warn);padding-left:10px}
.kp-etapa.crit{border-left:3px solid var(--kp-crit);padding-left:10px}
.kp-etapa .nb{font-size:13.5px;font-weight:600}
.kp-etapa .vl{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap;text-align:right}
.kp-etapa .vl small{font-size:11px;font-weight:400;color:var(--kp-ink2);margin-left:2px}
.kp-etapa .dl{font-size:12px;white-space:nowrap;text-align:right}
.kp-etapa .dl .sube{color:var(--kp-crit)}
.kp-etapa .dl .baja{color:var(--kp-ok)}
.kp-etapa .dl .ig{color:var(--kp-ink3)}
.kp-etapa .sp{line-height:0}
.kp-etapa .sp svg{width:100%;height:34px;display:block}

@media(max-width:560px){
  .kp-etapa{grid-template-columns:1fr auto;grid-template-areas:"nb vl" "sp dl";
    row-gap:2px;gap:10px}
  .kp-etapa .nb{grid-area:nb}
  .kp-etapa .vl{grid-area:vl;text-align:right}
  .kp-etapa .sp{grid-area:sp;text-align:left}
  .kp-etapa .dl{grid-area:dl}
}

/* ── Filtros como desplegables en movil ─────────────────────────
   En pantalla ancha los chips de Estado y Campo se ven de un vistazo
   y tocar es barato. En un telefono esos mismos chips son cuatro
   renglones de cabecera que empujan la lista fuera de la primera
   pantalla. Ahi cada dimension pasa a ser un desplegable nativo: se
   toca Estado y sale su lista, se toca Campo y sale la suya. El
   selector nativo abre el picker del sistema, que es mas comodo con
   el pulgar que una fila de chips que hay que deslizar.

   Los dos juegos de controles comparten estado; kpSincronizar() los
   deja siempre diciendo lo mismo. */
.kp-fbar{background:#fff;border-bottom:1px solid var(--kp-line);
  padding:9px 14px;display:none;flex-direction:column;gap:7px}
.kp-fsel{display:flex;gap:6px}
.kp-fsel select{flex:1 1 0;min-width:0;max-width:none;
  text-overflow:ellipsis;padding-top:7px;padding-bottom:7px}
.kp-fbus{display:flex;gap:6px}

.kp-fbus .kp-buscar{flex:1 1 auto;min-width:0;padding-top:7px;padding-bottom:7px}

.kp-bar2{border-top:none;padding-top:0}
.kp-grupo{display:flex;gap:6px;flex-wrap:wrap}
.kp-sel{cursor:pointer;max-width:190px;-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%236b6b70' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:26px}
.kp-buscar{min-width:140px;cursor:text}
.kp-limpiar{color:var(--kp-crit);border-color:#eccac4}

/* En movil las dos barras se apilan y cada grupo puede deslizarse en
   horizontal por separado: con seis PAD los chips romperian el alto de
   la cabecera y empujarian la lista fuera de la primera pantalla. */
@media(max-width:640px){
  .kp-bar{gap:6px;overflow-x:auto;flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .kp-bar::-webkit-scrollbar{display:none}
  .kp-grupo{flex-wrap:nowrap}
  .kp-bar .lb{flex:none}
  .kp-chip{flex:none}
  .kp-buscar{min-width:120px}

  /* Los chips se retiran y mandan los desplegables. Los controles no
     se duplican: kpUbicarControles() mueve el buscador y el boton
     Limpiar, asi que conservan lo escrito al girar el telefono. */
  .kp-fbar{display:flex}
  .kp-panel{display:none}
}

@media(max-width:640px){
  .kp-wrap{padding:12px}
  .kp-top{padding:12px 14px}
  .kp-bar{padding:9px 14px}
  .kp-sec{padding:13px;border-radius:9px}
  /* Dos columnas en movil: un indicador por fila desperdicia pantalla
     y obliga a un scroll larguisimo. */
  .kp-kpis{grid-template-columns:repeat(2,1fr);gap:8px}
  .kp-kpi{padding:10px}
  .kp-kpi .v{font-size:19px}
  .kp-kpi .k{font-size:9.5px;letter-spacing:.6px}
  .kp-kpi .r{font-size:11px}
  .kp-stats{grid-template-columns:repeat(2,1fr)}
  .kp-row{padding:11px 12px}
  .kp-vd .est{font-size:19px}

  /* Escala 1:1 y deslizamiento. El sangrado negativo hace que la
     cadena llegue al borde de la tarjeta en lugar de cortarse. */
  .kp-chain-wrap{margin:0 -16px;padding:0 16px}
  .kp-chain{width:var(--kp-chain-w);max-width:none}
  .kp-chain-hint .sol-movil{display:inline}
}
/* Los graficos no se encogen por debajo de 280 px de ancho util:
   por debajo de eso las etiquetas del eje se pisan y no se lee nada.
   Se desliza en horizontal, igual que la cadena. */
@media(max-width:640px){
  .kp-leg{gap:10px;font-size:11.5px}
  .kp-rule{padding:11px 12px}
  .kp-nav{position:sticky;top:0;z-index:5;background:var(--kp-page);
    margin:0 -12px;padding:8px 12px 10px}
}
@media(max-width:380px){
  .kp-kpis{grid-template-columns:1fr}
  .kp-top h1{font-size:18px}
}
/* Impresion: las secciones plegadas se abren y desaparecen los
   controles, para que un reporte impreso no salga a medias. */
@media print{
  .kp-top,.kp-bar,.kp-fbar,.kp-nav,.kp-back{display:none !important}
  .kp-sec.cerrada .cuerpo{display:block !important}
  .kp-sec{break-inside:avoid;border-color:#ccc}
  body{background:#fff}
}
/* ── Demanda energetica: boton de entrada ────────────────────────
   El panel plegable se reemplaza por una puerta. La cifra de la
   acometida no es un dato secundario de la lista de rondas: es otra
   pregunta, con su propia pantalla. El boton informa plegado y
   promete lo que hay detras. */
.kp-dem-btn{width:100%;display:flex;align-items:center;gap:14px;text-align:left;
  background:linear-gradient(102deg,#0d2438 0%,#123f5e 55%,#0f5f66 100%);
  border:none;border-radius:10px;padding:0;margin:0 0 14px;cursor:pointer;
  color:#fff;font-family:inherit;overflow:hidden}
.kp-dem-btn:hover{filter:brightness(1.12)}
.kp-dem-btn:active{transform:scale(.995)}
.kp-dem-btn .ic{flex:0 0 auto;width:46px;align-self:stretch;display:flex;
  align-items:center;justify-content:center;background:rgba(255,255,255,.10);
  font-size:19px;line-height:1}
.kp-dem-btn .tx{flex:1 1 auto;min-width:0;padding:13px 0}
.kp-dem-btn .t1{font-size:14px;font-weight:600;letter-spacing:.2px}
.kp-dem-btn .t2{font-size:11.5px;color:rgba(255,255,255,.72);margin-top:2px}
.kp-dem-btn .vl{flex:0 0 auto;padding:13px 0;text-align:right;line-height:1.1}

<script>
/* ============================================================
   CONFIGURACION
   ============================================================ */
/* Las credenciales se heredan de Kronos-M. Este archivo corre en un
   iframe del mismo origen, asi que puede leerlas del documento padre
   y no necesita copia propia. Al abrirse en pestana aparte el padre
   es window.opener. Si no hay ninguno, se dice claramente en lugar
   de quedarse cargando. */
function kpCredencial(nombre){
  var fuentes = [];
  try { if (window.parent && window.parent !== window) fuentes.push(window.parent); } catch(e){}
  try { if (window.opener) fuentes.push(window.opener); } catch(e){}
  for (var i = 0; i < fuentes.length; i++){
    try {
      var v = fuentes[i][nombre];
      if (v && String(v).indexOf('PEGAR_AQUI') !== 0) return v;
    } catch(e){}
  }
  return null;
}

/* Se dejan sin resolver a proposito: se leen al usarlas, no al
   cargar este archivo, para que no dependa de cual de los dos
   documentos termine de cargar primero. */
const KP = {
  SUPABASE_URL: null,
  SUPABASE_ANON_KEY: null
};

/* ============================================================
   CAPA DE DATOS
   Unico punto que toca la base. Todo sale de las rondas de campo
   confirmadas: no hay vector del analizador ni datos de ejemplo.
   ============================================================ */
/* Las RPC viven en public, asi que el cliente va con el esquema por
   defecto. La sesion se toma sola de localStorage porque el iframe
   corre en el mismo origen que Kronos-M. */
let kpSb = null;

/* Primero se intenta reusar el cliente de Kronos-M. Crear uno nuevo
   sobre la misma llave de almacenamiento produce el aviso "Multiple
   GoTrueClient instances" y puede dejar la sesion en un estado raro.
   Solo si no se encuentra se crea uno propio. */
function kpClienteHeredado(){
  var fuentes = [];
  try { if (window.parent && window.parent !== window) fuentes.push(window.parent); } catch(e){}
  try { if (window.opener) fuentes.push(window.opener); } catch(e){}
  for (var i = 0; i < fuentes.length; i++){
    try {
      var c = fuentes[i].sb;
      if (c && c.rpc) return c;
    } catch(e){}
  }
  return null;
}

function kpCliente(){
  if (kpSb) return kpSb;

  kpSb = kpClienteHeredado();
  if (kpSb) return kpSb;

  if (!KP.SUPABASE_URL)      KP.SUPABASE_URL      = kpCredencial('SUPABASE_URL');
  if (!KP.SUPABASE_ANON_KEY) KP.SUPABASE_ANON_KEY = kpCredencial('SUPABASE_ANON_KEY');

  if (!KP.SUPABASE_URL || !KP.SUPABASE_ANON_KEY)
    throw new Error('No se pudo tomar la conexion de Kronos-M. '
      + 'Lo mas probable es que el index.html desplegado sea una version anterior: '
      + 'recarga con Ctrl+Shift+R. Para comprobarlo, escribe window.sb en la consola '
      + 'con Kronos-M abierto; si dice undefined, hay que subir el index.html nuevo.');

  kpSb = window.supabase.createClient(KP.SUPABASE_URL, KP.SUPABASE_ANON_KEY);
  return kpSb;
}

/* La flota sale de dp_bes_lista y no de dp_flota. dp_flota se apoyaba
   en los dictamenes del analizador, que ya no existen: mostraria los 53
   pozos como "No evaluable". Ahora el estado de una unidad es cuando fue
   su ultima ronda, que es la informacion real que hay. */
async function kpCargarFlota(){
  const { data, error } = await kpCliente().rpc('dp_bes_lista');
  if (error) throw new Error(error.message);
  return (data || []).map(r => ({
    pozo:    r.pozo,
    campo:   r.campo || '\u2014',
    pad:     r.pad   || '\u2014',
    marca:   r.marca_variador || '\u2014',
    rondas:      Number(r.rondas || 0),              /* de la corrida vigente */
    historicas:  Number(r.rondas_historicas || 0),
    ultima:      r.ultima || null,
    ultima_hist: r.ultima_historica || null,
    corrida:     r.inicio_corrida || null,
    vencida:     !!r.vencida,
    /* Un pozo con ocho rondas del equipo anterior y ninguna del actual
       no esta al dia: esta sin medir desde el cambio. */
    estado: (!r.rondas) ? 'sin' : (r.vencida ? 'vencida' : 'vigente')
  }));
}

/* ============================================================
   POTENCIA EN ACOMETIDA
   ============================================================
   Potencia medida en pst_in (entrada del PST desde la red), que es
   donde el consumo incluye las perdidas del transformador, del filtro
   y del cable. Medida en la salida del variador el numero sale menor
   y no compara con nada aguas arriba.

   No es energia. Para kWh hacen falta minutos de operacion, y hoy
   pozo_features_diarias esta vacia y serie_horaria tiene un solo pozo
   cargado. Multiplicar kW por horas de calendario daria un numero con
   un supuesto grande adentro disfrazado de medicion.

   Tampoco es demanda simultanea: cada pozo aporta su ultima ronda con
   acometida y esas rondas son de fechas distintas. Por eso la vista
   muestra siempre la antiguedad junto al total. */

async function kpCargarPotencia(){
  const { data, error } = await kpCliente().rpc('dp_potencia_bes');
  if (error) throw new Error(error.message);
  const m = {};
  (data || []).forEach(r => {
    m[r.pozo] = {
      kw: kpN(r.kw), kva: kpN(r.kva), kvar: kpN(r.kvar), fp: kpN(r.fp),
      i: kpN(r.i_prom), v: kpN(r.v_prom),
      thd_i: kpN(r.thd_i), thd_v: kpN(r.thd_v), factor_k: kpN(r.factor_k),
      hz: kpN(r.hz), condicion: r.condicion || null,
      medido_en: r.medido_en || null,
      dias: r.dias == null ? null : Number(r.dias),
      corrida_actual: r.corrida_actual
    };
  });
  return m;
}

/* Numero o nada. Un cero medido es un dato; una cadena vacia no. */
function kpN(v){
  if (v == null || v === '') return null;
  const n = Number(v);
  return isFinite(n) ? n : null;
}

/* Se conserva por si vuelve una fuente de dictamenes. Hoy no se llama. */

/* Un pozo no evaluable puede serlo por dos razones muy distintas:
   nunca se le cargo un archivo, o el archivo llego incompleto. La
   primera se resuelve cargando datos; la segunda, averiguando por que
   faltan muestras. Mostrarlas juntas esconde esa diferencia. */

/* El resumen dice por que el pozo esta como esta. Un pozo sin vector
   no es un pozo sano: hay que decir que no se pudo evaluar. */


/* Traduce lo que devuelve la RPC a lo que la vista ya sabe pintar. */

async function kpCargarMedicion(pozoId){
  if (!pozoId) return null;
  const { data, error } = await kpCliente().rpc('dp_medicion', { p_pozo_id: pozoId });
  if (error) throw new Error(error.message);
  return data || null;
}

async function kpCargarCorridas(pozoId){
  if (!pozoId) return [];
  const { data, error } = await kpCliente().rpc('dp_corridas', { p_pozo_id: pozoId });
  if (error) throw new Error(error.message);
  return data || [];
}

async function kpCargarTendencia(pozoId){
  if (!pozoId) return [];
  const { data, error } = await kpCliente().rpc('dp_tendencia_nodos',
    { p_pozo_id: pozoId, p_rondas: 12 });
  if (error) throw new Error(error.message);
  return data || [];
}

async function kpCargarBalance(pozoId){
  if (!pozoId) return [];
  const { data, error } = await kpCliente().rpc('dp_balance_convertidores',
    { p_pozo_id: pozoId, p_rondas: 12 });

}

/* La lista de flota no trae el id del pozo, y las RPC del detalle lo
   necesitan. Se resuelve por nombre una sola vez y se recuerda. */
const kpIds = {};
async function kpIdDe(codigo){
  if (kpIds[codigo]) return kpIds[codigo];
  const { data, error } = await kpCliente().rpc('dp_buscar_unidad', { p_texto: codigo });
  if (error) throw new Error(error.message);
  const f = (data || []).find(x => x.nombre === codigo) || (data || [])[0];
  if (f) kpIds[codigo] = f.id;
  return f ? f.id : null;
}

async function kpCargarEventos(pozoId){
  if (!pozoId) return [];
  const { data, error } = await kpCliente().rpc('dp_eventos_pozo',
    { p_pozo_id: pozoId, p_dias: 90 });
  if (error) throw new Error(error.message);
  return data || [];
}

async function kpCargarContexto(pozoId){
  if (!pozoId) return null;
  const { data, error } = await kpCliente().rpc('dp_contexto', { p_pozo_id: pozoId });
  if (error) throw new Error(error.message);
  return data || null;
}

function kpNum(v){
  if (v == null) return '\u2014';
  const n = Number(v);
  if (!isFinite(n)) return '\u2014';
  return (Math.abs(n) >= 100) ? n.toFixed(0) : n.toFixed(2);
}

/* Los porcentajes llevan siempre un decimal. Con kpNum, una carga de
   119.58 % se redondeaba a "120" en el resumen y salia "119.6" en la
   cadena: dos cifras distintas del mismo dato en la misma pantalla. */
/* Etiqueta de eje: sin decimales de relleno. 10, no 10.00. */
function kpEje(v){
  const n = Number(v);
  if (!isFinite(n)) return '';
  return (Math.abs(n) >= 10 || n === Math.round(n))
    ? String(Math.round(n * 100) / 100)
    : n.toFixed(1);
}

/* Temperaturas en Fahrenheit. El panel de superficie las entrega en F,
   el tecnico las captura en F y las piensa en F; la base las guarda en
   la unidad canonica (C) para poder compararlas entre pozos. Aqui se
   devuelven a la escala en la que se leyeron.

   Ademas se descarta el cero espurio: -17.78 C son exactamente 0 F, y
   un 0 F en un motor de fondo operando no existe. Es el campo que
   quedo vacio y se guardo como cero. Mostrarlo como temperatura seria
   dar por medido algo que nadie midio. */
function kpTempF(celsius){
  if (celsius == null) return null;
  const c = Number(celsius);
  if (!isFinite(c)) return null;
  const f = c * 9 / 5 + 32;
  if (f <= 0.01) return null;          /* 0 F o menos: dato invalido */
  return f;
}

function kpNumF(celsius){
  const f = kpTempF(celsius);
  return f == null ? '\u2014' : f.toFixed(1);
}

function kpPct(v){
  if (v == null) return '\u2014';
  const n = Number(v);
  return isFinite(n) ? n.toFixed(1) : '\u2014';
}

/* ============================================================
   DATOS DE DEMOSTRACION
   ============================================================ */
/* ============================================================
   CALCULO ELECTRICO SOBRE LA MEDICION DE CAMPO
   Formulas verificadas contra resultados conocidos:
     desbalance = max(|x - promedio|) / promedio * 100   (NEMA)
     carga      = I_promedio / I_nominal * 100
     kVA        = raiz(3) * V_promedio * I_promedio / 1000
     balance de rectificadores = |I1 - I2| / promedio(I1,I2) * 100
   ============================================================ */
const RT3 = Math.sqrt(3);

function kpProm(vs){
  const l = vs.filter(v => v != null && isFinite(v));
  if (!l.length) return null;
  return l.reduce((a,b) => a + b, 0) / l.length;
}
function kpDesbal(vs){
  const l = vs.filter(v => v != null && isFinite(v));
  if (l.length < 2) return null;
  const p = kpProm(l);
  if (!p) return null;
  return Math.max.apply(null, l.map(v => Math.abs(v - p))) / p * 100;
}
function kpEstadoCarga(pct){
  if (pct == null) return 'none';
  if (pct > 100) return 'crit';
  if (pct >= 95) return 'warn';
  return 'ok';
}
/* Desbalance de TENSION. NEMA MG-1 marca el derateo del motor desde
   1 % y desaconseja operar por encima de 5 %. */
function kpEstadoDesbal(pct){
  if (pct == null) return 'none';
  if (pct > 2)   return 'crit';
  if (pct > 1)   return 'warn';
  return 'ok';
}

/* Desbalance de CORRIENTE. No lleva el mismo umbral que la tension:
   un desbalance de tension pequeno produce uno de corriente entre seis
   y diez veces mayor, asi que juzgar la corriente contra el 2 % de la
   tension pinta en rojo una flota que esta bien. La practica en ESP es
   revisar desde 5 % y actuar sobre 10 %.

   Con el criterio anterior, las cinco etapas de CYC-54 salian en
   critico con valores de 4 a 6 %, que son normales. */
function kpEstadoDesbalI(pct){
  if (pct == null) return 'none';
  if (pct > 10)  return 'crit';
  if (pct > 5)   return 'warn';
  return 'ok';
}

/* Cada etapa declara sus tres corrientes, sus tres tensiones y de
   donde sale su nominal. Si no hay nominal, no se inventa carga. */
const KP_ETAPAS = [
  {nodo:'PST entrada', detalle:'Primario',
   i:['pst_in_i_a','pst_in_i_b','pst_in_i_c'],
   v:['pst_in_v_ab','pst_in_v_ac','pst_in_v_bc'],
   nom:'pst_i_entrada_a'},

  {nodo:'PST \u0394', detalle:'Sec. delta',
   i:['conv1_i_a','conv1_i_b','conv1_i_c'],
   v:['conv1_v_ab','conv1_v_ac','conv1_v_bc'],
   nom:'pst_i_secundario_a'},

  {nodo:'PST Y', detalle:'Sec. estrella',
   i:['conv2_i_a','conv2_i_b','conv2_i_c'],
   v:['conv2_v_ab','conv2_v_ac','conv2_v_bc'],
   nom:'pst_i_secundario_a'},

  /* La entrada del VFD no se mide: es la suma de los dos
     secundarios del PST, contrastada contra el Amp Input. */
  {nodo:'VFD entrada', detalle:'Suma \u0394 + Y',
   i_suma:[['conv1_i_a','conv1_i_b','conv1_i_c'],
           ['conv2_i_a','conv2_i_b','conv2_i_c']],
   v:['conv1_v_ab','conv1_v_ac','conv1_v_bc'],
   nom:'vfd_i_entrada_a'},

  {nodo:'VFD salida', detalle:'Salida',
   i:['vfdout_i_a','vfdout_i_b','vfdout_i_c'],
   v:['vfdout_v_ab','vfdout_v_ac','vfdout_v_bc'],
   nom:'vfd_i_nominal_a'},

  {nodo:'SUT salida', detalle:'Al cable',
   i:['sutout_i_a','sutout_i_b','sutout_i_c'],
   v:['sutout_v_ab','sutout_v_ac','sutout_v_bc'],
   nom:'sut_i_nominal_a'},

  /* Mismo valor medido que el SUT, contra el nominal del motor. */
  {nodo:'Motor', detalle:'De fondo',
   i:['sutout_i_a','sutout_i_b','sutout_i_c'],
   v:['sutout_v_ab','sutout_v_ac','sutout_v_bc'],
   nom:'motor_i_nominal_a'}
];

function kpCalcularCadena(val, placa){
  const out = [];
  KP_ETAPAS.forEach(e => {
    let ii = null, ip = null;
    if (e.i_suma){
      const partes = e.i_suma.map(g => kpProm(g.map(c => val[c])));
      if (partes.some(x => x == null)) return;
      ip = partes.reduce((a,b) => a + b, 0);
    } else {
      ii = e.i.map(c => val[c]);
      ip = kpProm(ii);
    }
    const vv = e.v.map(c => val[c]);
    const vp = kpProm(vv);
    if (ip == null) return;
    const nominal = e.nom && placa ? placa[e.nom] : null;
    const pct = nominal ? (ip / nominal * 100) : null;
    out.push({
      nodo: e.nodo, detalle: e.detalle,
      medido: Math.round(ip * 10) / 10,
      nominal: nominal || null,
      unidad: 'A',
      v_prom: vp,
      kva: (vp != null) ? RT3 * vp * ip / 1000 : null,
      desbal_i: ii ? kpDesbal(ii) : null,
      desbal_v: kpDesbal(vv),
      carga_pct: pct,
      estado: nominal ? kpEstadoCarga(pct) : 'none'
    });
  });
  return out;
}

function kpBalanceRectificadores(val){
  const i1 = kpProm([val.conv1_i_a, val.conv1_i_b, val.conv1_i_c]);
  const i2 = kpProm([val.conv2_i_a, val.conv2_i_b, val.conv2_i_c]);
  if (i1 == null || i2 == null) return null;
  const prom = (i1 + i2) / 2;
  const dif = Math.abs(i1 - i2) / prom * 100;
  return {
    conv1: i1, conv2: i2, diferencia_pct: dif,
    mayor: (i1 >= i2) ? 'secundario delta' : 'secundario estrella',
    estado: dif > 10 ? 'crit' : (dif > 5 ? 'warn' : 'ok')
  };
}

/* Umbrales de FP y THD: los de FP son criterio operativo comun en
   O&G; los de THD de tension en salida de VFD no aplican como falla
   porque la onda PWM distorsiona por diseno. Se marcan como
   informativos y no como hallazgo. */
function kpCalidadEnergia(val){
  const p = [];
  const punto = (pref, nombre, esSalidaVfd) => {
    const fp = val[pref+'_fp'], thdv = val[pref+'_thdv'], thdi = val[pref+'_thd'];
    if (fp == null && thdv == null && thdi == null) return;
    const al = [];
    if (fp != null){
      if (fp <= 0.80)      al.push({t:'crit', m:'Factor de potencia ' + fp.toFixed(2) + ' (critico si es 0.80 o menos)'});
      else if (fp <= 0.85) al.push({t:'warn', m:'Factor de potencia ' + fp.toFixed(2) + ' (atencion si es 0.85 o menos)'});
    }
    if (thdv != null && esSalidaVfd)
      al.push({t:'info', m:'THD de tension ' + thdv.toFixed(1) + ' %. Valor esperable en salida de VFD sin filtro senoidal: la onda PWM distorsiona por diseno. No es falla.'});
    else if (thdv != null && thdv > 8)
      al.push({t:'warn', m:'THD de tension ' + thdv.toFixed(1) + ' % en red (IEEE 519 sugiere 8 % para sistemas de este nivel)'});
    p.push({
      nombre: nombre, fp: fp, thdv: thdv, thdi: thdi,
      factork: val[pref+'_factork'],
      kw: val[pref+'_kw'], kvar: val[pref+'_kvar'], kva: val[pref+'_kva'],
      alertas: al
    });
  };
  punto('pst_in',  'Entrada PST (red)', false);
  punto('vfdout',  'Salida VFD (al motor)', true);
  return p;
}

function kpTemperaturas(val){
  const defs = [
    ['hs1_c','Disipador 1'], ['hs2_c','Disipador 2'],
    ['hs3_c','Disipador 3'], ['hs4_c','Disipador 4'],
    ['temp_inductor_c','Inductor'], ['temp_controller_c','Controlador'],
    ['temp_igbt_u_c','IGBT U'], ['temp_igbt_v_c','IGBT V'], ['temp_igbt_w_c','IGBT W'],
    ['temp_pst_c','PST'], ['temp_sut_c','SUT']
  ];
  return defs.filter(d => kpTempF(val[d[0]]) != null)
             .map(d => ({ nombre: d[1], valor: kpTempF(val[d[0]]) }));
}

/* ============================================================
   FILTROS: CHIPS EN ESCRITORIO, DESPLEGABLES EN MOVIL
   Los dos juegos apuntan a las mismas tres variables. Quien cambia
   el filtro llama a un kpSet*, no toca el DOM del otro juego.

const kpMQ = window.matchMedia('(max-width:640px)');

/* El buscador y el boton Limpiar se mueven entre las dos barras en
   lugar de duplicarse: asi no hay dos valores que sincronizar y lo
   escrito sobrevive a un giro de pantalla. */
function kpUbicarControles(){
  const b = document.getElementById('kpBuscar');
  const l = document.getElementById('kpLimpiar');
  if (!b || !l) return;
  const destino = kpMQ.matches ? document.getElementById('kpFBus')
                               : document.getElementById('kpFiltros2');
  if (b.parentNode === destino) return;
  destino.appendChild(b);
  destino.appendChild(l);
}

/* Deja los dos juegos de controles diciendo lo mismo. */
function kpSincronizar(){
  document.querySelectorAll('#kpFiltros .kp-chip[data-s]')
    .forEach(x => x.classList.toggle('on', x.dataset.s === kpFiltro));
  document.querySelectorAll('#kpCampos .kp-chip')
    .forEach(x => x.classList.toggle('on', x.dataset.c === kpCampo));
  const e = document.getElementById('kpEstadoSel'); if (e) e.value = kpFiltro;
  const c = document.getElementById('kpCampoSel');  if (c) c.value = kpCampo;
  const p = document.getElementById('kpPad');       if (p) p.value = kpPad;
  const m = document.getElementById('kpPadSel');    if (m) m.value = kpPad;
}

function kpSetEstado(v){
  kpFiltro = v;
  kpSincronizar();
  kpPintarFlota();
}

/* Cambiar de campo invalida los PAD del anterior. */
function kpSetCampo(v){
  kpCampo = v;
  kpPoblarPads();
  kpSincronizar();
  kpPintarFlota();
}

function kpSetPad(v){
  kpPad = v;
  kpSincronizar();
  kpPintarFlota();
}

function kpMostrarFiltros(v){
  document.getElementById('kpFiltros').style.display  = v ? 'flex' : 'none';
  document.getElementById('kpFiltros2').style.display = v ? 'flex' : 'none';
  /* Cadena vacia devuelve el control a la hoja de estilos, que es la
     que decide si la barra de desplegables existe segun el ancho. */
  document.getElementById('kpFBar').style.display  = v ? '' : 'none';
  document.getElementById('kpPanel').style.display = v ? '' : 'none';
}

function kpPeor(lista){
  let r = "ok";
  for (const x of lista){
    if (x.estado === "crit") return "crit";
    if (x.estado === "warn") r = "warn";
  }
  return r;
}

async function kpVerFlota(){
  kpVistaActual = 'flota';
  kpEnDemanda   = false;
  kpDemPozo     = null;
  document.body.classList.remove('kp-oscuro');
  document.getElementById("kpBack").style.display = "none";
  document.getElementById("kpBack").innerHTML = '&larr; Volver a flota';
  kpMostrarFiltros(true);
  document.getElementById("kpTitulo").textContent = "Monitoreo de Condici\u00f3n";
  document.getElementById("kpSub").innerHTML =
    "Monitoreo de condici&oacute;n y diagn&oacute;stico de m&aacute;quinas";
  const v = document.getElementById("kpVista");
  v.innerHTML = '<div class="kp-msg">Cargando&hellip;</div>';
  try {
    kpFlota = await kpCargarFlota();
  } catch (e) {
    v.innerHTML = '<div class="kp-msg">No se pudo cargar la flota.<br>' + e.message + '</div>';
    return;
  }
  /* La potencia es informacion adicional: si su RPC falla o todavia no
     esta desplegada, la pantalla de flota tiene que seguir sirviendo. */
  try {
    kpPot = await kpCargarPotencia();
  } catch (e) {
    kpPot = {};
    console.warn('[Kronos-M] Sin potencia en acometida:', e.message);
  }
  kpPoblarFiltros();
  kpPintarFlota();
}

/* Los campos y los PAD salen de los datos, no de una lista fija: si
   entra un pozo de un PAD nuevo aparece solo, y si un PAD se retira
   deja de estorbar en el filtro. */
function kpPoblarFiltros(){
  const campos = [...new Set(kpFlota.map(x => x.campo).filter(c => c && c !== '\u2014'))].sort();
  let h = '<button class="kp-chip on" data-c="all">Todos</button>';
  campos.forEach(c => {
    h += '<button class="kp-chip" data-c="' + kpEsc(c) + '">' + kpEsc(c) + '</button>';
  });
  document.getElementById('kpCampos').innerHTML = h;

  const sel = document.getElementById('kpCampoSel');
  if (sel) {
    sel.innerHTML = '<option value="all">Todos los campos</option>'
      + campos.map(c => '<option value="' + kpEsc(c) + '">' + kpEsc(c) + '</option>').join('');
  }
  kpPoblarPads();
  kpSincronizar();
}

/* Los PAD se limitan al campo elegido. Ofrecer los PAD de Put Sur
   cuando esta filtrado Put Norte solo produce listas vacias. */
function kpPoblarPads(){
  const pads = [...new Set(kpFlota
    .filter(x => kpCampo === 'all' || x.campo === kpCampo)
    .map(x => x.pad).filter(p => p && p !== '\u2014'))].sort();

  /* Se conserva la seleccion si el PAD sigue existiendo en el campo
     nuevo; si no, se vuelve a Todos en lugar de dejar un filtro
     invisible que no coincide con nada. */
  if (pads.indexOf(kpPad) < 0) kpPad = 'all';

  const ops = pads.map(p => '<option value="' + kpEsc(p) + '">' + kpEsc(p) + '</option>').join('');
  const sel = document.getElementById('kpPad');
  if (sel) { sel.innerHTML = '<option value="all">Todos</option>' + ops; sel.value = kpPad; }
  const mov = document.getElementById('kpPadSel');
  if (mov) { mov.innerHTML = '<option value="all">Todos los PAD</option>' + ops; mov.value = kpPad; }
}

function kpLimpiarFiltros(){
  kpFiltro = 'all';
  kpCampo  = 'all';
  kpPad    = 'all';
  document.getElementById('kpBuscar').value = '';
  kpPoblarPads();
  kpSincronizar();
  kpPintarFlota();
}

/* ============================================================
   DEMANDA ENERGETICA
   La acometida dejo de ser un panel plegado dentro de la lista de
   rondas y paso a ser una pantalla propia. Motivos: la pregunta que
   responde es distinta (cuanto consume el activo, no a que unidad
   hay que ir), y para responderla bien hace falta jerarquia. Un
   total de flota no dice nada; un total por PAD decide una compra
   de transformador.

   La navegacion del tablero escribe sobre kpCampo y kpPad, los
   mismos filtros de la vista de flota. Asi, bajar a un PAD aqui y
   cerrar el tablero deja la lista de unidades en ese mismo PAD: no
   hay dos estados que sincronizar.

   El estado de ronda (vigente / vencida) no participa. La demanda
   de un PAD es la que es, sin importar si la ronda esta vencida.
   ============================================================ */

let kpEnDemanda   = false;
let kpDemPozo     = null;   /* hoja de la jerarquia: unidad individual */
let kpVistaActual = 'flota';

const KD_HEX = ['#12a5b8','#35a853','#3f8fd0','#c9a227','#8e6fd0','#d6584a','#5f7d94'];

/* El boton informa plegado: quien no entre al tablero igual se lleva
   el total del alcance que esta mirando. */
function kpBotonDemanda(ambito){
  const con = ambito.map(x => ({ u: x, p: kpPot[x.pozo] }))
                    .filter(r => r.p && r.p.kw != null);

  if (!con.length){
    return '<div class="kp-dem-btn nd">'
      + '<span class="ic">&#9889;</span>'
      + '<span class="tx"><span class="t1">Demanda energ&eacute;tica</span>'
      +   '<span class="t2">Sin acometidas medidas en este alcance</span></span>'
      + '<span class="vl"><span>sin datos</span></span>'
      + '<span class="fw">&nbsp;</span></div>';
  }

  const t = kpDemTotales(con);
  return '<button class="kp-dem-btn" onclick="kpVerDemanda()">'
    + '<span class="ic">&#9889;</span>'
    + '<span class="tx"><span class="t1">Demanda energ&eacute;tica</span>'
    +   '<span class="t2">Tablero por campo, PAD y unidad</span></span>'
    + '<span class="vl"><b>' + t.kw.toFixed(0) + '<small>kW</small></b>'
    +   '<span>' + con.length + (con.length === 1 ? ' unidad' : ' unidades')
    +   ' &middot; FP ' + (t.fp != null ? t.fp.toFixed(2) : '\u2014') + '</span></span>'
    + '<span class="fw">&rsaquo;</span></button>';
}

/* Optimizacion no es una vista de esta pantalla: lee sus propias
   tablas y produce una propuesta que se registra y se sigue. Por eso
   vive en su archivo y aqui solo hay la puerta. Se abre encima, con
   el campo y el PAD que el usuario ya tenga puestos, para que no
   tenga que volver a filtrar lo mismo. */
function kpBotonOptimizacion(){

    + '<span class="tx"><span class="t1">Optimizaci&oacute;n energ&eacute;tica</span>'

function kpAbrirOptimizacion(){
  const cap = document.getElementById('kpOptCapa');

  document.getElementById('kpOptCapa').classList.remove('abierta');
  document.body.classList.remove('kp-sin-scroll');
  /* Se libera el iframe para que no siga consumiendo ni conserve
     una sesion de trabajo a medias que confunda al reabrir. */
  document.getElementById('kpOptMarco').src = 'about:blank';
}

/* Total del conjunto. La aparente se recompone de la activa y la
   reactiva sumadas: sumar kVA individuales da de mas siempre que los
   factores de potencia difieran, que es el caso normal en campo. */
function kpDemTotales(rs){
  const s = k => rs.reduce((a, r) => a + (r.p[k] != null ? r.p[k] : 0), 0);
  const kw   = s('kw');
  const kvar = s('kvar');
  const kva  = Math.sqrt(kw * kw + kvar * kvar);
  const thds = rs.map(r => r.p.thd_i).filter(v => v != null);
  return {
    kw: kw, kvar: kvar, kva: kva,
    fp: kva ? kw / kva : null,
    n: rs.length,
    thd: thds.length ? thds.reduce((a, b) => a + b, 0) / thds.length : null
  };
}

/* Las filas del tablero salen del cruce entre la flota (que tiene
   campo y PAD) y la RPC de potencia (que tiene la medida). Una
   unidad sin acometida medida no entra al total, y eso se dice en
   la nota al pie en lugar de disimularlo. */
function kpDemFilas(){
  return kpFlota
    .filter(x => kpCampo === 'all' || x.campo === kpCampo)
    .filter(x => kpPad   === 'all' || x.pad   === kpPad)
    .filter(x => !kpDemPozo || x.pozo === kpDemPozo)
    .map(x => ({ u: x, p: kpPot[x.pozo] }));
}

function kpDemNivel(){
  if (kpDemPozo)        return 3;
  if (kpPad   !== 'all') return 2;
  if (kpCampo !== 'all') return 1;
  return 0;
}

/* Agrupa por la dimension que corresponde al nivel y ordena por
   demanda descendente: lo que mas pesa arriba. */
function kpDemGrupos(con, clave){
  const m = new Map();
  con.forEach(r => {
    const k = r.u[clave] || '\u2014';
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(r);
  });
  return [...m.entries()]
    .map(([k, v]) => Object.assign({ nombre: k }, kpDemTotales(v)))
    .sort((a, b) => b.kw - a.kw);
}

function kpDemBajar(valor){
  const n = kpDemNivel();
  if (n === 0){ kpCampo = valor; kpPoblarPads(); }
  else if (n === 1){ kpPad = valor; }
  else if (n === 2){ kpDemPozo = valor; }
  kpSincronizar();
  kpPintarDemanda();
}

/* La miga de pan sube: el nivel al que se toca queda como ultimo. */
function kpDemSubir(n){
  if (n <= 0){ kpCampo = 'all'; kpPad = 'all'; kpDemPozo = null; kpPoblarPads(); }
  else if (n === 1){ kpPad = 'all'; kpDemPozo = null; kpPoblarPads(); }
  else if (n === 2){ kpDemPozo = null; }
  kpSincronizar();
  kpPintarDemanda();
}

function kpVerDemanda(){
  if (!kpEnDemanda) kpDemPozo = null;   /* entrada nueva: desde la raiz */
  kpEnDemanda   = true;
  kpVistaActual = 'demanda';
  document.body.classList.add('kp-oscuro');
  kpMostrarFiltros(false);
  const b = document.getElementById('kpBack');

  b.innerHTML = '&larr; Volver a flota';

  kpPintarDemanda();
}

function kpCerrarDemanda(){
  kpEnDemanda   = false;
  kpDemPozo     = null;
  kpVistaActual = 'flota';
  document.body.classList.remove('kp-oscuro');
  document.getElementById('kpBack').style.display = 'none';
  document.getElementById('kpBack').innerHTML = '&larr; Volver a flota';
  kpMostrarFiltros(true);
  document.getElementById('kpTitulo').textContent = 'Monitoreo de Condici\u00f3n';
  document.getElementById('kpSub').innerHTML =
    'Monitoreo de condici&oacute;n y diagn&oacute;stico de m&aacute;quinas';
  kpSincronizar();
  kpPintarFlota();
}

/* Un solo boton de cabecera para tres vistas. Desde el diagnostico de
   una unidad abierta desde el tablero se vuelve al tablero, no a la
   flota: se perderia el punto de la jerarquia en el que estaba. */
function kpAtras(){
  if (kpVistaActual === 'pozo' && kpEnDemanda) kpVerDemanda();
  else if (kpVistaActual === 'demanda')        kpCerrarDemanda();
  else                                         kpVerFlota();
}

function kpPintarDemanda(){
  const v = document.getElementById('kpVista');
  const todas = kpDemFilas();
  const con   = todas.filter(r => r.p && r.p.kw != null);
  const sin   = todas.length - con.length;
  const nivel = kpDemNivel();

  let h = '<div class="kd">' + kpDemMiga();

  if (!con.length){
    h += '<div class="kd-card"><div class="kd-vacio">'
      +  'Ninguna de las ' + todas.length
      +  (todas.length === 1 ? ' unidad de este alcance tiene'
                             : ' unidades de este alcance tienen')
      +  ' acometida medida.<br>La demanda se calcula sobre el punto de '
      +  'entrada al PST capturado en ronda.</div></div></div>';
    v.innerHTML = h;
    return;
  }

  const t = kpDemTotales(con);
  h += kpDemHero(t, con, nivel);

  if (nivel < 3){
    const clave = nivel === 0 ? 'campo' : (nivel === 1 ? 'pad' : 'pozo');
    const gr    = kpDemGrupos(con, clave);
    const tit   = nivel === 0 ? 'Demanda por campo'
                : (nivel === 1 ? 'Demanda por PAD' : 'Demanda por unidad');

    h += '<div class="kd-grid">'
      +  '<div class="kd-card"><div class="ct"><b>' + tit + '</b>'
      +    '<span>Toque para bajar</span></div>'
      +    kpDemBarras(gr, nivel) + '</div>'
      +  '<div class="kd-card"><div class="ct"><b>Participaci&oacute;n</b>'
      +    '<span>% de kW</span></div>' + kpDemDonut(gr, t.kw) + '</div>'
      +  '</div>';
  } else {
    h += kpDemUnidad(con[0]);
  }

  h += '<div class="kd-grid">'
    +  '<div class="kd-card"><div class="ct"><b>Factor de potencia</b>'
    +    '<span>' + con.length + ' unidades</span></div>'
    +    kpDemFP(con) + '</div>'
    +  '<div class="kd-card"><div class="ct"><b>Mayor demanda</b>'
    +    '<span>Top ' + Math.min(6, con.length) + '</span></div>'
    +    kpDemRanking(con) + '</div>'
    +  '</div>';

  h += '<div class="kd-card"><div class="ct"><b>Detalle de unidades</b>'
    +  '<span>' + con.length + '</span></div>'
    +  kpDemTabla(con) + kpDemNota(con, sin) + '</div>';

  h += '</div>';
  v.innerHTML = h;
}

function kpDemMiga(){
  let h = '<div class="kd-mig">';
  const n = kpDemNivel();
  const paso = (txt, i, act) => act
    ? '<button class="aq">' + txt + '</button>'
    : '<button onclick="kpDemSubir(' + i + ')">' + txt + '</button>';

  h += paso('Todos los campos', 0, n === 0);
  if (n >= 1) h += '<span class="sep">&rsaquo;</span>'
    + paso(kpEsc(kpCampo), 1, n === 1);
  if (n >= 2) h += '<span class="sep">&rsaquo;</span>'
    + paso(kpEsc(kpPad), 2, n === 2);
  if (n >= 3) h += '<span class="sep">&rsaquo;</span>'
    + paso(kpEsc(kpDemPozo), 3, true);
  return h + '</div>';
}

function kpDemHero(t, con, nivel){
  const kwu = t.n ? t.kw / t.n : null;
  const fpc = t.fp == null ? '' : (t.fp < 0.85 ? ' r' : (t.fp < 0.90 ? ' w' : ' g'));
  const thc = t.thd == null ? '' : (t.thd > 8 ? ' w' : ' g');
  const tile = (cls, k, v, u, r) => '<div class="kd-h' + cls + '">'
    + '<div class="k">' + k + '</div>'
    + '<div class="v">' + v + (u ? '<small>' + u + '</small>' : '') + '</div>'
    + (r ? '<div class="r2">' + r + '</div>' : '') + '</div>';

  return '<div class="kd-hero">'
    + tile('',    'Activa',   t.kw.toFixed(0),   'kW',   'demanda medida')
    + tile('',    'Aparente', t.kva.toFixed(0),  'kVA',  'recompuesta')
    + tile('',    'Reactiva', t.kvar.toFixed(0), 'kVAr', 'inductiva')
    + tile(fpc,   'Factor de potencia',
           t.fp != null ? t.fp.toFixed(3) : '\u2014', '',
           t.fp == null ? '' : (t.fp < 0.90 ? 'bajo 0.90' : 'dentro de rango'))
    + tile('g',   'Unidades', String(t.n), '',
           kwu != null ? kwu.toFixed(0) + ' kW promedio' : '')
    + tile(thc,   'THD-I promedio',
           t.thd != null ? t.thd.toFixed(1) : '\u2014',
           t.thd != null ? '%' : '',
           t.thd != null ? (t.thd > 8 ? 'sobre IEEE 519' : 'dentro de IEEE 519') : 'sin medida')
    + '</div>';
}

function kpDemBarras(gr, nivel){
  const max = Math.max.apply(null, gr.map(g => g.kw).concat([1]));
  return gr.map(g => {
    const w   = Math.max(2, Math.round(g.kw / max * 100));
    const baj = nivel < 3;
    const at  = baj ? ' class="kd-bar cl" onclick="kpDemBajar(this.dataset.v)"'
                    : ' class="kd-bar"';
    return '<button' + at + ' data-v="' + kpEsc(g.nombre) + '">'
      + '<span class="lb"><span><i>' + kpEsc(g.nombre) + '</i>'
      +   '<u>' + g.n + (g.n === 1 ? ' unidad' : ' unidades')
      +   (g.fp != null ? ' \u00b7 FP ' + g.fp.toFixed(2) : '') + '</u></span>'
      +   '<em>' + g.kw.toFixed(0) + '<s> kW</s></em></span>'
      + '<span class="tk"><span class="fl" style="width:' + w + '%"></span></span>'
      + '</button>';
  }).join('');
}

/* Rosco por porcentaje de kW. Mas de seis rebanadas no se distinguen,
   asi que el resto se agrupa. */
function kpDemDonut(gr, kwTot){
  if (!kwTot) return '<div class="kd-vacio">Sin demanda para repartir</div>';

  let items = gr.slice(0, 6).map((g, i) => ({ n: g.nombre, kw: g.kw, c: KD_HEX[i] }));
  if (gr.length > 6){
    const resto = gr.slice(6).reduce((a, g) => a + g.kw, 0);
    items.push({ n: 'Otros ' + (gr.length - 6), kw: resto, c: KD_HEX[6] });
  }

  const R = 52, SW = 15, C = 2 * Math.PI * R;
  let off = 0;
  const anillos = items.map(it => {
    const len = C * (it.kw / kwTot);
    const s = '<circle cx="66" cy="66" r="' + R + '" fill="none" stroke="' + it.c
      + '" stroke-width="' + SW + '" stroke-dasharray="' + len.toFixed(2)
      + ' ' + (C - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2)
      + '" transform="rotate(-90 66 66)"></circle>';
    off += len;
    return s;
  }).join('');

  const leyenda = items.map(it =>
    '<div><i style="background:' + it.c + '"></i>'
    + '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
    + kpEsc(it.n) + '</span><b>' + (it.kw / kwTot * 100).toFixed(0) + '%</b></div>'
  ).join('');

  return '<div class="kd-don"><svg width="132" height="132" viewBox="0 0 132 132">'
    + '<circle cx="66" cy="66" r="' + R + '" fill="none" stroke="rgba(255,255,255,.07)" '
    +   'stroke-width="' + SW + '"></circle>'
    + anillos
    + '<text x="66" y="62" text-anchor="middle" fill="#fff" font-size="20" '
    +   'font-weight="600">' + kwTot.toFixed(0) + '</text>'
    + '<text x="66" y="79" text-anchor="middle" fill="#7f9bb2" font-size="11">kW</text>'
    + '</svg><div class="lg">' + leyenda + '</div></div>';
}

/* Cuatro cajones de FP. El corte en 0.90 es el que factura: por
   debajo hay penalizacion, y por eso los dos primeros van en calido. */
function kpDemFP(con){
  const fps = con.map(r => r.p.fp).filter(v => v != null);
  if (!fps.length) return '<div class="kd-vacio">Sin factor de potencia medido</div>';

  const cajones = [
    { t: '< 0.85',      f: v => v <  0.85,             c: '#d6584a' },
    { t: '0.85 - 0.90', f: v => v >= 0.85 && v < 0.90, c: '#e0a230' },
    { t: '0.90 - 0.95', f: v => v >= 0.90 && v < 0.95, c: '#35a853' },
    { t: '\u2265 0.95', f: v => v >= 0.95,             c: '#12a5b8' }
  ].map(c => Object.assign(c, { n: fps.filter(c.f).length }));

  const max = Math.max.apply(null, cajones.map(c => c.n).concat([1]));
  const cols = cajones.map(c => '<div class="cl2">'
    + '<div class="n">' + c.n + '</div>'
    + '<div class="cb" style="height:' + Math.round(c.n / max * 74) + 'px;'
    +   'background:' + c.c + (c.n ? '' : ';opacity:.25') + '"></div>'
    + '<div class="lg2">' + c.t + '</div></div>').join('');

  const bajos = con.filter(r => r.p.fp != null && r.p.fp < 0.90)
                   .sort((a, b) => a.p.fp - b.p.fp).slice(0, 3);
  let pie = '';
  if (bajos.length){
    pie = '<p class="kd-nota"><span class="al">Bajo 0.90:</span> '
      + bajos.map(r => kpEsc(r.u.pozo) + ' (' + r.p.fp.toFixed(2) + ')').join(' \u00b7 ')
      + (con.filter(r => r.p.fp != null && r.p.fp < 0.90).length > 3
          ? ' y otras' : '') + '.</p>';
  } else {
    pie = '<p class="kd-nota">Todas las unidades medidas est&aacute;n en 0.90 o m&aacute;s.</p>';
  }
  return '<div class="kd-fp">' + cols + '</div>' + pie;
}

function kpDemRanking(con){
  const top = con.slice().sort((a, b) => (b.p.kw || 0) - (a.p.kw || 0)).slice(0, 6);
  const max = Math.max.apply(null, top.map(r => r.p.kw || 0).concat([1]));
  return top.map((r, i) =>
    '<button class="kd-bar cl" onclick="kpVerPozo(this.dataset.p)" '
    + 'data-p="' + kpEsc(r.u.pozo) + '">'
    + '<span class="lb"><span><i>' + (i + 1) + '. ' + kpEsc(r.u.pozo) + '</i>'
    +   '<u>' + kpEsc(r.u.pad && r.u.pad !== '\u2014' ? r.u.pad : r.u.campo) + '</u></span>'
    +   '<em>' + r.p.kw.toFixed(0) + '<s> kW</s></em></span>'
    + '<span class="tk"><span class="fl" style="width:'
    +   Math.max(2, Math.round(r.p.kw / max * 100)) + '%"></span></span>'
    + '</button>'
  ).join('');
}

/* Hoja de la jerarquia: una sola unidad. Aqui la pregunta ya no es
   cuanto suma, es como esta esa acometida. */
function kpDemUnidad(r){
  const p = r.p;
  const c = (k, v, u) => '<div class="kd-h"><div class="k">' + k + '</div>'
    + '<div class="v">' + v + (u ? '<small>' + u + '</small>' : '') + '</div></div>';

  return '<div class="kd-card">'
    + '<div class="ct"><b>' + kpEsc(r.u.pozo) + ' \u00b7 ' + kpEsc(r.u.marca) + '</b>'
    +   '<span>' + kpEsc(r.u.campo)
    +   (r.u.pad && r.u.pad !== '\u2014' ? ' \u00b7 ' + kpEsc(r.u.pad) : '') + '</span></div>'
    + '<div class="kd-hero" style="margin-bottom:0">'
    +   c('Corriente', kpNum(p.i), 'A')
    +   c('Tensi&oacute;n', kpNum(p.v), 'V')
    +   c('Frecuencia', p.hz != null ? p.hz.toFixed(1) : '\u2014', 'Hz')
    +   c('THD-I', p.thd_i != null ? p.thd_i.toFixed(1) : '\u2014', '%')
    +   c('THD-V', p.thd_v != null ? p.thd_v.toFixed(1) : '\u2014', '%')
    +   c('Factor K', p.factor_k != null ? p.factor_k.toFixed(2) : '\u2014', '')
    + '</div>'
    + '<p class="kd-nota">Condici&oacute;n de la medida: <b>'
    +   kpEsc(p.condicion || 'no registrada') + '</b>'
    +   (p.medido_en ? ' \u00b7 ' + kpEsc(p.medido_en) : '')
    +   (p.dias != null ? ' \u00b7 hace ' + p.dias + ' d\u00edas' : '')
    +   (p.corrida_actual === false
          ? ' \u00b7 <span class="al">corresponde a la corrida anterior</span>' : '')
    +   '</p>'
    + '<button class="kd-abrir" onclick="kpVerPozo(this.dataset.p)" '
    +   'data-p="' + kpEsc(r.u.pozo) + '">Abrir diagn&oacute;stico de la unidad</button>'
    + '</div>';
}

function kpDemTabla(con){
  const filas = con.slice()
    .sort((a, b) => (b.p.kw || 0) - (a.p.kw || 0))
    .map(r => {
      const p  = r.p;
      const vj = (p.dias != null && p.dias > 120);
      const ba = (p.fp != null && p.fp < 0.90);
      return '<tr>'
        + '<td class="pz" onclick="kpDemVer(this.dataset.p)" data-p="'
        +   kpEsc(r.u.pozo) + '">' + kpEsc(r.u.pozo) + '</td>'
        + '<td>' + kpEsc(r.u.pad && r.u.pad !== '\u2014' ? r.u.pad : r.u.campo) + '</td>'
        + '<td>' + kpNum(p.kw)   + '</td>'
        + '<td>' + kpNum(p.kva)  + '</td>'
        + '<td>' + kpNum(p.kvar) + '</td>'
        + '<td class="' + (ba ? 'ba' : '') + '">'
        +   (p.fp != null ? p.fp.toFixed(2) : '\u2014') + '</td>'
        + '<td>' + kpNum(p.i)    + '</td>'
        + '<td>' + kpNum(p.v)    + '</td>'
        + '<td>' + (p.thd_i != null ? p.thd_i.toFixed(1) : '\u2014') + '</td>'
        + '<td>' + (p.hz != null ? p.hz.toFixed(1) : '\u2014') + '</td>'
        + '<td class="' + (vj ? 'vj' : '') + '">'
        +   (p.medido_en ? kpEsc(p.medido_en) : '\u2014') + '</td>'
        + '</tr>';
    }).join('');

  return '<div class="kd-scroll"><table class="kd-tabla">'
    + '<thead><tr><th>Unidad</th><th>Ubicaci&oacute;n</th><th>kW</th><th>kVA</th>'
    + '<th>kVAr</th><th>FP</th><th>A</th><th>V</th><th>THD-I&nbsp;%</th>'
    + '<th>Hz</th><th>Medida</th></tr></thead>'
    + '<tbody>' + filas + '</tbody></table></div>';
}

/* Desde la tabla se baja a la unidad dentro del tablero, no se sale
   al diagnostico: quien esta comparando acometidas quiere ver esa
   acometida, y para el diagnostico ya hay un boton explicito. */
function kpDemVer(pozo){
  const u = kpFlota.find(x => x.pozo === pozo);
  if (!u) return;
  kpCampo   = u.campo;
  kpPad     = u.pad;
  kpDemPozo = pozo;
  kpPoblarPads();
  kpSincronizar();
  kpPintarDemanda();
}

/* Lo que la cifra no dice hay que escribirlo. Quien mira un total de
   kW asume que es la demanda simultanea del PAD, y no lo es: cada
   unidad aporta su ultima ronda, y las rondas son de fechas
   distintas. */
function kpDemNota(con, sin){
  const dias    = con.map(r => r.p.dias).filter(d => d != null).sort((a, b) => a - b);
  const mediana = dias.length ? dias[Math.floor(dias.length / 2)] : null;
  const viejas  = con.filter(r => r.p.dias != null && r.p.dias > 120).length;
  const otra    = con.filter(r => r.p.corrida_actual === false).length;

  let n = '<p class="kd-nota">Medido en la entrada del PST desde la red, sobre la '
    + '&uacute;ltima ronda de cada unidad que incluy&oacute; ese punto. '
    + '<b>No es demanda simult&aacute;nea</b>: las rondas son de fechas distintas'
    + (mediana != null ? ', la mediana tiene ' + mediana + ' d\u00edas' : '') + '.';
  if (viejas) n += ' <span class="al">' + viejas
    + (viejas === 1 ? ' unidad supera' : ' unidades superan') + ' los 4 meses.</span>';
  if (otra) n += ' ' + otra
    + (otra === 1 ? ' corresponde' : ' corresponden') + ' a la corrida anterior.';
  if (sin) n += ' ' + sin + (sin === 1 ? ' unidad no tiene' : ' unidades no tienen')
    + ' acometida medida y queda' + (sin === 1 ? '' : 'n') + ' fuera del total.';
  return n + '</p>';
}

function kpPintarFlota(){
  const q   = (document.getElementById('kpBuscar')?.value || '').trim().toUpperCase();
  const pad = kpPad;

  /* El ambito es campo + PAD + busqueda. El estado se aplica despues,
     aparte, para que los contadores de arriba sigan mostrando el total
     del ambito aunque se este mirando solo un estado: si al tocar
     "Vencidas" el contador de vencidas pasara a ser el total, no habria
     con que compararlo. */
  const ambito = kpFlota
    .filter(x => kpCampo === 'all' || x.campo === kpCampo)
    .filter(x => pad === 'all' || x.pad === pad)
    .filter(x => !q || x.pozo.toUpperCase().includes(q)
                    || (x.campo || '').toUpperCase().includes(q)
                    || (x.pad   || '').toUpperCase().includes(q));

  const d = ambito.filter(x => kpFiltro === "all" || x.estado === kpFiltro);

  const hayFiltro = (kpFiltro !== 'all' || kpCampo !== 'all' || pad !== 'all' || q);
  const bl = document.getElementById('kpLimpiar');
  if (bl) bl.style.display = hayFiltro ? '' : 'none';

  /* Orden: primero las que llevan mas tiempo sin ronda. Es lo que hay
     que salir a hacer, y por eso encabeza la lista. Las que nunca se
     han medido van al final: no son urgentes, son un pendiente de
     otra naturaleza. */
  d.sort((a,b) => {
    if (!a.ultima && !b.ultima) return a.pozo.localeCompare(b.pozo);
    if (!a.ultima) return 1;
    if (!b.ultima) return -1;
    return a.ultima.localeCompare(b.ultima);
  });

  const cuenta = e => ambito.filter(x => x.estado === e).length;
  const conRondas = ambito.filter(x => x.rondas > 0);
  const totalRondas = ambito.reduce((a,x) => a + x.rondas, 0);

  const alcance = [];
  if (kpCampo !== 'all') alcance.push(kpEsc(kpCampo));
  if (pad !== 'all')     alcance.push(kpEsc(pad));
  if (q)                 alcance.push('"' + kpEsc(q) + '"');

  let h = '<h2>Unidades BES' + (alcance.length ? ' \u00b7 ' + alcance.join(' \u00b7 ') : '')
        + '</h2><p class="hint">'
        + ambito.length + (ambito.length === 1 ? ' unidad' : ' unidades')
        + ' &middot; ' + totalRondas + ' rondas registradas'
        + (alcance.length ? ' &middot; de ' + kpFlota.length + ' en total' : '')
        + ' &middot; ordenadas por antig&uuml;edad de la &uacute;ltima ronda</p>';

  h += '<div class="kp-stats">'
    +  '<div class="kp-stat"><div class="k">Al d&iacute;a</div><div class="v" style="color:var(--kp-ok)">'
    +  cuenta('vigente') + '</div></div>'
    +  '<div class="kp-stat"><div class="k">Vencidas</div><div class="v" style="color:var(--kp-warn)">'
    +  cuenta('vencida') + '</div></div>'
    +  '<div class="kp-stat"><div class="k">Sin rondas</div><div class="v" style="color:var(--kp-null)">'
    +  cuenta('sin') + '</div></div>'
    +  '<div class="kp-stat"><div class="k">Rondas / unidad</div><div class="v">'
    +  (conRondas.length ? (totalRondas / conRondas.length).toFixed(1) : '0')
    +  '</div></div></div>';

  h += kpBotonDemanda(ambito);
  h += kpBotonOptimizacion();

  if (!d.length){
    h += '<div class="kp-list"><div class="kp-msg">'
      +  (ambito.length
            ? 'Ninguna de las ' + ambito.length + ' unidades de este alcance est&aacute; en ese estado.'
            : 'Ninguna unidad con estos filtros.')
      +  (hayFiltro ? '<br><br><button class="kp-chip" onclick="kpLimpiarFiltros()">'
                    + 'Quitar los filtros</button>' : '')
      +  '</div></div>';
    document.getElementById("kpVista").innerHTML = h;
    return;
  }

  h += '<div class="kp-list">';
  d.forEach(x => {
    const cls = x.estado === 'vigente' ? 'ok' : (x.estado === 'vencida' ? 'warn' : 'none');
    const txt = x.estado === 'vigente' ? 'Al d\u00eda'
              : (x.estado === 'vencida' ? 'Vencida' : 'Sin rondas');
    h += '<div class="kp-row" onclick="kpVerPozo(\'' + x.pozo + '\')">'
      +  '<div style="flex:1;min-width:0">'
      +  '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
      +  '<span class="nm">' + x.pozo + '</span>'
      +  '<span class="sys">' + x.marca + '</span>'
      +  '<span style="font-size:12px;color:var(--kp-ink3)">' + x.campo
      +  (x.pad && x.pad !== '\u2014' ? ' \u00b7 ' + x.pad : '') + '</span></div>'
      +  '<div class="ds">' + (x.rondas
            ? x.rondas + (x.rondas === 1 ? ' ronda' : ' rondas')
              + (x.corrida ? ' en la corrida actual' : '')
            : (x.historicas
                ? '<span style="color:var(--kp-warn)">Sin rondas desde el cambio de equipo</span>'
                : 'Sin rondas registradas')) + '</div>'
      +  '<div class="ts">' + (x.ultima
            ? '\u00daltima: ' + x.ultima + ' \u00b7 ' + kpDiasDesde(x.ultima)
            : (x.historicas
                ? 'Equipo de fondo cambiado el ' + x.corrida + ' \u00b7 '
                  + x.historicas + ' rondas del equipo anterior'
                : 'Nunca se ha medido')) + '</div></div>'
      +  '<span class="kp-pill ' + cls + '">' + txt + '</span></div>';
  });
  h += '</div>';
  document.getElementById("kpVista").innerHTML = h;
}

/* "hace 47 dias" se entiende de una; una fecha sola obliga a restar
   mentalmente para saber si eso esta bien o mal. */
function kpDiasDesde(iso){
  const d = Math.floor((Date.now() - new Date(iso + 'T12:00:00').getTime()) / 86400000);
  if (d <= 0) return 'hoy';
  if (d === 1) return 'ayer';
  if (d < 60) return 'hace ' + d + ' d\u00edas';
  return 'hace ' + Math.round(d / 30) + ' meses';
}

/* ============================================================
   VISTA: POZO
   ============================================================ */
async function kpVerPozo(codigo){
  kpVistaActual = 'pozo';
  document.body.classList.remove('kp-oscuro');
  document.getElementById("kpBack").style.display = "block";
  document.getElementById("kpBack").innerHTML = kpEnDemanda
    ? '&larr; Volver a demanda' : '&larr; Volver a flota';
  kpMostrarFiltros(false);
  const v = document.getElementById("kpVista");
  v.innerHTML = '<div class="kp-msg">Cargando&hellip;</div>';
  document.getElementById("kpTitulo").textContent = codigo;
  document.getElementById("kpSub").innerHTML = "Cargando&hellip;";

  let pozoId = null;
  try { pozoId = await kpIdDe(codigo); } catch(e){}
  if (!pozoId){
    v.innerHTML = '<div class="kp-card"><div class="kp-msg">'
      + 'No se pudo resolver el activo ' + kpEsc(codigo) + '.</div></div>';
    return;
  }

  /* Las cuatro consultas van en paralelo y cada una con su propio
     catch: en un PAD es normal que una responda y otra no, y perder
     la cadena porque fallaron los eventos seria absurdo. */
  let med = null, ctx = null, evs = [], tend = [], bal = [], cor = [];
  const r = await Promise.all([
    kpCargarMedicion(pozoId).catch(() => null),
    kpCargarContexto(pozoId).catch(() => null),
    kpCargarEventos(pozoId).catch(() => []),
    kpCargarTendencia(pozoId).catch(() => []),
    kpCargarBalance(pozoId).catch(() => []),
    kpCargarCorridas(pozoId).catch(() => [])
  ]);
  med = r[0]; ctx = r[1]; evs = r[2] || []; tend = r[3] || []; bal = r[4] || []; cor = r[5] || [];

  /* Se cambio el equipo de fondo y todavia no hay rondas del nuevo. No
     se muestran los numeros del anterior contra la placa nueva: serian
     corriente de un equipo contra la nominal de otro. */
  if (med && med.sin_rondas_corrida){
    document.getElementById("kpSub").innerHTML =
      'BES &middot; equipo de fondo cambiado el ' + med.inicio_corrida;
    document.getElementById("kpVista").innerHTML =
      kpAvisoCorrida(med, cor)
      + '<div class="kp-sec"><h2>Rondas del equipo anterior</h2>'
      + '<p class="hint">Se conservan y se pueden consultar, pero no se '
      + 'mezclan con las del equipo actual.</p>'
      + kpRenderCorridas(cor) + '</div>';
    return;
  }

  const hayCtx = ctx && ((ctx.bitacora||[]).length || (ctx.aislamiento||[]).length);
  if (!med && !hayCtx && !evs.length){
    document.getElementById("kpSub").innerHTML = "Sin rondas registradas";
    v.innerHTML = '<div class="kp-card"><div class="kp-msg">'
      + 'Esta unidad no tiene rondas de campo confirmadas.<br>'
      + 'Los indicadores se calculan a partir de la captura en campo: '
      + 'en cuanto se registre una ronda, aparecen aqu&iacute;.</div></div>';
    return;
  }

  const mc = (med && med.medicion) || {};
  document.getElementById("kpSub").innerHTML =
    'BES' + (mc.medido_en ? ' &middot; &uacute;ltima ronda ' + kpFechaCorta(mc.medido_en) : '')
    + (med && med.rondas ? ' &middot; ' + med.rondas + ' rondas' : '')
    + (med && med.inicio_corrida ? ' &middot; corrida desde ' + med.inicio_corrida : '');

  KP_EV = evs;
  const angosta = window.matchMedia('(max-width:640px)').matches;
  const sec = [];

  /* Orden de lectura:
       1 resumen        -> como esta la unidad ahora, en cuatro cifras
       2 cadena         -> donde esta el margen, etapa por etapa
       3 tendencia      -> hacia donde va, que es lo que no se ve en una foto
       4 eventos        -> que paso en el periodo
       5 contexto       -> informacion sobre el dato, al final */

  if (med){
    sec.push(kpSeccion('resumen', 'Estado de la unidad',
      kpSubRonda(mc), kpRenderResumen(med, bal), { plegable:false }));

    sec.push(kpSeccion('cadena', 'Cadena de potencia',
      'Cada etapa contra su propia nominal de placa',
      kpRenderMedicion(med), { cerrada:false }));
  }

  if (tend.length){
    const nRondas = new Set(tend.map(t => t.fecha)).size;
    sec.push(kpSeccion('tendencia', 'Tendencia entre rondas',
      nRondas + (nRondas === 1 ? ' ronda' : ' rondas') + ' &middot; una foto no dice si algo se est&aacute; moviendo',
      kpRenderTendencia(tend, bal), { cerrada: angosta }));
  }

  if (cor.length > 1){
    sec.push(kpSeccion('corridas', 'Equipo de fondo',
      cor.length + ' corridas registradas',
      kpRenderCorridas(cor), { cerrada:true }));
  }

  const ev = kpRenderEventos(KP_EV);
  if (ev) sec.push(ev);

  if (ctx){
    sec.push(kpSeccion('contexto', 'Contexto y calidad del dato', null,
      kpRenderContexto(ctx), { cerrada:true }));
  }

  let h = '';
  if (sec.length > 3){
    h += '<div class="kp-nav">'
      +  sec.map(x => '<a href="#sec-' + x.id + '">' + x.titulo + '</a>').join('')
      +  '</div>';
  }
  h += sec.map(x => x.html).join('');
  v.innerHTML = h;
  if (KP_EV.length) kpEvPintar();
}

/* ============================================================
   CORRIDAS DE FONDO
   ============================================================
   Una corrida es el periodo entre la bajada del conjunto de fondo y su
   recuperacion. Cortar las series ahi no es una preferencia de
   presentacion: la placa vigente es la del equipo actual, asi que
   calcular carga sobre mediciones del equipo anterior compara la
   corriente de uno contra la nominal de otro.                      */
function kpAvisoCorrida(med, cor){
  const act = (cor || []).find(c => c.actual);
  const eq = act && act.equipos && act.equipos.length ? act.equipos : [];
  let h = '<div class="kp-sec" style="border-left:4px solid var(--kp-warn)">'
        + '<h2>Se cambi&oacute; el equipo de fondo</h2>'
        + '<p class="hint" style="margin-bottom:12px">'
        + 'El conjunto actual se instal&oacute; el <b>' + med.inicio_corrida
        + '</b> y todav&iacute;a no tiene rondas de campo. '
        + 'Las ' + med.rondas_anteriores + ' rondas anteriores '
        + '(la &uacute;ltima del ' + med.ultima_anterior + ') son del equipo retirado: '
        + 'calcular carga con ellas contra la placa nueva dar&iacute;a un porcentaje '
        + 'que no corresponde a ning&uacute;n equipo real.</p>';
  if (eq.length){
    h += '<div class="kp-list" style="margin-bottom:12px"><div class="kp-grp">Equipo instalado</div>';
    eq.forEach(e => {
      h += '<div class="kp-rule"><div>'
        +  '<div><span class="nm">' + kpEsc(e.rol) + '</span> '
        +  '<span class="id">' + kpEsc(e.serial || '\u2014') + '</span></div>'
        +  '<div class="dt">' + kpEsc(e.marca || '\u2014')
        +  (e.modelo ? ' \u00b7 ' + kpEsc(e.modelo) : '') + '</div>'
        +  '<div class="src">Instalado el ' + e.instalado_el + '</div>'
        +  '</div></div>';
    });
    h += '</div>';
  }
  h += '<p class="hint" style="margin:0">Registra una ronda de campo para que la unidad '
    +  'vuelva a evaluarse. Los indicadores aparecen en cuanto haya la primera medici&oacute;n '
    +  'del equipo nuevo.</p></div>';
  return h;
}

function kpRenderCorridas(cor){
  if (!cor || !cor.length)
    return '<p class="hint">Sin instalaciones de fondo registradas para este activo.</p>';
  let h = '<div class="kp-list">';
  cor.forEach(c => {
    const eq = (c.equipos || []).map(e =>
      kpEsc(e.rol) + ' ' + kpEsc(e.marca || '') + ' ' + kpEsc(e.modelo || '')
      + (e.serial ? ' (' + kpEsc(e.serial) + ')' : '')).join(' \u00b7 ');
    /* Los dias de corrida son el run life, que es como se juzga un
       equipo de fondo. Una corrida de ocho anos es informacion, no
       relleno. */
    const fin = c.fin ? new Date(c.fin) : new Date();
    const dias = Math.round((fin - new Date(c.inicio)) / 86400000);
    h += '<div class="kp-rule' + (c.actual ? ' ok' : '') + '"><div>'
      +  '<div><span class="nm">' + c.inicio + (c.fin ? ' a ' + c.fin : ' \u2014 en servicio')
      +  '</span></div>'
      +  '<div class="dt">' + (eq || 'Sin detalle de equipo') + '</div>'
      +  '<div class="src">' + c.rondas + (c.rondas === 1 ? ' ronda' : ' rondas')
      +  ' &middot; ' + (dias >= 365 ? (dias/365).toFixed(1) + ' a\u00f1os' : dias + ' d\u00edas')
      +  (c.actual ? ' en servicio' : ' de corrida') + '</div>'
      +  '</div><span class="kp-pill ' + (c.actual ? 'ok' : 'none') + '">'
      +  (c.actual ? 'Actual' : 'Anterior') + '</span></div>';
  });
  return h + '</div>';
}

function kpSubRonda(mc){
  if (!mc || !mc.medido_en) return null;
  /* Solo cuando y quien. La frecuencia, el modo y la condicion pasaron
     a fichas propias: repetirlos aqui era ruido. */
  const p = [kpFechaCorta(mc.medido_en)];
  if (mc.realizado_por) p.push(kpEsc(mc.realizado_por));
  return p.join(' &middot; ');
}

/* ============================================================
   RESUMEN: las cuatro cifras que deciden si hay que hacer algo
   ============================================================
   Se eligen las que un electricista mira primero al llegar: cuanto
   carga el motor, si las corrientes vienen parejas, como reparten los
   dos puentes y como esta el factor de potencia en la acometida.
   El resto esta abajo para quien quiera entrar en detalle.        */
function kpRenderResumen(med, bal){
  const val = med.valores || {}, placa = med.placa || {};
  const mc  = med.medicion || {};
  const cad = kpCalcularCadena(val, placa);
  const b   = (bal && bal.length) ? bal[bal.length - 1] : kpBalanceRectificadores(val);

  let h = '';

  /* ---- Operacion: como esta puesta la maquina -------------------
     Antes esto vivia en una linea de texto gris bajo el titulo y las
     cuatro tarjetas grandes repetian lo que ya dice la cadena. Los
     parametros de operacion son lo primero que se contrasta al llegar
     -- si la frecuencia no es la esperada, todo lo demas se lee
     distinto -- asi que suben aqui.                                */
  const op = [];
  const chip = (k, v, u) => { if (v != null && v !== '') op.push({k, v, u: u || ''}); };
  chip('Frecuencia',  kpNum(mc.frecuencia_hz), 'Hz');
  chip('Setpoint',    kpNum(mc.setpoint_hz), 'Hz');
  chip('HSC',         kpNum(mc.hsc), 'Hz');
  chip('LSC',         kpNum(mc.lsc), 'Hz');
  chip('Modo',        mc.control_mode ? kpEsc(mc.control_mode) : null);
  chip('Condici\u00f3n', mc.condicion ? kpEsc(mc.condicion) : null);

  if (op.length){
    h += '<div class="kp-chips">';
    op.forEach(x => {
      h += '<div class="kp-dato"><div class="k">' + x.k + '</div>'
        +  '<div class="v">' + x.v + (x.u ? '<small>' + x.u + '</small>' : '') + '</div></div>';
    });
    h += '</div>';
  }

  /* ---- Sensor de fondo -------------------------------------------
     Se muestra aparte porque es el unico bloque que habla de la bomba
     y no de la instalacion electrica. Cuando no viene, se dice: en la
     flota solo una de cada cuarenta rondas lo trae, y un hueco mudo
     haria pensar que el equipo esta bien cuando en realidad nadie lo
     midio.                                                          */
  /* Los ceros no son mediciones: un PIP de 0 psi o una vibracion de 0 g
     con la unidad operando es un campo que quedo vacio. Se descartan
     igual que el 0 F de las temperaturas. */
  const vivo = (v) => v != null && Number(v) !== 0;
  const sf = [
    ['sf_pip_psi','PIP','psi',      v => vivo(v) ? kpNum(v) : null],
    ['sf_pdesc_psi','Descarga','psi', v => vivo(v) ? kpNum(v) : null],
    ['sf_t_motor_c','T motor','\u00b0F',  v => kpTempF(v) == null ? null : kpNumF(v)],
    ['sf_t_intake_c','T intake','\u00b0F', v => kpTempF(v) == null ? null : kpNumF(v)],
    ['sf_vib_x_g','Vib X','g',      v => vivo(v) ? kpNum(v) : null],
    ['sf_vib_y_g','Vib Y','g',      v => vivo(v) ? kpNum(v) : null],
    ['sf_ct_ma','CT','mA',          v => vivo(v) ? kpNum(v) : null],
    ['sf_vt_v','Vt','V',            v => vivo(v) ? kpNum(v) : null]
  ].map(d => [d[0], d[1], d[2], d[3](val[d[0]])])
   .filter(d => d[3] != null);

  h += '<div class="kp-sub" style="margin-top:16px">Sensor de fondo</div>';
  if (sf.length){
    h += '<div class="kp-chips">';
    sf.forEach(d => {
      h += '<div class="kp-dato"><div class="k">' + d[1] + '</div>'
        +  '<div class="v">' + d[3] + '<small>' + d[2] + '</small></div></div>';
    });
    /* El delta se calcula en F, no en C convertido: una diferencia de
       temperatura no se convierte con la formula de una temperatura,
       y el tecnico compara este numero contra referencias en F. */
    const tm = kpTempF(val.sf_t_motor_c), ti = kpTempF(val.sf_t_intake_c);
    if (tm != null && ti != null){
      h += '<div class="kp-dato"><div class="k">\u0394T motor-intake</div>'
        +  '<div class="v">' + (tm - ti).toFixed(1) + '<small>\u00b0F</small></div></div>';
    }
    h += '</div>';
  } else {
    h += '<p class="hint" style="margin:2px 0 0">No se registr&oacute; en esta ronda. '
      +  'Sin estos valores no hay lectura de la bomba: presi&oacute;n de entrada, '
      +  'temperaturas y vibraci&oacute;n quedan sin evaluar.</p>';
  }

  /* ---- Que revisar ------------------------------------------------
