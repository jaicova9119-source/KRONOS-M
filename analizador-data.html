<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kronos-M · Analizador DATA</title>
<style>
  :root{
    --azul:#14526b; --acento:#0f7d8c; --acento-osc:#0b616d;
    --fondo:#f2f5f6; --panel:#fff; --linea:#dce5e8;
    --texto:#1c2b30; --suave:#5f7278;
    --ok:#1d6b4f; --ok-bg:#eef7f2; --ok-ln:#c8e3d5;
    --warn:#8a5a1c; --warn-bg:#fff6e9; --warn-ln:#f2ddbe;
    --err:#8c2f2f; --err-bg:#fbeeee; --err-ln:#efd3d3;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--texto);font:15px/1.45 var(--sans)}
  header{background:var(--azul);color:#fff;padding:14px 18px}
  header .marca{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;opacity:.7}
  header h1{margin:2px 0 0;font-size:19px;font-weight:600}
  main{padding:18px;max-width:900px;margin:0 auto}

  label{display:block;font-size:11.5px;font-weight:700;color:var(--suave);
    text-transform:uppercase;letter-spacing:.07em;margin:16px 0 5px}
  .campo{width:100%;padding:10px 12px;border:1px solid var(--linea);border-radius:8px;
    font:15px var(--sans);background:#fff;color:var(--texto)}
  select.campo{appearance:none}

  .zona{border:2px dashed var(--linea);border-radius:12px;background:var(--panel);
    padding:26px 18px;text-align:center;margin-top:6px;cursor:pointer}
  .zona.activa{border-color:var(--acento);background:#eef7f8}
  .zona p{margin:0;color:var(--suave);font-size:13.5px}
  .zona strong{display:block;color:var(--texto);font-size:15px;margin-bottom:4px}

  table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px;background:var(--panel)}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--linea)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--suave)}
  td.n{text-align:right;font-family:var(--mono)}
  tr.no td{color:var(--suave)}

  .aviso{border-radius:8px;padding:11px 13px;font-size:13px;margin-top:14px;
    background:#eaf2f5;border:1px solid #cfe0e6;color:#28454f}
  .aviso.ok{background:var(--ok-bg);border-color:var(--ok-ln);color:var(--ok)}
  .aviso.warn{background:var(--warn-bg);border-color:var(--warn-ln);color:var(--warn)}
  .aviso.err{background:var(--err-bg);border-color:var(--err-ln);color:var(--err)}

  .barra{height:6px;background:var(--linea);border-radius:3px;overflow:hidden;margin-top:12px}
  .barra i{display:block;height:100%;background:var(--acento);width:0;transition:width .2s}
  .prog{font:12px var(--mono);color:var(--suave);margin-top:6px}

  button.b{border:0;border-radius:8px;padding:12px 16px;font:600 14px var(--sans);
    cursor:pointer;background:var(--acento);color:#fff;width:100%;margin-top:16px}
  button.b:active{background:var(--acento-osc)}
  button.b:disabled{opacity:.45;cursor:default}
  .oculto{display:none !important}
  code{font:12px var(--mono);background:#e8eef0;padding:1px 5px;border-radius:3px}
</style>
</head>
<body>

<header>
  <div class="marca">Kronos-M</div>
  <h1>Analizador DATA · variadores</h1>
</header>

<main>
  <label for="pozo">Unidad</label>
  <select id="pozo" class="campo"><option value="">Cargando unidades…</option></select>

  <label>Archivos de la descarga</label>
  <div class="zona" id="zona">
    <strong>Arrastra la carpeta o los archivos .csv</strong>
    <p>Reconoce <code>log</code>, <code>Event Rec</code> y <code>SD Hist</code>.
       El <code>Ampchart</code> se ignora: es la misma corriente del log y su
       columna Average viene incompleta.</p>
  </div>
  <input type="file" id="archivos" multiple accept=".csv" class="oculto">

  <div id="lista"></div>
  <div id="msg"></div>

  <div class="barra oculto" id="barra"><i id="barra-i"></i></div>
  <div class="prog oculto" id="prog"></div>

  <button class="b" id="procesar" disabled>Procesar y enviar</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===================================================================
   Configuración: los mismos valores del index.html de Kronos-M.
   =================================================================== */
var SUPABASE_URL      = 'https://cxprmbnjnnldqyzaqsvf.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4cHJtYm5qbm5sZHF5emFxc3ZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNTA3OTQsImV4cCI6MjA5OTYyNjc5NH0.UVvo1JxPI0YBeDKyS2lv2egUNdEPu_sa3RX7Cnw5mrg';

var sb = window.sb || null;
if (!sb) { try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e){} }

/* ===================================================================
   Mapa de puntos del variador.

   Se mapea por ID de punto, NUNCA por nombre: el nombre es texto libre
   que el técnico configura en el VFD, y varía entre unidades. El punto
   1562 es "PIP" en CYC-08 y "Intake Pres" en CYC-18 — el mismo dato.
   =================================================================== */
var PUNTOS = {
  '5':'HZ', '6':'I_A', '7':'I_B', '8':'I_C', '9':'V_SAL', '10':'V_BUS',
  '285':'V_AB', '289':'V_BC', '294':'V_CA',
  '387':'T_DISIP_1', '399':'T_DISIP_2', '435':'T_INDUCTOR',
  '779':'TQ_BOMBA', '780':'RPM_BOMBA', '1291':'TQ_MOTOR', '1292':'RPM_MOTOR',
  '1354':'V_MOTOR', '1356':'I_B_MOTOR',
  '1562':'PIP', '1563':'PD', '1564':'TI', '1565':'TM',
  '1566':'VIB_X', '1567':'VIB_Z'
  /* 1568 (CT) y 1569 (V_TOOL) quedan fuera hasta definir su uso */
};

/* Umbral para considerar la unidad operando. Por debajo, las muestras no
   entran al promedio: con la bomba parada la PIP sube al nivel estático
   y mezclarla con el estado operando arruina la tendencia. */
var HZ_MIN = 10;

var $ = function(id){ return document.getElementById(id); };
function aviso(t, c){ $('msg').innerHTML = t ? '<div class="aviso '+(c||'')+'">'+t+'</div>' : ''; }

/* ===================================================================
   Utilidades
   =================================================================== */
/* El log trae la fecha sin ceros a la izquierda ("2025/9/19 6:51:2").
   new Date() sobre eso no es confiable entre navegadores. */
function aFecha(s){
  var m = /^(\d{4})\/(\d{1,2})\/(\d{1,2})[ T](\d{1,2}):(\d{1,2}):(\d{1,2})/.exec(s.trim());
  if (!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +m[6]);
}
function aFechaHora(f, h){
  var a = /^(\d{4})\/(\d{1,2})\/(\d{1,2})/.exec((f||'').trim());
  var b = /^(\d{1,2}):(\d{1,2}):(\d{1,2})/.exec((h||'').trim());
  if (!a || !b) return null;
  return new Date(+a[1], +a[2]-1, +a[3], +b[1], +b[2], +b[3]);
}
function iso(d){
  var p = function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'
       + p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
function tipoArchivo(n){
  var b = n.toLowerCase();
  if (b.indexOf('ampchart') >= 0) return null;      /* redundante */
  if (b.indexOf('event')    >= 0) return 'EVENTOS';
  if (b.indexOf('sd hist')  >= 0 || b.indexOf('sdhist') >= 0) return 'PAROS';
  if (b.indexOf('log')      >= 0) return 'LOG';
  return null;
}

/* ===================================================================
   Selección de archivos
   =================================================================== */
var archivos = [];

$('zona').onclick = function(){ $('archivos').click(); };
['dragenter','dragover'].forEach(function(ev){
  $('zona').addEventListener(ev, function(e){ e.preventDefault(); $('zona').classList.add('activa'); });
});
['dragleave','drop'].forEach(function(ev){
  $('zona').addEventListener(ev, function(e){ e.preventDefault(); $('zona').classList.remove('activa'); });
});
$('zona').addEventListener('drop', function(e){
  e.preventDefault();
  recibir(Array.prototype.slice.call(e.dataTransfer.files));
});
$('archivos').onchange = function(e){ recibir(Array.prototype.slice.call(e.target.files)); };

function recibir(fs){
  archivos = [];
  fs.forEach(function(f){
    var t = tipoArchivo(f.name);
    if (t) archivos.push({ f:f, tipo:t });
  });
  archivos.sort(function(a,b){ return a.f.name.localeCompare(b.f.name); });

  var ign = fs.length - archivos.length;
  var mb = archivos.reduce(function(s,x){ return s + x.f.size; }, 0) / 1048576;

  $('lista').innerHTML = archivos.length
    ? '<table><tr><th>Archivo</th><th>Tipo</th><th style="text-align:right">Tamaño</th></tr>'
      + archivos.map(function(x){
          return '<tr><td>'+x.f.name+'</td><td>'+x.tipo
               + '</td><td class="n">'+(x.f.size/1048576).toFixed(1)+' MB</td></tr>'; }).join('')
      + '</table>'
    : '';

  var t = archivos.length + ' archivo(s), ' + mb.toFixed(1) + ' MB.'
        + (ign ? ' Se ignoraron ' + ign + ' (Ampchart u otros).' : '');
  if (mb > 40) {
    aviso(t + ' Con este volumen conviene hacerlo desde computador, no desde el celular.', 'warn');
  } else { aviso(t); }

  $('procesar').disabled = !(archivos.length && $('pozo').value);
}

/* ===================================================================
   Parser del log: agrega por hora mientras lee
   =================================================================== */
function procesarLog(texto){
  var L = texto.split('\n');

  /* Estructura: línea en blanco, nombres, IDs de punto, unidades, datos.
     Se localiza la cabecera en vez de asumir posición fija. */
  var o = 0;
  while (o < 6 && L[o].indexOf('Date/Time') < 0) o++;
  if (o >= 6) return null;

  var ids = L[o+1].split(',').map(function(s){ return s.trim(); });
  var cols = [], iHz = -1;
  for (var k = 0; k < ids.length; k++) {
    if (PUNTOS[ids[k]]) cols.push([k, PUNTOS[ids[k]]]);
    if (ids[k] === '5') iHz = k;
  }
  if (!cols.length) return null;

  var ac = {}, paro = {}, n = 0, t0 = null, t1 = null, dif = [];

  for (var i = o+3; i < L.length; i++) {
    var p = L[i].split(',');
    if (p.length < 5) continue;
    var t = aFecha(p[0]);
    if (!t) continue;

    n++;
    if (!t0) t0 = t;
    if (t1) dif.push((t - t1) / 1000);
    t1 = t;

    var hk = new Date(t.getFullYear(), t.getMonth(), t.getDate(), t.getHours()).getTime();

    var hz = iHz >= 0 ? parseFloat(p[iHz]) : NaN;
    if (!(hz >= HZ_MIN)) { paro[hk] = (paro[hk]||0) + 1; continue; }

    for (var c = 0; c < cols.length; c++) {
      var idx = cols[c][0];
      if (idx >= p.length) continue;
      var v = parseFloat(p[idx]);
      if (isNaN(v)) continue;
      var key = hk + '|' + cols[c][1];
      (ac[key] || (ac[key] = [])).push(v);
    }
  }
  if (!n || !t0) return null;

  /* Frecuencia media de cada hora: contexto obligatorio de cada fila */
  var hzHora = {};
  Object.keys(ac).forEach(function(key){
    var pr = key.split('|');
    if (pr[1] === 'HZ') {
      var a = ac[key], s = 0;
      for (var j = 0; j < a.length; j++) s += a[j];
      hzHora[pr[0]] = s / a.length;
    }
  });

  var horas = [];
  Object.keys(ac).forEach(function(key){
    var pr = key.split('|'), hk2 = pr[0], cod = pr[1];
    var a = ac[key].slice().sort(function(x,y){ return x-y; });
    var m = a.length, s = 0;
    for (var j = 0; j < m; j++) s += a[j];
    var pr2 = s / m, vr = 0;
    for (var j2 = 0; j2 < m; j2++) vr += (a[j2]-pr2)*(a[j2]-pr2);
    horas.push({
      h: iso(new Date(+hk2)), v: cod, n: m,
      mn: a[0], mx: a[m-1],
      pr: +pr2.toFixed(3),
      p95: a[Math.min(m-1, Math.floor(0.95*m))],
      sd: +Math.sqrt(vr/m).toFixed(3),
      hz: hzHora[hk2] != null ? +hzHora[hk2].toFixed(2) : null,
      pa: Math.round((paro[hk2]||0) * (medianaSegura(dif)||10) / 60)
    });
  });

  return { muestras:n, desde:iso(t0), hasta:iso(t1), horas:horas,
           intervalo_s: medianaSegura(dif) };
}

function medianaSegura(d){
  if (!d.length) return null;
  var a = d.slice(0, 500).sort(function(x,y){ return x-y; });
  return a[Math.floor(a.length/2)];
}

function procesarEventos(texto){
  var L = texto.split('\n'), out = [];
  for (var i = 1; i < L.length; i++) {
    var p = L[i].split(',').map(function(s){ return s.trim(); });
    if (p.length < 5 || !p[1]) continue;
    var t = aFechaHora(p[3], p[4]);
    if (!t) continue;
    out.push({ t:iso(t), tipo:p[1], punto:p[2]||'', ant:p[5]||'', pos:p[6]||'' });
  }
  return out;
}

function procesarParos(texto){
  var L = texto.split('\n'), out = [];
  for (var i = 1; i < L.length; i++) {
    var p = L[i].split(',').map(function(s){ return s.trim(); });
    if (p.length < 3 || !p[0]) continue;
    var t = aFechaHora(p[1], p[2]);
    if (!t) continue;
    var num = function(x){ var v = parseFloat(x); return isNaN(v) ? null : v; };
    out.push({ t:iso(t), causa:p[0],
      ia:num(p[3]), ib:num(p[4]), ic:num(p[5]),
      vab:num(p[6]), vbc:num(p[7]), vca:num(p[8]),
      ai1:num(p[9]), ai2:num(p[10]) });
  }
  return out;
}

/* ===================================================================
   Proceso y envío
   =================================================================== */
function leer(f){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onload  = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
    r.readAsText(f, 'ISO-8859-1');   /* los archivos traen ° en latin-1 */
  });
}
function esperar(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

$('procesar').onclick = async function(){
  var pozoId = $('pozo').value;
  if (!pozoId) { aviso('Selecciona la unidad.', 'err'); return; }

  $('procesar').disabled = true;
  $('barra').classList.remove('oculto');
  $('prog').classList.remove('oculto');
  aviso('');

  var res = [], eventos = [], paros = [];

  for (var i = 0; i < archivos.length; i++) {
    var a = archivos[i];
    $('prog').textContent = 'Leyendo ' + a.f.name + '  (' + (i+1) + '/' + archivos.length + ')';
    $('barra-i').style.width = Math.round(100*i/archivos.length) + '%';
    await esperar(20);   /* deja respirar la interfaz */

    var texto;
    try { texto = await leer(a.f); }
    catch (e) { res.push({ n:a.f.name, err:'no se pudo leer' }); continue; }

    if (a.tipo === 'LOG') {
      var r = procesarLog(texto);
      if (!r) { res.push({ n:a.f.name, err:'sin cabecera reconocible' }); continue; }

      var env = await sb.rpc('dp_ingresar_serie', { p: {
        pozo_id: pozoId, archivo: a.f.name, desde: r.desde, hasta: r.hasta,
        muestras: r.muestras, intervalo_s: r.intervalo_s, horas: r.horas } });

      var b = (env && env.data) || {};
      res.push({ n:a.f.name, muestras:r.muestras, horas:r.horas.length,
                 int:r.intervalo_s,
                 err: env.error ? env.error.message : (b.ok ? null : b.error) });
    } else if (a.tipo === 'EVENTOS') {
      eventos = eventos.concat(procesarEventos(texto));
      res.push({ n:a.f.name, eventos:procesarEventos(texto).length });
    } else if (a.tipo === 'PAROS') {
      paros = paros.concat(procesarParos(texto));
      res.push({ n:a.f.name, paros:procesarParos(texto).length });
    }
  }

  if (eventos.length || paros.length) {
    $('prog').textContent = 'Enviando eventos y paros…';
    var e2 = await sb.rpc('dp_ingresar_eventos', {
      p: { pozo_id: pozoId, eventos: eventos, paros: paros } });
    if (e2.error) res.push({ n:'eventos y paros', err:e2.error.message });
  }

  $('barra-i').style.width = '100%';
  $('prog').textContent = 'Listo';

  var mues = res.reduce(function(s,x){ return s + (x.muestras||0); }, 0);
  var hs   = res.reduce(function(s,x){ return s + (x.horas||0); }, 0);
  var fall = res.filter(function(x){ return x.err; });

  $('lista').innerHTML = '<table><tr><th>Archivo</th><th style="text-align:right">Muestras</th>'
    + '<th style="text-align:right">Horas</th><th style="text-align:right">Intervalo</th>'
    + '<th>Resultado</th></tr>'
    + res.map(function(x){
        return '<tr'+(x.err?' class="no"':'')+'><td>'+x.n+'</td>'
          + '<td class="n">'+(x.muestras||x.eventos||x.paros||'—')+'</td>'
          + '<td class="n">'+(x.horas||'—')+'</td>'
          + '<td class="n">'+(x.int?x.int+' s':'—')+'</td>'
          + '<td>'+(x.err||'ok')+'</td></tr>'; }).join('')
    + '</table>';

  aviso(mues.toLocaleString('es-CO') + ' muestras resumidas en ' + hs.toLocaleString('es-CO')
    + ' filas horarias. ' + eventos.length + ' eventos y ' + paros.length + ' paros.'
    + (fall.length ? ' ' + fall.length + ' archivo(s) con problema.' : ''),
    fall.length ? 'warn' : 'ok');

  $('procesar').disabled = false;
};

/* ===================================================================
   Arranque
   =================================================================== */
(async function(){
  if (!sb) { aviso('Falta configurar la conexión a Supabase en este archivo.', 'err'); return; }
  var r = await sb.rpc('dp_buscar_unidad', { p_texto: '' });
  if (r.error) { aviso('No se pudieron cargar las unidades: ' + r.error.message, 'err'); return; }
  $('pozo').innerHTML = '<option value="">Seleccionar unidad…</option>'
    + (r.data||[]).map(function(u){
        return '<option value="'+u.id+'">'+u.nombre+' · '+(u.sistema||'—')+'</option>'; }).join('');
  $('pozo').onchange = function(){
    $('procesar').disabled = !(archivos.length && $('pozo').value);
  };
})();
</script>
</body>
</html>
