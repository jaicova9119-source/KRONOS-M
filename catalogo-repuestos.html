        "Opcional. Cámara, galería o un archivo del equipo: sirve igual una foto " +
        "de campo que un recorte de catálogo. Se lee la marcación y se proponen " +
        "los campos, que puedes corregir antes de guardar.</div>" +
      '<img class="rep-previa" id="rep-n-previa" hidden alt="">' +
    "</div>" +
    '<div id="rep-n-extras"></div>' +
    '<div class="rep-duo">' +
      '<div class="rep-campo"><label for="rep-n-marca">Marca</label>' +
        '<input id="rep-n-marca" placeholder="Yaskawa" autocomplete="off"></div>' +
      '<div class="rep-campo"><label for="rep-n-serie">Serie</label>' +
        '<input id="rep-n-serie" placeholder="iQpump / GA700" autocomplete="off"></div>' +
    "</div>" +
    '<div class="rep-campo"><label for="rep-n-den">Denominación</label>' +
      '<input id="rep-n-den" placeholder="Tarjeta de control" autocomplete="off"></div>' +
    '<div class="rep-campo"><label for="rep-n-tipo">Tipo</label>' +
      '<select id="rep-n-tipo">' + repOpc(REP_TIPOS) + "</select></div>" +
    '<div class="rep-campo mono"><label for="rep-n-pn">Parte número</label>' +
      '<input id="rep-n-pn" placeholder="ETC740361" autocomplete="off"></div>' +
    '<div class="rep-campo mono"><label for="rep-n-marc">Marcación impresa sobre la pieza</label>' +
      '<input id="rep-n-marc" placeholder="ETC740361-S0515.M" autocomplete="off"></div>' +
    '<p class="rep-ayuda">Copia la marcación tal como está serigrafiada, con guiones y puntos. ' +
      "Es lo que el técnico va a leer en el sitio.</p>" +
    '<div class="rep-campo mono"><label for="rep-n-sap">Código de material (SAP)</label>' +
      '<input id="rep-n-sap" autocomplete="off"></div>' +
    '<label class="rep-check"><input type="checkbox" id="rep-n-crit">Repuesto crítico</label>' +
    '<div class="rep-modal-pie">' +
      '<button type="button" data-cerrar>Cancelar</button>' +
      '<button type="button" class="primario" id="rep-n-guardar">Guardar repuesto</button>' +
    "</div>"
  );

  repLectura = null;

  repEl("rep-n-foto").addEventListener("change", async e => {
    const bruto = e.target.files[0];
    e.target.value = "";           // permite reelegir el mismo archivo
    if (!bruto) return;

    /* Se recorta antes de cualquier otra cosa: lo que se lee, lo que se
       sube y lo que se ve en la miniatura es el mismo encuadre. */
    const f = await repAbrirRecorte(bruto);
    if (!f) return;                // el usuario canceló

    const btn = repEl("rep-n-foto-btn");
    const pie = repEl("rep-n-foto-pie");
    const previa = repEl("rep-n-previa");

    previa.src = URL.createObjectURL(f);
    previa.hidden = false;
    btn.classList.add("ocupado");
    btn.textContent = "Leyendo la marcación…";
    pie.textContent = "Esto tarda unos segundos con señal de campo.";

    try {
      const r = await repLeerMarcacion(f, null);
      repLectura = { archivo: f, lecturaId: r.lectura_id, propuesto: r.campos };
      const tocados = repPintarPropuesta(REP_MAPA_ALTA, r.campos);

      const conf = r.campos.confianza || "baja";
      pie.innerHTML = "Campos propuestos por lectura de la imagen" +
        '<span class="rep-conf ' + conf + '">confianza ' + conf + "</span><br>" +
        "Revísalos antes de guardar: ninguno queda como verificado." +
        (r.campos.observacion ? "<br>" + repEsc(r.campos.observacion) : "");

      if (!tocados.length) {
        pie.innerHTML = "No se distinguió ningún dato en la imagen. " +
          "Escríbelos a mano; la foto igual se guarda con la pieza.";
      }
      repPintarExtras(r.campos.otros_codigos || []);
    } catch (err) {
      repLectura = { archivo: f, lecturaId: null, propuesto: {} };
      pie.textContent = (err.message || "No se pudo leer la imagen") +
        ". Escribe los datos a mano; la foto igual se guarda.";
    }
    btn.classList.remove("ocupado");
    btn.textContent = "Cambiar la imagen";
  });

  repEl("rep-n-guardar").addEventListener("click", async () => {
    const marca = repEl("rep-n-marca").value.trim();
    const den = repEl("rep-n-den").value.trim();
    if (!marca || !den) { repAviso("Marca y denominación son obligatorias."); return; }
    const btn = repEl("rep-n-guardar");
    btn.disabled = true;

    const { data, error } = await sb.from("rep_repuesto").insert({
      marca: marca,
      serie: repEl("rep-n-serie").value.trim() || null,
      denominacion: den,
      tipo: repEl("rep-n-tipo").value,
      critico: repEl("rep-n-crit").checked,
      codigo_material: repEl("rep-n-sap").value.trim() || null
    }).select("id").single();
    if (error) { repAviso(error.message); btn.disabled = false; return; }

    /* Un codigo escrito a mano se da por leido del manual y verificado.
       Uno que salio de la imagen y no se toco, no: entra sin verificar y
       la ficha lo advierte hasta que alguien lo contraste. */
    const prop = (repLectura && repLectura.propuesto) || {};
    const origen = (campo, valor) => {
      const vino = prop[campo] && prop[campo] === valor;
      return vino
        ? { fuente: "ocr_imagen", verificado: false }
        : { fuente: "manual", verificado: true };
    };

    const ids = [];
    const pn = repEl("rep-n-pn").value.trim();
    const mc = repEl("rep-n-marc").value.trim();
    if (pn) {
      ids.push(repFilaIdent(data.id, "parte_numero", pn,
        Object.assign({ principal: true }, origen("parte_numero", pn))));
    }
    if (mc) {
      ids.push(repFilaIdent(data.id, "marcacion_impresa", mc,
        origen("marcacion_impresa", mc)));
    }
    if (prop.revision) {
      ids.push(repFilaIdent(data.id, "revision", prop.revision,
        { fuente: "ocr_imagen", verificado: false }));
    }
    repEl("rep-n-extras").querySelectorAll("input[type=checkbox]:checked").forEach(c => {
      ids.push(repFilaIdent(data.id, "codigo_alterno", c.dataset.valor,
        { fuente: "ocr_imagen", verificado: false, notas: c.dataset.etiqueta || null }));
    });

    repPendientes = [];
    if (ids.length) {
      /* `.select("id")` no es decorativo: sin el, un INSERT bloqueado por
         RLS vuelve sin error y sin filas, y se reporta como exito. */
      const res = await sb.from("rep_identificador").insert(ids).select("id");
      if (res.error) {
        const m = (res.error.code === "PGRST102")
          ? "Los códigos no se guardaron por un defecto de formato en el envío. " +
            "Repórtalo: el detalle es " + res.error.message
          : "Los códigos no se guardaron: " + res.error.message;
        repPendientes.push(m);
      } else if (!res.data || res.data.length !== ids.length) {
        repPendientes.push("Se esperaban " + ids.length + " código(s) y se guardaron " +
          ((res.data && res.data.length) || 0) + ". Revisa los permisos de escritura.");
      }
    } else {
      repPendientes.push("La pieza quedó sin ningún código. Agrégale al menos el " +
        "parte número o la marcación impresa desde el botón \u0022Agregar código\u0022.");
    }

    /* La foto se sube ahora porque la ruta en Storage lleva el id, que
       hasta este momento no existia. */
    if (repLectura && repLectura.archivo) {
      btn.textContent = "Subiendo la foto…";
      repActual = data;
      try {
        await repSubirImagen(repLectura.archivo, {
          tipo: "marcacion",
          descripcion: "Foto del alta",
          principal: true,
          campo: true
        });
      } catch (e) {
        repPendientes.push("La foto no se subió: " + (e.message || ""));
      }
      await repCerrarBitacora(repLectura.lecturaId, data.id,
                              repCamposEditados(REP_MAPA_ALTA, prop));
    }

    repLectura = null;
    repCerrarModal();
    await repCargarFacetas();
    await repBuscar();
    await repAbrirFicha(data.id);
  });
}

  cont.innerHTML = '<p class="rep-ayuda" style="margin-bottom:6px">' +
    "Otros códigos vistos en la imagen. Marca los que pertenezcan a esta pieza:</p>" +
    '<div class="rep-extras">' + lista.map(c =>
      '<label class="rep-extra"><input type="checkbox" data-valor="' + repEsc(c.valor) +
      '" data-etiqueta="' + repEsc(c.etiqueta || "") + '">' +
      '<span class="et">' + repEsc(c.etiqueta || "código") + "</span>" +
      '<span class="vl">' + repEsc(c.valor) + "</span></label>").join("") + "</div>";
}

function repModalImagen() {
  repAbrirModal(
    "<h3>Agregar imagen</h3>" +
    '<div class="rep-campo"><label for="rep-i-file">Imagen (cámara, galería o archivo)</label>' +
      '<input id="rep-i-file" type="file" accept="image/*"></div>' +
    '<img class="rep-previa" id="rep-i-previa" hidden alt="" style="margin:-4px 0 11px">' +
    '<div class="rep-campo"><label for="rep-i-tipo">Qué muestra</label>' +
      '<select id="rep-i-tipo">' + repOpc(REP_TIPOS_IMG) + "</select></div>" +
    '<div class="rep-campo"><label for="rep-i-desc">Descripción</label>' +
      '<input id="rep-i-desc" placeholder="Etiqueta lateral, esquina inferior derecha"></div>' +
    (repPuedeEditar
      ? '<div class="rep-lectura" style="margin-bottom:11px">' +
          '<label class="rep-lectura-btn" id="rep-i-leer">Leer la marcación de esta foto</label>' +
          '<div class="rep-lectura-pie" id="rep-i-leer-pie">' +
            "Compara lo que se lee con los códigos ya registrados y te ofrece los nuevos." +
          '</div><div id="rep-i-extras"></div></div>'
      : "") +
    (repPuedeEditar
      ? '<label class="rep-check"><input type="checkbox" id="rep-i-ppal">Usar como imagen principal</label>'
      : "") +
    '<label class="rep-check"><input type="checkbox" id="rep-i-campo">Tomada en campo</label>' +
    '<p class="rep-ayuda">La imagen se reduce en el equipo antes de subir: 1600 px para consulta ' +
      "y 320 px para el listado.</p>" +
    '<div class="rep-modal-pie">' +
      '<button type="button" data-cerrar>Cancelar</button>' +
      '<button type="button" class="primario" id="rep-i-guardar">Subir imagen</button>' +
    "</div>"
  );

  repImagenFicha = null;
  repEl("rep-i-file").addEventListener("change", async e => {
    const bruto = e.target.files[0];
    e.target.value = "";
    if (!bruto) return;
    const rec = await repAbrirRecorte(bruto);
    if (!rec) return;
    repImagenFicha = rec;
    const previa = repEl("rep-i-previa");
    previa.src = URL.createObjectURL(rec);
    previa.hidden = false;
  });

  const btnLeer = repEl("rep-i-leer");
  if (btnLeer) {
    btnLeer.addEventListener("click", async () => {
      const f = repImagenFicha;
      const pie = repEl("rep-i-leer-pie");
      if (!f) { pie.textContent = "Primero elige la imagen."; return; }
      btnLeer.classList.add("ocupado");
      btnLeer.textContent = "Leyendo…";
      try {
        const r = await repLeerMarcacion(f, repActual.id);
        repLecturaFicha = r;
        /* Solo se ofrecen los codigos que no estan ya en la pieza. */
        const ya = (repActual.rep_identificador || [])
          .map(i => i.valor.toUpperCase().replace(/[^A-Z0-9]/g, ""));
        const nuevos = [];
        const meter = (clase, valor, etiqueta) => {
          if (!valor) return;
          const k = valor.toUpperCase().replace(/[^A-Z0-9]/g, "");
          if (ya.indexOf(k) >= 0) return;
          nuevos.push({ clase: clase, valor: valor, etiqueta: etiqueta });
        };
        meter("parte_numero", r.campos.parte_numero, "Parte número");
        meter("marcacion_impresa", r.campos.marcacion_impresa, "Marcación impresa");
        meter("revision", r.campos.revision, "Revisión");
        (r.campos.otros_codigos || []).forEach(c =>
          meter("codigo_alterno", c.valor, c.etiqueta || "Código"));

        const conf = r.campos.confianza || "baja";
        pie.innerHTML = nuevos.length
          ? "Códigos nuevos en esta imagen" +
            '<span class="rep-conf ' + conf + '">confianza ' + conf + "</span><br>" +
            "Marca los que quieras agregar; entran como no verificados."
          : "No hay códigos nuevos: lo que se lee ya está registrado." +
            '<span class="rep-conf ' + conf + '">confianza ' + conf + "</span>";

        repEl("rep-i-extras").innerHTML = nuevos.length
          ? '<div class="rep-extras" style="margin-top:9px">' + nuevos.map((c, i) =>
              '<label class="rep-extra"><input type="checkbox" checked data-i="' + i + '">' +
              '<span class="et">' + repEsc(c.etiqueta) + "</span>" +
              '<span class="vl">' + repEsc(c.valor) + "</span></label>").join("") + "</div>"
          : "";
        repLecturaFicha.nuevos = nuevos;
      } catch (err) {
        pie.textContent = err.message || "No se pudo leer la imagen.";
      }
      btnLeer.classList.remove("ocupado");
      btnLeer.textContent = "Leer la marcación de esta foto";
    });
  }

  repEl("rep-i-guardar").addEventListener("click", async () => {
    const f = repImagenFicha;
    if (!f) { repAviso("Elige una imagen o toma una fotografía."); return; }
    const btn = repEl("rep-i-guardar");
    btn.disabled = true; btn.textContent = "Subiendo…";
    try {
      const chk = repEl("rep-i-ppal");
      const ppal = repPuedeEditar && chk && chk.checked;
      if (ppal) {
        /* El indice unico parcial solo admite una principal por pieza. */
        await sb.from("rep_imagen").update({ principal: false })
          .eq("repuesto_id", repActual.id).eq("principal", true).select("id");
      }
      await repSubirImagen(f, {
        tipo: repEl("rep-i-tipo").value,
        descripcion: repEl("rep-i-desc").value.trim(),
        principal: ppal,
        campo: repEl("rep-i-campo").checked
      });

      const cajaExtras = repEl("rep-i-extras");
      if (repLecturaFicha && cajaExtras) {
        const marcados = [].slice.call(cajaExtras.querySelectorAll("input:checked"))
          .map(c => repLecturaFicha.nuevos[Number(c.dataset.i)])
          .filter(Boolean)
          .map(c => repFilaIdent(repActual.id, c.clase, c.valor, {
            fuente: "ocr_imagen", verificado: false,
            notas: c.clase === "codigo_alterno" ? c.etiqueta : null
          }));
        if (marcados.length) {
          const res = await sb.from("rep_identificador").insert(marcados).select("id");
          if (res.error) repAviso("La foto entró, pero los códigos no: " + res.error.message);
        }
        await repCerrarBitacora(repLecturaFicha.lectura_id, repActual.id, []);
      }
      repLecturaFicha = null;
      repImagenFicha = null;

      repCerrarModal();
      await repRefrescarActual();
    } catch (e) {
      repAviso(e.message || "No se pudo subir la imagen.");
      btn.disabled = false; btn.textContent = "Subir imagen";
    }
  });
}

    repCerrarModal();
    await repRefrescarActual();
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   Eventos
   ═══════════════════════════════════════════════════════════════════════ */
repEl("rep-btn-buscar").addEventListener("click", repBuscar);
repEl("rep-q").addEventListener("keydown", e => { if (e.key === "Enter") repBuscar(); });
repEl("rep-f-marca").addEventListener("change", () => { repRefrescarSeries(); repBuscar(); });
repEl("rep-f-serie").addEventListener("change", repBuscar);
repEl("rep-f-tipo").addEventListener("change", repBuscar);
repEl("rep-f-estado").addEventListener("change", repBuscar);
repEl("rep-fab").addEventListener("click", repModalNuevo);
repEl("rep-fuentes").addEventListener("click", repModalFuentes);
repEl("rep-volver").addEventListener("click", repCerrarFicha);

repEl("rep-listado").addEventListener("click", e => {
  const card = e.target.closest(".rep-card");
  if (card) repAbrirFicha(repFilas[Number(card.dataset.i)].id);
});

repEl("rep-ficha").addEventListener("click", e => {
  const tira = e.target.closest(".rep-tira");
  if (tira) { repMostrarImagen(Number(tira.dataset.i)); return; }
  if (e.target.id === "rep-gal-main" && e.target.dataset.full) {
    repEl("rep-visor-img").src = e.target.dataset.full;
    repEl("rep-visor").classList.add("abierta");
    return;
  }
  if (e.target.id === "rep-banner-x") {
    repPendientes = [];
    const b = e.target.closest(".rep-banner");
    if (b) b.remove();
    return;
  }
  if (e.target.id === "rep-b-foto") repModalImagen();
  if (e.target.id === "rep-b-codigo") repModalCodigo();
  if (e.target.id === "rep-b-aplic") repModalAplicacion();
  if (e.target.id === "rep-b-cotejar") repModalCotejo();
  if (e.target.id === "rep-b-volver") repCerrarFicha();
});

repEl("rep-modal").addEventListener("click", async e => {
  if (e.target.id === "rep-modal" || e.target.hasAttribute("data-cerrar")) {
    repCerrarModal();
    return;
  }
  const b = e.target.closest("[data-cotejo]");
  if (!b || !repActual) return;

  const m = repCotejoFilas[Number(b.dataset.cotejo)];
  if (!m) return;
  /* Se sella el identificador que se consulto, no el renglon de la lista:
     lo que se verifica es el codigo de la pieza; la lista es la evidencia.
     El sello de quien valida y cuando lo pone el trigger en la base. */
  const obj = (repActual.rep_identificador || []).find(i => i.valor === m.consultado);
  if (!obj) { repAviso("Ese código ya no está en la pieza."); return; }
  b.disabled = true;
  const { data, error } = await sb.from("rep_identificador")
    .update({ verificado: true, fuente_id: m.fuente_id, fuente_fila: m.fila })
    .eq("id", obj.id).select("id");
  if (error) { repAviso(error.message); b.disabled = false; return; }
  if (!data || !data.length) {
    repAviso("La base no aceptó el cambio. Revisa tus permisos de escritura.");
    b.disabled = false;
    return;
  }
  b.textContent = "Verificado";
  repCerrarModal();
  repPendientes = [];
  await repRefrescarActual();
});
repEl("rep-visor-cerrar").addEventListener("click", () =>
  repEl("rep-visor").classList.remove("abierta"));
repEl("rep-visor").addEventListener("click", e => {
  if (e.target.id === "rep-visor") repEl("rep-visor").classList.remove("abierta");
});

repEl("rep-sel").addEventListener("pointerdown", e => {
  const tir = e.target.closest(".rep-tirador");
  repRecIniciarArrastre(e, tir ? tir.dataset.t : "mover");
});
window.addEventListener("resize", () => {
  if (repRecSel) repRecPintar();
});
document.addEventListener("pointermove", repRecMover);
document.addEventListener("pointerup", repRecSoltar);
document.addEventListener("pointercancel", repRecSoltar);

repEl("rep-rec-usar").addEventListener("click", repRecAplicar);
repEl("rep-rec-cancelar").addEventListener("click", () => repRecTerminar(null));
repEl("rep-rec-rotar").addEventListener("click", repRecRotar);
repEl("rep-rec-todo").addEventListener("click", () => {
  repRecSel = { x: 0, y: 0, w: 1, h: 1 };
  repRecPintar();
});

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (repEl("rep-recorte").classList.contains("abierta")) { repRecTerminar(null); return; }
  if (repEl("rep-visor").classList.contains("abierta")) {
    repEl("rep-visor").classList.remove("abierta"); return;
  }
  if (repEl("rep-modal").classList.contains("abierta")) { repCerrarModal(); return; }
  if (repEl("rep-ficha").classList.contains("abierta")) repCerrarFicha();
});

repIniciar();
</script>
</body>
</html>
